# =============================================================================
# DataEngineBDP 基础设施 Docker Compose 编排
# =============================================================================
# 用途：在 WSL + Docker 中模拟真实大数据组件环境
# 组件：Trino 460 + Doris 2.1.7 + NebulaGraph 3.6.0 + MLflow 2.20.2
#       + Flink 1.20.0 + Spark 3.5.3 + PostgreSQL 16
# 网络：dataengine-infra (172.20.0.0/16)
# 容器前缀：de-
# 资源限制：每容器最多 2g 内存
# 启动：docker compose -f docker-compose.infra.yml up -d
# 停止：docker compose -f docker-compose.infra.yml down -v
# =============================================================================

name: dataengine-infra

networks:
  dataengine-infra:
    name: dataengine-infra
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  de-postgres-data:
    name: de-postgres-data
  de-trino-data:
    name: de-trino-data
  de-doris-fe-meta:
    name: de-doris-fe-meta
  de-doris-be-storage:
    name: de-doris-be-storage
  de-nebula-meta:
    name: de-nebula-meta
  de-nebula-storage:
    name: de-nebula-storage
  de-flink-jm-checkpoints:
    name: de-flink-jm-checkpoints
  de-flink-tm-checkpoints:
    name: de-flink-tm-checkpoints
  de-spark-shared:
    name: de-spark-shared
  de-mlflow-artifacts:
    name: de-mlflow-artifacts

# =============================================================================
# 服务定义
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - 共享数据库
  # ---------------------------------------------------------------------------
  de-postgres:
    image: postgres:16-alpine
    container_name: de-postgres
    hostname: de-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataengine
      POSTGRES_USER: deadmin
      POSTGRES_PASSWORD: depassword
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - de-postgres-data:/var/lib/postgresql/data
      - ./docker/infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - dataengine-infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadmin -d dataengine"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Trino 460 - 交互查询引擎
  # ---------------------------------------------------------------------------
  de-trino:
    image: trinodb/trino:460
    container_name: de-trino
    hostname: de-trino
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./docker/infra/trino/config:/etc/trino:ro
      - de-trino-data:/data/trino
    networks:
      - dataengine-infra
    depends_on:
      de-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Apache Doris 2.1.7 - OLAP 引擎（FE）
  # ---------------------------------------------------------------------------
  de-doris-fe:
    image: apache/doris-fe:2.1.7
    container_name: de-doris-fe
    hostname: de-doris-fe
    restart: unless-stopped
    # privileged 已移除：使用最小 cap_add 替代，遵循最小权限原则
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    environment:
      TZ: Asia/Shanghai
      FE_SERVERS: "fe1:de-doris-fe:9010"
    ports:
      - "8030:8030"  # HTTP
      - "9010:9010"  # Edit Log (Thrift)
      - "9020:9020"  # MySQL Server
      - "9030:9030"  # Query Port
    volumes:
      - ./docker/infra/doris/fe/fe.conf:/opt/apache-doris/fe/conf/fe.conf:ro
      - de-doris-fe-meta:/opt/apache-doris/fe/doris-meta
    networks:
      - dataengine-infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8030/api/bootstrap || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Apache Doris 2.1.7 - OLAP 引擎（BE）
  # ---------------------------------------------------------------------------
  de-doris-be:
    image: apache/doris-be:2.1.7
    container_name: de-doris-be
    hostname: de-doris-be
    restart: unless-stopped
    # privileged 已移除：使用最小 cap_add 替代，遵循最小权限原则
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    environment:
      TZ: Asia/Shanghai
      FE_SERVERS: "fe1:de-doris-fe:9010"
    ports:
      - "8040:8040"  # Webserver
      - "9050:9050"  # Heartbeat
      - "8060:8060"  # BRPC
      - "9060:9060"  # BE Thrift
    volumes:
      - ./docker/infra/doris/be/be.conf:/opt/apache-doris/be/conf/be.conf:ro
      - de-doris-be-storage:/opt/apache-doris/be/storage
    networks:
      - dataengine-infra
    depends_on:
      de-doris-fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8040/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # NebulaGraph 3.6.0 - 图数据库（Meta 服务）
  # ---------------------------------------------------------------------------
  de-nebula-metad:
    image: vesoft/nebula-metad:v3.6.0
    container_name: de-nebula-metad
    hostname: de-nebula-metad
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=de-nebula-metad:9559
      - --local_ip=de-nebula-metad
      - --port=9559
      - --ws_ip=de-nebula-metad
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_path=/logs/meta
      - --daemonize=false
    ports:
      - "19559:19559"  # Meta HTTP
      - "9559:9559"    # Meta Thrift
    volumes:
      - de-nebula-meta:/data/meta
      - ./docker/infra/nebula/logs:/logs/meta
    networks:
      - dataengine-infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:19559/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 256m

  # ---------------------------------------------------------------------------
  # NebulaGraph 3.6.0 - 图数据库（Graph 服务）
  # ---------------------------------------------------------------------------
  de-nebula-graphd:
    image: vesoft/nebula-graphd:v3.6.0
    container_name: de-nebula-graphd
    hostname: de-nebula-graphd
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=de-nebula-metad:9559
      - --local_ip=de-nebula-graphd
      - --port=9669
      - --ws_ip=de-nebula-graphd
      - --ws_http_port=19669
      - --log_path=/logs/graph
      - --daemonize=false
    ports:
      - "9669:9669"     # Graph Thrift (客户端连接)
      - "19669:19669"   # Graph HTTP
    volumes:
      - ./docker/infra/nebula/logs:/logs/graph
    networks:
      - dataengine-infra
    depends_on:
      de-nebula-metad:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:19669/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 256m

  # ---------------------------------------------------------------------------
  # NebulaGraph 3.6.0 - 图数据库（Storage 服务）
  # ---------------------------------------------------------------------------
  de-nebula-storaged:
    image: vesoft/nebula-storaged:v3.6.0
    container_name: de-nebula-storaged
    hostname: de-nebula-storaged
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=de-nebula-metad:9559
      - --local_ip=de-nebula-storaged
      - --port=9779
      - --ws_ip=de-nebula-storaged
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_path=/logs/storage
      - --daemonize=false
    ports:
      - "19779:19779"  # Storage HTTP
      - "9779:9779"    # Storage Thrift
    volumes:
      - de-nebula-storage:/data/storage
      - ./docker/infra/nebula/logs:/logs/storage
    networks:
      - dataengine-infra
    depends_on:
      de-nebula-metad:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:19779/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 256m

  # ---------------------------------------------------------------------------
  # MLflow 2.20.2 - 机器学习平台
  # ---------------------------------------------------------------------------
  de-mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.2
    container_name: de-mlflow
    hostname: de-mlflow
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlruns
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - de-mlflow-artifacts:/mlruns
      - ./docker/infra/mlflow:/mlflow
    networks:
      - dataengine-infra
    command: >
      sh -c "mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 256m

  # ---------------------------------------------------------------------------
  # Flink 1.20.0 - 流计算引擎（JobManager）
  # ---------------------------------------------------------------------------
  de-flink-jobmanager:
    image: flink:1.20.0
    container_name: de-flink-jobmanager
    hostname: de-flink-jobmanager
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: de-flink-jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.bind.host: 0.0.0.0
        jobmanager.memory.process.size: 1600m
        jobmanager.web.address: 0.0.0.0
        jobmanager.web.port: 8081
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        rest.port: 8081
        parallelism.default: 4
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        execution.checkpointing.interval: 60000
        execution.checkpointing.mode: EXACTLY_ONCE
    ports:
      - "8081:8081"  # WebUI
      - "6123:6123"  # RPC
    volumes:
      - de-flink-jm-checkpoints:/opt/flink/checkpoints
    networks:
      - dataengine-infra
    command: jobmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Flink 1.20.0 - 流计算引擎（TaskManager 1）
  # ---------------------------------------------------------------------------
  de-flink-taskmanager-1:
    image: flink:1.20.0
    container_name: de-flink-taskmanager-1
    hostname: de-flink-taskmanager-1
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: de-flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.bind.host: 0.0.0.0
        taskmanager.host: de-flink-taskmanager-1
        taskmanager.memory.process.size: 1728m
        taskmanager.memory.flink.size: 1280m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 4
        state.backend: hashmap
    volumes:
      - de-flink-tm-checkpoints:/opt/flink/checkpoints
    networks:
      - dataengine-infra
    depends_on:
      de-flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Flink 1.20.0 - 流计算引擎（TaskManager 2）
  # ---------------------------------------------------------------------------
  de-flink-taskmanager-2:
    image: flink:1.20.0
    container_name: de-flink-taskmanager-2
    hostname: de-flink-taskmanager-2
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: de-flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.bind.host: 0.0.0.0
        taskmanager.host: de-flink-taskmanager-2
        taskmanager.memory.process.size: 1728m
        taskmanager.memory.flink.size: 1280m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 4
        state.backend: hashmap
    volumes:
      - de-flink-tm-checkpoints:/opt/flink/checkpoints
    networks:
      - dataengine-infra
    depends_on:
      de-flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Spark 3.5.3 (Bitnami) - 批计算引擎（Master）
  # ---------------------------------------------------------------------------
  de-spark-master:
    image: bitnami/spark:3.5.3
    container_name: de-spark-master
    hostname: de-spark-master
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPARK_MODE: master
      SPARK_MASTER_HOST: de-spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_DAEMON_MEMORY: 1g
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: "2"
    ports:
      - "7077:7077"    # Master RPC
      - "18080:8080"   # Master WebUI（宿主机 18080，避免与 Trino 8080 冲突）
    volumes:
      - ./docker/infra/spark/conf:/opt/bitnami/spark/conf:ro
      - de-spark-shared:/opt/spark/shared
    networks:
      - dataengine-infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Spark 3.5.3 (Bitnami) - 批计算引擎（Worker 1）
  # ---------------------------------------------------------------------------
  de-spark-worker-1:
    image: bitnami/spark:3.5.3
    container_name: de-spark-worker-1
    hostname: de-spark-worker-1
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://de-spark-master:7077
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./docker/infra/spark/conf:/opt/bitnami/spark/conf:ro
      - de-spark-shared:/opt/spark/shared
    networks:
      - dataengine-infra
    depends_on:
      de-spark-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Spark 3.5.3 (Bitnami) - 批计算引擎（Worker 2）
  # ---------------------------------------------------------------------------
  de-spark-worker-2:
    image: bitnami/spark:3.5.3
    container_name: de-spark-worker-2
    hostname: de-spark-worker-2
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://de-spark-master:7077
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./docker/infra/spark/conf:/opt/bitnami/spark/conf:ro
      - de-spark-shared:/opt/spark/shared
    networks:
      - dataengine-infra
    depends_on:
      de-spark-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m