# ============================================================
# SonarCloud 全局属性配置文件
# ============================================================
# 用途：为 sonar-scanner CLI 提供默认配置（前端分析使用）
# 注意：Java 模块分析通过 mvn sonar:sonar 命令行参数覆盖，
#       本文件主要供前端 sonar-scanner 和本地手动扫描使用。
#
# 组织与主机（公共云）
sonar.organization=levango7
sonar.host.url=https://sonarcloud.io

# ------------------------------------------------------------
# 排除规则：不参与分析的文件/目录
# ------------------------------------------------------------
# - **/target/**        Maven 构建产物
# - **/node_modules/**  前端依赖
# - **/*.test.*         前端测试文件（*.test.ts / *.test.js）
# - **/vendor/**        第三方 vendored 代码
# - **/generated/**     代码生成产物（protobuf、OpenAPI 等）
sonar.exclusions=**/target/**,**/node_modules/**,**/*.test.*,**/vendor/**,**/generated/**

# ------------------------------------------------------------
# 覆盖率排除：不计入覆盖率统计的文件
# ------------------------------------------------------------
# - **/test/**          Java/Go 测试目录
# - **/tests/**         前端测试目录
# - **/*Test*.java      Java 测试类
# - **/*Tests.java      Java 测试类（复数形式）
# - **/*IT.java         Java 集成测试
# - **/__tests__/**     Jest 测试目录
sonar.coverage.exclusions=**/test/**,**/tests/**,**/*Test*.java,**/*Tests.java,**/*IT.java,**/__tests__/**

# ------------------------------------------------------------
# 重复度检测排除：不参与重复代码检测的文件
# ------------------------------------------------------------
# - **/dto/**           DTO 类结构相似属正常
# - **/entity/**        JPA Entity 字段重复属正常
# - **/generated/**     代码生成产物
sonar.cpd.exclusions=**/dto/**,**/entity/**,**/generated/**

# ------------------------------------------------------------
# 新代码定义：仅分析新增/修改代码
# ------------------------------------------------------------
# previous_version：与上一个版本比较（基于 git tag）
# 也可设为 days:1（最近1天）、number_of_commits:30（最近30次提交）
sonar.leak.period=previous_version