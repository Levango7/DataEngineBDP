#!ipxe
# iPXE 引导配置 —— 拉起内核 + initrd，并把 cloud-init user-data 交给它
#
# 需要的文件（由 serve-pxe.sh --check-only 校验）：
#   vmlinuz      内核（取自你选定的 netboot 镜像，仓内不提供二进制）
#   initrd.img   initramfs（同上）
#   user-data.yaml  cloud-init 配置（模板见 ../cloud-init/user-data.yaml）
#
# 为什么不给死下载 URL：
#   云镜像站的 netboot 目录会随发行版版本移动，写死 URL 等于埋一个将来 404 的雷；
#   这里要求运维把选定发行版的 vmlinuz / initrd.img 放进根目录，由脚本校验存在性。

set pxe-port ${PXE_HTTP_PORT:8080}
set pxe-base http://${next-server}:${pxe-port}
set root-url ${pxe-base}

kernel ${root-url}/vmlinuz initrd=initrd.img autoinstall ds=nocloud-net;s=${root-url}/user-data.yaml console=ttyS0,115200n8
initrd ${root-url}/initrd.img
boot || goto failed

:failed
echo >>> iPXE: 内核引导失败
exit 1
