server:
  port: 0

spring:
  flyway:
    enabled: false
  application:
    name: encaps-tenant-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  security:
    jwt:
      secret: test-secret-key-for-unit-tests-at-least-256-bits-long
      issuer: shuqing-bigdata
    cors:
      allowed-origins: http://localhost:5173
  # Sprint 2.2 L4-0：关守 encaps-layer 侧 TenantController（防 /api/v1/tenants 双注册）
  tenant:
    controller:
      enabled: false
  k8s:
    mock-enabled: true
