server:
  port: 8081

spring:
  application:
    name: encaps-tenant
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/encaps-tenant-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.levango7.dataenginebdp: INFO

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes:
      service.name: ${spring.application.name}
  traces:
    exporter: otlp

app:
  security:
    jwt:
      algorithm: ${JWT_ALG:HS384}
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
      sm2-private-key: ${JWT_SM2_PRIVATE_KEY:}
      sm2-public-key: ${JWT_SM2_PUBLIC_KEY:}
    oidc:
      enabled: ${OIDC_ENABLED:false}
      jwks-uri: ${OIDC_JWKS_URI:}
      issuer-uri: ${OIDC_ISSUER_URI:}
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    encrypt-key: ${ENCRYPT_KEY}
    keycloak:
      realm: ${KEYCLOAK_REALM:shuqing}
      auth-server-url: ${KEYCLOAK_URL:http://keycloak-service:8080/realms/shuqing}
      resource: ${KEYCLOAK_CLIENT_ID:shuqing-platform}

  # Sprint 2.2 L4-0：本模块依赖 encaps-layer（同包扫描会带入其 TenantController，
  # 与本模块 TenantController 形成 /api/v1/tenants 双注册 → ambiguous mapping 启动失败）。
  # 显式关闭 encaps-layer 侧守卫（Sprint 2.1 加入的 @ConditionalOnProperty）。
  # 生产跨进程部署时 encaps-layer 侧可按需重新开启（默认 matchIfMissing=true）。
  tenant:
    controller:
      enabled: ${ENCAPS_LAYER_TENANT_CONTROLLER_ENABLED:false}

  k8s:
    mock-enabled: ${K8S_MOCK_ENABLED:false}

security:
  jwt:
    rotation:
      enabled: ${JWT_ROTATION_ENABLED:false}
      interval-days: 90
      overlap-days: 7
      interval-millis: 7776000000
      key-store-path: ${user.home}/.dataenginebdp/keys
