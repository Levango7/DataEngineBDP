# 生产环境 Profile（spring.profiles.active=prod）
# 覆盖默认 H2 配置，切换到 PostgreSQL；JWT secret 必须外置。
#
# 注意：encaps-tenant 与 encaps-layer 存在同名表（租户/工作空间相关），
# 二者共用 shuqing 库时必须用独立 schema（encaps_tenant）隔离，禁止落到 public。

spring:
  datasource:
    # 各服务共用 PostgreSQL 实例、各自独立 schema（避免与 encaps-layer 撞表名）
    url: ${DB_URL:jdbc:postgresql://postgresql:5432/shuqing?currentSchema=encaps_tenant}
    username: ${DB_USERNAME:shuqing}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # 建表由 Flyway 负责（db/migration/V1__baseline.sql），Hibernate 只校验不改表
  flyway:
    enabled: true
    schemas: ${FLYWAY_SCHEMA:encaps_tenant}
    create-schemas: true
    baseline-on-migrate: false
    locations: classpath:db/migration/encaps-tenant
  jpa:
    hibernate:
      # 生产默认 validate（表由迁移管理）；本地验证/初始化可用 DDL_AUTO=update 覆盖
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}  # 生产环境必须外置，无默认值
      issuer: ${JWT_ISSUER:shuqing-bigdata}
    cors:
      allowed-origins: ${CORS_ORIGINS}
