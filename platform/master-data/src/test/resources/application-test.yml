# 测试环境 Profile
# 使用 H2 内存数据库，关闭 H2 console，配置测试用 JWT secret

server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:test-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

app:
  security:
    jwt:
      secret: test-secret-key-for-hmac-sha-256-at-least-32-bytes-long
      issuer: test-issuer
    cors:
      allowed-origins: http://localhost:5173
    api-key:
      enabled: true
      valid-keys: test-api-key-1,test-api-key-2
      tenant-id: test-tenant
