[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sq-chunker"
version = "0.1.0"
description = "Shuqing Big Data Platform - Multi-modal Chunker Framework (T008-1)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shuqing Big Data Platform Team"},
]
keywords = ["chunker", "multi-modal", "rag", "embedding", "text", "image", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    # 图像/表格切片测试所需依赖
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
]
# T008-6: Embedding + RAG 可选依赖
embedding = [
    "sentence-transformers>=2.2.0",
    "tiktoken>=0.5.0",
]
embedding-openai = [
    "openai>=1.0.0",
]
rag = [
    "pymilvus>=2.3.0",
]
all = [
    "sentence-transformers>=2.2.0",
    "tiktoken>=0.5.0",
    "openai>=1.0.0",
    "pymilvus>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/shuqing/sq-chunker"

[tool.setuptools.packages.find]
where = ["."]
include = ["chunker*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "embedding/tests/*",
    "rag/tests/*",
    "*/tests/*",
    "conftest.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]