# 生产环境 Profile（spring.profiles.active=prod）
# 覆盖默认 H2 配置，切换到 PostgreSQL；JWT secret 必须外置。

spring:
  datasource:
    # 各服务共用 PostgreSQL 实例、各自独立 schema（避免多服务同库撞表名）
    url: ${DB_URL:jdbc:postgresql://postgresql:5432/shuqing?currentSchema=encaps_layer}
    username: ${DB_USERNAME:shuqing}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # 建表由 Flyway 负责（db/migration/V1__baseline.sql），Hibernate 只校验不改表
  flyway:
    enabled: true
    schemas: ${FLYWAY_SCHEMA:encaps_layer}
    create-schemas: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}  # 生产环境必须外置，无默认值
      issuer: ${JWT_ISSUER:shuqing-bigdata}
    cors:
      allowed-origins: ${CORS_ORIGINS}

management:
  endpoint:
    health:
      show-details: when-authorized  # 生产环境：健康详情仅认证用户可见