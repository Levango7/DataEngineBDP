server:
  port: 8080

spring:
  application:
    name: encaps-layer
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/encaps-layer-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    # 不写死驱动类：Spring Boot 按 JDBC URL 自动推断（H2/PostgreSQL 均可）。
    # 如需强制指定可用 DB_DRIVER 覆盖。
    driver-class-name: ${DB_DRIVER:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.levango7.dataenginebdp: INFO

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes:
      service.name: ${spring.application.name}
  traces:
    exporter: otlp

app:
  security:
    jwt:
      # HMAC-SHA 签名密钥，至少 32 字节（256 bit）；生产环境必须通过环境变量覆盖
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-at-least-256-bits}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    # Keycloak OIDC：enabled=true 时优先 RS256/JWKS 验证，失败回退 HMAC（默认关闭，保持兼容）
    oidc:
      enabled: ${OIDC_ENABLED:false}
      jwks-uri: ${OIDC_JWKS_URI:}
      issuer-uri: ${OIDC_ISSUER_URI:}
    cors:
      # 允许的前端源，逗号分隔；默认放行 Vite 开发服务器
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
    keycloak:
      realm: ${KEYCLOAK_REALM:shuqing}
      auth-server-url: ${KEYCLOAK_URL:http://keycloak-service:8080/realms/shuqing}
      resource: ${KEYCLOAK_CLIENT_ID:shuqing-platform}

  # K8s 客户端配置：mock-enabled=true 时不连接真实集群，使用 mock 数据
  # 开发环境设 K8S_MOCK_ENABLED=true 使用 mock；生产/Service Mesh 环境设 false 连接真实 K8s
  # Service Mesh 模式（k3s + Istio）下，fabric8 KubernetesClient 从 KUBECONFIG 或 ~/.kube/config
  # 自动发现集群连接信息；k3s 安装脚本已将 kubeconfig 写入 ~/.kube/config（见 ske/k3s/install-k3s.sh）
  k8s:
    # 切真实模式：false 表示连接真实 K8s 集群（k3s/ Istio Service Mesh 控制面已就绪）
    mock-enabled: ${K8S_MOCK_ENABLED:false}
    # 集群连接覆盖项（留空则走 fabric8 默认 KUBECONFIG 发现）
    # k3s 默认 API 端口 6443；如需显式指定：
    # master-url: ${K8S_MASTER_URL:https://127.0.0.1:6443}
    # kubeconfig: ${K8S_KUBECONFIG:~/.kube/config}
    # Service Mesh 相关：sidecar 由 Istio 自动注入（namespace 标签 istio-injection=enabled）
    # mTLS 由 PeerAuthentication 管理（见 ske/k3s/peer-authentication-mtls.yaml），应用无需感知