server:
  port: 8080

spring:
  application:
    name: encaps-layer
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/encaps-layer-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    # 不写死驱动类：Spring Boot 按 JDBC URL 自动推断（H2/PostgreSQL 均可）。
    # 如需强制指定可用 DB_DRIVER 覆盖。
    driver-class-name: ${DB_DRIVER:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.levango7.dataenginebdp: INFO

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes:
      service.name: ${spring.application.name}
  traces:
    exporter: otlp

app:
  security:
    jwt:
      # JWT 签名算法：HS384（默认，非信创）/ SM3withSM2（信创环境）
      # 切换方式：环境变量 JWT_ALG=SM3withSM2，或 profile=xinchuang 时自动启用
      algorithm: ${JWT_ALG:HS384}
      # HMAC-SHA 签名密钥，至少 32 字节（256 bit）；生产环境必须通过环境变量覆盖
      # 仅在 algorithm=HS384/HS256 时使用
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-at-least-256-bits}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
      # SM2withSM3 签名密钥对（信创环境专用）
      # 私钥 D 值（32 字节，hex 字符串，64 字符）；生产环境通过 KMS/JWT_SM2_PRIVATE_KEY 注入
      # 公钥 Q 值（65 字节未压缩点编码，hex 字符串，130 字符）
      # 留空时启动阶段自动生成临时密钥对（仅开发环境，重启后旧 token 失效）
      sm2-private-key: ${JWT_SM2_PRIVATE_KEY:}
      sm2-public-key: ${JWT_SM2_PUBLIC_KEY:}
    # Keycloak OIDC：enabled=true 时优先 RS256/JWKS 验证，失败回退 HMAC（默认关闭，保持兼容）
    oidc:
      enabled: ${OIDC_ENABLED:false}
      jwks-uri: ${OIDC_JWKS_URI:}
      issuer-uri: ${OIDC_ISSUER_URI:}
    cors:
      # 允许的前端源，逗号分隔；默认放行 Vite 开发服务器
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    # 字段级加密全局 SM4 密钥（hex 字符串，32 字符 = 16 字节）
    # 生产环境必须通过环境变量 ENCRYPT_KEY 覆盖；开发环境默认值仅用于本地联调
    # 配置方式：export ENCRYPT_KEY=0123456789abcdef0123456789abcdef（32 字符 hex）
    # 留空时 @Encrypt/@Decrypt 切面在调用时抛 CryptoException（生产环境必须配置）
    # 注意：密钥由 KMS 生成，禁止硬编码到代码仓库；轮换周期 1 年（见 R-024）
    encrypt-key: ${ENCRYPT_KEY:0123456789abcdef0123456789abcdef}
    keycloak:
      realm: ${KEYCLOAK_REALM:shuqing}
      auth-server-url: ${KEYCLOAK_URL:http://keycloak-service:8080/realms/shuqing}
      resource: ${KEYCLOAK_CLIENT_ID:shuqing-platform}

  # 数据开发（Web IDE）配置
  develop:
    # 工作空间根路径：扫描文件树的基准目录（相对路径基于服务启动目录解析）
    workspace-root: ${DEVELOP_WORKSPACE_ROOT:./data/develop-workspace}
    # stream-batch-scheduler 基地址：作业提交目标
    scheduler-base-url: ${DEVELOP_SCHEDULER_URL:http://localhost:18086}

  # 数据集成（SeaTunnel）配置
  integrate:
    # SeaTunnel REST API 基地址
    seatunnel-base-url: ${SEATUNNEL_URL:http://localhost:5801}

  # K8s 客户端配置：mock-enabled=true 时不连接真实集群，使用 mock 数据
  # 开发环境设 K8S_MOCK_ENABLED=true 使用 mock；生产/Service Mesh 环境设 false 连接真实 K8s
  # Service Mesh 模式（k3s + Istio）下，fabric8 KubernetesClient 从 KUBECONFIG 或 ~/.kube/config
  # 自动发现集群连接信息；k3s 安装脚本已将 kubeconfig 写入 ~/.kube/config（见 ske/k3s/install-k3s.sh）
  k8s:
    # 切真实模式：false 表示连接真实 K8s 集群（k3s/ Istio Service Mesh 控制面已就绪）
    mock-enabled: ${K8S_MOCK_ENABLED:false}
    # 集群连接覆盖项（留空则走 fabric8 默认 KUBECONFIG 发现）
    # k3s 默认 API 端口 6443；如需显式指定：
    # master-url: ${K8S_MASTER_URL:https://127.0.0.1:6443}
    # kubeconfig: ${K8S_KUBECONFIG:~/.kube/config}
    # Service Mesh 相关：sidecar 由 Istio 自动注入（namespace 标签 istio-injection=enabled）
    # mTLS 由 PeerAuthentication 管理（见 ske/k3s/peer-authentication-mtls.yaml），应用无需感知

# JWT 密钥自动轮换（见 docs/JWT-KEY-ROTATION-GUIDE.md）
# 默认关闭（enabled=false），不影响现有 HMAC/OIDC 验签链路；生产环境设 true 开启
# 轮换策略：生成新 RSA 2048 密钥对 → 发布到双密钥池 → 过渡期后废弃旧密钥（零停机）
security:
  jwt:
    rotation:
      # 是否启用自动轮换（默认关闭，生产环境通过环境变量 JWT_ROTATION_ENABLED=true 开启）
      enabled: ${JWT_ROTATION_ENABLED:false}
      # 轮换间隔（天），默认 90 天（等保三级与 JR/T 0071-2012 合规上限）
      interval-days: 90
      # 新旧密钥并行验签过渡期（天），默认 7 天；须 ≥ 最长 token TTL（本平台 24h）
      overlap-days: 7
      # 调度间隔（毫秒）= interval-days × 86400000，供 @Scheduled 使用；默认 90 天
      interval-millis: 7776000000
      # 密钥持久化目录（PEM 文件落盘，便于审计与跨实例共享）
      key-store-path: ${user.home}/.dataenginebdp/keys