[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sq-nl2sql"
version = "0.1.0"
description = "Shuqing Big Data Platform - NL2SQL Core Engine (L4.5.4)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shuqing Big Data Platform Team"},
]
keywords = ["nl2sql", "text-to-sql", "langchain", "llm", "natural-language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "sqlparse==0.6.0",
    "python-dateutil==2.9.0",
    "jinja2==3.1.6",
]

# 注意：本模块依赖真源是 requirements.txt（pip-audit 与 CI 的 Python Test 都以它为准）。
# 2026-10-19 事故：#610 升级了 requirements 里的 langchain-openai 却漏改 core，导致
# requirements 不可解析；同时本文件与 requirements 版本漂移（sqlparse 0.5.0 vs 0.6.0、
# langchain-core 1.5.5 vs 1.6.12、tiktoken 0.6.0 vs 0.7.0、pytest-asyncio 0.23.6 vs >=1.4.0）。
# 本次已全部对齐 requirements.txt；后续改动请以 requirements.txt 为准同步本文件。

[project.optional-dependencies]
# LangChain SQL 生成（生产模式）
# 仅 langchain-openai 的 ChatOpenAI 有代码引用（sql_generator.py:421 懒加载）；
# langchain 主包 / langchain-community 全模块无 import，且 langchain-community 0.0.34
# 要求 langchain-core<0.2.0，与 1.6.x 根本不相容（留着会引入新的 ResolutionImpossible），故移除。
langchain = [
    "langchain-core==1.6.12",
    "langchain-openai==1.7.0",
    "openai==3.35.1",
    "tiktoken==0.7.0",
]
test = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "httpx==0.28.1",
    "sqlparse==0.6.0",
]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "httpx==0.28.1",
    "sqlparse==0.6.0",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.0",
    "openai==3.35.1",
    "tiktoken==0.7.0",
]

[project.urls]
Homepage = "https://github.com/shuqing/sq-nl2sql"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]