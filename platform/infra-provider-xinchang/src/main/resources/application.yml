server:
  port: 8081

spring:
  application:
    name: infra-provider-xinchang
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/xinchang-provider-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.shuqing.bigdata: INFO

app:
  security:
    jwt:
      # HMAC-SHA 签名密钥，至少 32 字节（256 bit）；生产环境必须通过环境变量覆盖
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-at-least-256-bits}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  xinchang:
    # IPMI Redfish API 基础配置（带外管理）
    ipmi:
      # 默认连接超时（毫秒）
      connect-timeout-ms: ${IPMI_CONNECT_TIMEOUT:5000}
      # 默认读取超时（毫秒）
      read-timeout-ms: ${IPMI_READ_TIMEOUT:30000}
      # 默认 BMC 用户名（生产环境通过环境变量注入）
      username: ${IPMI_USERNAME:ADMIN}
      # 默认 BMC 密码（生产环境通过环境变量注入）
      password: ${IPMI_PASSWORD:ADMIN}
    # PXE 网络启动配置
    pxe:
      # PXE 引导服务器地址
      boot-server: ${PXE_BOOT_SERVER:192.168.200.1}
      # 麒麟 V10 镜像 URL
      kylin-v10-image: ${KYLIN_V10_IMAGE:http://pxe.shuqing.local/images/kylin-v10-server.iso}
      # 统信 UOS 镜像 URL
      uos-image: ${UOS_IMAGE:http://pxe.shuqing.local/images/uniontech-uos-server.iso}
    # K8s 集群初始化配置
    k8s:
      # SKE 定制 kubeadm 配置模板路径
      kubeadm-config-template: ${KUBEADM_TEMPLATE:classpath:/kubeadm-config.yaml}
      # 默认 Pod 网段
      pod-cidr: ${POD_CIDR:10.244.0.0/16}
      # 默认 Service 网段
      service-cidr: ${SERVICE_CIDR:10.96.0.0/12}
      # 默认 K8s 版本
      version: ${K8S_VERSION:v1.28.9}
      # 控制平面 VIP（keepalived/负载均衡器地址）；为空时使用首个 control-plane 节点 hostname
      control-plane-vip: ${K8S_CONTROL_PLANE_VIP:}
    # SSH 远程执行配置：通过 SSH 到信创节点执行 kubeadm 命令
    ssh:
      # 默认 SSH 主机（可选，节点未提供 hostname 时兜底；正常应使用节点 hostname）
      host: ${SSH_HOST:}
      # SSH 端口
      port: ${SSH_PORT:22}
      # SSH 登录用户名（需具备 kubeadm 执行权限，通常为 root）
      username: ${SSH_USERNAME:root}
      # SSH 密码认证（与 key-file 二选一；生产环境建议用 key-file）
      password: ${SSH_PASSWORD:}
      # SSH 私钥文件路径（PKCS8 格式；优先于 password 认证）
      key-file: ${SSH_KEY_FILE:}
      # 是否在远程命令前加 sudo（SSH 用户非 root 时需要）
      use-sudo: ${SSH_USE_SUDO:true}