server:
  port: 0

spring:
  application:
    name: encaps-data-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  security:
    jwt:
      secret: test-secret-key-for-unit-tests-at-least-256-bits-long
      issuer: shuqing-bigdata
    cors:
      allowed-origins: http://localhost:5173
    # 凭据加密密钥（CredentialEncryptorConfig 条件装配的前置）：不配则 CredentialEncryptor
    # bean 不注册，DataSourceController 构造失败（台账 #57① 上下文守卫实测暴露）。
    credential-encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    encrypt-key: 0123456789abcdef0123456789abcdef