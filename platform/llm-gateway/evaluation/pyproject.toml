# T031 模型评测平台 Python 项目配置
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sq-evaluation"
version = "0.1.0"
description = "数擎大数据平台 T031 模型评测平台与 A/B 对比"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"