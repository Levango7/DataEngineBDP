[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sq-business-portal"
version = "0.1.0"
description = "Shuqing Big Data Platform - Business Portal (L5.4)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shuqing Big Data Platform Team"},
]
keywords = ["business-portal", "multi-tenant", "data-isolation", "internal-billing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
test = [
    "pytest==8.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "mlflow==3.15.1",
]
mlflow = ["mlflow==3.15.1"]

[project.urls]
Homepage = "https://github.com/shuqing/sq-business-portal"
Documentation = "https://github.com/shuqing/sq-business-portal/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["business_portal*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]