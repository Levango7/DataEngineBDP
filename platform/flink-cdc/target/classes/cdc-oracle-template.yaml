# ============================================================================
# 数擎大数据平台 - Flink CDC Oracle 管道配置模板
# ============================================================================
# 本文件描述一条从 Oracle 同步变更到 Kafka 的 CDC 管道。
# 使用方式：复制本文件并按实际环境修改，通过 start-cdc-oracle.sh 启动。
# ----------------------------------------------------------------------------
# Oracle 服务端前置条件：
#   1. Oracle 11g+，启用 ARCHIVELOG 模式（ALTER DATABASE ARCHIVELOG）
#   2. 启用 supplemental logging（ALTER DATABASE ADD SUPPLEMENTAL LOG DATA）
#   3. 用户具备 EXECUTE_CATALOG_ROLE、SELECT ANY TRANSACTION 等权限
#   4. LogMiner 选项需匹配服务端 Redo Log 配置
# ============================================================================

# ---- 作业级配置 ----
job:
  name: oracle-to-kafka
  parallelism: 2

# ---- 数据源（Source）配置 ----
sources:
  - name: ora-orders
    type: ORACLE                  # 数据源类型: MYSQL / POSTGRESQL / ORACLE
    host: 127.0.0.1
    port: 1521
    username: cdc_user            # 需具备 EXECUTE_CATALOG_ROLE、SELECT ANY TRANSACTION 权限
    password: cdc_password
    database: ORCLPDB1            # Oracle service name（也可使用 SID）
    table: SHOP.ORDERS            # 表名（格式 SCHEMA.TABLE，全部大写）
    startupMode: initial          # initial / latest-offset / timestamp / specific-offset
    # startupTimestampMillis: 1700000000000   # 仅 timestamp 模式需要

    # ---- Oracle 特有配置 ----
    serviceName: ORCLPDB1         # Oracle service name（覆盖 database）
    schemaList:                   # 需捕获的 schema 列表（Oracle schema 等同于 user，全部大写）
      - SHOP
    tableList:                    # 需捕获的表列表（格式 SCHEMA.TABLE，全部大写）
      - SHOP.ORDERS
      # - SHOP.ORDER_ITEMS
    logMinerOption: both          # LogMiner 选项: online-log / archived-log / both
    useXStream: false             # 是否使用 XStream API（false=LogMiner，推荐 LogMiner）
    # startScn: 12345678          # 起始 SCN（仅 specific-offset 模式）

    includeSchemaChanges: false   # 是否捕获 DDL 变更
    parallelism: 2                # Source 并行度
    splitColumn: ID               # 全量快照分片列（Oracle 列名通常大写）

  # 示例：第二个数据源
  # - name: ora-products
  #   type: ORACLE
  #   host: 127.0.0.1
  #   port: 1521
  #   username: cdc_user
  #   password: cdc_password
  #   database: ORCLPDB1
  #   table: SHOP.PRODUCTS
  #   startupMode: latest-offset
  #   serviceName: ORCLPDB1
  #   schemaList:
  #     - SHOP
  #   tableList:
  #     - SHOP.PRODUCTS
  #   logMinerOption: archived-log
  #   parallelism: 1

# ---- 数据目标（Sink）配置 ----
sinks:
  - name: kafka-ora-orders
    type: KAFKA                    # 目标类型: KAFKA / ICEBERG / DORIS
    host: 127.0.0.1
    port: 9092
    topic: cdc.SHOP.ORDERS        # Kafka Topic 名称
    writeMode: upsert              # append-only / upsert / overwrite
    format: debezium-json          # debezium-json / canal-json / json / parquet
    primaryKey: ID                 # upsert 模式主键列（逗号分隔，Oracle 列名大写）
    parallelism: 2
    properties:                    # 额外 Kafka 生产者属性
      acks: "1"
      linger.ms: "10"
      batch.size: "16384"