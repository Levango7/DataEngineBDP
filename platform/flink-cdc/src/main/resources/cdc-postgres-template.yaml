# ============================================================================
# 数擎大数据平台 - Flink CDC PostgreSQL 管道配置模板
# ============================================================================
# 本文件描述一条从 PostgreSQL 同步变更到 Kafka 的 CDC 管道。
# 使用方式：复制本文件并按实际环境修改，通过 start-cdc-postgres.sh 启动。
# ----------------------------------------------------------------------------
# PostgreSQL 服务端前置条件：
#   1. postgresql.conf: wal_level=logical, max_replication_slots>=10
#   2. 用户具备 REPLICATION、LOGIN 权限，且对目标表有 SELECT 权限
#   3. 已创建 replication slot（或由连接器自动创建）
# ============================================================================

# ---- 作业级配置 ----
job:
  name: postgres-to-kafka
  parallelism: 2

# ---- 数据源（Source）配置 ----
sources:
  - name: pg-orders
    type: POSTGRESQL              # 数据源类型: MYSQL / POSTGRESQL / ORACLE
    host: 127.0.0.1
    port: 5432
    username: cdc_user            # 需具备 REPLICATION、LOGIN 权限
    password: cdc_password
    database: shop                # 数据库名
    table: public.orders          # 表名（格式 schema.table，支持正则）
    startupMode: initial          # initial / latest-offset / timestamp / specific-offset
    # startupTimestampMillis: 1700000000000   # 仅 timestamp 模式需要

    # ---- PostgreSQL 特有配置 ----
    # Logical Replication Slot 配置（基于 WAL 逻辑解码）
    slotName: flink_slot          # slot 名称（需在 PG 中唯一，多作业需不同 slot）
    decodingPlugin: pgoutput      # 逻辑解码插件: pgoutput / decoderbufs / wal2json
    schemaList:                   # 需捕获的 schema 列表（支持正则）
      - public
    tableList:                    # 需捕获的表列表（格式 schema.table，支持正则）
      - public.orders
      # - public.order_items
    slotDropOnFinish: false       # 作业结束后是否删除 slot

    includeSchemaChanges: false   # 是否捕获 DDL 变更
    parallelism: 2                # Source 并行度
    splitColumn: id               # 全量快照分片列

  # 示例：第二个数据源
  # - name: pg-products
  #   type: POSTGRESQL
  #   host: 127.0.0.1
  #   port: 5432
  #   username: cdc_user
  #   password: cdc_password
  #   database: shop
  #   table: public.products
  #   startupMode: latest-offset
  #   slotName: flink_slot_products
  #   decodingPlugin: pgoutput
  #   schemaList:
  #     - public
  #   tableList:
  #     - public.products
  #   parallelism: 1

# ---- 数据目标（Sink）配置 ----
sinks:
  - name: kafka-pg-orders
    type: KAFKA                    # 目标类型: KAFKA / ICEBERG / DORIS
    host: 127.0.0.1
    port: 9092
    topic: cdc.public.orders      # Kafka Topic 名称
    writeMode: upsert              # append-only / upsert / overwrite
    format: debezium-json          # debezium-json / canal-json / json / parquet
    primaryKey: id                 # upsert 模式主键列（逗号分隔）
    parallelism: 2
    properties:                    # 额外 Kafka 生产者属性
      acks: "1"
      linger.ms: "10"
      batch.size: "16384"