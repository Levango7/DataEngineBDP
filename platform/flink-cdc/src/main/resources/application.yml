# ============================================================================
# 物化视图管理面宿主配置（Phase C1）
# 仅 MaterializedViewManagementApplication 启动时生效；作业提交器（CliFrontend）
# 不加载 Spring 上下文，不受本文件影响。
# ============================================================================
server:
  port: 8080
spring:
  application:
    name: flink-cdc-materializedview

# ---- 管理面鉴权（common-security 自动装配读取）----
# 生产必须经环境变量注入真实密钥（>= 32 字节）；此处默认值仅供本地/CI 冒烟。
app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-mv-management-secret-0123456789abcdef}
      issuer: ${JWT_ISSUER:dataenginebdp}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    ratelimit:
      enabled: true

# ---- 物化视图框架 ----
materializedview:
  enabled: true
  doris:
    fe-hosts: ${MV_DORIS_FE_HOSTS:127.0.0.1:8030}
    username: ${MV_DORIS_USER:root}
    password: ${MV_DORIS_PASSWORD:}
    database: ${MV_DORIS_DB:report}
    connect-timeout-ms: 10000
    read-timeout-ms: 60000
