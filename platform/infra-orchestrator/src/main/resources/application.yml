server:
  port: 8085

spring:
  application:
    name: infra-orchestrator
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/orchestrator-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.shuqing.bigdata: INFO

app:
  security:
    jwt:
      # HMAC-SHA 签名密钥，至少 32 字节（256 bit）；生产环境必须通过环境变量覆盖
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-at-least-256-bits}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  orchestrator:
    # WebClient 调用下游 Provider 的超时配置
    webclient:
      connect-timeout-ms: ${WC_CONNECT_TIMEOUT:5000}
      read-timeout-ms: ${WC_READ_TIMEOUT:30000}
      write-timeout-ms: ${WC_WRITE_TIMEOUT:30000}
      response-timeout-ms: ${WC_RESPONSE_TIMEOUT:60000}
      max-in-memory-size-mb: ${WC_MAX_MEMORY_MB:16}
    # 集群状态轮询配置
    poll:
      enabled: ${POLL_ENABLED:true}
      max-attempts: ${POLL_MAX_ATTEMPTS:60}
      interval-ms: ${POLL_INTERVAL_MS:2000}
    # 下游 Provider 连接配置（可通过环境变量覆盖）
    providers:
      xinchang:
        base-url: ${XINCHANG_PROVIDER_URL:http://infra-provider-xinchang:8090}
        enabled: ${XINCHANG_PROVIDER_ENABLED:true}
      baremetal:
        base-url: ${BAREMETAL_PROVIDER_URL:http://infra-provider-baremetal:8091}
        enabled: ${BAREMETAL_PROVIDER_ENABLED:true}
      cloud:
        base-url: ${CLOUD_PROVIDER_URL:http://infra-provider-cloud:8092}
        enabled: ${CLOUD_PROVIDER_ENABLED:true}
      private:
        base-url: ${PRIVATE_PROVIDER_URL:http://infra-provider-private:8093}
        enabled: ${PRIVATE_PROVIDER_ENABLED:true}
    # 环境默认配置 Profile（可覆盖，未列出的环境使用内置默认值）
    profiles:
      XINCHANG:
        default-cpu-cores: 16
        default-memory-gb: 64
        default-disk-gb: 500
        default-k8s-version: v1.28.9
        default-network-type: vlan
      BAREMETAL:
        default-cpu-cores: 32
        default-memory-gb: 128
        default-disk-gb: 1000
        default-k8s-version: v1.29.2
        default-network-type: vlan
      CLOUD_HUAWEI:
        default-cpu-cores: 8
        default-memory-gb: 32
        default-disk-gb: 200
        default-network-type: vpc
      CLOUD_ALI:
        default-cpu-cores: 8
        default-memory-gb: 32
        default-disk-gb: 200
        default-network-type: vpc
      CLOUD_TENCENT:
        default-cpu-cores: 8
        default-memory-gb: 32
        default-disk-gb: 200
        default-network-type: vpc
      PRIVATE_VSPHERE:
        default-cpu-cores: 8
        default-memory-gb: 16
        default-disk-gb: 200
        default-network-type: vlan
      PRIVATE_OPENSTACK:
        default-cpu-cores: 8
        default-memory-gb: 16
        default-disk-gb: 200
        default-network-type: vlan