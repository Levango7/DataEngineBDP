server:
  port: 8084

spring:
  application:
    name: metadata-collector
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/metadata_collector}
    username: ${DB_USERNAME:metadata}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.levango7.dataenginebdp: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
    cors:
      allowed-origins: ${CORS_ORIGINS:https://console.shuqing.example.com}
  catalog:
    base-url: ${CATALOG_BASE_URL:http://catalog:8082}
    timeout-seconds: ${CATALOG_TIMEOUT:30}
    max-retries: ${CATALOG_MAX_RETRIES:3}
  collector:
    hive:
      default-database: ${HIVE_DEFAULT_DB:default}
    doris:
      default-database: ${DORIS_DEFAULT_DB:information_schema}
    filesystem:
      max-depth: ${FS_MAX_DEPTH:5}