server:
  port: 8084

spring:
  application:
    name: metadata-collector
  datasource:
    # 独立 schema：Flyway 建表与 Hibernate 校验都落在 metadata_collector（多服务同库避免撞表名）
    url: ${DB_URL:jdbc:postgresql://postgres:5432/metadata_collector?currentSchema=metadata_collector}
    username: ${DB_USERNAME:metadata}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # 建表由 Flyway 负责（db/migration/V1__baseline.sql），Hibernate 只校验不改表
  flyway:
    enabled: true
    schemas: ${FLYWAY_SCHEMA:metadata_collector}
    create-schemas: true
    baseline-on-migrate: false
    locations: classpath:db/migration/metadata-collector
  jpa:
    hibernate:
      # 原为 none（既不建表也不校验，风险最高）；Flyway 接管建表后改为 validate
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.levango7.dataenginebdp: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
    cors:
      allowed-origins: ${CORS_ORIGINS:https://console.shuqing.example.com}
  catalog:
    base-url: ${CATALOG_BASE_URL:http://catalog:8082}
    timeout-seconds: ${CATALOG_TIMEOUT:30}
    max-retries: ${CATALOG_MAX_RETRIES:3}
  collector:
    hive:
      default-database: ${HIVE_DEFAULT_DB:default}
    doris:
      default-database: ${DORIS_DEFAULT_DB:information_schema}
    filesystem:
      max-depth: ${FS_MAX_DEPTH:5}