server:
  port: 8084

spring:
  application:
    name: metadata-collector
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/metadata-collector-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.levango7.dataenginebdp: INFO

app:
  security:
    jwt:
      # HMAC-SHA 签名密钥，至少 32 字节（256 bit）；生产环境必须通过环境变量覆盖
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
    cors:
      # 允许的前端源，逗号分隔；默认放行 Vite 开发服务器
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  # Catalog 服务地址：采集结果写入目标
  catalog:
    base-url: ${CATALOG_BASE_URL:http://catalog:8082}
    timeout-seconds: ${CATALOG_TIMEOUT:30}
    max-retries: ${CATALOG_MAX_RETRIES:3}

  # 各 Collector 默认配置
  collector:
    hive:
      default-database: ${HIVE_DEFAULT_DB:default}
    doris:
      default-database: ${DORIS_DEFAULT_DB:information_schema}
    filesystem:
      max-depth: ${FS_MAX_DEPTH:5}