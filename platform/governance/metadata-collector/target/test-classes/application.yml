server:
  port: 0

spring:
  application:
    name: metadata-collector-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  security:
    jwt:
      secret: test-secret-key-for-unit-tests-at-least-256-bits-long
      issuer: shuqing-bigdata
    cors:
      allowed-origins: http://localhost:5173
  catalog:
    base-url: http://localhost:8082
    timeout-seconds: 5
    max-retries: 1
  collector:
    hive:
      default-database: default
    doris:
      default-database: information_schema
    filesystem:
      max-depth: 3