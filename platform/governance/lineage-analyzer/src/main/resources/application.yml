server:
  port: 8086
  # 移除 context-path: /lineage，所有 API 直接从 /api/v1/* 访问，与平台其他服务保持一致

spring:
  application:
    name: lineage-analyzer
  datasource:
    # H2 内存数据库：开发/测试零配置；生产可通过环境变量切换至 PostgreSQL
    url: jdbc:h2:mem:lineage;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

# JWT 鉴权配置
app:
  security:
    jwt:
      # 开发态默认密钥；生产通过环境变量 JWT_SECRET 覆盖
      secret: ${JWT_SECRET:shuqing-bigdata-lineage-dev-secret-please-change-in-production-32bytes}
      # 是否启用 JWT 校验（false 时所有接口匿名可访问，便于本地联调）
      enabled: ${JWT_ENABLED:false}

# NebulaGraph 可选后端配置（默认不启用，使用内存图 + H2）
nebula:
  enabled: false
  host: ${NEBULA_HOST:127.0.0.1}
  port: ${NEBULA_PORT:9669}
  username: ${NEBULA_USER:root}
  password: ${NEBULA_PASSWORD}
  space: ${NEBULA_SPACE:lineage}

# 血缘分析配置
lineage:
  # 查询深度上限，防止图过大
  max-depth: 10
  # 影响分析最大节点数
  max-impact-nodes: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.levango7.dataenginebdp.governance.lineage: INFO
    org.hibernate.SQL: WARN