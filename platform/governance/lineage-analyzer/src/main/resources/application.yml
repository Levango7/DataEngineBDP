server:
  port: 8086
  # 移除 context-path: /lineage，所有 API 直接从 /api/v1/* 访问，与平台其他服务保持一致

spring:
  application:
    name: lineage-analyzer
  datasource:
    # H2 内存数据库：开发/测试零配置；生产可通过环境变量切换至 PostgreSQL
    url: jdbc:h2:mem:lineage;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false
  # Flyway：仅生产/集成环境启用（prod profile 置 true）。
  # dev 默认关闭：H2 + ddl-auto=update 零配置本地起库；
  # 基线脚本是 PostgreSQL 方言，不能在 H2 上执行。
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

# JWT 鉴权配置
app:
  security:
    jwt:
      # JWT 密钥必须外置，无默认值；开发/生产均通过环境变量 JWT_SECRET 注入
      # 本地联调可在 IDE Run Configuration 中设置 JWT_SECRET 环境变量
      secret: ${JWT_SECRET}
      # 是否启用 JWT 校验（默认启用；本地联调可通过环境变量 JWT_ENABLED=false 关闭）
      enabled: ${JWT_ENABLED:true}

# NebulaGraph 可选后端配置（默认不启用，使用内存图 + H2）
nebula:
  enabled: false
  host: ${NEBULA_HOST:127.0.0.1}
  port: ${NEBULA_PORT:9669}
  username: ${NEBULA_USER:root}
  password: ${NEBULA_PASSWORD}
  space: ${NEBULA_SPACE:lineage}

# 血缘分析配置
lineage:
  # 查询深度上限，防止图过大
  max-depth: 10
  # 影响分析最大节点数
  max-impact-nodes: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.levango7.dataenginebdp.governance.lineage: INFO
    org.hibernate.SQL: WARN