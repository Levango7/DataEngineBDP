# DataEngineBDP - Bare Metal Infra Provider 配置
# 本地数据中心裸金属供应Provider
#
# 安全说明：所有敏感字段（密钥/密码/DSN）通过 ${ENV_VAR} 引用环境变量，
# 不再内联硬编码。部署方必须显式注入以下环境变量，缺失则启动 fatal：
#   - JWT_SIGNING_KEY:           JWT 签名密钥（≥32 字节）
#   - POSTGRES_DSN:              PostgreSQL 连接串（仅 driver=postgres 时生效）
#   - REDFISH_DEFAULT_PASSWORD:  BMC 默认密码
#   - REDFISH_INSECURE_SKIP_VERIFY: 是否跳过 BMC TLS 校验（true/false，生产建议 false）

server:
  # HTTP服务监听端口
  port: 8080
  # Gin运行模式: debug / release / test
  mode: release
  # 请求读超时(秒)
  read_timeout: 30
  # 请求写超时(秒)
  write_timeout: 60

# JWT鉴权配置
auth:
  # JWT签名密钥(通过环境变量注入，不再硬编码)
  secret: "${JWT_SIGNING_KEY}"
  # Token有效期(小时)
  token_ttl: 24
  # 默认签发主体
  issuer: "infra-provider-baremetal"

# 数据库配置
database:
  # 驱动: sqlite(开发) / postgres(生产)
  driver: sqlite
  # SQLite文件路径(仅driver=sqlite时生效)
  sqlite_path: "./data/baremetal.db"
  # PostgreSQL DSN(仅driver=postgres时生效，通过环境变量注入，不再硬编码密码)
  postgres_dsn: "${POSTGRES_DSN}"
  # 最大打开连接数
  max_open_conns: 20
  # 最大空闲连接数
  max_idle_conns: 5

# Redfish/IPMI带外管理默认配置
redfish:
  # 默认BMC用户名(可被节点配置覆盖)
  default_username: "admin"
  # 默认BMC密码(通过环境变量注入，不再硬编码)
  default_password: "${REDFISH_DEFAULT_PASSWORD}"
  # HTTPS请求超时(秒)
  timeout: 30
  # 是否校验BMC TLS证书(通过环境变量配置，生产建议 false 即严格校验)
  insecure_skip_verify: ${REDFISH_INSECURE_SKIP_VERIFY}

# K8s集群初始化配置
k8s:
  # kubeadm使用的K8s版本
  kubernetes_version: "v1.29.2"
  # Pod网络CIDR
  pod_cidr: "10.244.0.0/16"
  # Service网络CIDR
  service_cidr: "10.96.0.0/12"
  # 控制平面API Server对外监听端口
  api_server_port: 6443
  # 镜像仓库(国内可改为registry.cn-hangzhou.aliyuncs.com/google_containers)
  image_repository: "registry.k8s.io"

# PXE引导配置
pxe:
  # TFTP服务器IP
  tftp_server: "192.168.10.10"
  # HTTP装机源地址(存放kernel/initrd/rootfs)
  http_boot_url: "http://192.168.10.10:8080/pxe/boot"
  # 默认OS镜像名称
  default_image: "ubuntu-22.04-server-cloudimg-amd64"

# 日志配置
log:
  # 日志级别: trace / debug / info / warn / error / fatal / panic
  level: info
  # 日志格式: text / json
  format: json
  # 是否输出调用者信息
  report_caller: true