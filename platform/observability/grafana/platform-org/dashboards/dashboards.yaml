# Grafana 平台方 Organization 仪表板 provisioning 配置
#
# 从 platform-org/dashboards/ 目录自动加载所有 JSON 仪表板。
apiVersion: 1

providers:
  - name: platform-dashboards
    orgId: 1
    folder: 平台运维
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/platform-org
      foldersFromFilesStructure: true