# Grafana 主配置 grafana.ini（双 Organization 视图）
#
# 启用 multi-organization 后，Grafana 通过 orgId 隔离平台方与客户方数据源/仪表板。
# 平台方 Organization（orgId=1）由 init-orgs.sh 创建并赋予 platform-ops 角色。
# 客户方 Organization（orgId>=2）由租户开通时动态创建，每租户一个 Organization。
#
# 关键安全项：
#   - [auth] disable_login_form=true，强制走 OAuth/OIDC（Keycloak）。
#   - [organizations] 自动将 Keycloak group 映射到 Grafana org role。
#   - [security] cookie_secure=true，禁止明文 cookie。

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_addr = 0.0.0.0
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[security]
admin_user = admin
admin_password = admin
disable_gravatar = true
cookie_secure = true
cookie_httponly = true
strict_transport_security = true
x_xss_protection = true
x_content_type_options = true

[auth]
disable_login_form = true
oauth_auto_login = true

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
client_id = grafana
client_secret = ${GRAFANA_OAUTH_CLIENT_SECRET}
scopes = openid profile email groups
auth_url = http://keycloak:8080/realms/shuqing/protocol/openid-connect/auth
token_url = http://keycloak:8080/realms/shuqing/protocol/openid-connect/token
api_url = http://keycloak:8080/realms/shuqing/protocol/openid-connect/userinfo
login_attribute_path = preferred_username
groups_attribute_path = groups
role_attribute_path = contains(groups, 'platform-ops') && 'Admin' || 'Viewer'
tls_skip_verify_insecure = false

[organizations]
auto_assign_org_id = 1
# 启用组织角色映射：Keycloak group → Grafana org role。
org_role_mapping = platform-ops:Admin,tenant-admin:Admin,tenant-editor:Editor,tenant-viewer:Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console
level = info

[alerting]
enabled = false
# 告警统一由 Alertmanager + Prometheus rule 管理，关闭 Grafana 内置告警。

[unified_alerting]
enabled = false

[plugins]
enable_alpha = false
app_tls_skip_verify_insecure = false

[expressions]
enabled = true

[feature_toggles]
enable = multiOrganization