# 告警路由配置（Kubernetes AlertmanagerConfig CRD）
#
# 用途：按严重程度（severity）路由告警到不同通知渠道。
# 部署：kubectl apply -f alert-routing.yaml -n monitoring
#
# 路由策略：
#   severity=critical → PagerDuty + 邮件（7x24 立即，5 分钟重复）
#   severity=warning  → 邮件（30 秒聚合，30 分钟重复）
#   severity=info     → Slack（1 分钟聚合，4 小时重复）
#   其他              → default-slack 兜底
#
# 与现有 alertmanager/alertmanager.yml 的关系：
#   现有 alertmanager.yml 采用 P0/P1/P2 三级（电话/邮件/钉钉）。
#   本文件采用 critical/warning/info 三级（PagerDuty/邮件/Slack），
#   作为 CRD 化部署的补充路由配置，二者通过 namespace/label 隔离可并存。
apiVersion: monitoring.coreos.com/v1
kind: AlertmanagerConfig
metadata:
  name: alert-routing
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-config
    app.kubernetes.io/part-of: observability
    prometheus: kube-prometheus
    role: alert-routing
  annotations:
    description: "告警路由：critical→PagerDuty+邮件, warning→邮件, info→Slack"
spec:
  route:
    receiver: default-slack
    groupBy: ['alertname', 'service', 'component']
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 4h
    routes:
      # critical 严重告警：PagerDuty + 邮件
      - matchers:
          - severity = "critical"
        receiver: critical-pagerduty-email
        groupWait: 0s
        groupInterval: 30s
        repeatInterval: 5m
        continue: false

      # warning 重要告警：邮件
      - matchers:
          - severity = "warning"
        receiver: warning-email
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 30m
        continue: false

      # info 一般告警：Slack
      - matchers:
          - severity = "info"
        receiver: info-slack
        groupWait: 1m
        groupInterval: 30m
        repeatInterval: 4h
        continue: false

  # 抑制规则：critical 触发时抑制同源 warning/info，避免告警风暴
  inhibitRules:
    - sourceMatchers:
        - severity = "critical"
      targetMatchers:
        - severity =~ "warning|info"
      equal: ['service', 'component', 'alertname']

    - sourceMatchers:
        - severity = "warning"
      targetMatchers:
        - severity = "info"
      equal: ['service', 'component', 'alertname']

  receivers:
    # critical：PagerDuty + 邮件
    - name: critical-pagerduty-email
      pagerDutyConfigs:
        - routingKey: '${PAGERDUTY_ROUTING_KEY}'
          severity: critical
          sendResolved: true
          description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
          clientURL: 'https://grafana.shuqing.bigdata'
      emailConfigs:
        - to: '${CRITICAL_EMAIL_TO}'
          sendResolved: true
          headers:
            Subject: '[CRITICAL] {{ .GroupLabels.alertname }} — {{ .CommonLabels.service }}'
          html: '{{ template "email.critical.html" . }}'

    # warning：邮件
    - name: warning-email
      emailConfigs:
        - to: '${WARNING_EMAIL_TO}'
          sendResolved: true
          headers:
            Subject: '[WARNING] {{ .GroupLabels.alertname }} — {{ .CommonLabels.service }}'
          html: '{{ template "email.warning.html" . }}'

    # info：Slack
    - name: info-slack
      slackConfigs:
        - apiURL: '${SLACK_WEBHOOK_URL}'
          channel: '#alerts-info'
          sendResolved: true
          title: '[INFO] {{ .GroupLabels.alertname }}'
          text: '{{ .CommonAnnotations.description }}'

    # 默认兜底：Slack
    - name: default-slack
      slackConfigs:
        - apiURL: '${SLACK_WEBHOOK_URL}'
          channel: '#alerts-default'
          sendResolved: true
          title: '{{ .GroupLabels.alertname }}'
          text: '{{ .CommonAnnotations.summary }}'