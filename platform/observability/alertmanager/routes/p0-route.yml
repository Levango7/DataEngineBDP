# P0 严重告警路由配置 — 电话 + 短信
#
# 本文件是 alertmanager.yml 中 P0 路由的独立描述，便于测试与文档化。
# 实际生效配置在 alertmanager.yml 的 route.routes[0] 与 receivers[p0-pager]。
#
# 触发条件：severity label == "P0"
# 通知渠道：电话网关（语音通知）+ 短信网关
# 时效要求：7x24 立即通知，group_wait=0s，repeat_interval=5m
# 典型场景：
#   - 集群节点宕机
#   - 核心数据库不可达
#   - 数据丢失风险
#   - 安全事件（入侵/泄露）
route:
  matchers:
    - severity = "P0"
  receiver: p0-pager
  group_by: ['alertname', 'tenant_id', 'component']
  group_wait: 0s
  group_interval: 30s
  repeat_interval: 5m
  continue: false

receiver:
  name: p0-pager
  channels:
    - type: phone
      description: 电话语音通知（7x24）
      url: '${PHONE_GATEWAY_URL}/api/v1/call'
      auth: Bearer ${PHONE_GATEWAY_TOKEN}
      send_resolved: true
      max_alerts: 0
    - type: sms
      description: 短信通知（7x24）
      url: '${SMS_GATEWAY_URL}/api/v1/sms'
      auth: Bearer ${SMS_GATEWAY_TOKEN}
      send_resolved: true
      max_alerts: 0