[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sq-knowledge-engine"
version = "0.1.0"
description = "Shuqing Big Data Platform - Knowledge Engineering Engine (L4.5.2)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shuqing Big Data Platform Team"},
]
keywords = ["knowledge-graph", "ner", "relation-extraction", "nebulagraph", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "httpx==0.28.1",
    "loguru==0.7.2",
    "python-dateutil==2.9.0",
]

[project.optional-dependencies]
nebula = ["nebula3-python==3.4.0"]
test = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "httpx==0.28.1",
]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "httpx==0.28.1",
    "nebula3-python==3.4.0",
]

[project.urls]
Homepage = "https://github.com/shuqing/sq-knowledge-engine"
Documentation = "https://github.com/shuqing/sq-knowledge-engine/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_engine*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]