server:
  port: 8081

spring:
  application:
    name: sql-gateway
  webflux:
    client:
      max-in-memory-size: 16MB
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/sql-gateway-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.levango7.dataenginebdp: INFO

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes:
      service.name: ${spring.application.name}
  traces:
    exporter: otlp

sql-gateway:
  backends:
    trino:
      url: http://trino-service:8080
      timeout: 30
      max-retries: 3
    doris:
      url: http://doris-fe-service:9030
      timeout: 30
      max-retries: 3
  default-engine: trino
  circuit-breaker:
    enabled: true
    failure-threshold: 5
    reset-timeout: 60

app:
  security:
    jwt:
      # HMAC-SHA 签名密钥，至少 32 字节（256 bit）；生产环境必须通过环境变量覆盖
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-at-least-256-bits}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    cors:
      # 允许的前端源，逗号分隔；默认放行 Vite 开发服务器
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
    keycloak:
      realm: ${KEYCLOAK_REALM:shuqing}
      auth-server-url: ${KEYCLOAK_URL:http://keycloak-service:8080/realms/shuqing}
      resource: ${KEYCLOAK_CLIENT_ID:shuqing-platform}

# 虚拟表模块配置
virtual-table:
  cache:
    # 元数据缓存最大条数
    maximum-size: 1000
    # 元数据缓存写入后过期分钟数
    expire-after-write-minutes: 10
  materialization:
    # 是否启用物化表定时刷新调度器
    scheduler-enabled: true
    # 默认刷新间隔秒数（虚拟表未指定时使用）
    default-refresh-interval-seconds: 300
