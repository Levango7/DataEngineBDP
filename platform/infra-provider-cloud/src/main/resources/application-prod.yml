# 生产环境 profile：切换 PostgreSQL、关闭 H2 控制台、提升日志级别门槛
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgresql:5432/shuqing?currentSchema=infra_provider_cloud}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # 建表由 Flyway 负责（db/migration/infra-provider-cloud/V1__baseline.sql），Hibernate 只校验不改表
  flyway:
    enabled: true
    schemas: ${FLYWAY_SCHEMA:infra_provider_cloud}
    create-schemas: true
    baseline-on-migrate: false
    locations: classpath:db/migration/infra-provider-cloud
  h2:
    console:
      enabled: false

logging:
  level:
    com.levango7.dataenginebdp: INFO
    org.hibernate: WARN