server:
  port: 8084
spring:
  application:
    name: infra-provider-cloud
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/infra-cloud-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.shuqing.bigdata: INFO

app:
  security:
    jwt:
      # HMAC-SHA 签名密钥，至少 32 字节（256 bit）；生产环境必须通过环境变量覆盖
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-at-least-256-bits}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    cors:
      # 允许的前端源，逗号分隔；默认放行 Vite 开发服务器
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  cloud:
    # 三朵云凭证：生产环境通过 K8s Secret / 环境变量注入，禁止明文提交
    huawei:
      ak: ${HUAWEI_AK:}
      sk: ${HUAWEI_SK:}
      region: ${HUAWEI_REGION:cn-north-4}
      # 镜像 ID / 网络 / 安全组等默认值，可被请求体覆盖
      image-id: ${HUAWEI_IMAGE_ID:}
      vpc-id: ${HUAWEI_VPC_ID:}
      subnet-id: ${HUAWEI_SUBNET_ID:}
      security-group-id: ${HUAWEI_SG_ID:}
    ali:
      ak: ${ALI_AK:}
      sk: ${ALI_SK:}
      region: ${ALI_REGION:cn-hangzhou}
      image-id: ${ALI_IMAGE_ID:}
      vpc-id: ${ALI_VPC_ID:}
      vswitch-id: ${ALI_VSWITCH_ID:}
      security-group-id: ${ALI_SG_ID:}
    tencent:
      secret-id: ${TENCENT_SECRET_ID:}
      secret-key: ${TENCENT_SECRET_KEY:}
      region: ${TENCENT_REGION:ap-guangzhou}
      image-id: ${TENCENT_IMAGE_ID:}
      vpc-id: ${TENCENT_VPC_ID:}
      subnet-id: ${TENCENT_SUBNET_ID:}
      security-group-id: ${TENCENT_SG_ID:}
  k8s:
    # K8s 引导脚本位置（kubeadm 二次封装的 SKE 引导脚本）
    bootstrap-script: ${K8S_BOOTSTRAP_SCRIPT:/opt/ske/bootstrap.sh}
    # 控制面 API Server 端口
    api-port: ${K8S_API_PORT:6443}
    # Pod CIDR / Service CIDR
    pod-cidr: ${K8S_POD_CIDR:10.244.0.0/16}
    service-cidr: ${K8S_SERVICE_CIDR:10.96.0.0/12}