[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sq-ml-platform"
version = "0.1.0"
description = "Shuqing Big Data Platform - ML Platform (L4.5.6)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shuqing Big Data Platform Team"},
]
keywords = ["ml-platform", "mlflow", "scikit-learn", "mllib", "feature-store", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.2.1",
    "httpx==0.28.1",
    "loguru==0.7.2",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
sklearn = [
    "scikit-learn==1.4.1.post1",
    "numpy==1.26.4",
    "joblib==1.3.2",
]
mlflow = ["mlflow==3.15.1"]
test = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "httpx==0.28.1",
    "scikit-learn==1.4.1.post1",
    "numpy==1.26.4",
    "joblib==1.3.2",
]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "httpx==0.28.1",
    "scikit-learn==1.4.1.post1",
    "numpy==1.26.4",
    "joblib==1.3.2",
    "mlflow==3.15.1",
]

[project.urls]
Homepage = "https://github.com/shuqing/sq-ml-platform"
Documentation = "https://github.com/shuqing/sq-ml-platform/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_platform*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]