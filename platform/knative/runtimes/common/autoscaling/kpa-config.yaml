# ============================================================================
# Knative KPA 自动伸缩 ConfigMap · 数擎大数据平台 T025
# ----------------------------------------------------------------------------
# 作用：配置 Knative Pod Autoscaler (KPA) 的全局参数
# 核心指标：
#   1. target RPS = 10：每个 Pod 目标处理 10 RPS，超过自动扩 Pod
#   2. scale-to-zero：无流量 60s 后 Pod 缩容到 0
#   3. max-scale-up-rate = 1000：快速扩容应对突发流量
# 验证：
#   kubectl get configmap config-autoscaler -n knative-serving -o yaml
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-autoscaler
  namespace: knative-serving
  labels:
    app.kubernetes.io/name: config-autoscaler
    app.kubernetes.io/part-of: serverless-runtime
    platform.shuqing.io/component: kpa-autoscaling
    platform.shuqing.io/task: "T025"
data:
  # ---------- scale-to-zero ----------
  # 启用缩容到零
  enable-scale-to-zero: "true"
  # 无流量后等待 60s 再缩容到零
  scale-to-zero-grace-period: "60s"
  # scale-to-zero 后保留 Activator 的最短时间
  scale-to-zero-pod-retention-period: "0s"

  # ---------- KPA 目标 ----------
  # 目标并发（每个 Pod 同时处理的请求数）
  target-concurrency: "10"
  # 目标 RPS（每个 Pod 每秒处理的请求数）
  target-rps: "10"
  # 容器并发限制
  container-concurrency-target-default: "10"
  # 突发并发容量（>1 时启用突发）
  container-concurrency-target-burst-capacity: "11"

  # ---------- 扩缩容速率 ----------
  # 最大扩容速率（每秒新增 Pod 数）
  max-scale-up-rate: "1000.0"
  # 最大缩容速率
  max-scale-down-rate: "2.0"

  # ---------- 稳定窗口 ----------
  # 伸缩决策前观察的稳定时间
  stable-window: "60s"
  # 缩容窗口
  scale-down-delay: "60s"
  # 伸缩指标聚合窗口
  panic-window: "6s"
  # panic 模式阈值倍数
  panic-threshold-percentage: "200.0"

  # ---------- RPS 指标 ----------
  # 启用基于 RPS 的伸缩指标
  enable-rps-metric: "true"
  # RPS 目标利用率
  target-utilization-percentage: "100"