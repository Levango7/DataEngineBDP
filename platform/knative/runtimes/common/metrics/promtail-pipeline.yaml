# ============================================================================
# Promtail Pipeline 配置 · 数据引擎大数据平台 T025
# ----------------------------------------------------------------------------
# 作用：采集 Knative Service 函数调用日志，写入 Loki
# tenant 隔离：
#   1. 从结构化 JSON 日志中提取 tenant 字段，作为 Loki 标签
#   2. 支持按 tenant 过滤查询：{tenant="xxx"} |= "invocation"
# 采集源：Knative Service Pod 的 stdout（Knative queue-proxy + 用户容器）
# ============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki.monitoring:3100/loki/api/v1/push
    tenant_id: default

scrape_configs:
  # ---------- Knative Service 函数调用日志 ----------
  - job_name: knative-function-logs
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - serverless-functions
    relabel_configs:
      # 仅采集带有 serverless-runtime 标签的 Pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
        regex: serverless-runtime
        action: keep
      # 提取 runtime 类型作为标签
      - source_labels: [__meta_kubernetes_pod_label_platform_shuqing_io_runtime]
        target_label: runtime
      # 提取函数名
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: function
      # 提取 tenant（从 Pod 注解，若有）
      - source_labels: [__meta_kubernetes_pod_annotation_platform_shuqing_io_tenant]
        target_label: tenant
    pipeline_stages:
      # 解析 JSON 日志，提取 tenant 字段
      - json:
          expressions:
            logType: type
            logTenant: tenant
            logRuntime: runtime
            logFunction: function
            logStatus: status
            logDuration: duration_seconds
      # 仅保留 invocation 类型日志
      - match:
          selector: '{logType="invocation"}'
          action: keep
      # 将提取的 tenant 作为 Loki 标签
      - labels:
          logType:
          logTenant:
          logRuntime:
          logFunction:
          logStatus:
      # 提取 tenant 到顶层 tenant 标签（若 Pod 注解未设置）
      - template:
          source: tenant
          template: '{{ if .tenant }}{{ .tenant }}{{ else }}{{ .logTenant }}{{ end }}'
      - labels:
          tenant: