# ============================================================================
# Knative Service 示例 · 数擎大数据平台
# ----------------------------------------------------------------------------
# 作用：验证 Knative Serving KService 创建与 URL 分配
# 特性：
#   1. scale-to-zero：无流量 60s 后 Pod 自动缩容到 0
#   2. KPA 自动伸缩：基于并发与 RPS
#   3. 复用 Istio Ingress Gateway
# 镜像：hashicorp/http-echo（轻量 HTTP echo 服务）
# 验证：
#   kubectl get ksvc hello-kservice -n knative-examples
#   curl http://hello-kservice.knative-examples.shuqing.local
# ============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello-kservice
  namespace: knative-examples
  labels:
    app.kubernetes.io/name: hello-kservice
    app.kubernetes.io/part-of: knative-examples
    platform.shuqing.io/component: serverless
    platform.shuqing.io/task: "T024"
  annotations:
    # 强制使用 KPA（Knative Pod Autoscaler）
    serving.knative.dev/autoscaler-class: "kpa.autoscaling.knative.dev"
    # 目标并发
    autoscaling.knative.dev/target: "10"
    # 目标 RPS
    autoscaling.knative.dev/target-burst-capacity: "11"
    # 最小副本数（0 表示允许 scale-to-zero）
    autoscaling.knative.dev/min-scale: "0"
    # 最大副本数
    autoscaling.knative.dev/max-scale: "10"
    # scale-to-zero 优雅期
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "60s"
spec:
  template:
    metadata:
      annotations:
        # 代理 CPU 资源
        autoscaling.knative.dev/autoscale: "true"
    spec:
      # 超时
      timeoutSeconds: 30
      # 容器并发
      containerConcurrency: 10
      containers:
        - name: app
          image: docker.m.daocloud.io/hashicorp/http-echo:1.0.0
          args:
            - "-text=Hello from Knative Serving! 数擎大数据平台 Serverless"
          ports:
            - containerPort: 5678
              name: http1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 10