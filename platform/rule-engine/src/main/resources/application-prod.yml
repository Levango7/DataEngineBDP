# 生产环境 Profile（spring.profiles.active=prod）
# 覆盖默认 H2 配置，切换到 PostgreSQL；JWT secret 必须外置。

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgresql:5432/shuqing}
    username: ${DB_USERNAME:shuqing}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 生产默认 validate（表由迁移管理）；本地验证/初始化可用 DDL_AUTO=update 覆盖
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}  # 生产环境必须外置，无默认值
      issuer: ${JWT_ISSUER:shuqing-bigdata}
    cors:
      allowed-origins: ${CORS_ORIGINS}