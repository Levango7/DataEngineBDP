# APISIX key-auth 插件配置 - API Key 认证
#
# 对应详细设计 §5 网关拦截第一步：认证
#     APISIX 插件链依次做认证 → 租户隔离 → 限流 → 熔断 → 计量 → 转发。
#
# 工作原理：
#     1. 客户端在请求头 X-API-Key 或 query 参数 api_key 中携带 AK
#     2. APISIX key-auth 插件查找 Consumer 表，匹配 AK
#     3. 匹配成功则注入 consumer_name 到上下文，供后续插件使用
#     4. 匹配失败返回 401 Unauthorized
#
# Consumer 由订阅审批后动态创建：
#     POST /apisix/admin/consumers -d '{"username":"sub-{subId}","plugins":{"key-auth":{"key":"AKxxx"}}}'

# 插件元数据
plugin_name: key-auth
plugin_type: auth

# 全局配置
config:
  # 从 Header 提取 AK
  header: X-API-Key
  # 从 Query 参数提取 AK（备用）
  query: api_key
  # 从 Cookie 提取 AK（可选）
  # cookie: api_key
  # 隐藏 AK 到日志（安全考虑）
  hide_credentials: true

# 错误响应
error_response:
  # AK 缺失
  missing_key:
    status_code: 401
    body:
      error: missing_api_key
      message: "缺少 API Key，请在 X-API-Key 头或 api_key 查询参数中提供"
  # AK 无效
  invalid_key:
    status_code: 401
    body:
      error: invalid_api_key
      message: "API Key 无效或已吊销"
  # AK 已过期
  expired_key:
    status_code: 401
    body:
      error: expired_api_key
      message: "API Key 已过期，请重新申请"

# Consumer 创建模板（订阅审批通过后填充）
consumer_template:
  username: "sub-${subscription_id}"
  plugins:
    key-auth:
      key: "${access_key}"
  # 标签用于管理和过滤
  labels:
    subscription_id: "${subscription_id}"
    api_id: "${api_id}"
    subscriber_tenant_id: "${subscriber_tenant_id}"
    provider_tenant_id: "${provider_tenant_id}"
    granted_quota: "${granted_quota}"

# Consumer 列表示例（实际由动态创建）
consumers_example:
  - username: sub-aaa-111
    plugins:
      key-auth:
        key: AKa1b2c3d4e5f6a7b8c9d0e1f2a3b4c5
    labels:
      subscription_id: sub-aaa-111
      api_id: api-weather-query
      subscriber_tenant_id: tenant-consumer-a
      provider_tenant_id: tenant-provider-x
      granted_quota: 100

  - username: sub-bbb-222
    plugins:
      key-auth:
        key: AKf6e5d4c3b2a1f6e5d4c3b2a1f6e5d4c3
    labels:
      subscription_id: sub-bbb-222
      api_id: api-llm-chat
      subscriber_tenant_id: tenant-consumer-b
      provider_tenant_id: tenant-provider-y
      granted_quota: 50