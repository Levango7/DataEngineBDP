# 数擎云核 SKE · 本地 MinIO in-cluster 兜底 (WSL2/VM 真 kubeadm 无宿主 docker 时使用)
# 由 platform/bootstrap.sh 在检测不到 docker 时自动 apply
# 说明: emptyDir 仅用于本地 PoC, 重启 Pod 数据丢失; 生产走 CephDriver/云 S3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: platform-ops
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          value: minio
        - name: MINIO_ROOT_PASSWORD
          value: minio123
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: platform-ops
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: platform-ops
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          until mc alias set local http://minio.platform-ops:9000 minio minio123 2>/dev/null; do
            echo "等待 MinIO 就绪..."; sleep 3
          done
          mc mb -p local/lakehouse
          echo "bucket lakehouse 已确保"
