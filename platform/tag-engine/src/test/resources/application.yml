server:
  port: 0

spring:
  application:
    name: tag-engine-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  tag-store:
    type: mock
  doris:
    jdbc-url: jdbc:mysql://localhost:9030
    username: root
    password: ""
    database: tag_db
    wide-table: dws_user_tag_wide
    select-limit: 1000
    query-timeout-ms: 3000
  compute:
    batch-concurrency: 2
    batch-max-size: 50
  audience:
    max-result-size: 1000