server:
  port: ${TAG_ENGINE_PORT:8080}

spring:
  application:
    name: tag-engine
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/tag-engine-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: false
      path: /h2-console

  # Flyway：仅生产/集成环境启用（prod profile 置 true）。
  # dev 默认关闭：H2 + ddl-auto=update 零配置本地起库；
  # 基线脚本是 PostgreSQL 方言，不能在 H2 上执行。
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration/tag-engine
    validate-on-migrate: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.levango7.dataenginebdp: INFO

# 标签画像引擎配置
app:
  # JWT 接线（2026-10-03 补）：common-security 的 SecurityConfig 依赖 JwtAuthFilter，
  # 而该 Bean 仅在 app.security.jwt.secret 就绪时装配（fail-closed）——缺接线时
  # 应用在任何 profile 都无法启动（KNOWN-FAILURES #3 批次生产启动验证暴露）。
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    # CORS 允许来源（common-security 的 corsConfigurationSource 读取；缺省会造成启动失败）
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  tag-store:
    # 存储实现类型：mock（内存）/ doris（真实 Doris 集群）
    type: ${TAG_STORE_TYPE:doris}
  doris:
    # Doris FE JDBC 地址，仅当 tag-store.type=doris 时生效
    jdbc-url: ${DORIS_JDBC_URL:jdbc:mysql://doris-fe:9030}
    username: ${DORIS_USERNAME:root}
    password: ${DORIS_PASSWORD:}
    # 标签宽表库名
    database: ${DORIS_DATABASE:tag_db}
    # 标签宽表表名
    wide-table: ${DORIS_WIDE_TABLE:dws_user_tag_wide}
    # 圈选最大返回行数（防止 OOM）
    select-limit: ${DORIS_SELECT_LIMIT:100000}
    # 圈选超时（毫秒）
    query-timeout-ms: ${DORIS_QUERY_TIMEOUT_MS:5000}
  compute:
    # 批量计算并发度
    batch-concurrency: ${COMPUTE_BATCH_CONCURRENCY:4}
    # 单次批计算最大标签数
    batch-max-size: ${COMPUTE_BATCH_MAX_SIZE:100}
  audience:
    # 单次圈选最大返回用户数
    max-result-size: ${AUDIENCE_MAX_RESULT:10000}