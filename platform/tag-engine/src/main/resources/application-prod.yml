server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tag-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/tagengine}
    username: ${DB_USERNAME:tagengine}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        # 生产环境仅暴露 health 与 info，metrics/prometheus 端点限制为内部网络访问
        # 如需 Prometheus 抓取，通过单独的 management port 或网络策略隔离
        include: health,info
  endpoint:
    health:
      show-details: never  # 不暴露健康检查详情（如数据库连接信息）

app:
  tag-store:
    type: doris
  doris:
    jdbc-url: ${DORIS_JDBC_URL}
    username: ${DORIS_USERNAME}
    password: ${DORIS_PASSWORD}
    database: ${DORIS_DATABASE:tag_db}
    wide-table: ${DORIS_WIDE_TABLE:dws_user_tag_wide}
    select-limit: ${DORIS_SELECT_LIMIT:100000}
    query-timeout-ms: ${DORIS_QUERY_TIMEOUT_MS:5000}
