server:
  port: ${SERVER_PORT:8088}
spring:
  application:
    name: finops-billing
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/finops-billing-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: false
      path: /h2-console
  # Flyway：仅生产/集成环境启用（prod profile 置 true）。
  # dev 默认关闭：H2 + ddl-auto=update 零配置本地起库；
  # 基线脚本是 PostgreSQL 方言（含 oid 等类型），不能在 H2 上执行。
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
    # 不写 serialization.write-dates-as-timestamps：该键属 Jackson 2，
    # Spring Boot 4（Jackson 3，tools.jackson）已无对应枚举，保留会导致属性绑定失败、
    # 应用在任何 profile 下都无法启动。Jackson 3 默认即以 ISO-8601 输出 java.time。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.levango7.dataenginebdp: INFO
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  prometheus:
    url: ${PROMETHEUS_URL:http://localhost:19090}
    query-timeout-ms: ${PROMETHEUS_QUERY_TIMEOUT:10000}
