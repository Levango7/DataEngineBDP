server:
  port: 8084
spring:
  application:
    name: cost-model
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/cost-model-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.shuqing.bigdata: INFO

app:
  security:
    jwt:
      # HMAC-SHA 签名密钥，至少 32 字节（256 bit）；生产环境必须通过环境变量覆盖
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-at-least-256-bits}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    cors:
      # 允许的前端源，逗号分隔；默认放行 Vite 开发服务器
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  # FinOps 成本模型配置
  finops:
    # 默认计费方式：ON_DEMAND / RESERVED / TIERED
    default-billing-method: ${FINOPS_DEFAULT_BILLING:ON_DEMAND}
    # 默认定价配置名
    default-pricing-config: ${FINOPS_DEFAULT_PRICING:default}
  # Prometheus 查询配置
  prometheus:
    # Prometheus 服务地址（集成测试环境默认 http://localhost:19090）
    url: ${PROMETHEUS_URL:http://localhost:19090}
    # 采集查询超时（毫秒）
    query-timeout-ms: ${PROMETHEUS_QUERY_TIMEOUT:10000}
  # 资源用量采集配置
  collector:
    # 采集粒度（秒），≤ 60 表示 1 分钟粒度
    scrape-interval-seconds: ${COLLECTOR_INTERVAL:60}
    # 五维度采集开关
    dimensions:
      cpu: ${COLLECT_CPU:true}
      memory: ${COLLECT_MEMORY:true}
      storage: ${COLLECT_STORAGE:true}
      gpu: ${COLLECT_GPU:true}
      network: ${COLLECT_NETWORK:true}