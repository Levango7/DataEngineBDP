server:
  port: 8085
spring:
  application:
    name: finops-dashboard
  datasource:
    # 开发环境默认 H2 文件模式；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/finops-dashboard-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    # 不写死驱动类：Spring Boot 按 JDBC URL 自动推断（H2/PostgreSQL 均可）。
    driver-class-name: ${DB_DRIVER:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.levango7.dataenginebdp: INFO

app:
  security:
    jwt:
      # HMAC-SHA 签名密钥，至少 32 字节；生产环境必须通过环境变量覆盖
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  # FinOps 看板配置
  finops:
    # Top10 资源数上限
    top-n: ${FINOPS_TOP_N:10}
    # 闲置识别阈值
    idle:
      # CPU 平均利用率低于此阈值（百分比）视为低利用率
      cpu-util-threshold: ${IDLE_CPU_THRESHOLD:10.0}
      # 内存平均利用率低于此阈值（百分比）视为低利用率
      memory-util-threshold: ${IDLE_MEMORY_THRESHOLD:20.0}
      # GPU 平均利用率低于此阈值（百分比）视为空闲 GPU
      gpu-util-threshold: ${IDLE_GPU_THRESHOLD:5.0}
      # 网络流量低于此阈值（MB/s）视为低流量
      network-traffic-threshold: ${IDLE_NETWORK_THRESHOLD:1.0}
      # 持续时长（小时），低于该时长持续才视为闲置
      sustained-hours: ${IDLE_SUSTAINED_HOURS:24}
    # 分账默认配置
    allocation:
      # 分账维度：namespace / workspace_label
      default-dimension: ${ALLOCATION_DIMENSION:namespace}
      # 默认分账比例（key=子工作空间名，value=比例），合计需=1.0
      default-ratios: ${ALLOCATION_RATIOS:default=1.0}
  # Prometheus 查询配置
  prometheus:
    url: ${PROMETHEUS_URL:http://localhost:19090}
    query-timeout-ms: ${PROMETHEUS_QUERY_TIMEOUT:10000}
  # cost-model 服务地址（用于获取成本数据）
  cost-model:
    url: ${COST_MODEL_URL:http://localhost:18084}