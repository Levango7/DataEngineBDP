# =============================================================================
# 跨域数据面 POC：双 MinIO 实例模拟两个域（源 / 目标）
# 用途：本地复现“源域 → 跨域复制 → 目标域”真实链路
# 端口：源 127.0.0.1:9100，目标 127.0.0.1:9110（避开 batch-pipeline 的 9000）
# 凭证：缺省 minioadmin 仅开发用，生产经 CDR_ACCESS_KEY / CDR_SECRET_KEY 覆盖
# 用法：docker compose -f platform/storage-io/docker/docker-compose.replication.yml up -d
# =============================================================================
services:
  minio-source:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: cdr-minio-source
    ports:
      - "127.0.0.1:9100:9000"
    environment:
      MINIO_ROOT_USER: ${CDR_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CDR_SECRET_KEY:-minioadmin}
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cdr-net

  minio-target:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: cdr-minio-target
    ports:
      - "127.0.0.1:9110:9000"
    environment:
      MINIO_ROOT_USER: ${CDR_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CDR_SECRET_KEY:-minioadmin}
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cdr-net

  minio-init:
    image: minio/mc:RELEASE.2024-08-29T01-40-52Z
    container_name: cdr-minio-init
    depends_on:
      minio-source:
        condition: service_healthy
      minio-target:
        condition: service_healthy
    environment:
      CDR_ACCESS_KEY: ${CDR_ACCESS_KEY:-minioadmin}
      CDR_SECRET_KEY: ${CDR_SECRET_KEY:-minioadmin}
      CDR_BUCKET: ${CDR_BUCKET:-xdomain}
    entrypoint: >
      /bin/sh -c "
      mc alias set src http://minio-source:9000 $$CDR_ACCESS_KEY $$CDR_SECRET_KEY;
      mc alias set tgt http://minio-target:9000 $$CDR_ACCESS_KEY $$CDR_SECRET_KEY;
      mc mb --ignore-existing src/$$CDR_BUCKET;
      mc mb --ignore-existing tgt/$$CDR_BUCKET;
      echo '[minio-init] buckets ready';
      exit 0;
      "
    networks:
      - cdr-net

networks:
  cdr-net:
    name: cdr-net
