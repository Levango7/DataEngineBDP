# =============================================================================
# 跨域数据面 POC：双对象存储实例模拟两个域（源 / 目标）
# 用途：本地复现“源域 → 跨域复制 → 目标域”真实链路
#
# 实现替换（台账 #17）：MinIO 社区版 → RustFS 1.0.6
#   - MinIO 社区版镜像 2026-09-11 被上游整体删除（runner 实测 pull access denied）。
#   - RustFS：Apache-2.0，上游仓 rustfs/rustfs @ tag 1.0.6
#     (commit de9009d882644effc2628e777650025c3d8e7c65)，runner 实拉 PULL_OK。
#   - 服务名 / 容器名保持 minio-* 不变：本文件对外暴露的源/目标 endpoint
#     (http://minio-source:9100 / http://minio-target:9110) 被跨域复制逻辑引用。
#
# 凭据环境变量名：RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY
#   （上游 rustfs/src/config/cli.rs:1551/:1559 的 clap env 绑定 +
#     entrypoint.sh:181/:182 的 resolve_credential_source；
#     MINIO_ROOT_USER/MINIO_ROOT_PASSWORD 上游只当 legacy 参数形态的提示串，
#     entrypoint 与二进制都不读这两个 env）
#
# 端口：源 127.0.0.1:9100，目标 127.0.0.1:9110（避开 batch-pipeline 的 9000）
# 凭证：缺省 minioadmin 仅开发用，生产经 CDR_ACCESS_KEY / CDR_SECRET_KEY 覆盖
# 用法：docker compose -f platform/storage-io/docker/docker-compose.replication.yml up -d
# =============================================================================
services:
  minio-source:
    image: rustfs/rustfs:1.0.6
    container_name: cdr-minio-source
    ports:
      - "127.0.0.1:9100:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${CDR_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${CDR_SECRET_KEY:-minioadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
    healthcheck:
      # RustFS 仍注册 MinIO 兼容健康端点（上游 rustfs/src/server/layer.rs:1640）
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cdr-net

  minio-target:
    image: rustfs/rustfs:1.0.6
    container_name: cdr-minio-target
    ports:
      - "127.0.0.1:9110:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${CDR_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${CDR_SECRET_KEY:-minioadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cdr-net

  minio-init:
    # 建桶客户端换 amazon/aws-cli（RustFS 无官方 mc；minio/mc 已断供）
    image: amazon/aws-cli:2.17.23
    container_name: cdr-minio-init
    depends_on:
      minio-source:
        condition: service_healthy
      minio-target:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${CDR_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${CDR_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      CDR_BUCKET: ${CDR_BUCKET:-xdomain}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio-source:9000 s3api create-bucket --bucket $$CDR_BUCKET || true;
      aws --endpoint-url http://minio-target:9000 s3api create-bucket --bucket $$CDR_BUCKET || true;
      echo '[minio-init] buckets ready';
      exit 0;
      "
    networks:
      - cdr-net

networks:
  cdr-net:
    name: cdr-net
