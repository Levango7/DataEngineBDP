server:
  port: 0

spring:
  application:
    name: infra-provider-private-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

private-cloud:
  vsphere:
    vcenter-url: http://localhost:9999
    username: administrator@vsphere.local
    password: test-pass
    template-vm: ubuntu-2204-k8s-template
    datacenter: Datacenter
    cluster: Cluster
    datastore: datastore1
    folder: shuqing-k8s
    insecure-tls: true
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  openstack:
    auth-url: http://localhost:9998/v3
    username: admin
    password: test-pass
    project-name: admin
    user-domain-name: Default
    project-domain-name: Default
    region: RegionOne
    image-id: 00000000-0000-0000-0000-000000000001
    flavor-id: 00000000-0000-0000-0000-000000000002
    external-network: public
    insecure-tls: false
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  k8s-bootstrap:
    method: cloud-init
    k8s-version: v1.30.0
    pod-cidr: 10.244.0.0/16
    service-cidr: 10.96.0.0/12
    ready-timeout-seconds: 60

app:
  security:
    jwt:
      secret: test-secret-key-for-unit-tests-at-least-256-bits-long
      issuer: shuqing-bigdata
    cors:
      allowed-origins: http://localhost:5173