server:
  port: 8084

spring:
  application:
    name: infra-provider-private
  webflux:
    client:
      max-in-memory-size: 16MB
  datasource:
    # 开发环境默认 H2 文件模式（重启不丢数据）；生产环境通过环境变量切换 PostgreSQL
    url: ${DB_URL:jdbc:h2:file:./data/infra-provider-private-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
  level:
    com.levango7.dataenginebdp: INFO

# 私有云 Provider 配置
private-cloud:
  vsphere:
    # vCenter REST API 基址（vCenter 7.0+）
    vcenter-url: ${VSPHERE_VCENTER_URL:https://vcenter.example.com}
    username: ${VSPHERE_USERNAME:administrator@vsphere.local}
    password: ${VSPHERE_PASSWORD:}
    # 克隆源模板 VM 名称
    template-vm: ${VSPHERE_TEMPLATE_VM:ubuntu-2204-k8s-template}
    # 目标资源池/数据中心/集群
    datacenter: ${VSPHERE_DATACENTER:Datacenter}
    cluster: ${VSPHERE_CLUSTER:Cluster}
    datastore: ${VSPHERE_DATASTORE:datastore1}
    folder: ${VSPHERE_FOLDER:shuqing-k8s}
    # 是否跳过 TLS 证书校验（自签证书环境设为 true）
    insecure-tls: ${VSPHERE_INSECURE_TLS:true}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  openstack:
    # OpenStack Identity (Keystone) 端点
    auth-url: ${OS_AUTH_URL:http://keystone-service:5000/v3}
    username: ${OS_USERNAME:admin}
    password: ${OS_PASSWORD:}
    project-name: ${OS_PROJECT_NAME:admin}
    user-domain-name: ${OS_USER_DOMAIN_NAME:Default}
    project-domain-name: ${OS_PROJECT_DOMAIN_NAME:Default}
    # Nova 计算服务区域
    region: ${OS_REGION:RegionOne}
    # 用于创建实例的镜像 ID / flavor ID
    image-id: ${OS_IMAGE_ID:}
    flavor-id: ${OS_FLAVOR_ID:}
    # 外部网络名称（用于分配浮动 IP）
    external-network: ${OS_EXTERNAL_NETWORK:public}
    insecure-tls: ${OS_INSECURE_TLS:false}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  k8s-bootstrap:
    # K8s 初始化脚本执行方式：ssh / cloud-init
    method: ${K8S_BOOTSTRAP_METHOD:cloud-init}
    # K8s 版本
    k8s-version: ${K8S_VERSION:v1.30.0}
    # POD CIDR / SERVICE CIDR
    pod-cidr: ${POD_CIDR:10.244.0.0/16}
    service-cidr: ${SERVICE_CIDR:10.96.0.0/12}
    # 等待 VM 就绪的超时时间（秒）
    ready-timeout-seconds: 600

app:
  security:
    jwt:
      # HMAC-SHA 签名密钥，至少 32 字节（256 bit）；生产环境必须通过环境变量覆盖
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:shuqing-bigdata}
      expiry: 3600
    cors:
      # 允许的前端源，逗号分隔；默认放行 Vite 开发服务器
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
    keycloak:
      realm: ${KEYCLOAK_REALM:shuqing}
      auth-server-url: ${KEYCLOAK_URL:http://keycloak-service:8080/realms/shuqing}
      resource: ${KEYCLOAK_CLIENT_ID:shuqing-platform}