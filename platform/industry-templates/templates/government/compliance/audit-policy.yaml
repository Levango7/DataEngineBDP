# 政务审计策略
# ============================================================================
# 归属：数擎大数据平台 · L5.3 行业应用模板 · 政务模板（government）
# 对标：GB/T?25069-2010《信息安全技术 信息系统安全管理要求》、等保2.0 安全审计要求
# 关联：compliance/data-classification.yaml（数据分级）；DDL: 04_government_compliance_ddl.sql §3 audit_log
# 生效方式：审计策略下推到 L2.7 统一 SQL 网关与 L3.7 安全脱敏，所有敏感操作自动记录审计日志
# 合规要求：审计日志不可篡改、不可删除，保留期 ≥ 180 天（等保2.0 要求）
# 字符集：UTF-8，YAML 2 空格缩进
# ============================================================================

# 审计策略定义
audit_policy:
  # 审计策略元信息
  metadata:
    standard: GB/T 25069-2010 / 等保2.0
    retention_days: 1825
    immutable: true
    description: |
      政务行业审计策略：所有敏感操作（登录/查询/导出/修改/删除/授权/访问）
      自动记录审计日志，日志不可篡改、不可删除，保留期 5 年。

  # 审计事件类型
  audit_events:
    # --------------------------------------------------------------------------
    # 身份认证审计
    # --------------------------------------------------------------------------
    - event_type: LOGIN
      description: 用户登录
      log_fields: [operator_id, operator_name, source_ip, operate_result, failure_reason]
      audit_level: INFO
      trigger: "认证成功或失败"

    - event_type: LOGOUT
      description: 用户登出
      log_fields: [operator_id, operator_name, source_ip]
      audit_level: INFO
      trigger: "主动登出或会话超时"

    # --------------------------------------------------------------------------
    # 数据访问审计
    # --------------------------------------------------------------------------
    - event_type: QUERY
      description: 数据查询
      log_fields: [operator_id, target_type, target_name, request_params, response_summary, source_ip]
      audit_level: INFO
      trigger: "查询 L2/L3/L4 数据"
      condition: "target.data_classification IN ['L2', 'L3', 'L4']"

    - event_type: EXPORT
      description: 数据导出
      log_fields: [operator_id, target_type, target_name, request_params, response_summary, source_ip]
      audit_level: WARNING
      trigger: "导出 L2/L3 数据"
      condition: "target.data_classification IN ['L2', 'L3']"

    # --------------------------------------------------------------------------
    # 数据修改审计
    # --------------------------------------------------------------------------
    - event_type: MODIFY
      description: 数据修改
      log_fields: [operator_id, target_type, target_name, request_params, response_summary, source_ip]
      audit_level: WARNING
      trigger: "修改 L2/L3 数据"

    - event_type: DELETE
      description: 数据删除
      log_fields: [operator_id, target_type, target_name, request_params, source_ip]
      audit_level: CRITICAL
      trigger: "删除 L2/L3 数据"

    # --------------------------------------------------------------------------
    # 权限变更审计
    # --------------------------------------------------------------------------
    - event_type: GRANT
      description: 权限授予
      log_fields: [operator_id, target_type, target_id, target_name, request_params, source_ip]
      audit_level: CRITICAL
      trigger: "授予角色/权限"

    - event_type: REVOKE
      description: 权限收回
      log_fields: [operator_id, target_type, target_id, target_name, request_params, source_ip]
      audit_level: CRITICAL
      trigger: "收回角色/权限"

    # --------------------------------------------------------------------------
    # 访问控制审计
    # --------------------------------------------------------------------------
    - event_type: ACCESS
      description: 访问控制决策
      log_fields: [operator_id, target_type, target_name, operate_result, source_ip]
      audit_level: INFO
      trigger: "访问控制策略匹配"
      condition: "decision == 'DENY'"
      note: "仅拒绝访问时记录，允许访问不记录（避免日志膨胀）"

  # 审计日志存储要求
  storage_requirements:
    # 存储介质
    storage: Apache Doris（OLAP 存储）
    # 不可篡改要求
    immutable: true
    implementation: "通过 Doris UNIQUE KEY 模型 + 只读用户 + WORM 存储实现不可篡改"
    # 保留期
    retention:
      default_days: 1825
      min_days: 180
      max_days: 3650
      cleanup_policy: "超期自动归档到对象存储，不直接删除"
    # 加密要求
    encryption:
      at_rest: true
      algorithm: AES-256
      in_transit: true
      tls_version: "TLS 1.3"

  # 审计日志查询权限
  query_permissions:
    # 仅审计员可查询审计日志
    allowed_roles:
      - auditor
    # 审计员查询审计日志也需审计
    audit_the_auditor: true
    # 查询结果受脱敏规则约束
    desensitize_on_query: true

  # 审计异常检测
  anomaly_detection:
    # 异常登录检测
    - name: abnormal_login
      description: 异常登录检测（短时间内多次失败）
      condition: "LOGIN.failure COUNT >= 5 WITHIN 10 minutes"
      risk_level: HIGH
      action: "锁定账号 + 生成风险预警"

    # 异常查询检测
    - name: abnormal_query
      description: 异常查询检测（大量敏感数据查询）
      condition: "QUERY.L3 COUNT >= 1000 WITHIN 1 hour"
      risk_level: MEDIUM
      action: "生成风险预警"

    # 非工作时间访问检测
    - name: off_hours_access
      description: 非工作时间访问检测（22:00-06:00 访问 L3/L4 数据）
      condition: "ACCESS.time BETWEEN 22:00 AND 06:00 AND target.data_classification IN ['L3', 'L4']"
      risk_level: MEDIUM
      action: "生成风险预警"

    # 越权访问检测
    - name: unauthorized_access
      description: 越权访问检测（访问控制拒绝）
      condition: "ACCESS.decision == 'DENY'"
      risk_level: HIGH
      action: "生成风险预警"