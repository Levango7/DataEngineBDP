  - {id: perm_table_government_service_write,     name: "政务服务事项读写",   resource: government_service,      action: write, sql: "SELECT,INSERT,UPDATE,DELETE ON government_service"}
  - {id: perm_table_service_transaction_read,     name: "办理记录只读",       resource: service_transaction,     action: read,  sql: "SELECT ON service_transaction"}
  - {id: perm_table_service_transaction_write,    name: "办理记录读写",       resource: service_transaction,     action: write, sql: "SELECT,INSERT,UPDATE,DELETE ON service_transaction"}
