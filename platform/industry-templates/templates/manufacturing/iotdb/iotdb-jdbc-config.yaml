# IoTDB JDBC 连接配置
# ============================================================================
# 用途：制造行业模板通过 IoTDB JDBC 查询设备传感器时序数据
# 引擎：Apache IoTDB 1.3.x
# 字符集：UTF-8，YAML 2 空格缩进
# ============================================================================

# IoTDB 集群连接配置
iotdb:
  # IoTDB 版本
  version: "1.3.2"
  # 集群模式：STANDALONE-单机 / CLUSTER-集群
  mode: CLUSTER
  # JDBC 连接配置
  jdbc:
    # JDBC 驱动类名
    driverClass: "org.apache.iotdb.jdbc.IoTDBDriver"
    # JDBC URL（集群模式多节点逗号分隔）
    url: "jdbc:iotdb://iotdb-0:6667,iotdb-1:6667,iotdb-2:6667/"
    # 用户名（生产环境通过 Secret 引用）
    username: "root"
    # 密码（生产环境通过 Secret 引用，不在此明文配置）
    passwordSecret:
      name: iotdb-credentials
      key: password
    # 连接池配置
    pool:
      initialSize: 5
      maxSize: 20
      maxWaitMillis: 5000
      # 连接超时（毫秒）
      connectTimeout: 10000
      # 查询超时（毫秒）
      queryTimeout: 60000
    # SSL 配置
    ssl:
      enabled: false
      # trustStorePath: /etc/iotdb/truststore.jks
      # trustStorePasswordSecret:
      #   name: iotdb-credentials
      #   key: truststore-password

# 时序数据查询配置
query:
  # 设备传感器数据查询模板
  # 时序路径格式：root.mfg.equipment.{equipment_code}.{metric_name}
  sensorQueryTemplate: >
    SELECT {metric_names}
    FROM root.mfg.equipment.{equipment_code}
    WHERE time >= {start_time} AND time < {end_time}
  # 设备状态变更查询模板
  statusQueryTemplate: >
    SELECT status
    FROM root.mfg.equipment.{equipment_code}.status
    WHERE time >= {start_time} AND time < {end_time}
  # 默认查询时间范围（最近 15 分钟）
  defaultRangeMinutes: 15
  # 最大返回行数
  maxRowLimit: 100000

# 时序路径定义
timeseries:
  # 设备根路径
  rootPath: "root.mfg.equipment"
  # 传感器指标路径模板
  sensorPathTemplate: "root.mfg.equipment.{equipment_code}.{metric_name}"
  # 支持的传感器指标列表
  metrics:
    - name: temperature
      unit: "℃"
      description: "设备温度"
      alarmThreshold:
        warning: 80
        critical: 95
    - name: vibration
      unit: "mm/s"
      description: "振动速度"
      alarmThreshold:
        warning: 4.5
        critical: 7.1
    - name: current
      unit: "A"
      description: "电流"
      alarmThreshold:
        warning: 50
        critical: 60
    - name: pressure
      unit: "MPa"
      description: "压力"
      alarmThreshold:
        warning: 10
        critical: 12
    - name: speed
      unit: "rpm"
      description: "转速"
      alarmThreshold:
        warning: 3000
        critical: 3500
    - name: status
      unit: ""
      description: "设备状态（RUNNING/IDLE/DOWN/MAINT/FAULT）"

# 数据写入目标配置（Doris）
target:
  doris:
    feHost: "doris-fe.doris.svc.cluster.local"
    fePort: 9030
    database: "db_manufacturing"
    # 传感器指标目标表
    sensorMetricTable: "equipment_sensor_metric"
    # 状态日志目标表
    statusLogTable: "equipment_status_log"
    user: "root"
    passwordSecret:
      name: doris-credentials
      key: password

# 健康检查
healthCheck:
  enabled: true
  # 健康检查间隔（秒）
  intervalSeconds: 30
  # 健康检查查询
  query: "SHOW TIMESERIES root.mfg.equipment.** LIMIT 1"