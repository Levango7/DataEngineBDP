# 值含义：R=只读 W=读写 M=管理 V=查看 N=无权限
# ============================================================================
permission_matrix:
  # 表权限矩阵（行：角色，列：表）
  table_matrix:
    columns:
      - risk_model
      - risk_rule
      - risk_feature
      - risk_evaluation
      - risk_alert
      - customer
      - customer_tag
      - customer_profile
      - customer_relation
      - account
      - account_balance
      - account_transaction
      - account_status_log
      - transaction
      - transaction_detail
      - aml_alert
      - transaction_monitor
      - loan_application
      - loan_contract
      - repayment_plan
      - credit_score
    rows:
