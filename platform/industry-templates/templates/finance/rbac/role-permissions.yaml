          - N
          - N
          - N
          - N
          - N
          - R
          - R
          - W
          - R
          - N
          - N
          - N
          - R
      - role: compliance_officer
        values:
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
          - R
      - role: account_manager
        values:
          - N
          - N
          - N
          - N
          - N
          - W
          - W
          - W
          - W
          - W
          - W
          - W
          - W
          - W
          - W
          - N
          - N
          - N
          - N
          - N
          - N

  # DAG 权限矩阵（行：角色，列：DAG）
  dag_matrix:
    columns:
      - risk_feature_daily
      - customer_tag_update
      - account_eod_settlement
      - transaction_aml_check
      - credit_score_monthly
    rows:
      - role: risk_officer
        values:
          - M
          - N
          - N
          - V
          - N
      - role: compliance_officer
        values:
          - V
          - V
          - V
          - V
          - V
      - role: account_manager
        values:
          - N
          - M
          - V
          - N
          - N

  # Dashboard 权限矩阵（行：角色，列：Dashboard）
  dashboard_matrix:
    columns:
      - risk-dashboard
      - customer-dashboard
      - transaction-dashboard
    rows:
      - role: risk_officer
        values:
          - V
          - N
          - N
      - role: compliance_officer
        values:
          - V
          - V
          - V
      - role: account_manager
        values:
          - N
          - V
          - V

# ============================================================================
# 验收对照
# ============================================================================
acceptance_check:
  - item: 风控员不可访问客户隐私表
    expected: customer/customer_profile/customer_relation/customer_tag 无权限
    actual: 4 张客户表均不在 risk_officer 权限列表
    result: PASS
  - item: 合规员不可修改任何数据
    expected: 无 write/manage 权限
    actual: 29 个权限全部为 read/view
    result: PASS
  - item: 客户经理不可访问风控模型表
    expected: risk_model/risk_rule/risk_feature/risk_evaluation/risk_alert 无权限
    actual: 5 张风控表均不在 account_manager 权限列表
    result: PASS
  - item: 客户经理不可访问信贷评分表
    expected: credit_score/loan_application/loan_contract/repayment_plan 无权限
    actual: 4 张信贷表均不在 account_manager 权限列表
    result: PASS
  - item: 合规员可访问所有表只读
    expected: 21 张表 read 权限
    actual: 21 个 read 权限全部授予
    result: PASS
  - item: 合规员可查看所有 DAG
    expected: 5 个 DAG view 权限
    actual: 5 个 view 权限全部授予
    result: PASS
  - item: 合规员可查看所有 Dashboard
    expected: 3 个 Dashboard view 权限
    actual: 3 个 view 权限全部授予
    result: PASS