# 金融行业模板 - RBAC 权限定义
# ============================================================================
# 模块：T018-5 RBAC 角色权限定义与模板打包
# 格式：Keycloak permission 格式（resource + action + scope）
# 权限模型：基于资源的权限（Resource-Based Permission）
# 资源类型：table（DDL 表）/ dag（调度作业）/ dashboard（仪表盘）
# 字符集：UTF-8，YAML 2 空格缩进
# ============================================================================

# 权限定义元信息
permission_metadata:
  total_resources: 29
  resource_types:
    - table
    - dag
    - dashboard
  action_types:
    - read    # 只读（SELECT）
    - write   # 读写（INSERT/UPDATE/DELETE）
    - manage  # 管理（DDL/调度上下线/触发执行）
    - view    # 查看（DAG 详情 / Dashboard 渲染）
  scope_types:
    - finance_template  # 金融模板范围

# ============================================================================
# 资源定义：21 张表 + 5 个 DAG + 3 个 Dashboard = 29 个资源
# ============================================================================

resources:
  # --------------------------------------------------------------------------
  # 表资源（21 张，来自 T018-2 DDL）
  # --------------------------------------------------------------------------
  # 风控域 5 张表
  - name: risk_model
    type: table
    description: 风控模型主表，存储评分卡模型配置
    domain: risk
    classification: confidential
  - name: risk_rule
    type: table
    description: 风控规则配置表，存储规则定义与命中次数
    domain: risk
    classification: confidential
  - name: risk_feature
    type: table
    description: 风控特征表，存储客户交易特征向量
    domain: risk
    classification: confidential
  - name: risk_evaluation
    type: table
    description: 风控评估结果表，存储评分与等级
    domain: risk
    classification: confidential
  - name: risk_alert
    type: table
    description: 风控告警表，存储 FRAUD/AML/CREDIT/BEHAVIOR 告警
    domain: risk
    classification: confidential

  # 客户域 4 张表
  - name: customer
    type: table
    description: 客户主表，含个人敏感信息（姓名/证件号/手机号）
    domain: customer
    classification: restricted
  - name: customer_tag
    type: table
    description: 客户标签表，含业务/风险/行为/营销标签
    domain: customer
    classification: internal
  - name: customer_profile
    type: table
    description: 客户画像表，含生命周期与资产画像
    domain: customer
    classification: restricted
  - name: customer_relation
    type: table
    description: 客户关系表，含担保/关联方关系
    domain: customer
    classification: restricted

  # 账户域 4 张表
  - name: account
    type: table
    description: 账户主表，含账户类型/状态/余额
    domain: account
    classification: confidential
  - name: account_balance
    type: table
    description: 账户余额快照表，日终余额
    domain: account
    classification: confidential
  - name: account_transaction
    type: table
    description: 账户流水表，借贷发生额明细
    domain: account
    classification: confidential
  - name: account_status_log
    type: table
    description: 账户状态变更日志表
    domain: account
    classification: internal

  # 交易域 4 张表
  - name: transaction
    type: table
    description: 交易主表，含交易类型/金额/渠道
    domain: transaction
    classification: confidential
  - name: transaction_detail
    type: table
    description: 交易明细表，含对手方/产品/扩展属性
    domain: transaction
    classification: confidential
  - name: aml_alert
    type: table
    description: 反洗钱告警表，含 STR 标记
    domain: transaction
    classification: restricted
  - name: transaction_monitor
    type: table
    description: 交易监控命中表，准实时扫描
    domain: transaction
    classification: confidential

  # 信贷域 4 张表
  - name: loan_application
    type: table
    description: 贷款申请表，含申请金额/期限/状态
    domain: credit
    classification: confidential
  - name: loan_contract
    type: table
    description: 贷款合同表，含合同金额/利率/期限
    domain: credit
    classification: confidential
  - name: repayment_plan
    type: table
    description: 还款计划表，含期次/应还/实还
    domain: credit
    classification: confidential
  - name: credit_score
    type: table
    description: 信用评分表，300~850 分制 A/B/C/D 等级
    domain: credit
    classification: confidential

  # --------------------------------------------------------------------------
  # DAG 资源（5 个，来自 T018-3）
  # --------------------------------------------------------------------------
  - name: risk_feature_daily
    type: dag
    description: 风控特征日计算 DAG，每日凌晨 2:00 调度
    domain: risk
    schedule: "0 2 * * * ?"
  - name: customer_tag_update
    type: dag
    description: 客户标签更新 DAG，每日凌晨 3:00 调度
    domain: customer
    schedule: "0 3 * * * ?"
  - name: account_eod_settlement
    type: dag
    description: 账户日终清算 DAG，每日 23:30 调度
    domain: account
    schedule: "30 23 * * * ?"
  - name: transaction_aml_check
    type: dag
    description: 交易反洗钱检查 DAG，每 30 分钟调度
    domain: transaction
    schedule: "0,30 * * * * ?"
  - name: credit_score_monthly
    type: dag
    description: 信贷评分月度计算 DAG，每月 1 日凌晨 4:00 调度
    domain: credit
    schedule: "0 4 1 * * ?"

  # --------------------------------------------------------------------------
  # Dashboard 资源（3 个，来自 T018-4）
  # --------------------------------------------------------------------------
  - name: risk-dashboard
    type: dashboard
    description: 风控视角仪表盘，6 图表（评分分布/告警趋势/规则命中/覆盖率/级别分布）
    domain: risk
    charts_count: 6
  - name: customer-dashboard
    type: dashboard
    description: 客户视角仪表盘，6 图表（总数增长/标签分布/等级分布/关系网络/活跃数/生命周期）
    domain: customer
    charts_count: 6
  - name: transaction-dashboard
    type: dashboard
    description: 交易视角仪表盘，6 图表（金额趋势/类型分布/大额Top10/AML告警/日总额/渠道分布）
    domain: transaction
    charts_count: 6

# ============================================================================
# 权限定义：基于资源 × 操作的笛卡尔积，按业务语义筛选
# ============================================================================
