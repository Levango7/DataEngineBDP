# Helm Chart values - 金融行业模板默认配置
# ============================================================================
# 用途：定义 helm install finance-template 时的可配置参数
# ============================================================================

# 模板元信息
template:
  name: finance-template
  version: 1.0.0
  # 是否启用模板自动导入（部署后自动调用平台 Job 导入 DDL/DAG/Dashboard/RBAC）
  autoImport: true

# 目标命名空间
namespace: finance

# 各组件目标地址（用于平台侧 Job 导入资产）
target:
  doris:
    feHost: doris-fe.doris.svc.cluster.local
    fePort: 9030
    database: db_finance
    user: root
    # 密码通过 Secret 引用，不在此明文配置
    passwordSecret:
      name: doris-credentials
      key: password
  dolphinscheduler:
    host: dolphinscheduler-api.dolphinscheduler.svc.cluster.local
    port: 12345
    tokenSecret:
      name: ds-credentials
      key: token
  superset:
    host: superset.superset.svc.cluster.local
    port: 8088
    tokenSecret:
      name: superset-credentials
      key: token
  keycloak:
    host: keycloak.keycloak.svc.cluster.local
    port: 8080
    realm: finance-template-realm
    adminSecret:
      name: keycloak-credentials
      key: admin-password

# ConfigMap 配置（模板资产挂载方式）
configMap:
  # 是否创建 ConfigMap 挂载模板资产
  create: true
  # ConfigMap 名称前缀
  namePrefix: finance-template
  # 资产子目录挂载配置
  assets:
    ddl:
      enabled: true
      mountPath: /templates/ddl
    dag:
      enabled: true
      mountPath: /templates/dag
    dashboard:
      enabled: true
      mountPath: /templates/dashboard
    rbac:
      enabled: true
      mountPath: /templates/rbac
    docs:
      enabled: true
      mountPath: /templates/docs

# 导入 Job 配置
importJob:
  # 是否创建导入 Job
  enabled: true
  # 导入 Job 镜像（平台侧提供的模板导入器）
  image:
    repository: shuqing/template-importer
    tag: "5.3.0"
    pullPolicy: IfNotPresent
  # Job 资源配置
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  # Job 重试次数
  backoffLimit: 3
  # Job 超时（秒）
  activeDeadlineSeconds: 1800

# RBAC 同步配置
rbacSync:
  enabled: true
  # 是否在导入失败时回滚已创建的角色
  rollbackOnFailure: true