# Flink IoTDB Source Connector 配置
# ============================================================================
# 用途：Flink 流计算通过 IoTDB Source Connector 实时接入能源设备时序数据
# 引擎：Apache Flink 1.18 + IoTDB 1.3.x
# 字符集：UTF-8，YAML 2 空格缩进
# ============================================================================

# Flink 集群配置
flink:
  # Flink 版本
  version: "1.18.1"
  # JobManager 地址
  jobmanager:
    rpcAddress: "flink-jobmanager"
    rpcPort: 6123
    restAddress: "flink-jobmanager"
    restPort: 8081
  # TaskManager 配置
  taskmanager:
    numberOfTaskSlots: 4
    # 并行度
    parallelism: 4
    # 内存配置
    memory:
      processSize: "4096m"
      flinkSize: "2048m"
      taskHeapSize: "1024m"
      taskOffHeapSize: "256m"
      networkSize: "256m"
  # Checkpoint 配置（Exactly-Once 语义）
  checkpoint:
    enabled: true
    interval: 60000  # 60 秒
    timeout: 300000  # 5 分钟
    minPause: 30000  # 30 秒
    mode: "EXACTLY_ONCE"
    # Checkpoint 存储路径（HDFS/S3）
    path: "hdfs:///flink/checkpoints/energy-iotdb-ingestion"
    # 外部化 Checkpoint 保留策略
    externalizedCheckpointCleanup: "RETAIN_ON_CANCELLATION"

# IoTDB Source Connector 配置
iotdbSource:
  # Connector JAR 路径
  jarPath: "/opt/flink/connectors/flink-iotdb-connector-1.18.jar"
  # IoTDB 连接配置
  host: "iotdb-0"
  port: 6667
  # 集群节点列表（高可用）
  nodes:
    - "iotdb-0:6667"
    - "iotdb-1:6667"
    - "iotdb-2:6667"
  username: "root"
  passwordSecret:
    name: iotdb-credentials
    key: password
  # 时序路径模式（通配符订阅所有能源设备）
  timeseriesPattern: "root.energy.device.**"
  # 传感器指标路径模式
  sensorPattern: "root.energy.device.*.voltage,root.energy.device.*.current,root.energy.device.*.power,root.energy.device.*.power_factor,root.energy.device.*.temperature,root.energy.device.*.pressure,root.energy.device.*.flow_rate,root.energy.device.*.cumulative_value"
  # 状态变更路径模式
  statusPattern: "root.energy.device.*.status"
  # 数据接入模式
  # INCREMENTAL: 增量接入（从上次消费位置继续）
  # FULL: 全量接入（从头开始）
  fetchMode: "INCREMENTAL"
  # 批量大小
  batchSize: 1000
  # 拉取间隔（毫秒）
  fetchIntervalMs: 100

# Doris Sink Connector 配置（Stream Load）
dorisSink:
  # Connector JAR 路径
  jarPath: "/opt/flink/connectors/flink-doris-connector-1.18.jar"
  # Doris FE 地址
  fenodes: "doris-fe.doris.svc.cluster.local:8030"
  # 数据库
  database: "db_energy"
  # 用户名
  username: "root"
  passwordSecret:
    name: doris-credentials
    key: password
  # 实时状态目标表
  realtimeStatusTable: "device_realtime_status"
  # 指标历史目标表
  metricHistoryTable: "device_metric_history"
  # 状态变更目标表
  statusChangeTable: "device_status_change"
  # 批量加载配置
  sink:
    # 批量大小
    batchSize: 1000
    # 批量间隔（毫秒）
    batchIntervalMs: 1000
    # 最大重试次数
    maxRetries: 3
    # Stream Load 超时（秒）
    streamLoadTimeout: 60
    # 是否启用两阶段提交（保证 Exactly-Once）
    enable2pc: true
    # 标签前缀
    labelPrefix: "flink-energy-iotdb-ingestion"

# 数据转换配置
transform:
  # 时间戳时区（IoTDB 使用 UTC，Doris 使用 Asia/Shanghai）
  timezone: "Asia/Shanghai"
  # 时间戳精度转换（IoTDB 毫秒 → Doris DATETIME）
  timestampPrecision: "MILLIS_TO_DATETIME"
  # 异常值过滤
  outlierFilter:
    enabled: true
    rules:
      - metric: "voltage"
        min: 0
        max: 500
      - metric: "current"
        min: 0
        max: 1000
      - metric: "power"
        min: 0
        max: 10000
      - metric: "power_factor"
        min: 0
        max: 1
      - metric: "temperature"
        min: -50
        max: 200
      - metric: "pressure"
        min: 0
        max: 10
      - metric: "flow_rate"
        min: 0
        max: 100000
  # 指标状态判定（基于阈值生成 NORMAL/WARNING/ALARM）
  statusJudge:
    enabled: true
    # 预警阈值（从 iotdb-jdbc-config.yaml 的 alarmThreshold 读取）
    configRef: "iotdb-jdbc-config.yaml#timeseries.metrics"

# 监控与告警
monitoring:
  # Flink metrics reporter
  metricsReporter:
    enabled: true
    reporterClass: "org.apache.flink.metrics.prometheus.PrometheusReporter"
    port: 9260
  # 告警规则
  alerts:
    # 接入延迟告警（源数据时间戳与当前时间差 > 阈值）
    ingestionLag:
      enabled: true
      thresholdSeconds: 300  # 5 分钟
    # 接入失败率告警
    failureRate:
      enabled: true
      threshold: 0.05  # 5%
      windowSize: 300  # 5 分钟窗口