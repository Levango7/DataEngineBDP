# IoTDB JDBC 连接配置
# ============================================================================
# 用途：能源行业模板通过 IoTDB JDBC 查询能源设备时序数据
# 引擎：Apache IoTDB 1.3.x
# 字符集：UTF-8，YAML 2 空格缩进
# ============================================================================

# IoTDB 集群连接配置
iotdb:
  # IoTDB 版本
  version: "1.3.2"
  # 集群模式：STANDALONE-单机 / CLUSTER-集群
  mode: CLUSTER
  # JDBC 连接配置
  jdbc:
    # JDBC 驱动类名
    driverClass: "org.apache.iotdb.jdbc.IoTDBDriver"
    # JDBC URL（集群模式多节点逗号分隔）
    url: "jdbc:iotdb://iotdb-0:6667,iotdb-1:6667,iotdb-2:6667/"
    # 用户名（生产环境通过 Secret 引用）
    username: "root"
    # 密码（生产环境通过 Secret 引用，不在此明文配置）
    passwordSecret:
      name: iotdb-credentials
      key: password
    # 连接池配置
    pool:
      initialSize: 5
      maxSize: 20
      maxWaitMillis: 5000
      # 连接超时（毫秒）
      connectTimeout: 10000
      # 查询超时（毫秒）
      queryTimeout: 60000
    # SSL 配置
    ssl:
      enabled: false
      # trustStorePath: /etc/iotdb/truststore.jks
      # trustStorePasswordSecret:
      #   name: iotdb-credentials
      #   key: truststore-password

# 时序数据查询配置
query:
  # 设备状态查询模板（实时监控）
  # 时序路径格式：root.energy.device.{device_code}.{metric_name}
  deviceStatusQueryTemplate: >
    SELECT {metric_names}
    FROM root.energy.device.{device_code}
    WHERE time >= {start_time} AND time < {end_time}
  # 设备累计读数查询模板（能耗计算）
  cumulativeReadingQueryTemplate: >
    SELECT cumulative_value
    FROM root.energy.device.{device_code}.cumulative_value
    WHERE time >= {start_time} AND time < {end_time}
  # 设备状态变更查询模板
  statusChangeQueryTemplate: >
    SELECT status
    FROM root.energy.device.{device_code}.status
    WHERE time >= {start_time} AND time < {end_time}
  # 默认查询时间范围（最近 5 分钟，对应 DAG 调度间隔）
  defaultRangeMinutes: 5
  # 最大返回行数
  maxRowLimit: 100000

# 时序路径定义
timeseries:
  # 设备根路径
  rootPath: "root.energy.device"
  # 传感器指标路径模板
  metricPathTemplate: "root.energy.device.{device_code}.{metric_name}"
  # 支持的传感器指标列表
  metrics:
    - name: voltage
      unit: "V"
      description: "电压（电表专用）"
      alarmThreshold:
        warning: 380
        critical: 420
    - name: current
      unit: "A"
      description: "电流（电表专用）"
      alarmThreshold:
        warning: 200
        critical: 250
    - name: power
      unit: "kW"
      description: "有功功率"
      alarmThreshold:
        warning: null
        critical: null
    - name: power_factor
      unit: ""
      description: "功率因数"
      alarmThreshold:
        warning: 0.85
        critical: 0.80
    - name: temperature
      unit: "℃"
      description: "设备温度"
      alarmThreshold:
        warning: 65
        critical: 80
    - name: pressure
      unit: "MPa"
      description: "管道压力（气/汽/水表专用）"
      alarmThreshold:
        warning: 1.2
        critical: 1.5
    - name: flow_rate
      unit: "m3/h"
      description: "瞬时流量"
      alarmThreshold:
        warning: null
        critical: null
    - name: cumulative_value
      unit: "kWh"
      description: "累计读数（用于能耗差分计算）"
      alarmThreshold:
        warning: null
        critical: null
    - name: signal_strength
      unit: "dBm"
      description: "信号强度"
      alarmThreshold:
        warning: -80
        critical: -90
    - name: status
      unit: ""
      description: "设备状态（ONLINE/OFFLINE/FAULT/MAINT）"

# 数据写入目标配置（Doris）
target:
  doris:
    feHost: "doris-fe.doris.svc.cluster.local"
    fePort: 9030
    database: "db_energy"
    # 实时状态目标表
    realtimeStatusTable: "device_realtime_status"
    # 指标历史目标表
    metricHistoryTable: "device_metric_history"
    # 状态变更目标表
    statusChangeTable: "device_status_change"
    user: "root"
    passwordSecret:
      name: doris-credentials
      key: password

# 健康检查
healthCheck:
  enabled: true
  # 健康检查间隔（秒）
  intervalSeconds: 30
  # 健康检查查询
  query: "SHOW TIMESERIES root.energy.device.** LIMIT 1"