# 能源行业模板 - RBAC 权限定义
# ============================================================================
# 模块：T043 能源行业模板 RBAC
# 格式：资源 + 操作组合权限定义
# 资源数：40（31 表 + 5 DAG + 4 Dashboard）
# 字符集：UTF-8，YAML 2 空格缩进
# ============================================================================

# 资源定义列表
resources:
  # --------------------------------------------------------------------------
  # 表资源（31 张）
  # --------------------------------------------------------------------------
  # 设备监测域（8 张）
  - name: energy_device
    type: table
    description: "能源设备主表"
    domain: device-monitoring
  - name: device_realtime_status
    type: table
    description: "设备实时状态表"
    domain: device-monitoring
  - name: device_alarm_record
    type: table
    description: "设备告警记录表"
    domain: device-monitoring
  - name: device_health_score
    type: table
    description: "设备健康度评分表"
    domain: device-monitoring
  - name: device_metric_history
    type: table
    description: "设备指标历史表"
    domain: device-monitoring
  - name: device_alarm_rule
    type: table
    description: "告警规则定义表"
    domain: device-monitoring
  - name: device_maintenance_log
    type: table
    description: "设备维护记录表"
    domain: device-monitoring
  - name: device_status_change
    type: table
    description: "设备状态变更日志表"
    domain: device-monitoring
  # 用能分析域（7 张）
  - name: energy_consumption_detail
    type: table
    description: "能耗明细表"
    domain: consumption-analysis
  - name: energy_consumption_summary
    type: table
    description: "能耗汇总表"
    domain: consumption-analysis
  - name: energy_dimension_compare
    type: table
    description: "多维对比分析表"
    domain: consumption-analysis
  - name: energy_trend_data
    type: table
    description: "能耗趋势数据表"
    domain: consumption-analysis
  - name: energy_quota
    type: table
    description: "能耗定额表"
    domain: consumption-analysis
  - name: energy_balance
    type: table
    description: "能源平衡表"
    domain: consumption-analysis
  - name: energy_cost_analysis
    type: table
    description: "能源成本分析表"
    domain: consumption-analysis
  # 碳排放核算域（7 张）
  - name: emission_factor_library
    type: table
    description: "排放因子库"
    domain: carbon-emission
  - name: emission_source
    type: table
    description: "排放源表"
    domain: carbon-emission
  - name: emission_calculation_result
    type: table
    description: "排放核算结果表"
    domain: carbon-emission
  - name: emission_calculation_model
    type: table
    description: "核算模型表"
    domain: carbon-emission
  - name: emission_scope_classification
    type: table
    description: "排放范围分类表"
    domain: carbon-emission
  - name: emission_reduction_target
    type: table
    description: "减排目标表"
    domain: carbon-emission
  - name: emission_report
    type: table
    description: "核算报告表"
    domain: carbon-emission
  # 趋势预测域（5 张）
  - name: forecast_parameter
    type: table
    description: "预测参数表"
    domain: forecast
  - name: forecast_result
    type: table
    description: "预测结果表"
    domain: forecast
  - name: forecast_model_evaluation
    type: table
    description: "模型评估表"
    domain: forecast
  - name: forecast_model_registry
    type: table
    description: "模型注册表"
    domain: forecast
  - name: forecast_confidence_interval
    type: table
    description: "置信区间表"
    domain: forecast
  # RBAC 域（4 张）
  - name: energy_role
    type: table
    description: "角色表"
    domain: rbac
  - name: energy_permission
    type: table
    description: "权限表"
    domain: rbac
  - name: energy_role_permission
    type: table
    description: "角色-权限关联表"
    domain: rbac
  - name: energy_user_role
    type: table
    description: "用户-角色关联表"
    domain: rbac

  # --------------------------------------------------------------------------
  # DAG 资源（5 个）
  # --------------------------------------------------------------------------
  - name: device_status_monitoring
    type: dag
    description: "设备状态实时监控 DAG"
    domain: device-monitoring
  - name: energy_consumption_statistics
    type: dag
    description: "用能分析统计 DAG"
    domain: consumption-analysis
  - name: carbon_emission_calculation
    type: dag
    description: "碳排放核算 DAG"
    domain: carbon-emission
  - name: energy_trend_forecast
    type: dag
    description: "能耗趋势预测 DAG"
    domain: forecast
  - name: device_alert_routing
    type: dag
    description: "设备告警路由 DAG"
    domain: device-monitoring

  # --------------------------------------------------------------------------
  # Dashboard 资源（4 个）
  # --------------------------------------------------------------------------
  - name: device-monitoring
    type: dashboard
    description: "能源设备监测看板"
    domain: device-monitoring
  - name: energy-consumption-analysis
    type: dashboard
    description: "用能分析看板"
    domain: consumption-analysis
  - name: carbon-emission-accounting
    type: dashboard
    description: "碳排放核算看板"
    domain: carbon-emission
  - name: energy-forecast
    type: dashboard
    description: "能耗趋势预测看板"
    domain: forecast

# 权限定义列表
permissions:
  # 通用操作权限模板
  - code: "*:read"
    name: "读取权限"
    description: "读取资源"
    operation: READ
  - code: "*:write"
    name: "写入权限"
    description: "写入/修改资源"
    operation: WRITE
  - code: "*:exec"
    name: "执行权限"
    description: "执行资源（DAG/作业）"
    operation: EXEC
  - code: "*:admin"
    name: "管理权限"
    description: "管理资源（配置/删除/授权）"
    operation: ADMIN

  # 表级权限（节选关键权限，覆盖 31 表）
  # 设备监测域
  - code: "energy_device:read"
    name: "读取能源设备主表"
