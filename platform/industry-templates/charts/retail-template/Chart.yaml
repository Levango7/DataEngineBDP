# Helm Chart 定义 - 零售行业模板包装
# ============================================================================
# 用途：使零售行业模板可被 helm install 引用部署
# 说明：本 Chart 不部署实际工作负载（Doris/DS/Superset/Keycloak/tag-engine 由各自 Chart 部署），
#       而是将模板资产（DDL/DAG/Dashboard/RBAC/tag-engine-config）打包为 ConfigMap/Secret，
#       供平台侧的模板导入 Job 拉取并应用到对应组件。
# ============================================================================

apiVersion: v2
name: retail-template
description: |
  数据引擎大数据平台 V2.0 Phase 2 Batch 1b - T038 零售行业完整模板 Helm Chart。
  含 18 张 DDL 表（商品画像 6 + 会员分析 6 + 营销效果 6）、6 个 DAG 调度作业
  （RFM 分群/流失预测/LTV/A-B 实验/转化漏斗/ROI）、3 个 Superset Dashboard、
  3 个 RBAC 角色（店长/运营/数据分析师）、标签引擎接入配置，
  通过 ConfigMap 挂载模板资产，由平台侧 Job 完成导入。
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://shuqing.com/industry-templates/retail
sources:
  - https://github.com/shuqing/DataEngineBDP/platform/industry-templates/templates/retail
mainters:
  - name: hw029373469
    email: hw029373469@shuqing.com
    url: https://shuqing.com
keywords:
  - retail
  - e-commerce
  - rfm
  - churn-prediction
  - ltv
  - ab-testing
  - conversion-funnel
  - roi
  - big-data
  - industry-template
  - doris
  - dolphinscheduler
  - superset
  - keycloak
  - tag-engine
  - rbac
annotations:
  category: industry-template
  industry: retail
  shuqing.platform/version: "2.0.0"
  shuqing.template/business-domains: "product_profile,member_analysis,marketing_effect"
  shuqing.template/tables: "18"
  shuqing.template/dags: "6"
  shuqing.template/dashboards: "3"
  shuqing.template/roles: "3"
  shuqing.template/tag-engine: "enabled"