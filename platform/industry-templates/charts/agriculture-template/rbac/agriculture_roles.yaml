# agriculture 行业模板 RBAC - 角色与权限配置
- realm: agriculture
  enabled: true
  roles:
    - name: agriculture_viewer
      description: 只读
      composite: false
    - name: agriculture_analyst
      description: 分析读写
      composite: true
      composites: [agriculture_viewer]
    - name: agriculture_operator
      description: 运营操作
      composite: true
      composites: [agriculture_analyst]
    - name: agriculture_admin
      description: 模板管理
      composite: true
      composites: [agriculture_operator]
