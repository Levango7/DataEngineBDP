# education 行业模板 RBAC - 角色与权限配置
- realm: education
  enabled: true
  roles:
    - name: education_viewer
      description: 只读
      composite: false
    - name: education_analyst
      description: 分析读写
      composite: true
      composites: [education_viewer]
    - name: education_operator
      description: 运营操作
      composite: true
      composites: [education_analyst]
    - name: education_admin
      description: 模板管理
      composite: true
      composites: [education_operator]
