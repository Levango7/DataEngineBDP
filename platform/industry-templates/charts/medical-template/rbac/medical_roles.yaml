# medical 行业模板 RBAC - 角色与权限配置
- realm: medical
  enabled: true
  roles:
    - name: medical_viewer
      description: 只读
      composite: false
    - name: medical_analyst
      description: 分析读写
      composite: true
      composites: [medical_viewer]
    - name: medical_operator
      description: 运营操作
      composite: true
      composites: [medical_analyst]
    - name: medical_admin
      description: 模板管理
      composite: true
      composites: [medical_operator]
