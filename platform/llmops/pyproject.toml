[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sq-llmops"
version = "0.1.0"
description = "Shuqing Big Data Platform - LLMOps Platform (L4.5.3)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shuqing Big Data Platform Team"},
]
keywords = ["llmops", "mlflow", "model-registry", "fine-tuning", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.2.1",
    "httpx==0.27.0",
    "loguru==0.7.3",
    "python-dateutil==2.9.0",
]

[project.optional-dependencies]
mlflow = ["mlflow==2.11.1"]
test = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    "mlflow==2.11.1",
]

[project.urls]
Homepage = "https://github.com/shuqing/sq-llmops"
Documentation = "https://github.com/shuqing/sq-llmops/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmops*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]