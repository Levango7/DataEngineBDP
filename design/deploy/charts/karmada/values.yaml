# ============================================================================
# karmada Helm Chart 默认 values
# 关联：design/deploy/values/karmada-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源）----
image:
  repository: "registry.k8s.io/karmada/karmada-apiserver"
  tag: "v1.12.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 5443
  # 容器端口
  containerPort: 5443

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 5443
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 5443
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: karmada.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # karmada 默认配置，完整配置请引用 design/deploy/values/karmada-values.yaml

# ============================================================================
# 灾备配置（disasterRecovery）- 跨集群联邦备份与故障切换
# 关联：scripts/disaster-recovery/ 目录下的灾备脚本
# ============================================================================
disasterRecovery:
  # 灾备总开关
  enabled: false

  # RTO（Recovery Time Objective，恢复时间目标，分钟）
  rto: 30

  # RPO（Recovery Point Objective，恢复点目标，分钟）
  rpo: 60

  # 备份调度（Cron 表达式，默认每日凌晨 02:00）
  backupSchedule: "0 2 * * *"

  # 备份保留天数
  retentionDays: 30

  # 业务 namespace 列表
  businessNamespaces:
    - default
    - production
    - staging

  # 目标集群列表（Karmada 成员集群）
  targetClusters:
    - cluster-beijing
    - cluster-shanghai
    - cluster-shenzhen

  # ---- 故障切换配置 ----
  failover:
    # 连续失败次数阈值（达到后判定集群故障）
    failureThreshold: 3
    # 检测间隔（秒）
    intervalSeconds: 30
    # 超时时间（秒）
    timeoutSeconds: 60
    # 自动切换开关（生产环境建议 false，由人工确认后脚本触发）
    autoFailover: false

    # ---- 通知配置 ----
    notification:
      # Webhook 通知
      webhook:
        enabled: false
        # url: "https://hooks.slack.com/services/xxx"
      # 邮件通知
      email:
        enabled: false
        # to:
        #   - oncall@shuqing.example.com
        # smtpServer: "smtp.shuqing.example.com:587"

  # ---- 跨 region 复制 ----
  crossRegionReplication:
    enabled: false
    targetRegion: "us-west-2"
    targetBucket: "velero-backups-archive"
    prefix: "archive"
    endpoint: "https://s3.amazonaws.com"
    forcePathStyle: true

# ---- 集群信息采集器（默认关闭）----
clusterInfoCollector:
  enabled: false
  image:
    repository: "registry.k8s.io/karmada/karmada-agent"
    tag: "v1.12.0"
    pullPolicy: IfNotPresent
  karmadaHost: ""
  reportInterval: "60s"
  resources: {}
  nodeSelector: {}
  tolerations: []

# ---- 传播策略（默认关闭）----
propagationPolicy:
  enabled: false
  type: "config"
  namespace: "default"
  clusterAffinity: []
  clusterTolerations: []
  placementPolicyType: "Duplicated"
  replicaSchedulingType: "Duplicated"
  replicaDivisionPreference: "Weighted"
  staticWeights: []
  targetResources: []
  topologySpreadConstraints: []

# ---- 调度Profile（默认关闭，按需启用）----
schedulingProfile:
  enabled: false

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/karmada-values.yaml 覆盖
# 渲染命令： helm template karmada design/deploy/charts/karmada -f design/deploy/values/karmada-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
