apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llmops.fullname" . }}
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | int }}
  selector:
    matchLabels:
      {{- include "llmops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmops.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap 变更时滚动重启
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}
      # k8s 会为同命名空间的 Service 向 Pod 注入 服务名_PORT=tcp://IP:PORT 形式的链接变量；
      # 独立安装（release 名=chart 名，APISIX 上游即按 chart 名）时 Service 名等于 chart 名，
      # 与 llmops/config/settings.py 的 env_prefix LLMOPS_ 同名 → LLMOPS_PORT 被当整数解析，
      # 启动即崩溃（同型根因已在 burn-in 集群 nl2sql 实测）。
      # 关闭服务链接注入（组件间寻址走 Service DNS / 显式 URL，不依赖这些变量）。
      enableServiceLinks: false
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "llmops.configmapName" . }}
          env:
            - name: AUTH_MODE
              value: {{ .Values.auth.authMode | default "jwt" | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecretName | quote }}
                  key: {{ .Values.auth.jwtSecretKey | quote }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path | quote }}
              port: {{ .Values.probes.liveness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | int }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | int }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path | quote }}
              port: {{ .Values.probes.readiness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | int }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | int }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
{{- range .Values.securityContext.capabilities.drop }}
                - {{ . }}
{{- end }}
{{- end }}
