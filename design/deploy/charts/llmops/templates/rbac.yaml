{{- if .Values.inference.rbac.create }}
# B 线真推理编排：llmops 需要在目标命名空间管理推理 Deployment/Service。
# 权限收敛在 inference.namespace 一个命名空间内（Role 而非 ClusterRole）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llmops.fullname" . }}
  # 全部资源显式 namespace：渲染产物自描述，kubectl apply -f - 无需 -n 默认。
  # 坑实录：SA 无 ns 时 `apply -n shuqing` 落 default？不会——落 -n 指定值，
  # 但跨 ns 清单（Role/RoleBinding 在 inference.namespace）与 -n 冲突会整流报错。
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
---
{{- if .Values.inference.namespaceCreate }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.inference.namespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "llmops.fullname" . }}-inference
  namespace: {{ .Values.inference.namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # G 线 per-service 模型 URL Secret（presigned URL=短期凭据，只写不读）：
  # 无 get/list/watch（SA 对 ns 内全部 Secret 的读权限是最值钱的收敛刀）；
  # create 先行、reconcile 重签走 merge patch 盲写、404 重建，均不需要 get。
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "llmops.fullname" . }}-inference
  namespace: {{ .Values.inference.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "llmops.fullname" . }}-inference
subjects:
  - kind: ServiceAccount
    name: {{ include "llmops.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
