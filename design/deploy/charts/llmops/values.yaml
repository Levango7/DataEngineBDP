# ============================================================================
# llmops Helm Chart 默认 values
# 关联：design/deploy/values/llmops-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（自研：build.yml 推 ghcr.io，tag 只有 latest 与 40 位 sha；按环境钉 sha 请写 env values）----
image:
  repository: "ghcr.io/levango7/sq-llmops"
  tag: "latest"
  pullPolicy: Always

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
# 2026-11-28 起镜像 Dockerfile 固定数字 UID/GID 10001（runAsNonRoot=true 时 kubelet
# 无法校验用户名形式的 USER，真集群实测报 "image has non-numeric user (app)" ⇒
# 镜像必须自证非 root）。chart 侧同步显式 runAsUser/runAsGroup/fsGroup=10001 三重钉死：
# 即使有人换掉镜像，Pod 仍以非 root 数字 uid 跑；/app 文件属主同 10001，只读根文件系统不受影响。
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
# 路径为 /health：健康路由未挂 API 前缀（llmops/api/app.py: include_router(health.router)）；
# 原 /api/v1/health 实测 404，liveness 会按 failureThreshold 反复重启 Pod。
probes:
  liveness:
    enabled: true
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: llmops.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
# LLMOPS_STORE_TYPE 必须显式注入（Settings 默认 mlflow；镜像已装 .[mlflow] extra）。
# 各环境指向自己的 MLflow 服务：在 env values 里覆盖 LLMOPS_MLFLOW_URI。
env:
  LLMOPS_STORE_TYPE: mlflow
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
# ---- 鉴权（AUTH_MODE fail-fast 配套）----
# jwt_auth.py 在 K8s 环境未显式 AUTH_MODE 时拒绝启动；此处生产默认强制 jwt。
# 本地/测试（非 K8s）或需匿名放行时，显式设置 auth.authMode: none。
# JWT_SECRET 从 existingSecretName 的 jwtSecretKey 键读取，须与签发端一致。
auth:
  authMode: jwt
  existingSecretName: shuqing-jwt-secret
  jwtSecretKey: jwt-secret

# ---- 前端视图持久化（A2：生产禁止内存回退）----
# store=postgresql 时 LLMOPS_FRONTEND_DATABASE_URL 必须由 existingSecretName 注入；
# DSN 不进 values/ConfigMap（凭据只走 Secret；源码与示例不写可用凭据）。
frontend:
  store: postgresql
  existingSecretName: shuqing-llmops-pg
  databaseUrlKey: database-url

# ---- 运行环境（production 时 Settings 强制 frontendStore=postgresql，否则启动 fail-fast）----
environment: production

# ---- 推理编排（B 线：production 禁止契约级假编排，必须真集群）----
# orchestrator=kubernetes 时由本 chart 创建 ServiceAccount 与目标命名空间最小权限 Role；
# 推理运行时镜像为生产必填（运行时契约=llama.cpp server：/completion 推理、/health 探针）；
# 模型 URL 与 DSN 同一 Secret（frontend.existingSecretName 的 modelUrlKey 键），不进 values 明文。
inference:
  orchestrator: kubernetes
  namespace: llmops-inference
  namespaceCreate: true
  image: "ghcr.io/ggml-org/llama.cpp:server"
  initImage: "curlimages/curl:8.11.1"
  syncIntervalSec: 15
  modelUrlKey: model-url
  rbac:
    create: true

config:
  application.conf: |
    # llmops 默认配置，完整配置请引用 design/deploy/values/llmops-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/llmops-values.yaml 覆盖
# 渲染命令： helm template llmops design/deploy/charts/llmops -f design/deploy/values/llmops-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
