# ============================================================================
# llmops Helm Chart 默认 values
# 关联：design/deploy/values/llmops-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源 docker.m.daocloud.io）----
image:
  repository: "ghcr.io/levango7/sq-llmops"
  tag: "latest"
  pullPolicy: Always

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
# 镜像 Dockerfile 的 app 用户由 useradd --system 创建（uid 非固定，python:3.11-slim 实测 999）
# ⇒ 不设 runAsUser/runAsGroup（写死 1000 会让进程落到不存在于 /etc/passwd 的 uid 上，
#   且 /app 下 app:app 属主文件对 uid 1000 只读）；只留 runAsNonRoot + fsGroup
#   （kubelet 把 fsGroup 加进容器补充组，emptyDir 仍可写）。同族约定见 ai-assistant/business-portal 等。
securityContext:
  enabled: true
  runAsNonRoot: true
  fsGroup: 999
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
# 路径为 /health：健康路由未挂 API 前缀（llmops/api/app.py: include_router(health.router)）；
# 原 /api/v1/health 实测 404，liveness 会按 failureThreshold 反复重启 Pod。
probes:
  liveness:
    enabled: true
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: llmops.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
# ---- 鉴权（AUTH_MODE fail-fast 配套）----
# jwt_auth.py 在 K8s 环境未显式 AUTH_MODE 时拒绝启动；此处生产默认强制 jwt。
# 本地/测试（非 K8s）或需匿名放行时，显式设置 auth.authMode: none。
# JWT_SECRET 从 existingSecretName 的 jwtSecretKey 键读取，须与签发端一致。
auth:
  authMode: jwt
  existingSecretName: shuqing-jwt-secret
  jwtSecretKey: jwt-secret

config:
  application.conf: |
    # llmops 默认配置，完整配置请引用 design/deploy/values/llmops-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/llmops-values.yaml 覆盖
# 渲染命令： helm template llmops design/deploy/charts/llmops -f design/deploy/values/llmops-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
