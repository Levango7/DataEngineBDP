{{- if .Values.secret.create -}}
# Secret - 组件凭据占位（T019）
# 用途：dev 环境创建占位 Secret；staging/prod 环境应使用 External Secrets / Sealed Secrets
# 警告：切勿在生产环境使用占位凭据，必须由外部 Secret 管理器注入
apiVersion: v1
kind: Secret
metadata:
  name: finance-template-credentials
  namespace: {{ include "finance-template.namespace" . }}
  labels:
    {{- include "finance-template.labels" . | nindent 4 }}
    {{- include "finance-template.templateLabels" . | nindent 4 }}
  annotations:
    {{- include "finance-template.templateAnnotations" . | nindent 4 }}
    shuqing.io/secret-type: placeholder
    shuqing.io/warning: "占位 Secret，仅用于 dev 环境，生产环境必须使用外部 Secret 管理器"
type: Opaque
stringData:
  # Doris 凭据
  doris-password: {{ .Values.secret.doris.password | quote }}
  # DolphinScheduler 凭据
  ds-token: {{ .Values.secret.dolphinscheduler.token | quote }}
  # Superset 凭据
  superset-token: {{ .Values.secret.superset.token | quote }}
  # Keycloak 凭据
  keycloak-admin-password: {{ .Values.secret.keycloak.adminPassword | quote }}
{{- end -}}
