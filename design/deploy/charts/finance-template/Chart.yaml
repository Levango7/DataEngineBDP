# ============================================================================
# Helm Chart 定义 - 金融行业模板部署 Chart（T019）
# ============================================================================
# 模块：T019 金融模板 Helm Chart 打包 + values 多环境覆盖 + 部署验证
# 源：基于 T018 金融模板（platform/industry-templates/templates/finance/）
# 用途：将金融行业模板资产（21 DDL / 5 DAG / 3 Dashboard / 3 RBAC 角色）
#       打包为 Kubernetes ConfigMap，通过导入 Job 一键部署到
#       Doris + DolphinScheduler + Superset + Keycloak 技术栈。
# 说明：本 Chart 不部署实际工作负载（Doris/DS/Superset/Keycloak 由各自 Chart 部署），
#       仅负责模板资产的打包、导入与验证。
# 关联：platform/industry-templates/templates/finance/helm/（T018 原始 Chart）
# ============================================================================

apiVersion: v2
name: finance-template
description: |
  数据引擎大数据平台 L5.3 行业应用模板 - 金融行业完整模板部署 Chart。
  含 21 张 DDL 表、5 个 DAG 调度作业、3 个 Superset Dashboard、3 个 RBAC 角色，
  通过 ConfigMap 挂载模板资产，由导入 Job 完成一键部署。
  支持多环境（dev/staging/prod）values 覆盖与部署验证。
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://shuqing.com/industry-templates/finance
sources:
  - https://github.com/shuqing/DataEngineBDP/platform/industry-templates/templates/finance
  - https://github.com/shuqing/DataEngineBDP/design/deploy/charts/finance-template
maintainers:
  - name: hw029373469
    email: hw029373469@shuqing.com
    url: https://shuqing.com
keywords:
  - finance
  - banking
  - risk-control
  - big-data
  - industry-template
  - doris
  - dolphinscheduler
  - superset
  - keycloak
  - rbac
  - multi-environment
dependencies: []
annotations:
  category: industry-template
  industry: finance
  shuqing.platform/version: "5.3.0"
  shuqing.template/business-domains: "risk,customer,account,transaction,credit"
  shuqing.template/tables: "21"
  shuqing.template/dags: "5"
  shuqing.template/dashboards: "3"
  shuqing.template/roles: "3"
  shuqing.template/source-task: "T018"
  shuqing.template/chart-task: "T019"
