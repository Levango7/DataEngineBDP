{{- if and .Values.data .Values.data.enabled .Values.data.storageClassName -}}
# PersistentVolumeClaim：仅当 data.storageClassName 非空时渲染（values.data 段注释）。
# 与 deployment.yaml 的 data 卷（persistentValueClaim claimName=<fullname>-data）配套；
# 不设 storageClassName 时走 emptyDir（重启即失，本地/CI 口径）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "master-data.fullname" . }}-data
  labels:
    {{- include "master-data.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.data.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.data.storageSize | default "10Gi" | quote }}
{{- end -}}
