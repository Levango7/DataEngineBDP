# ============================================================================
# Argo Rollouts 控制器 ServiceAccount + RBAC（v2.1 灰度发布增强）
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argo-rollouts.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "argo-rollouts.name" . }}
    app.kubernetes.io/part-of: argo-rollouts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argo-rollouts.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "argo-rollouts.name" . }}
    app.kubernetes.io/part-of: argo-rollouts
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status", "rollouts/finalizers", "experiments", "experiments/status", "experiments/finalizers", "analysistemplates", "clusteranalysistemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "services/finalizers", "replicasets", "replicasets/finalizers", "configmaps", "events", "secrets", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "deployments/status", "deployments/finalizers", "replicasets", "replicasets/scale", "replicasets/status", "replicasets/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "argo-rollouts.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "argo-rollouts.name" . }}
    app.kubernetes.io/part-of: argo-rollouts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "argo-rollouts.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "argo-rollouts.name" . }}
    namespace: {{ .Release.Namespace }}
