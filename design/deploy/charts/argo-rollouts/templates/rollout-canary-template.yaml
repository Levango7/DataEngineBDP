{{- if .Values.strategyTemplates.canary.enabled }}
# ============================================================================
# 金丝雀策略模板（v2.1 灰度发布增强）
# 说明：基于权重逐步切流，配合 AnalysisTemplate 基于 Prometheus 指标自动推进/回滚。
# 使用：业务 Rollout 通过 strategy.canary 引用本模板的步骤结构。
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "argo-rollouts.name" . }}-canary-template
  labels:
    app: {{ include "argo-rollouts.name" . }}
    rollout-strategy: canary
    app.kubernetes.io/managed-by: helm
  annotations:
    rollout.argoproj.io/strategy: "canary"
    rollout.argoproj.io/description: "金丝雀渐进式发布模板-基于Prometheus指标自动推进"
spec:
  replicas: {{ .Values.strategyTemplates.canary.replicas | default 3 }}
  selector:
    matchLabels:
      app: {{ include "argo-rollouts.name" . }}-canary
  strategy:
    canary:
      canaryService: {{ include "argo-rollouts.name" . }}-canary-preview
      stableService: {{ include "argo-rollouts.name" . }}-canary-stable
      trafficRouting:
        istio:
          virtualService:
            name: {{ include "argo-rollouts.name" . }}-canary-vsvc
            routes:
              - primary
      maxSurge: {{ .Values.strategyTemplates.canary.maxSurge | default "25%" }}
      maxUnavailable: {{ .Values.strategyTemplates.canary.maxUnavailable | default 0 }}
      steps:
        - setWeight: 20
        - pause:
            duration: {{ .Values.strategyTemplates.canary.initialPause | default "2m" }}
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: service-name
                value: {{ include "argo-rollouts.name" . }}-canary-preview
        - setWeight: 40
        - pause:
            duration: {{ .Values.strategyTemplates.canary.stepPause | default "2m" }}
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: service-name
                value: {{ include "argo-rollouts.name" . }}-canary-preview
        - setWeight: 60
        - pause:
            duration: {{ .Values.strategyTemplates.canary.stepPause | default "2m" }}
        - setWeight: 80
        - pause:
            duration: {{ .Values.strategyTemplates.canary.stepPause | default "2m" }}
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: service-name
                value: {{ include "argo-rollouts.name" . }}-canary-preview
        - setWeight: 100
        - pause:
            duration: {{ .Values.strategyTemplates.canary.finalPause | default "1m" }}
  template:
    metadata:
      labels:
        app: {{ include "argo-rollouts.name" . }}-canary
    spec:
      containers:
        - name: app
          image: "{{ .Values.strategyTemplates.canary.image.repository }}:{{ .Values.strategyTemplates.canary.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
{{- end }}
