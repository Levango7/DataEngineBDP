{{- if .Values.crd.install }}
# ============================================================================
# Argo Rollouts CRD - ClusterAnalysisTemplate + Experiment（v2.1 灰度发布增强）
# ============================================================================
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusteranalysistemplates.argoproj.io
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: argo-rollouts
spec:
  group: argoproj.io
  names:
    kind: ClusterAnalysisTemplate
    listKind: ClusterAnalysisTemplateList
    plural: clusteranalysistemplates
    singular: clusteranalysistemplate
    shortNames:
      - cat
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: experiments.argoproj.io
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/part-of: argo-rollouts
spec:
  group: argoproj.io
  names:
    kind: Experiment
    listKind: ExperimentList
    plural: experiments
    singular: experiment
    shortNames:
      - exp
      - experiment
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
{{- end }}
