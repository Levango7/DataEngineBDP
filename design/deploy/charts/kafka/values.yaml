# ============================================================================
# kafka Helm Chart 默认 values
# 关联：design/deploy/values/kafka-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（官方镜像；sq-* 为自研包，构建未发布前用官方兜底） ----
image:
  repository: "apache/kafka"
  tag: "3.8.1"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 9092
  # 容器端口
  containerPort: 9092

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    tcpSocket:
      port: 9092
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    tcpSocket:
      port: 9092
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- ConfigMap 数据（从 design/deploy/values/kafka-values.yaml 提取骨架）----
config:
  broker:
    replicas: 3
    minInSyncReplicas: 2
    defaultReplicationFactor: 3
    compressionType: lz4
    logRetentionHours: 168
  metadata:
    mode: kraft
    kraft:
      controllers: 3

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/kafka-values.yaml 覆盖
# 渲染命令： helm template kafka design/deploy/charts/kafka -f design/deploy/values/kafka-values.yaml

# ---- 弹性伸缩（默认关闭，开启后按 CPU 使用率自动扩缩）----
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
