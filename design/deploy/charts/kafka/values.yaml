# ============================================================================
# kafka Helm Chart 默认 values
# 关联：design/deploy/values/kafka-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置 ----
image:
  repository: "sq-kafka"
  tag: "3.7-0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 9092
  # 容器端口
  containerPort: 9092

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 9092
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 9092
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- ConfigMap 数据（从 design/deploy/values/kafka-values.yaml 提取骨架）----
config:
  broker:
    replicas: 3
    minInSyncReplicas: 2
    defaultReplicationFactor: 3
    compressionType: lz4
    logRetentionHours: 168
  metadata:
    mode: kraft
    kraft:
      controllers: 3

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/kafka-values.yaml 覆盖
# 渲染命令： helm template kafka design/deploy/charts/kafka -f design/deploy/values/kafka-values.yaml
