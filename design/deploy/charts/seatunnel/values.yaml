# ============================================================================
# seatunnel Helm Chart 默认 values
# 关联：design/deploy/values/seatunnel-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置 ----
image:
  repository: "sq-seatunnel"
  tag: "2.3-0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- ConfigMap 数据（从 design/deploy/values/seatunnel-values.yaml 提取骨架）----
config:
  worker:
    replicas: 2
    slotNum: 2
    checkpointInterval: 60s
  connectors:
    mysql:
      enabled: true
      cdc: true
    postgres:
      enabled: true
      cdc: true
    kafka:
      enabled: true
    iceberg:
      enabled: true
      warehouse: s3://sq-iceberg/warehouse
  checkpoint:
    interval: 60s
    timeout: 5m
    storage: s3://sq-seatunnel/checkpoints

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/seatunnel-values.yaml 覆盖
# 渲染命令： helm template seatunnel design/deploy/charts/seatunnel -f design/deploy/values/seatunnel-values.yaml
