apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "encaps-layer.fullname" . }}
  labels:
    {{- include "encaps-layer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | int }}
  selector:
    matchLabels:
      {{- include "encaps-layer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "encaps-layer.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap 变更时滚动重启
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}
      {{- if or ( and .Values.logs ( .Values.logs.enabled ) ( .Values.logs.mountPath ) ) ( and .Values.tmp ( .Values.tmp.enabled ) ) }}
      volumes:
        {{- if and .Values.logs ( .Values.logs.enabled ) ( .Values.logs.mountPath ) }}
        - name: logs
          emptyDir: {}
        {{- end }}
        {{- if and .Values.tmp ( .Values.tmp.enabled ) }}
        # 嵌入式 Tomcat 启动时要在 /tmp 建部署临时目录（tomcat.PORT.RANDOM）。
        # readOnlyRootFilesystem: true 时 /tmp 只读，Tomcat 直接启动失败：
        #   FileSystemException: /tmp/tomcat.8081: Read-only file system
        #   -> ApplicationContextException: Unable to start web server
        # 用 emptyDir 挂出 /tmp，在保留只读根加固的前提下满足这一必需的可写点。
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "encaps-layer.configmapName" . }}
          {{- if and .Values.auth .Values.auth.jwtSecretName }}
          # JWT_SECRET 经 Secret 注入，不写入 ConfigMap。
          # 为何必需：application.yml 中 app.security.jwt.secret 为无默认值占位符（Relaxed 绑定
          # 到 JWT_SECRET）。缺失时 JwtAuthFilterAutoConfiguration 的守卫条件不成立 -> 不注册
          # JwtAuthFilter Bean -> SecurityConfig#securityFilterChain 硬依赖该 Bean 缺失 ->
          # No qualifying bean of type 'JwtAuthFilter' -> APPLICATION FAILED TO START。
          # 生产必须配置 auth.jwtSecretName；本地/CI 可留空并用 --set 覆盖。
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecretName }}
                  key: {{ .Values.auth.jwtSecretKey | default "jwt-secret" }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path | quote }}
              port: {{ .Values.probes.liveness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | int }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | int }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path | quote }}
              port: {{ .Values.probes.readiness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | int }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | int }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or ( and .Values.logs ( .Values.logs.enabled ) ( .Values.logs.mountPath ) ) ( and .Values.tmp ( .Values.tmp.enabled ) ) }}
          volumeMounts:
            {{- if and .Values.logs ( .Values.logs.enabled ) ( .Values.logs.mountPath ) }}
            # 应用日志目录挂载。默认为空（不挂），生产请用宿主机/云盘日志采集或挂 PVC。
            # 本地/CI 打开后即使镜像未建目录也能写；两者是双保险，不是二选一。
            - name: logs
              mountPath: {{ .Values.logs.mountPath }}
            {{- end }}
            {{- if and .Values.tmp ( .Values.tmp.enabled ) }}
            # /tmp 可写点，配合 readOnlyRootFilesystem: true 使用（见 volumes 段注释）。
            - name: tmp
              mountPath: /tmp
            {{- end }}
          {{- end }}
{{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
{{- range .Values.securityContext.capabilities.drop }}
                - {{ . }}
{{- end }}
{{- end }}
