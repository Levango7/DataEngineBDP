apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-collector.serviceName" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port | int }}
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
    - port: {{ .Values.service.httpPort | int }}
      targetPort: otlp-http
      protocol: TCP
      name: otlp-http
    - port: {{ .Values.service.metricsPort | int }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: {{ .Values.service.healthPort | int }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "otel-collector.selectorLabels" . | nindent 4 }}
