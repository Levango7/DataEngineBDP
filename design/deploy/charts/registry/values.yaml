# ============================================================================
# registry Helm Chart 默认 values
# 关联：design/deploy/values/registry-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源）----
image:
  repository: "goharbor/harbor-core"
  tag: "v2.10.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 80
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: registry.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  # 鉴权：K8s 内默认强制 JWT（JWT_SECRET 经 Secret 注入，见 SECRETS-MANAGEMENT-GUIDE.md）
  AUTH_MODE: jwt
  # 部署执行默认真实模式（组件代码默认 mock_mode=true，此处生产覆盖为 false）
  REGISTRY_MOCK_MODE: "false"

# ---- 鉴权（AUTH_MODE fail-fast 配套）----
auth:
  authMode: jwt
  existingSecretName: shuqing-jwt-secret
  jwtSecretKey: jwt-secret

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # registry 默认配置，完整配置请引用 design/deploy/values/registry-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/registry-values.yaml 覆盖
# 渲染命令： helm template registry design/deploy/charts/registry -f design/deploy/values/registry-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
