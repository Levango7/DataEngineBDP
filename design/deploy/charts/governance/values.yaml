# ============================================================================
# governance Helm Chart 默认 values
# 关联：design/deploy/values/governance-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置 ----
# governance 为治理中台聚合 Chart，实际由 3 个自研组件构成
#（metadata-collector / lineage-analyzer / real-time-pipeline，均有 build.yml 构建的真实镜像）。
# 生产环境请分别部署各组件 Chart，或在此按需指定真实组件镜像。
image:
  repository: "sq-lineage-analyzer"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- ConfigMap 数据（从 design/deploy/values/governance-values.yaml 提取骨架）----
config:
  common:
    baseImage: sq-governance-base:0.1.0
    jdkVersion: 17
    springBootVersion: 3.2.5
  metadata:
    enabled: true
    image: sq-metadata:0.1.0
    replicas: 2
  standard:
    enabled: true
    image: sq-standard:0.1.0
    replicas: 2
  quality:
    enabled: true
    image: sq-quality:0.1.0
    replicas: 2
  lineage:
    enabled: true
    image: sq-lineage:0.1.0
    replicas: 2

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/governance-values.yaml 覆盖
# 渲染命令： helm template governance design/deploy/charts/governance -f design/deploy/values/governance-values.yaml

# ---- 弹性伸缩（默认关闭，开启后按 CPU 使用率自动扩缩）----
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
