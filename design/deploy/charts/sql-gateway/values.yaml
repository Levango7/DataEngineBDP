# ============================================================================
# sql-gateway Helm Chart 默认 values
# 关联：design/deploy/values/sql-gateway-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源 docker.m.daocloud.io）----
image:
  repository: "docker.m.daocloud.io/sq-sql-gateway"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 2

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8081
  # 容器端口
  containerPort: 8081

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容（HPA）----
# 字段名 hpa 对应 templates/hpa.yaml，条件渲染 values.hpa.enabled
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  # CPU 利用率阈值（百分比），超过则扩容；留空则不生成 CPU 指标
  targetCPUUtilizationPercentage: 80
  # Memory 利用率阈值（百分比），超过则扩容；留空则不生成 Memory 指标
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget（PDB）----
# 字段名 pdb 对应 templates/pdb.yaml，条件渲染 values.pdb.enabled
# 保障滚动更新与节点维护期间最少可用副本数
pdb:
  enabled: false
  # minAvailable 与 maxUnavailable 二选一；此处默认保底 1 副本可用
  minAvailable: 1
  # maxUnavailable: 1  # 如需按比例不可用，可改用 maxUnavailable

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: sql-gateway.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- JWT 鉴权（Secret 注入，勿写入上面的 env/ConfigMap）----
# ---- 临时目录 ----
tmp:
  # 是否把 /tmp 挂成 emptyDir。默认关闭。
  # 需要与 securityContext.readOnlyRootFilesystem: true 同时使用：
  # 嵌入式 Tomcat 启动时要在 /tmp 建部署临时目录，只读根会导致
  # "FileSystemException: /tmp/tomcat.PORT.RANDOM: Read-only file system"
  # -> "Unable to start web server"。
  # 生产同样建议开启（不损失只读根加固，只放开这一个必需的可写点）。
  enabled: false

# ---- 应用日志目录 ----
logs:
  # 是否把容器内日志目录挂成 emptyDir。默认关闭（生产走日志采集/ PVC）。
  # 打开后即使镜像未预建该目录也能写入，用于本地/CI 与应急场景。
  enabled: false
  # 容器内日志目录。需与应用的 Logback <file> 解析结果一致
  # （WORKDIR=/app + 相对路径 logs/xxx.log => /app/logs）。
  mountPath: /app/logs

# ---- JWT 鉴权（Secret 注入，勿写入上面的 env/ConfigMap）----
auth:
  # 指向已存在的 Secret，其 jwtSecretKey 指定的键将作为 JWT_SECRET 注入容器。
  # 该值必须与 JWT 签发端（catalog 签发 / encaps-layer 签发 / Keycloak）一致，
  # 否则接口全部 401。留空表示不注入——此时若运行环境未提供 JWT_SECRET，
  # 容器将因缺少 JwtAuthFilter Bean 启动失败（见 templates/deployment.yaml 注释）。
  # 本地/CI：复用 catalog chart 生成的 dataengine-catalog-auth（见 deploy/local/values-local-core.yaml）。
  jwtSecretName: ""
  jwtSecretKey: jwt-secret

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # sql-gateway 默认配置，完整配置请引用 design/deploy/values/sql-gateway-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/sql-gateway-values.yaml 覆盖
# 渲染命令： helm template sql-gateway design/deploy/charts/sql-gateway -f design/deploy/values/sql-gateway-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
