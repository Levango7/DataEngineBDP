{{- if and (not .Values.auth.jwtSecretName) .Values.auth.jwtSecretValue }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-jwt" (include "karmada-api.fullname" .) }}
  labels:
    {{- include "karmada-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.jwtSecretKey | default "jwt-secret" }}: {{ .Values.auth.jwtSecretValue | quote }}
{{- end }}
