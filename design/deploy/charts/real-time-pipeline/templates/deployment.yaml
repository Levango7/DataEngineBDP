apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "real-time-pipeline.fullname" . }}
  labels:
    {{- include "real-time-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | int }}
  selector:
    matchLabels:
      {{- include "real-time-pipeline.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "real-time-pipeline.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap 变更时滚动重启
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}
      volumes:
        {{- if and .Values.tmp .Values.tmp.enabled }}
        # 只读根 + 可写 /tmp（Tomcat 启动必需，见 values.yaml 注释）
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if and .Values.logs .Values.logs.enabled .Values.logs.mountPath }}
        - name: logs
          emptyDir: {}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "real-time-pipeline.configmapName" . }}
          {{- if .Values.auth.jwtSecretName }}
          env:
            # JWT_SECRET 走 Secret（台账 #12：敏感值不进 ConfigMap/Pod spec 字面量）
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecretName }}
                  key: {{ .Values.auth.jwtSecretKey | default "jwt-secret" }}
          {{- end }}
          volumeMounts:
            {{- if and .Values.tmp .Values.tmp.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if and .Values.logs .Values.logs.enabled .Values.logs.mountPath }}
            - name: logs
              mountPath: {{ .Values.logs.mountPath }}
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path | quote }}
              port: {{ .Values.probes.liveness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | int }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | int }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path | quote }}
              port: {{ .Values.probes.readiness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | int }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | int }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
{{- range .Values.securityContext.capabilities.drop }}
                - {{ . }}
{{- end }}
{{- end }}
