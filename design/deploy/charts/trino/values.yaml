# ============================================================================
# trino Helm Chart 默认 values
# 关联：design/deploy/values/trino-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置 ----
image:
  repository: "trino"
  tag: "438"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- ConfigMap 数据（从 design/deploy/values/trino-values.yaml 提取骨架）----
config:
  catalogs:
    iceberg:
      enabled: true
      connector: iceberg
      warehouse: s3://sq-iceberg/warehouse
    doris:
      enabled: true
      connector: doris
      feHost: doris-fe:9030
    hive:
      enabled: true
      connector: hive
      metastoreUri: thrift://hive-metastore:9083
  resourceGroups:
    enabled: true
    managerType: legacy

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/trino-values.yaml 覆盖
# 渲染命令： helm template trino design/deploy/charts/trino -f design/deploy/values/trino-values.yaml
