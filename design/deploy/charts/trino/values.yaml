# ============================================================================
# trino Helm Chart 默认 values
# 关联：design/deploy/values/trino-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置 ----
image:
  repository: "trino"
  tag: "438"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- ConfigMap 数据（从 design/deploy/values/trino-values.yaml 提取骨架）----
config:
  catalogs:
    iceberg:
      enabled: true
      connector: iceberg
      warehouse: s3://sq-iceberg/warehouse
    doris:
      enabled: true
      connector: doris
      feHost: doris-fe:9030
    hive:
      enabled: true
      connector: hive
      metastoreUri: thrift://hive-metastore:9083
  resourceGroups:
    enabled: true
    managerType: legacy
  # v2.1 向量化执行引擎调优（OLAP 查询性能提升 2x）
  vectorized:
    enabled: true
    # Trino 438+ 向量化执行引擎（experimental）
    enableVectorizedEngine: true
    # 向量化 Join 算子
    enableVectorizedJoin: true
    # 向量化 Aggregate 算子
    enableVectorizedAggregation: true
    # 向量化 Filter 算子
    enableVectorizedFilter: true
    # 向量化 Project 算子
    enableVectorizedProject: true
    # 向量化 OrderBy 算子
    enableVectorizedSort: true
    # 向量化 Window 算子
    enableVectorizedWindow: true
    # 向量化 Exchange
    enableVectorizedExchange: true
    # 列式批处理大小
    batchSize: 4096
    # 并行 Scan 线程数
    scanParallelism: 4
    # 内存查询分配
    queryMaxMemoryPerNode: "4GB"
    # Join Spill（大表 JOIN 防止 OOM）
    joinSpillEnabled: true
    # Aggregation Spill
    aggregationSpillEnabled: true
    # Sort Spill
    sortSpillEnabled: true
    # Spill 目标大小
    spillTargetSize: "1GB"

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/trino-values.yaml 覆盖
# 渲染命令： helm template trino design/deploy/charts/trino -f design/deploy/values/trino-values.yaml

# ---- 弹性伸缩（默认关闭，开启后按 CPU 使用率自动扩缩）----
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
