# ============================================================================
# catalog Helm Chart 默认 values
# 关联：design/deploy/values/catalog-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源 docker.m.daocloud.io）----
image:
  repository: "docker.m.daocloud.io/sq-catalog"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 2

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8082
  # 容器端口
  containerPort: 8082

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "0.5"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8082
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8082
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容（HPA）----
# 字段名 hpa 对应 templates/hpa.yaml，条件渲染 values.hpa.enabled
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  # CPU 利用率阈值（百分比），超过则扩容；留空则不生成 CPU 指标
  targetCPUUtilizationPercentage: 80
  # Memory 利用率阈值（百分比），超过则扩容；留空则不生成 Memory 指标
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget（PDB）----
# 字段名 pdb 对应 templates/pdb.yaml，条件渲染 values.pdb.enabled
# 保障滚动更新与节点维护期间最少可用副本数
pdb:
  enabled: false
  # minAvailable 与 maxUnavailable 二选一；此处默认保底 1 副本可用
  minAvailable: 1
  # maxUnavailable: 1  # 如需按比例不可用，可改用 maxUnavailable

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: catalog.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # catalog 默认配置，完整配置请引用 design/deploy/values/catalog-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/catalog-values.yaml 覆盖
# 渲染命令： helm template catalog design/deploy/charts/catalog -f design/deploy/values/catalog-values.yaml

# JWT 签名密钥（必须显式提供，否则渲染失败 fail-fast）
# 留空时 templates/secret.yaml 的 required 校验将阻断渲染；
# 各环境请在对应 values 中覆盖，生产环境务必通过外部 Secret/CI 注入
auth:
  jwtSigningKey: ""
