# ============================================================================
# doris Helm Chart 默认 values
# 关联：design/deploy/values/doris-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置 ----
image:
  repository: "sq-doris"
  tag: "2.1-0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 9030
  # 容器端口
  containerPort: 9030

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 9030
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 9030
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- ConfigMap 数据（从 design/deploy/values/doris-values.yaml 提取骨架）----
config:
  fe:
    replicas: 3
    queryPort: 9030
    httpPort: 8030
    editLogPort: 9010
  be:
    replicas: 3
    webserverPort: 8040
    brpcPort: 8060
  compaction:
    maxConcurrency: 4
    rateLimit:
      enabled: true
      maxBytesPerSecond: 200MB

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/doris-values.yaml 覆盖
# 渲染命令： helm template doris design/deploy/charts/doris -f design/deploy/values/doris-values.yaml
