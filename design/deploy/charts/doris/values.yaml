# ============================================================================
# doris Helm Chart 默认 values
# 关联：design/deploy/values/doris-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（官方镜像；sq-* 为自研包，构建未发布前用官方兜底） ----
image:
  repository: "apache/doris"
  tag: "2.1.7"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 9030
  # 容器端口
  containerPort: 9030

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/bootstrap
      port: 9030
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/health
      port: 9030
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- ConfigMap 数据（从 design/deploy/values/doris-values.yaml 提取骨架）----
config:
  fe:
    replicas: 3
    queryPort: 9030
    httpPort: 8030
    editLogPort: 9010
  be:
    replicas: 3
    webserverPort: 8040
    brpcPort: 8060
  compaction:
    maxConcurrency: 4
    rateLimit:
      enabled: true
      maxBytesPerSecond: 200MB
  # v2.1 向量化执行引擎调优（OLAP 查询性能提升 2x）
  vectorized:
    enabled: true
    # BE 向量化执行开关（Doris 2.1+ 默认开启）
    enableVectorizedEngine: true
    # 向量化算子集合
    enableVectorizedOperators:
      - scan
      - filter
      - project
      - aggregate
      - hashJoin
      - sort
      - exchange
    # 向量化批处理大小（行数，影响 SIMD 效率）
    batchSize: 4096
    # 向量化表达式求值
    enableVectorizedExpr: true
    # 列式内存布局优化
    enableColumnarOpt: true
    # SIMD 指令集加速
    enableSimd: true
    # 向量化 Scan 谓下推
    enableVectorizedPushdown: true
    # 并行 Scan 线程数（每个 fragment）
    scanParallelism: 4
    # Pipeline 执行引擎（Doris 2.1+）
    enablePipelineEngine: true
    # Pipeline 并行度
    pipelineParallelism: 8
    # 内存 Limit（BE 单查询）
    queryMemoryLimitGB: 8

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/doris-values.yaml 覆盖
# 渲染命令： helm template doris design/deploy/charts/doris -f design/deploy/values/doris-values.yaml

# ---- 弹性伸缩（默认关闭，开启后按 CPU 使用率自动扩缩）----
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
