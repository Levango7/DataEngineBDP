# ============================================================================
# open-api-catalog Helm Chart 默认 values
# 关联：design/deploy/values/open-api-catalog-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源）----
image:
  repository: "harbor.shuqing.io/shuqing/open-api-catalog"
  tag: "2.0.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: open-api-catalog.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- 可写目录挂载（readOnlyRootFilesystem: true 时必需）----
# /data：SQLite 数据库落点。settings.dbPath 默认 "data/openapi_catalog.db"
# （相对路径 → 解析到镜像工作目录），只读根下建库必失败：
#   sqlite3.OperationalError: unable to open database file（CI kind-smoke 实证）。
# 开启后请同时把 OPENAPI_CATALOG_DB_PATH 指向 /data 下（见 deploy/local/values-local-core.yaml）。
data:
  enabled: false
  storageClassName: ""
# /tmp：临时文件逃生口（与 Java 组件对齐；uvicorn/Python 常规启动不强依赖）
tmp:
  enabled: false

# ---- ConfigMap 数据（骨架，按需扩展）----
# ---- 鉴权（AUTH_MODE fail-fast 配套）----
# jwt_auth.py 在 K8s 环境未显式 AUTH_MODE 时拒绝启动；此处生产默认强制 jwt。
# 本地/测试（非 K8s）或需匿名放行时，显式设置 auth.authMode: none。
# JWT_SECRET 从 existingSecretName 的 jwtSecretKey 键读取，须与签发端一致。
auth:
  authMode: jwt
  existingSecretName: shuqing-jwt-secret
  jwtSecretKey: jwt-secret

config:
  application.conf: |
    # open-api-catalog 默认配置，完整配置请引用 design/deploy/values/open-api-catalog-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/open-api-catalog-values.yaml 覆盖
# 渲染命令： helm template open-api-catalog design/deploy/charts/open-api-catalog -f design/deploy/values/open-api-catalog-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
