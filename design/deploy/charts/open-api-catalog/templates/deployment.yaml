apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-api-catalog.fullname" . }}
  labels:
    {{- include "open-api-catalog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | int }}
  selector:
    matchLabels:
      {{- include "open-api-catalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-api-catalog.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap 变更时滚动重启
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "open-api-catalog.configmapName" . }}
          env:
            - name: AUTH_MODE
              value: {{ .Values.auth.authMode | default "jwt" | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecretName | quote }}
                  key: {{ .Values.auth.jwtSecretKey | quote }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path | quote }}
              port: {{ .Values.probes.liveness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | int }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds | default 5 | int }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | int }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path | quote }}
              port: {{ .Values.probes.readiness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | int }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds | default 5 | int }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | int }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.data.enabled .Values.tmp.enabled }}
          volumeMounts:
            {{- if .Values.tmp.enabled }}
            # 只读根下 /tmp 仍需可写（临时文件逃生口；与 Java 组件同款）
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.data.enabled }}
            # SQLite 数据库目录（OPENAPI_CATALOG_DB_PATH 应指向 /data 下）
            - name: data
              mountPath: /data
            {{- end }}
          {{- end }}
{{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
{{- range .Values.securityContext.capabilities.drop }}
                - {{ . }}
{{- end }}
{{- end }}
      {{- if or .Values.data.enabled .Values.tmp.enabled }}
      volumes:
        {{- if .Values.tmp.enabled }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if .Values.data.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- end }}
