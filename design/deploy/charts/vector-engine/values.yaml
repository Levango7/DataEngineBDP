# ============================================================================
# vector-engine Helm Chart 默认 values
# 关联：design/deploy/values/vector-engine-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源 docker.m.daocloud.io）----
image:
  repository: "docker.m.daocloud.io/sq-vector-engine"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 2

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8086
  # 容器端口
  containerPort: 8086

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8086
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8086
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: vector-engine.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # vector-engine 默认配置，完整配置请引用 design/deploy/values/vector-engine-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/vector-engine-values.yaml 覆盖
# 渲染命令： helm template vector-engine design/deploy/charts/vector-engine -f design/deploy/values/vector-engine-values.yaml
