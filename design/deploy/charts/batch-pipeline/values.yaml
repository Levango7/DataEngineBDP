# ============================================================================
# batch-pipeline Helm Chart 默认 values
# 台账 #2：批处理管道 worker（Spark 作业编排执行，进程型、配置驱动、无 HTTP 服务面）。
# 与服务型 chart 的差异：无 Service/探针走 exec/无 /metrics。
# ============================================================================

image:
  repository: "docker.m.daocloud.io/sq-batch-pipeline"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# worker 通常单副本（作业编排有状态）；扩副本前先确认作业互斥
replicaCount: 1

resources:
  requests:
    cpu: "0.5"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

securityContext:
  enabled: true
  runAsNonRoot: true
  # 镜像 Dockerfile：USER batch-pipeline（uid 由 useradd 分配、非固定）⇒ 不设 runAsUser，
  # 交给镜像 USER；fsGroup 供 emptyDir 挂载分组可写
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# 进程型 worker：无 HTTP 端点 ⇒ exec 探针（与镜像 HEALTHCHECK 同义：配置可解析 = 进程活着）
probes:
  liveness:
    enabled: true
    exec:
      command: ["python", "-c", "import json, batch_pipeline.pipeline; json.load(open('config/pipeline.json', encoding='utf-8-sig'))"]
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3

# 可写点（只读根配套）：/tmp（Python 运行时）+ /app/data（工作目录/本地缓存）
tmp:
  enabled: true
data:
  enabled: true
  mountPath: /app/data

nodeSelector: {}
tolerations: []
affinity: {}

# worker 无 HTTP 服务面 ⇒ 不做 HPA（扩容=加副本需作业互斥，见 README）
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Secret 注入（三路，留空则不注入；README 列必填场景）----
auth:
  # JWT_SECRET：须与签发端（encaps-layer / Keycloak）一致
  jwtSecretName: ""
  jwtSecretKey: jwt-secret
storage:
  # S3/Iceberg 对象存储凭据（数据落对象存储时需要）
  existingSecret: ""
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key
minio:
  # MinIO 管理口令（自建 MinIO 测试拓扑用；生产由平台对象存储承接）
  existingSecret: ""
  rootPasswordKey: root-password

# ---- 环境变量（非敏感，进 ConfigMap）----
env:
  LOG_LEVEL: info
  JAVA_TOOL_OPTIONS: ""
  # 状态 API（stdlib 实现，非必需；留空则不启用）
  API_HOST: ""
  API_PORT: ""
  AUTH_MODE: "jwt"
  JWT_ISSUER: "shuqing-bigdata"
  JWT_EXPECTED_ISSUER: "shuqing-bigdata"

# ---- 管道配置：渲染为 config/pipeline.json（作业/数据源/输出定义）----
# 生产请按实际作业覆盖（下面是占位骨架）
config:
  pipeline.json: |
    {
      "jobs": []
    }

networkPolicy:
  enabled: false
