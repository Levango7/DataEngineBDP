apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tempo.fullname" . }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | int }}
  selector:
    matchLabels:
      {{- include "tempo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tempo.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap 变更时滚动重启
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.otlp.enabled }}
          # Tempo 无默认配置文件可用：必须显式指定 -config.file，否则只用内置默认值，
          # 不会开启 distributor.receivers.otlp ⇒ 采集面推来的链路无处落地（台账 #130）。
          args:
            - "-config.file=/conf/tempo.yaml"
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort | int }}
              protocol: TCP
            {{- if .Values.otlp.enabled }}
            - name: otlp-grpc
              containerPort: {{ .Values.otlp.grpcPort | int }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.otlp.httpPort | int }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "tempo.configmapName" . }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path | quote }}
              port: {{ .Values.probes.liveness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | int }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | int }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path | quote }}
              port: {{ .Values.probes.readiness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | int }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | int }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.otlp.enabled }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: data
              mountPath: /var/tempo
          {{- end }}
{{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
{{- range .Values.securityContext.capabilities.drop }}
                - {{ . }}
{{- end }}
{{- end }}
      {{- if .Values.otlp.enabled }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tempo.configmapName" . }}
        - name: data
          emptyDir: {}
      {{- end }}
