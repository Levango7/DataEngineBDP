apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tempo.configmapName" . }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | toString | quote }}
  {{- end }}
  {{- range $key, $val := .Values.config }}
  {{ $key }}: |
    {{- $val | nindent 4 }}
  {{- end }}
  {{- if .Values.otlp.enabled }}
  # Tempo 运行时配置：OTLP 接收端在此开启（台账 #130）
  tempo.yaml: |
    {{- .Values.tempoConfig | nindent 4 }}
  {{- end }}
