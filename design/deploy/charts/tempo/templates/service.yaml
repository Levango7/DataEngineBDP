apiVersion: v1
kind: Service
metadata:
  name: {{ include "tempo.serviceName" . }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port | int }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.otlp.enabled }}
    - port: {{ .Values.otlp.grpcPort | int }}
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
    - port: {{ .Values.otlp.httpPort | int }}
      targetPort: otlp-http
      protocol: TCP
      name: otlp-http
    {{- end }}
  selector:
    {{- include "tempo.selectorLabels" . | nindent 4 }}
