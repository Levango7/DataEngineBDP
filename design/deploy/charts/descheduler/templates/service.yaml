apiVersion: v1
kind: Service
metadata:
  name: {{ include "descheduler.serviceName" . }}
  labels:
    {{- include "descheduler.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port | int }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "descheduler.selectorLabels" . | nindent 4 }}
