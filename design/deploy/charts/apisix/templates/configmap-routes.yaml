            "nodes": {
              "failover-api:8094": 1
            }
          }
        },
        {
          "uri": "/api/v1/suggestions/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "dashboard:8085": 1
            }
          }
        },
        {
          "uri": "/api/v1/vector/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "vector-engine:8086": 1
            }
          }
        }
      ]
    }
