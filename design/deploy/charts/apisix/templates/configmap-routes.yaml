data:
  # 由 scripts/gen-apisix-routes.py 从代码路由前缀生成，勿手工编辑；
  # 新增服务后运行：python scripts/gen-apisix-routes.py
  # 上游名按 chart 名（约定：单独 helm install <chart> 或以 fullnameOverride 固定）；
  # 若整套以同一 release 名部署，需相应调整上游名。
  routes.json: |
