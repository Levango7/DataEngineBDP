          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "real-time-pipeline:18090": 1
            }
          }
        },
        {
          "uri": "/api/v1/lineage/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "lineage-analyzer:8086": 1
            }
          }
        },
        {
          "uri": "/api/v1/metadata/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "metadata-collector:8084": 1
            }
          }
        },
        {
          "uri": "/api/v1/override-policies/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "failover-api:8094": 1
            }
          }
        },
        {
          "uri": "/api/v1/pricing/**",
          "upstream": {
