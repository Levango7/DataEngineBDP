apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-routes
  labels:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/part-of: shuqing-bigdata
data:
  # 由 scripts/gen-apisix-routes.py 从代码路由前缀生成，勿手工编辑；
  # 新增服务后运行：python scripts/gen-apisix-routes.py
  # 上游名按 chart 名（约定：单独 helm install <chart> 或以 fullnameOverride 固定）；
  # 若整套以同一 release 名部署，需相应调整上游名。
  routes.json: |
    {
      "routes": [
        {
          "uri": "/api/v1/ai-assistant/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "ai-assistant:18110": 1
            }
          }
        },
        {
          "uri": "/api/v1/allocation/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "dashboard:8085": 1
            }
          }
        },
        {
          "uri": "/api/v1/bill/export/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "dashboard:8085": 1
            }
          }
        },
        {
          "uri": "/api/v1/clusters/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "karmada-api:8090": 1
            }
          }
        },
        {
          "uri": "/api/v1/clusters/health/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "failover-api:8094": 1
            }
          }
        },
        {
          "uri": "/api/v1/cost/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "cost-model:8084": 1
            }
          }
        },
        {
          "uri": "/api/v1/dashboard/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "dashboard:8085": 1
            }
          }
        },
        {
          "uri": "/api/v1/dashboard/billing/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "dashboard:8085": 1
            }
          }
        },
        {
          "uri": "/api/v1/dashboards/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "dashboard:8085": 1
            }
          }
        },
        {
          "uri": "/api/v1/failover-events/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "failover-api:8094": 1
            }
          }
        },
        {
          "uri": "/api/v1/failover-policies/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "failover-api:8094": 1
            }
          }
        },
        {
          "uri": "/api/v1/federated/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "federated-query:8094": 1
            }
          }
        },
        {
          "uri": "/api/v1/federated/governance/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "federated-query:8094": 1
            }
          }
        },
        {
          "uri": "/api/v1/federated/scheduling/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "federated-query:8094": 1
            }
          }
        },
        {
          "uri": "/api/v1/federated/transactions/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "federated-query:8094": 1
            }
          }
        },
        {
          "uri": "/api/v1/finops/billing/**",
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "cost-model:8084": 1
            }
          }
