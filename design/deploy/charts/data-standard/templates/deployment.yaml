apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-standard.fullname" . }}
  labels:
    {{- include "data-standard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | int }}
  selector:
    matchLabels:
      {{- include "data-standard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-standard.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap 变更时滚动重启
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}
      # k8s 会为同命名空间的 Service 向 Pod 注入 <服务名>_PORT=tcp://IP:PORT 形式的链接变量；
      # 本服务 application.yml:2 的端口配置项 server.port=${DATA_STANDARD_PORT:8087} 恰好同名
      # ⇒ 独立安装（release 名=chart 名）时 Service 名与 chart 名相同，注入的
      # DATA_STANDARD_PORT=tcp://10.x.x.x:8087 会被当作端口值解析，监听/启动异常
      # （同型根因已在 burn-in 集群 nl2sql / asset-exchange 实测）。
      # 关闭服务链接注入（组件间寻址走 Service DNS / 显式 URL，不依赖这些变量）。
      enableServiceLinks: false
      {{- if or ( and .Values.logs ( .Values.logs.enabled ) ( .Values.logs.mountPath ) ) ( and .Values.tmp ( .Values.tmp.enabled ) ) ( and .Values.data ( .Values.data.enabled ) ) }}
      volumes:
        {{- if and .Values.logs ( .Values.logs.enabled ) ( .Values.logs.mountPath ) }}
        - name: logs
          emptyDir: {}
        {{- end }}
        {{- if and .Values.tmp ( .Values.tmp.enabled ) }}
        # 嵌入式 Tomcat 启动时要在 /tmp 建部署临时目录（tomcat.PORT.RANDOM）。
        # readOnlyRootFilesystem: true 时 /tmp 只读，Tomcat 直接启动失败：
        #   FileSystemException: /tmp/tomcat.8087: Read-only file system
        #   -> ApplicationContextException: Unable to start web server
        # 用 emptyDir 挂出 /tmp，在保留只读根加固的前提下满足这一必需的可写点。
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if and .Values.data ( .Values.data.enabled ) }}
        # 应用数据目录（H2 文件库：/app/data/data-standard-db.mv.db 等）。
        # readOnlyRootFilesystem: true 时镜像内 /app/data 只读，H2 建库直接失败：
        #   FileSystemException: /app/data/data-standard-db.trace.db: Read-only file system
        # 注意 K8s 的 fsGroup 只对新挂载的卷生效，对镜像内既有目录无效，
        # 因此不能靠 fsGroup 绕过，必须把该目录挂出来。
        # 生产若需持久化，把 storageClassName 指向 PVC 即可复用同一挂载点。
        {{- if .Values.data.storageClassName }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "data-standard.fullname" . }}-data
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "data-standard.configmapName" . }}
          {{- if .Values.dbUrl }}
          # 显式覆盖镜像默认 DB_URL（切外部 PostgreSQL 生产库时用）
          - name: DB_URL
            value: {{ .Values.dbUrl | quote }}
          {{- end }}
          # JWT_SECRET 经 Secret 注入，不写入 ConfigMap（见 values.yaml auth 段注释）。
          # 为何**无条件**注入：本服务自带 SecurityConfig 直接依赖 JwtAuthFilter bean，
          # 缺 JWT_SECRET ⇒ UnsatisfiedDependencyException ⇒ 启动即失败（不同于 rule-engine
          # 可裸启）。Secret 缺失时 Pod 停在 CreateContainerConfigError，失败暴露在部署期。
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecretName | quote }}
                  key: {{ .Values.auth.jwtSecretKey | quote }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path | quote }}
              port: {{ .Values.probes.liveness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | int }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds | default 5 | int }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | int }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path | quote }}
              port: {{ .Values.probes.readiness.httpGet.port | int }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | int }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds | default 5 | int }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | int }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or ( and .Values.logs ( .Values.logs.enabled ) ( .Values.logs.mountPath ) ) ( and .Values.tmp ( .Values.tmp.enabled ) ) ( and .Values.data ( .Values.data.enabled ) ) }}
          volumeMounts:
            {{- if and .Values.logs ( .Values.logs.enabled ) ( .Values.logs.mountPath ) }}
            # 应用日志目录挂载。默认为空（不挂），生产请用宿主机/云盘日志采集或挂 PVC。
            - name: logs
              mountPath: {{ .Values.logs.mountPath }}
            {{- end }}
            {{- if and .Values.tmp ( .Values.tmp.enabled ) }}
            # /tmp 可写点，配合 readOnlyRootFilesystem: true 使用（见 volumes 段注释）。
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if and .Values.data ( .Values.data.enabled ) }}
            # /app/data 可写点（H2 文件库），配合 readOnlyRootFilesystem: true 使用。
            # uid/gid 与镜像 appuser(1001) 对齐才有写权（见 values.yaml securityContext 注释）。
            - name: data
              mountPath: /app/data
            {{- end }}
          {{- end }}
{{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
{{- range .Values.securityContext.capabilities.drop }}
                - {{ . }}
{{- end }}
{{- end }}
