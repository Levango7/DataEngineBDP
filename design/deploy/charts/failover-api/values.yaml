# ============================================================================
# failover-api Helm Chart 默认 values
# 台账 #2/#64：karmada 系改名（karmada-api / failover-api / failover-engine）后的部署单元。
# karmada 系部署单元（台账 #64 方案 A 改名后补齐）。
# ============================================================================

image:
  repository: "ghcr.io/levango7/sq-failover-api"
  tag: "latest"
  pullPolicy: Always

replicaCount: 2

service:
  type: ClusterIP
  port: 8094
  containerPort: 8094

resources:
  requests:
    cpu: "0.2"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

securityContext:
  enabled: true
  runAsNonRoot: true
  # 镜像 Dockerfile 用 useradd --system（uid 非固定）⇒ 不设 runAsUser，交给镜像 USER；
  # fsGroup 供 emptyDir 挂载分组可写（kubelet 会把 fsGroup 加进容器补充组）。
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8094
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8094
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

tmp:
  enabled: true
data:
  # 内嵌 DB 是文件（FAILOVER_API_DB ⇒ /app/data/*.db），只读根下必须可写
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

auth:
  # JWT_SECRET：须与签发端（encaps-layer / Keycloak）一致
  jwtSecretName: ""
  jwtSecretKey: jwt-secret

env:
  FAILOVER_API_PORT: "8094"
  FAILOVER_API_DB: "/app/data/failover-api.db"
  FAILOVER_API_VERSION: ""
  CORS_ALLOWED_ORIGINS: ""
  JWT_ISSUER: "shuqing-bigdata"

config: {}

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
