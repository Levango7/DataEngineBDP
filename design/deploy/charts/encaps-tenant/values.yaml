# ============================================================================
# encaps-tenant Helm Chart 默认 values
# 台账 #2：本 chart 为该服务补齐"部署单元"；其 prod profile 的建表缺口（#63）已于
# 2026-10-11 用 V3__baseline_shared_model.sql（20 表）结清，故 prod 路径可用（见 README）。
# ============================================================================

# ---- 镜像配置（国内镜像源 docker.m.daocloud.io）----
image:
  repository: "docker.m.daocloud.io/sq-encaps-tenant"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 2

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8081
  containerPort: 8081

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "0.5"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  # encaps-layer 家族镜像 Dockerfile 内 appuser 固化为 uid/gid=1001
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
# 路径对齐 Spring Boot actuator；**startup 探针必须开启**：本服务 20 个 JPA 仓库
# + Hibernate 初始化在 CI/kind 实测启动 40–60s，liveness 默认 delay 会在启动完成前
# 探失败并掐死容器（lastState exit=137、日志停在 Hibernate 中段——kind-smoke 实证）。
probes:
  startup:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 8081
    # 10s × 30 = 300s 启动上限；起来后交给 liveness/readiness
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 3
  liveness:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- 可写点（只读根配套；三条均为本仓实测教训）----
tmp:
  # Tomcat 启动要在 /tmp 建部署临时目录（"FileSystemException: /tmp/tomcat.PORT.RANDOM"）
  enabled: true
logs:
  enabled: true
  mountPath: /app/logs
data:
  # H2 文件库需写 /app/data（"FileSystemException: /app/data/…-db.trace.db"）；
  # 走 prod profile + PostgreSQL 时用不到，可关。持久化场景改挂 PVC（同挂载点）。
  enabled: false
  storageClassName: ""

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 / PDB ----
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Secret 注入（三项，留空则不注入；prod 必填清单见 README）----
auth:
  # JWT_SECRET：须与签发端（encaps-layer / Keycloak）一致，否则接口全部 401
  jwtSecretName: ""
  jwtSecretKey: jwt-secret
db:
  # DB_PASSWORD（prod profile 必需；application-prod.yml 里 DB_PASSWORD 无默认值）
  existingSecret: ""
  passwordKey: db-password
crypto:
  # ENCRYPT_KEY：凭据加密（与 encaps-layer 同键，复用其 Secret 也可）
  existingSecret: ""
  encryptKeyKey: encrypt-key

# ---- 环境变量（非敏感，全部进 ConfigMap）----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""
  # 生产：SPRING_PROFILES_ACTIVE=prod + 下列 DB_* / CORS_ORIGINS / FLYWAY_SCHEMA 必填
  # （prod profile 的 ${CORS_ORIGINS} 无默认值，缺失即启动失败——这是刻意设计）
  SPRING_PROFILES_ACTIVE: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config: {}

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /actuator/prometheus
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
