{{- if .Values.coreServices.enabled }}
{{- range $name, $svc := .Values.coreServices.items }}
# ============================================================================
# 核心服务 Apollo 接入配置 - {{ $name }}（v2.1 配置中心）
# 说明：ConfigMap 提供 Apollo 接入参数，应用通过 Spring Cloud Apollo Client 热更新。
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-apollo-config
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: dataenginebdp
    config-center: apollo
  annotations:
    apollo/config-center: "true"
    apollo/app-id: {{ $svc.appId | quote }}
    apollo/cluster: {{ $svc.cluster | quote }}
    apollo/namespaces: {{ join "," $svc.namespaces | quote }}
    apollo/hot-reload: "true"
    apollo/rollback: "true"
data:
  # Apollo 接入配置
  apollo.meta: "http://apollo-configservice.apollo.svc.cluster.local:8080"
  apollo.appId: {{ $svc.appId | quote }}
  apollo.cluster: {{ $svc.cluster | quote }}
  apollo.namespaces: {{ join "," $svc.namespaces | quote }}
  # 热更新配置
  apollo.bootstrap.enabled: "true"
  apollo.bootstrap.eagerLoad.enabled: "true"
  apollo.cacheDir: "/opt/data/apollo-cache"
  apollo.autoUpdateInjectedSpringProperties: "true"
  # 回滚配置
  apollo.rollback.maxHistoryVersions: "50"
  apollo.rollback.autoOnFailure: "true"
---
{{- end }}
{{- end }}
