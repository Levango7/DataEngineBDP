# ============================================================================
# Apollo ConfigService（v2.1 配置中心）
# 说明：配置服务，提供配置读取与热更新通知。
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apollo.name" . }}-configservice
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "apollo.name" . }}-configservice
    app.kubernetes.io/part-of: apollo
spec:
  replicas: {{ .Values.configService.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "apollo.name" . }}-configservice
  template:
    metadata:
      labels:
        app: {{ include "apollo.name" . }}-configservice
    spec:
      containers:
        - name: configservice
          image: "{{ .Values.image.configService.repository }}:{{ .Values.image.configService.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "github"
            - name: APOLLO_CONFIG_SERVICE_NAME
              value: "{{ include "apollo.name" . }}-configservice"
            {{- if .Values.db.internal.enabled }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://{{ include "apollo.name" . }}-mysql.{{ .Values.namespace.name }}.svc.cluster.local:3306/ApolloConfigDB?characterEncoding=utf8"
            - name: SPRING_DATASOURCE_USERNAME
              value: "apollo"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "apollo"
            {{- else }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://{{ .Values.db.external.host }}:{{ .Values.db.external.port }}/{{ .Values.db.external.database }}?characterEncoding=utf8"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.db.external.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.db.external.password | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.configService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apollo.name" . }}-configservice
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "apollo.name" . }}-configservice
    app.kubernetes.io/part-of: apollo
spec:
  type: {{ .Values.configService.service.type }}
  ports:
    - port: {{ .Values.configService.service.port }}
      targetPort: 8080
      name: http
  selector:
    app: {{ include "apollo.name" . }}-configservice
