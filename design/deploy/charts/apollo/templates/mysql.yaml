{{- if .Values.db.internal.enabled }}
# ============================================================================
# Apollo 内置 MySQL（v2.1 配置中心，仅开发环境）
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apollo.name" . }}-mysql
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "apollo.name" . }}-mysql
    app.kubernetes.io/part-of: apollo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "apollo.name" . }}-mysql
  template:
    metadata:
      labels:
        app: {{ include "apollo.name" . }}-mysql
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.db.internal.image.repository }}:{{ .Values.db.internal.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "ApolloConfigDB"
            - name: MYSQL_USER
              value: "apollo"
            - name: MYSQL_PASSWORD
              value: "apollo"
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            {{- toYaml .Values.db.internal.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          {{- if .Values.db.internal.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "apollo.name" . }}-mysql
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apollo.name" . }}-mysql
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "apollo.name" . }}-mysql
    app.kubernetes.io/part-of: apollo
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: {{ include "apollo.name" . }}-mysql
{{- if .Values.db.internal.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "apollo.name" . }}-mysql
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: apollo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.db.internal.persistence.size }}
  {{- if .Values.db.internal.persistence.storageClass }}
  storageClassName: {{ .Values.db.internal.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
