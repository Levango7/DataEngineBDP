# ============================================================================
# Apollo AdminService（v2.1 配置中心）
# 说明：管理服务，提供配置管理 REST API。
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apollo.name" . }}-adminservice
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "apollo.name" . }}-adminservice
    app.kubernetes.io/part-of: apollo
spec:
  replicas: {{ .Values.adminService.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "apollo.name" . }}-adminservice
  template:
    metadata:
      labels:
        app: {{ include "apollo.name" . }}-adminservice
    spec:
      containers:
        - name: adminservice
          image: "{{ .Values.image.adminService.repository }}:{{ .Values.image.adminService.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "github"
            {{- if .Values.db.internal.enabled }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://{{ include "apollo.name" . }}-mysql.{{ .Values.namespace.name }}.svc.cluster.local:3306/ApolloConfigDB?characterEncoding=utf8"
            - name: SPRING_DATASOURCE_USERNAME
              value: "apollo"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "apollo"
            {{- else }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://{{ .Values.db.external.host }}:{{ .Values.db.external.port }}/{{ .Values.db.external.database }}?characterEncoding=utf8"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.db.external.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.db.external.password | quote }}
            {{- end }}
          ports:
            - containerPort: 8090
              name: http
          resources:
            {{- toYaml .Values.adminService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apollo.name" . }}-adminservice
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "apollo.name" . }}-adminservice
    app.kubernetes.io/part-of: apollo
spec:
  type: {{ .Values.adminService.service.type }}
  ports:
    - port: {{ .Values.adminService.service.port }}
      targetPort: 8090
      name: http
  selector:
    app: {{ include "apollo.name" . }}-adminservice
