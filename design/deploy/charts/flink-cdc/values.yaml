# ============================================================================
# flink-cdc Helm Chart 默认 values
# 关联：design/deploy/values/flink-cdc-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源）----
image:
  repository: "harbor.shuqing.io/shuqing/flink-cdc"
  tag: "2.0.0"
  pullPolicy: IfNotPresent

# ---- 运行形态（Phase C1：物化视图管理面宿主）----
# 默认（command/args 均为空）：走镜像 ENTRYPOINT/CMD —— flink CLI 提交 CDC 作业（提交器形态）。
# 管理面模式示例（同一 jar 换主类，只承载 /api/materialized-views 与探针，不起 CDC 作业）：
#   command: ["java"]
#   args:
#     - "-cp"
#     - "/opt/flink-cdc/flink-cdc.jar"
#     - "com.levango7.dataenginebdp.flinkcdc.materializedview.MaterializedViewManagementApplication"
# 管理面鉴权：app.security.jwt.secret/issuer（健康端点 /api/v1/health 为平台白名单口径已放行，
# 其余 /api/** 要求 JWT；生产密钥建议经 Secret 注入 —— 见 platform/flink-cdc/src/main/resources/application.yml）。
# 台账 #119① 的 C1 选项以本模式承载；APISIX 既有路由 flink-cdc:8080 随之可达。
# 注：探针默认路径已由 /healthz//readyz 改为 /api/v1/health（JwtAuthFilter 白名单口径；
# 提交器形态本就无 HTTP 面，探针此前不可满足，本次随管理面口径统一）。
command: []
args: []

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: flink-cdc.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # flink-cdc 默认配置，完整配置请引用 design/deploy/values/flink-cdc-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/flink-cdc-values.yaml 覆盖
# 渲染命令： helm template flink-cdc design/deploy/charts/flink-cdc -f design/deploy/values/flink-cdc-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
