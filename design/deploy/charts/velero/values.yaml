# ============================================================================
# velero Helm Chart 默认 values
# 关联：design/deploy/values/velero-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源）----
image:
  repository: "velero/velero"
  tag: "v1.15.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8085
  # 容器端口
  containerPort: 8085

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /metrics
      port: 8085
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /metrics
      port: 8085
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: velero.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # velero 默认配置，完整配置请引用 design/deploy/values/velero-values.yaml

# ============================================================================
# 灾备配置（disasterRecovery）- 跨集群备份与恢复
# 关联：scripts/disaster-recovery/ 目录下的灾备脚本
# ============================================================================
disasterRecovery:
  # 灾备总开关
  enabled: false

  # RTO（Recovery Time Objective，恢复时间目标，分钟）
  # 定义：故障发生后系统恢复运行所需最大时间
  # 业务影响：RTO 越小，业务中断时间越短，但成本越高
  # 推荐值：核心业务 30，重要业务 60，一般业务 120
  rto: 30

  # RPO（Recovery Point Objective，恢复点目标，分钟）
  # 定义：故障发生时允许丢失的最大数据量（时间维度）
  # 业务影响：RPO 越小，数据丢失越少，但备份频率越高、存储成本越大
  # 推荐值：核心业务 15，重要业务 60，一般业务 360
  rpo: 60

  # 备份调度策略（Cron 表达式）
  backupSchedule:
    # 每日全量备份（默认凌晨 02:00）
    daily: "0 2 * * *"
    # 每小时增量备份（默认每整点）
    hourly: "0 * * * *"
    # 每周归档备份（默认周日凌晨 03:00）
    weekly: "0 3 * * 0"

  # 备份保留天数（全量备份）
  retentionDays: 30

  # 增量备份保留小时数
  incrementalRetentionHours: 24

  # 归档备份保留天数（异地容灾）
  archiveRetentionDays: 90

  # 业务 namespace 列表（增量备份仅覆盖这些 namespace）
  businessNamespaces:
    - default
    - production
    - staging

  # 标签选择器（可选，用于精细化备份范围）
  # labelSelector:
  #   matchLabels:
  #     backup: "true"

  # 卷快照位置名称
  # volumeSnapshotLocation: velero-vsl

  # ---- 备份存储位置（S3/MinIO）----
  backupStorage:
    # S3 bucket 名称
    bucket: "velero-backups"
    # bucket 前缀（多集群共享 bucket 时区分）
    prefix: ""
    # S3 region
    region: "us-east-1"
    # S3 endpoint（MinIO 时填写 MinIO 地址）
    endpoint: "https://s3.amazonaws.com"
    # 是否使用 path style（MinIO 需要 true）
    forcePathStyle: true
    # KMS 加密 key ID（可选）
    # kmsKeyId: "arn:aws:kms:us-east-1:123456789012:key/xxx"
    # CA 证书（可选，自签名证书时填写）
    # caCert: ""

  # ---- 跨 region 复制（异地容灾）----
  crossRegionReplication:
    enabled: false
    # 目标 region
    targetRegion: "us-west-2"
    # 目标 bucket
    targetBucket: "velero-backups-archive"
    # 目标 bucket 前缀
    prefix: "archive"
    # 目标 S3 endpoint
    endpoint: "https://s3.amazonaws.com"
    # 是否使用 path style
    forcePathStyle: true
    # KMS 加密 key ID（可选）
    # kmsKeyId: "arn:aws:kms:us-west-2:123456789012:key/yyy"

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/velero-values.yaml 覆盖
# 渲染命令： helm template velero design/deploy/charts/velero -f design/deploy/values/velero-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
