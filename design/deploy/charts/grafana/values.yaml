# ============================================================================
# grafana Helm Chart 默认 values
# 关联：本文件即唯一默认来源（2026-11-13 订正：此前注释引用的 design/deploy/values/grafana-values.yaml
# 在仓库中并不存在，属悬空引用，勿再引用；环境覆盖直接 -f 你的环境 values 文件）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源 docker.m.daocloud.io）----
image:
  repository: "docker.m.daocloud.io/grafana/grafana"
  tag: "11.2.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 3000
  # 容器端口
  containerPort: 3000

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "0.5"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: grafana.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # 占位键：当前 deployment 以 envFrom 消费本 ConfigMap（文件型配置走下方的卷挂载）

# ---- Dashboards as Code（2026-11-13 新增；大盘 JSON 在 chart 的 dashboards/ 目录）----
dashboards:
  enabled: true
  # 容器内大盘 JSON 挂载目录（provisioning provider 的 path）
  path: /var/lib/grafana/dashboards
datasource:
  enabled: true
  name: Prometheus
  uid: prometheus
  # 集群内 Prometheus 服务地址（按实际 release/namespace 覆盖）
  url: "http://prometheus:9090"
  isDefault: true

# ---- 引用提示 ----
# 环境覆盖请用 -f <你的环境 values 文件>（仓库内无 grafana-values.yaml，见 README §10）
# 渲染命令： helm template grafana design/deploy/charts/grafana

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
