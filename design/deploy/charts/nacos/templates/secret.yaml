{{- /*
MySQL 口令 Secret（台账 #12）：仅当未指定 mysql.existingSecret 且给了 mysql.password 时渲染。
生产推荐用 existingSecret（由密钥管理系统创建），本模板服务于本地/演示与向后兼容：
历史 values 里直接给 mysql.password 的用法仍可用，只是值不再进 Pod spec 而是进 Secret。
*/ -}}
{{- if and (not .Values.mysql.existingSecret) .Values.mysql.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-mysql" (include "nacos.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mysql.passwordKey | default "password" | quote }}: {{ .Values.mysql.password | quote }}
{{- end }}
