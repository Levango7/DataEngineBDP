apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "operations-api.configmapName" . }}
  labels:
    {{- include "operations-api.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.env }}
  {{$key}}: {{ $val | toString | quote }}
  {{- end }}
  {{- range $key, $val := .Values.config }}
  {{$key}}: |
    {{- $val | nindent 4 }}
  {{- end }}
