# ============================================================================
# stream-batch-scheduler Helm Chart 默认 values
# 说明：本文件为 Chart 骨架级默认值（环境深度覆盖走 helm -f 传入自备 values 文件）。
# 2026-11-08 订正：原注释引用的 design/deploy/values/stream-batch-scheduler-values.yaml
# 在本仓并不存在（悬空引用），删除该引用以免误导部署者。
# ============================================================================

# ---- 镜像配置（国内镜像源）----
image:
  repository: "ghcr.io/levango7/sq-stream-batch-scheduler"
  tag: "latest"
  pullPolicy: Always

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  # 2026-11-08 修配：应用实听 ${STREAM_BATCH_SCHEDULER_PORT:18086}（application.yml:2），
  # 原 8080 使 Service 与 kubelet 探针全部打空 ⇒ chart 部署必失败。
  port: 18086
  # 容器端口
  containerPort: 18086

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
# 2026-11-08 修配：健康端点对齐 Spring Boot actuator（pom.xml 内 spring-boot-starter-actuator，
# application.yml management.endpoints 暴露 health,info,prometheus,metrics）——原 /api/v1/health
# 无对应路由，探针必失败。startup 探针开启：本服务 JPA/Hibernate 冷启动可达数十秒
# （范式同 encaps-data chart：10s × 30 = 300s 启动上限，起来后交给 liveness/readiness）。
probes:
  startup:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 18086
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 3
  liveness:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 18086
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /actuator/health
      port: 18086
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: stream-batch-scheduler.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # stream-batch-scheduler 默认配置，完整配置请引用 design/deploy/values/stream-batch-scheduler-values.yaml

# ---- 引用提示 ----
# 2026-11-08 订正：原引用的 design/deploy/values/stream-batch-scheduler-values.yaml 在本仓不存在（悬空引用），
# 已删。环境覆盖请使用自备 values 文件，渲染命令：
#   helm template stream-batch-scheduler design/deploy/charts/stream-batch-scheduler -f <your-values>.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  # 2026-11-08 修配：Micrometer 指标暴露在 actuator 的 /actuator/prometheus（application.yml management 段）
  path: /actuator/prometheus
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
