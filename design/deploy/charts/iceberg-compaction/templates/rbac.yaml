apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iceberg-compaction.fullname" . }}
  labels:
    {{- include "iceberg-compaction.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "iceberg-compaction.fullname" . }}
  labels:
    {{- include "iceberg-compaction.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "iceberg-compaction.fullname" . }}
  labels:
    {{- include "iceberg-compaction.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "iceberg-compaction.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "iceberg-compaction.fullname" . }}
    namespace: {{ .Release.Namespace }}