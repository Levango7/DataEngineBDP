# ============================================================================
# iotdb Helm Chart 默认 values
# 关联：design/deploy/values/iotdb-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置 ----
image:
  repository: "sq-iotdb"
  tag: "2.0-0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 6667
  # 容器端口
  containerPort: 6667

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 6667
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 6667
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- ConfigMap 数据（从 design/deploy/values/iotdb-values.yaml 提取骨架）----
config:
  configNode:
    replicas: 3
    rpcPort: 10710
    mppPort: 10730
  dataNode:
    replicas: 3
    rpcPort: 6667
    metricsPort: 9091
  write:
    batch:
      enabled: true
      batchSize: 10000
    flush:
      strategy: auto
      flushInterval: 60s

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/iotdb-values.yaml 覆盖
# 渲染命令： helm template iotdb design/deploy/charts/iotdb -f design/deploy/values/iotdb-values.yaml
