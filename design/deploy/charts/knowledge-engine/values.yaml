# ============================================================================
# knowledge-engine Helm Chart 默认 values
# 关联：design/deploy/values/knowledge-engine-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源 docker.m.daocloud.io）----
image:
  repository: "docker.m.daocloud.io/sq-knowledge-engine"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 2

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: knowledge-engine.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  # 图存储/抽取器默认真实实现（与代码默认一致）；本地降级须显式改 mock
  KE_STORE_TYPE: nebula
  KE_EXTRACTOR_TYPE: llm

# ---- ConfigMap 数据（骨架，按需扩展）----
# ---- 鉴权（AUTH_MODE fail-fast 配套）----
# jwt_auth.py 在 K8s 环境未显式 AUTH_MODE 时拒绝启动；此处生产默认强制 jwt。
# 本地/测试（非 K8s）或需匿名放行时，显式设置 auth.authMode: none。
# JWT_SECRET 从 existingSecretName 的 jwtSecretKey 键读取，须与签发端一致。
auth:
  authMode: jwt
  existingSecretName: shuqing-jwt-secret
  jwtSecretKey: jwt-secret

config:
  application.conf: |
    # knowledge-engine 默认配置，完整配置请引用 design/deploy/values/knowledge-engine-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/knowledge-engine-values.yaml 覆盖
# 渲染命令： helm template knowledge-engine design/deploy/charts/knowledge-engine -f design/deploy/values/knowledge-engine-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
