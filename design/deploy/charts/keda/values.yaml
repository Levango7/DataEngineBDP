# ============================================================================
# keda Helm Chart 默认 values
# 关联：design/deploy/values/keda-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源 docker.m.daocloud.io）----
image:
  repository: "docker.m.daocloud.io/ghcr.io/kedacore/keda"
  tag: "2.16.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "0.5"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- v2.1 资源弹性：KEDA ScaledObject 配置 ----
# 基于自定义 Prometheus 指标触发弹性伸缩，峰值响应延迟 < 30s
scaledObjects:
  enabled: true
  # Prometheus TriggerAuthentication（Bearer Token 认证）
  prometheusTriggerAuth:
    secretName: prometheus-keda-token
    secretKey: token
  # 核心服务弹性伸缩配置
  services:
    # SQL 网关：基于并发查询数 + 查询延迟弹性扩缩
    sql-gateway:
      targetDeployment: sql-gateway
      minReplicas: 2
      maxReplicas: 10
      pollingInterval: 10  # 10s 轮询，峰值响应延迟 < 30s
      cooldownPeriod: 60
      triggers:
        # 并发查询数指标
        - type: prometheus
          metadata:
            serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:9090"
            metricName: "sql_gateway_concurrent_queries"
            threshold: "50"
            query: "sum(sql_gateway_concurrent_queries{application=\"sql-gateway\"})"
        # 查询延迟 P95 指标
        - type: prometheus
          metadata:
            serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:9090"
            metricName: "sql_gateway_query_p95"
            threshold: "5000"
            query: "histogram_quantile(0.95, sum(rate(sql_gateway_query_duration_seconds_bucket[5m])) by (le)) * 1000"
        # CPU 使用率兜底
        - type: cpu
          metadata:
            type: Utilization
            value: "80"

    # Trino：基于排队查询数 + 内存使用率弹性扩缩
    trino:
      targetDeployment: trino
      minReplicas: 2
      maxReplicas: 8
      pollingInterval: 15
      cooldownPeriod: 120
      triggers:
        - type: prometheus
          metadata:
            serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:9090"
            metricName: "trino_queued_queries"
            threshold: "10"
            query: "trino_execution_cluster_manager_running_queries"
        - type: prometheus
          metadata:
            serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:9090"
            metricName: "trino_memory_usage"
            threshold: "0.8"
            query: "trino_memory_pool_general_reserved_bytes / trino_memory_pool_general_total_bytes"
        - type: cpu
          metadata:
            type: Utilization
            value: "75"

    # Doris FE：基于查询 QPS + 并发数弹性扩缩
    doris-fe:
      targetDeployment: doris-fe
      minReplicas: 1
      maxReplicas: 5
      pollingInterval: 15
      cooldownPeriod: 90
      triggers:
        - type: prometheus
          metadata:
            serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:9090"
            metricName: "doris_query_qps"
            threshold: "100"
            query: "sum(rate(doris_be_query_total[1m]))"
        - type: prometheus
          metadata:
            serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:9090"
            metricName: "doris_running_queries"
            threshold: "50"
            query: "doris_fe_query_duration"
        - type: cpu
          metadata:
            type: Utilization
            value: "80"

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: keda.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # keda 默认配置，完整配置请引用 design/deploy/values/keda-values.yaml

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/keda-values.yaml 覆盖
# 渲染命令： helm template keda design/deploy/charts/keda -f design/deploy/values/keda-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
