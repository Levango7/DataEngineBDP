# ============================================================================
# DataEngineBDP Umbrella Chart 默认 values
# 说明：本文件仅控制各子 Chart 的启用开关与全局配置。
#       各子 Chart 的详细配置请参阅：
#         - design/deploy/charts/<name>/values.yaml（Chart 骨架默认值）
#         - design/deploy/values/env/<env>/<name>-values.yaml（环境覆盖值）
# 用法：helm install dataenginebdp . -f values.yaml -f design/deploy/values/env/prod/xxx.yaml
# ============================================================================

# ---- 全局配置（传递给所有子 Chart，子 Chart 通过 .Values.global 引用）----
global:
  imageRegistry: "docker.m.daocloud.io"  # 国内镜像源前缀
  storageClass: "sq-fast-ssd"            # 默认 StorageClass
  ingressClassName: "apisix"            # 默认 Ingress Class
  imagePullSecrets: []                  # 私有仓库拉取凭证

# ---- 各子 Chart 启用开关 ----
# 每个子 Chart 至少包含 enabled 字段；如需覆盖子 Chart 详细配置，
# 在对应键下追加配置，或通过 -f 环境values文件覆盖。

# ===== 自研核心组件（默认启用） =====
encaps-layer:
  enabled: true  # 封装层 - K8s产品化业务语义翻译
  # 详细配置见 design/deploy/charts/encaps-layer/values.yaml
sql-gateway:
  enabled: true  # SQL网关 - 统一SQL接入与路由
  # 详细配置见 design/deploy/charts/sql-gateway/values.yaml
catalog:
  enabled: true  # 目录服务 - 元数据目录与检索
  # 详细配置见 design/deploy/charts/catalog/values.yaml
rule-engine:
  enabled: true  # 规则引擎 - 数据质量规则执行
  # 详细配置见 design/deploy/charts/rule-engine/values.yaml

# ===== 自研治理组件（默认启用） =====
governance:
  enabled: true  # 数据治理 - 统一治理框架
  # 详细配置见 design/deploy/charts/governance/values.yaml
metadata-collector:
  enabled: true  # 元数据采集 - 多源元数据抓取
  # 详细配置见 design/deploy/charts/metadata-collector/values.yaml
lineage-analyzer:
  enabled: true  # 血缘分析 - 表级/字段级血缘
  # 详细配置见 design/deploy/charts/lineage-analyzer/values.yaml
data-quality:
  enabled: true  # 数据质量 - 规则引擎质量稽核
  # 详细配置见 design/deploy/charts/data-quality/values.yaml
asset-catalog:
  enabled: true  # 资产目录 - 数据资产编目
  # 详细配置见 design/deploy/charts/asset-catalog/values.yaml

# ===== 自研智能/AI组件（默认禁用） =====
ai-assistant:
  enabled: false  # AI助手 - 智能问答与辅助
  # 详细配置见 design/deploy/charts/ai-assistant/values.yaml
knowledge-engine:
  enabled: false  # 知识引擎 - 知识图谱与推理
  # 详细配置见 design/deploy/charts/knowledge-engine/values.yaml
