# ============================================================================
# redis Helm Chart 默认 values
# 关联：design/deploy/values/redis-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置（国内镜像源 docker.m.daocloud.io）----
image:
  repository: "docker.m.daocloud.io/bitnami/redis"
  tag: "7.2.4"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicaCount: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 6379
  # 容器端口
  containerPort: 6379

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "0.5"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: 6379
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: 6379
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 水平自动扩缩容 ----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- PodDisruptionBudget ----
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ---- Ingress ----
ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: redis.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- 环境变量 ----
env:
  LOG_LEVEL: info
  JAVA_OPTS: ""

# ---- ConfigMap 数据（骨架，按需扩展）----
config:
  application.conf: |
    # redis 默认配置，完整配置请引用 design/deploy/values/redis-values.yaml

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false
  # 设为 true 启用网络隔离（需 CNI 支持，如 Cilium/Calico）

# ---- ServiceMonitor（Prometheus 指标采集）----
# 需安装 prometheus-operator CRD
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/redis-values.yaml 覆盖
# 渲染命令： helm template redis design/deploy/charts/redis -f design/deploy/values/redis-values.yaml
