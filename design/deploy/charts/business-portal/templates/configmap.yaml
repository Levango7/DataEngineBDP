apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "business-portal.configmapName" . }}
  labels:
    {{- include "business-portal.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | toString | quote }}
  {{- end }}
  {{- range $key, $val := .Values.config }}
  {{ $key }}: |
    {{- $val | nindent 4 }}
  {{- end }}
