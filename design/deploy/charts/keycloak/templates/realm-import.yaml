{{- if .Values.realmImport.enabled }}
# Realm 定义 ConfigMap：挂载到 /opt/keycloak/data/import，配合启动参数 --import-realm
# 生效（KNOWN-FAILURES #11：旧实现把 realm 结构渲染成环境变量垃圾字符串，Keycloak 不读）。
# 注意：--import-realm 仅在对应 realm 不存在时导入，已存在则跳过（幂等）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-realm-import
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  {{- range $name, $realm := .Values.realmImport.files }}
  {{ $name }}: |-
{{ $realm | toPrettyJson | indent 4 }}
  {{- end }}
{{- end }}
