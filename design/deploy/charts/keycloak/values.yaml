# ============================================================================
# keycloak Helm Chart 默认 values
# 关联：design/deploy/values/keycloak-values.yaml（深度调优配置）
# 说明：本文件为 Chart 骨架级默认值，完整生产配置请引用上述 values 文件。
# ============================================================================

# ---- 镜像配置 ----
image:
  repository: "quay.io/keycloak/keycloak"
  tag: "25.0.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
replicas: 1

# ---- Service 配置 ----
service:
  type: ClusterIP
  port: 8080
  # 容器端口
  containerPort: 8080

# ---- 资源配额（默认 standard 档）----
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"


# ---- 安全上下文（Pod/Container 安全加固）----
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
probes:
  liveness:
    enabled: true
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- Pod 调度 ----
nodeSelector: {}
tolerations: []
affinity: {}

# ---- 启动参数（必需）----
# Keycloak 官方镜像没有默认子命令，缺 args 会直接退出导致 CrashLoop
# （KNOWN-FAILURES #11）。集群内走 HTTP（TLS 由 Ingress/网关终止）。
# 开启 realmImport 时会自动追加 --import-realm。
args:
  - start
  - --http-enabled=true
  - --hostname-strict=false
  - --proxy-headers=xforwarded

# ---- 数据库（KC_DB_* 环境变量，凭据只经 Secret 注入）----
# 先创建凭据 Secret（口令禁止写入 values）：
#   kubectl create secret generic keycloak-db \
#     --from-literal=username=keycloak --from-literal=password=<强口令>
database:
  enabled: true
  vendor: postgres
  host: pg-keycloak.internal
  port: 5432
  name: keycloak
  jdbcParams: ""                    # 例："?sslmode=require"
  existingSecret: keycloak-db
  usernameKey: username
  passwordKey: password

# ---- Realm 导入（--import-realm，文件以 ConfigMap 挂载到 /opt/keycloak/data/import）----
# 旧实现 values.config.realms 只被渲染成 `realms: "map[...]"` 环境变量垃圾字符串，
# Keycloak 不读（KNOWN-FAILURES #11）；现改为结构化文件渲染。
realmImport:
  enabled: false
  # 文件名 -> realm JSON（YAML 对象，渲染时 toPrettyJson）。
  # 例：
  # files:
  #   sq-realm.json:
  #     realm: sq
  #     enabled: true
  #     accessTokenLifespan: 300
  #     ssoSessionIdleTimeout: 28800
  files: {}

# ---- 附加标量环境变量（键值会以 envFrom 注入；仅标量会渲染）----
env: {}

# ---- MFA（多因素认证，台账 #131）----
# 此前可部署面零 MFA 配置：chart 内无任何 OTP/TOTP/WebAuthn 声明，只有合规报告里的
# 「已集成多因素认证」文字声明。本段把二次验证策略落成**可渲染的 realm 配置**：
#   · otpPolicy       —— TOTP 参数（算法 / 位数 / 周期）
#   · webAuthnPolicy  —— WebAuthn（通行密钥）策略，默认关闭
#   · requiredActions —— CONFIGURE_TOTP 作为默认动作 ⇒ 用户首次登录必须完成二次凭据配置
# 两条生效路径：
#   ① realmImport.enabled=true 时，mfa 字段被合并进每个导入 realm（--import-realm 生效）；
#   ② mfa.fragment.enabled=true 时，单独渲染一份 MFA realm 片段 ConfigMap，
#      供 scripts/import-keycloak-realm.sh 的 kcadm 路径使用。
# 强制范围（哪些用户/角色被挑战）属身份安全策略裁决，见 mfa.enforceRoles 与
# design/deploy/values/keycloak-values.yaml 的 mfa 段。
mfa:
  enabled: true
  # 强制范围：留空 = 全体登录用户；非空 = 仅这些 realm 角色被强制
  enforceRoles: []
  otpPolicy:
    type: totp
    algorithm: HmacSHA1
    digits: 6
    period: 30
    lookAheadWindow: 1
  webAuthnPolicy:
    enabled: false
    attestationType: none
    userVerificationRequirement: preferred
    rpName: "数擎云核"
    rpId: ""
  # 强制配置二次凭据的 required action
  requiredAction: CONFIGURE_TOTP
  requiredActionName: Configure OTP
  # 浏览器登录流（条件式 OTP 挑战）：默认关闭——该流结构（authenticationExecutions /
  # conditionalAuthFlow 字段拼写）需真机 Keycloak 校验，本仓无运行环境，未经验证。
  browserFlow:
    enabled: false
    alias: sq-browser-mfa
    description: "数擎云核 · 条件式 OTP 二次验证"
  # 渲染独立 MFA realm 片段（kcadm 导入路径用），不进 /opt/keycloak/data/import
  fragment:
    enabled: true
    fileName: sq-realm-mfa.json

# ---- 引用提示 ----
# 完整配置请通过 -f design/deploy/values/keycloak-values.yaml 覆盖
# 渲染命令： helm template keycloak design/deploy/charts/keycloak -f design/deploy/values/keycloak-values.yaml

# ---- 弹性伸缩（默认关闭，开启后按 CPU 使用率自动扩缩）----
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---- NetworkPolicy（网络隔离，等保三级微隔离要求）----
# 策略：deny-all 入站 + 仅允许同命名空间 Pod 访问服务端口 + 允许所有出站
networkPolicy:
  enabled: false

# ---- ServiceMonitor（Prometheus 指标采集）----
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
