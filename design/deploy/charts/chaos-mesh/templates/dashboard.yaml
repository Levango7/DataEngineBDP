{{- if .Values.dashboard.enabled }}
# ============================================================================
# Chaos Mesh Dashboard（v2.1 故障演练）
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chaos-mesh.name" . }}-dashboard
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "chaos-mesh.name" . }}-dashboard
    app.kubernetes.io/part-of: chaos-mesh
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "chaos-mesh.name" . }}-dashboard
  template:
    metadata:
      labels:
        app: {{ include "chaos-mesh.name" . }}-dashboard
    spec:
      containers:
        - name: chaos-dashboard
          image: "{{ .Values.image.chaosDashboard.repository }}:{{ .Values.image.chaosDashboard.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 2333
          env:
            - name: DATABASE_DRIVER
              value: "sqlite3"
            - name: DATABASE_DATASOURCE
              value: "/data/chaos-dashboard.db"
            - name: CHAOS_DAEMON_PROTOCOL
              value: "grpc"
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chaos-mesh.name" . }}-dashboard
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "chaos-mesh.name" . }}-dashboard
    app.kubernetes.io/part-of: chaos-mesh
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: 2333
      name: http
  selector:
    app: {{ include "chaos-mesh.name" . }}-dashboard
{{- end }}
