# ============================================================================
# Chaos Mesh 控制器部署（v2.1 故障演练）
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chaos-mesh.name" . }}-controller
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ include "chaos-mesh.name" . }}-controller
    app.kubernetes.io/part-of: chaos-mesh
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "chaos-mesh.name" . }}-controller
  template:
    metadata:
      labels:
        app: {{ include "chaos-mesh.name" . }}-controller
    spec:
      serviceAccountName: {{ include "chaos-mesh.name" . }}-controller
      containers:
        - name: chaos-controller
          image: "{{ .Values.image.chaosController.repository }}:{{ .Values.image.chaosController.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--metrics-addr=:8080"
            - "--namespaces={{ .Values.namespace.name }}"
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chaos-mesh.name" . }}-controller
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: chaos-mesh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chaos-mesh.name" . }}-controller
  labels:
    app.kubernetes.io/part-of: chaos-mesh
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources: ["*"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "configmaps", "events", "secrets", "services", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chaos-mesh.name" . }}-controller
  labels:
    app.kubernetes.io/part-of: chaos-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chaos-mesh.name" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "chaos-mesh.name" . }}-controller
    namespace: {{ .Values.namespace.name }}
