# SealedSecret CRD 示例 · finance-template 凭证（方案 B）
# ============================================================================
# 作用：用 Bitnami SealedSecrets 加密 finance-template 的 4 个凭证，
#       加密产物可安全入库 Git，集群内 controller 自动解密还原为原生 Secret。
# 适用：GitOps 简化场景、中小规模、Vault 未就绪的过渡阶段。
# 前置：已部署 sealed-secrets-controller（kube-system），已安装 kubeseal CLI。
# ============================================================================
#
# 生成方式（不要手写 encryptedData，必须用 kubeseal 生成）：
#
#   1. 准备明文 Secret（dry-run，不提交到集群）
#      kubectl create secret generic finance-template-secrets \
#        --namespace=finance \
#        --from-literal=doris-password='<生产口令>' \
#        --from-literal=dolphinscheduler-token='<生产令牌>' \
#        --from-literal=superset-token='<生产令牌>' \
#        --from-literal=keycloak-admin-password='<生产口令>' \
#        --dry-run=client -o yaml > /tmp/finance-secret.yaml
#
#   2. 用 kubeseal 加密（controller 在 kube-system）
#      kubeseal --format=yaml \
#        --controller-namespace=kube-system \
#        < /tmp/finance-secret.yaml > design/deploy/templates/finance-template-sealed.yaml
#
#   3. 加密产物入库 Git，ArgoCD 自动同步
#      kubectl apply -f design/deploy/templates/finance-template-sealed.yaml
#
#   4. 验证
#      kubectl get sealedsecret finance-template-secrets -n finance
#      kubectl get secret    finance-template-secrets -n finance
#
# 私钥保护：
#   - sealed-secrets-controller 私钥是全盘安全根，泄露即全部 SealedSecret 失守；
#   - 备份：kubectl get secret -n kube-system sealed-secrets-private-key -o yaml
#     加密后存入离线介质（KMS/HSM），严禁入库 Git；
#   - 轮换私钥需 re-seal 全部 SealedSecret，建议低峰期操作。
# ============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: finance-template-secrets
  namespace: finance
  labels:
    app.kubernetes.io/name: finance-template
    app.kubernetes.io/part-of: dataenginebdp
    app.kubernetes.io/component: credentials
    app.kubernetes.io/managed-by: sealed-secrets
    # 安全分级：用于标识凭证敏感度，便于审计与 RBAC
    security.dataenginebdp/classification: confidential
  annotations:
    # 描述与用途
    description: "finance-template 凭证（doris/dolphinscheduler/superset/keycloak），SealedSecret 加密"
    # 关联的占位符来源（便于审计追溯）
    dataenginebdp/source-values: "design/deploy/charts/finance-template/values.yaml#L126-132"
    # 生成工具与版本（便于运维识别）
    dataenginebdp/generated-by: "kubeseal"
    # 轮换策略提示
    dataenginebdp/rotation-policy: "doris/keycloak 180d, dolphinscheduler/superset 90d"
    # 禁止手工编辑加密内容
    dataenginebdp/edit-warning: "DO NOT EDIT encryptedData manually; re-seal via kubeseal"
spec:
  # 解密后生成的原生 Secret 模板
  template:
    metadata:
      name: finance-template-secrets
      namespace: finance
      labels:
        app.kubernetes.io/name: finance-template
        app.kubernetes.io/component: credentials
      annotations:
        description: "finance-template 凭证（由 SealedSecret 解密生成，勿手工修改）"
    type: Opaque
  # 加密后的凭证数据
  # ----------------------------------------------------------------------------
  # 以下 encryptedData 为占位说明，真实值由 kubeseal 生成（base64 加密块）。
  # 每个 key 对应原生 Secret 的 data 字段名；value 是 controller 私钥加密后的密文。
  # 加密绑定 (namespace, name)，重命名需重新 seal。
  # ----------------------------------------------------------------------------
  encryptedData:
    # Doris 数据库口令（对应 values.yaml secret.doris.password）
    doris-password: AgB3...<kubeseal生成的密文，勿手写>...
    # DolphinScheduler API 令牌（对应 secret.dolphinscheduler.token）
    dolphinscheduler-token: AgB3...<kubeseal生成的密文，勿手写>...
    # Superset API 令牌（对应 secret.superset.token）
    superset-token: AgB3...<kubeseal生成的密文，勿手写>...
    # Keycloak 管理员口令（对应 secret.keycloak.adminPassword）
    keycloak-admin-password: AgB3...<kubeseal生成的密文，勿手写>...
# ============================================================================
# 部署后，controller 会自动生成同名原生 Secret：
#   kubectl get secret finance-template-secrets -n finance -o yaml
# 应用通过 envFrom / valueFrom 引用该 Secret，无需感知 SealedSecret 存在。
# ============================================================================