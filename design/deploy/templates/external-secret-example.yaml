# ExternalSecret CRD 示例 · ArgoCD 漂移告警 webhook 凭证（方案 C）
# ============================================================================
# 作用：用 External Secrets Operator 从 Vault 拉取 ArgoCD 通知渠道的 4 个凭证，
#       自动生成原生 Secret，Git 中只存引用指针（无敏感数据）。
# 适用：生产环境、多集群、需要动态轮换与审计的企业级场景。
# 前置：
#   1. 已部署 External Secrets Operator（external-secrets namespace）；
#   2. 已部署 Vault 并启用 KV v2 secrets engine（path: secret/）；
#   3. 已在 Vault 写入凭证：
#        vault kv put secret/argocd-notifications \
#          slack-token='xoxb-xxxx' \
#          email-password='<SMTP口令>' \
#          dingtalk-token='<access_token>' \
#          pagerduty-key='<integration_key>'
#   4. 已配置 Vault JWT auth + policy，允许 argocd namespace 的 ServiceAccount
#      读取 secret/argocd-notifications；
#   5. 已在该 namespace 创建 SecretStore（见下方注释）。
# ============================================================================
#
# 配套 SecretStore（每个 namespace 一个，此处 argocd）：
# ---------------------------------------------------------------------------
# apiVersion: external-secrets.io/v1beta1
# kind: SecretStore
# metadata:
#   name: vault-backend
#   namespace: argocd
# spec:
#   provider:
#     vault:
#       server: "https://vault.vault.svc:8200"
#       path: "secret"          # KV v2 mount path
#       version: "v2"
#       auth:
#         kubernetes:
#           mountPath: "kubernetes"        # Vault JWT auth mount
#           role: "argocd-role"            # Vault role，绑定 policy
#           serviceAccountRef:
#             name: default                # argocd namespace 的 SA
# ---------------------------------------------------------------------------
#
# 部署与验证：
#   kubectl apply -f design/deploy/templates/external-secret-example.yaml
#   kubectl get externalsecret argocd-notifications-externalsecret -n argocd
#     # 期望 STATUS=Ready
#   kubectl get secret argocd-notifications-secret -n argocd -o yaml
#     # 期望 data 中含 4 个 key
#
# 轮换：
#   - 在 Vault 更新 KV，ESO 下个 refreshInterval 自动同步，无需改 Git；
#   - 紧急轮换可减小 refreshInterval 或手动触发：
#       kubectl annotate externalsecret argocd-notifications-externalsecret \
#         force-sync=$(date +%s) -n argocd --overwrite
# ============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-notifications-externalsecret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications
    app.kubernetes.io/part-of: gitops
    app.kubernetes.io/component: drift-alerting
    app.kubernetes.io/managed-by: external-secrets
    # 安全分级
    security.dataenginebdp/classification: confidential
  annotations:
    # 描述与用途
    description: "ArgoCD 漂移告警 webhook 凭证，从 Vault 拉取生成原生 Secret"
    # 关联的占位符来源（便于审计追溯）
    dataenginebdp/source-secret: "design/deploy/argocd/drift-detection/alerting/webhook-secret.yaml#L23-35"
    # 远端密钥路径（便于运维定位）
    dataenginebdp/vault-path: "secret/argocd-notifications"
    # 轮换策略提示
    dataenginebdp/rotation-policy: "90d or on-suspected-leak"
spec:
  # 刷新间隔：每 1 小时从 Vault 同步一次（轮换自动生效）
  refreshInterval: 1h
  # 指向本 namespace 的 SecretStore（ClusterSecretStore 则用 kind: ClusterSecretStore）
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  # 解密后生成的原生 Secret
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner        # ESO 拥有该 Secret，删除 ExternalSecret 时一并清理
    deletionPolicy: Delete       # 删除 ExternalSecret 时删除 Secret
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: argocd-notifications
          app.kubernetes.io/part-of: gitops
          app.kubernetes.io/component: drift-alerting
        annotations:
          description: "ArgoCD Notifications 凭证（由 ExternalSecret 同步生成，勿手工修改）"
          dataenginebdp/managed-by: external-secrets-operator
  # 数据映射：secretKey = 原生 Secret 的字段名，remoteRef.key = Vault KV 路径，property = KV 内字段名
  # ----------------------------------------------------------------------------
  data:
    # Slack Bot Token（xoxb- 开头）
    # 生成：Slack → Apps → Your Apps → OAuth & Permissions → Bot User OAuth Token
    - secretKey: slack-token
      remoteRef:
        key: argocd-notifications       # Vault path: secret/argocd-notifications
        property: slack-token
    # 邮件 SMTP 口令（email-username 为明文邮箱，保留原值，不在此映射）
    - secretKey: email-password
      remoteRef:
        key: argocd-notifications
        property: email-password
    # 钉钉机器人 access_token
    # 生成：钉钉群 → 群设置 → 智能群助手 → 自定义机器人 → 安全设置加签
    - secretKey: dingtalk-token
      remoteRef:
        key: argocd-notifications
        property: dingtalk-token
    # PagerDuty Integration Key
    # 生成：PagerDuty → Services → New Service → Integration → Events API v2
    - secretKey: pagerduty-key
      remoteRef:
        key: argocd-notifications
        property: pagerduty-key
# ============================================================================
# 部署后，ESO 会自动生成原生 Secret：
#   kubectl get secret argocd-notifications-secret -n argocd -o yaml
# ArgoCD notifications controller 通过该 Secret 渲染告警渠道凭证。
#
# 多集群扩展：
#   - 各集群创建各自的 SecretStore（指向同一 Vault）；
#   - 同一 ExternalSecret CRD 可入库 Git 并在多集群 apply，凭证统一来自 Vault。
# ============================================================================