# ============================================================================
# Flink 1.20 定制 Helm values
# 关联：部署清单 v0.1 §6.2 流式计算 / §10 可观测 / §9 资源配额
# 渲染： helm template . -f deploy/values-base.yaml -f deploy/values/flink-values.yaml
# 说明：在 values-base.engines.flink 之上做深度调优；状态后端 RocksDB 增量，
#       HA 模式 Zookeeper/Kubernetes 二选一；按三档套餐给出参数建议。
# ============================================================================

engines:
  flink:
    # ---- 镜像 / Operator ----
    operator:
      image: "flink-operator:1.9.0"
      replicas: 2
      resources:
        requests: { cpu: "500m", memory: "1Gi" }
        limits:   { cpu: "1",    memory: "2Gi" }
    flinkImage: "sq-flink:1.20.0-0.1.0"
    flinkVersion: "1.20.0"

    # ---- 套餐分档 ----
    tierProfiles:
      base:      { tmMemory: "2Gi",  tmSlots: 2, jmMemory: "1Gi" }
      standard:  { tmMemory: "4Gi",  tmSlots: 3, jmMemory: "2Gi" }
      flagship:  { tmMemory: "8Gi",  tmSlots: 4, jmMemory: "2Gi" }

    # ---- JobManager ----
    jobManager:
      replicas: 1                # HA 模式下由 ha.replicas 控制
      memory: "2Gi"
      cpu: 1
      resources:
        requests: { cpu: "1", memory: "2Gi" }
        limits:   { cpu: "2", memory: "3Gi" }
      nodeSelector: { "sq.io/pool": "flink-jm" }
      ha:
        enabled: true
        mode: "kubernetes"       # kubernetes | zookeeper
        replicas: 3
        zookeeperQuorum: "zk-0.zk:2181,zk-1.zk:2181,zk-2.zk:2181"
        storage: { size: "5Gi", storageClass: "fast-ssd" }

    # ---- TaskManager ----
    taskManager:
      replicas: 3
      memory: "4Gi"
      cpu: 2
      taskSlots: 3
      resources:
        requests: { cpu: "2", memory: "4Gi" }
        limits:   { cpu: "4", memory: "6Gi" }
      nodeSelector: { "sq.io/pool": "flink-tm" }
      memoryProcess:
        # taskmanager.memory.process 占比（Flink 1.18 切分）
        framework:    "20%"
        managed:      "40%"
        network:      "10%"
        jvmMetaspace: "256m"
        jvmOverhead:  "10%"

    # ---- Checkpoint / 保存点 ----
    checkpoint:
      interval: "60s"            # 分钟级
      minPause: "30s"
      timeout: "10m"
      maxConcurrent: 1
      externalized: true
      retainOnFailure: true
      savepoint:
        enabled: true
        interval: "6h"
        targetDir: "s3://sq-flink/savepoints"
      stateBackend:
        type: "rocksdb"          # rocksdb | filesystem
        incremental: true
        localDirs: ["/opt/flink/rocksdb"]
        rocksdb:
          writeBufferSize: "64MB"
          maxWriteBufferNumber: 3
          blockSize: "32KB"
          backgroundThreads: 4

    # ---- 网络调优 ----
    network:
      netty:
        numNetworkBuffers: 2048
        segmentSize: "32KB"
        networkBuffersPerChannel: 8
        clientConnectTimeoutSeconds: 60
      tcp:
        keepAlive: true
        keepIdle: 60
        keepInterval: 10
        keepProbes: 6

    # ---- 反压监控 ----
    backpressure:
      monitoring: true
      alertThreshold: 0.7        # 高于 0.7 告警
      sampleInterval: "10s"

    # ---- CDC connector ----
    cdc:
      enabled: true
      connectors: ["mysql", "postgres", "mongodb", "oracle"]
      mysql:
        serverIdRange: "5400-5404"
        snapshotMode: "initial"
        heartbeatInterval: "30s"
      pipeline:
        schemaChange: true
        exactlyOnce: true

    # ---- Iceberg sink ----
    iceberg:
      enabled: true
      catalog: "rest"
      catalogUri: "http://iceberg-catalog:8181"
      warehouse: "s3://sq-iceberg/warehouse"
      sink:
        upsert: true
        equalityFields: []
        writeParallelism: 4
        commitInterval: "60s"

    # ---- 监控 ----
    monitoring:
      metrics:
        enabled: true
        reporter: "prometheus"
        port: 9249
        interval: "30s"
        scopeFormats:
          jobManager: "<host>.jobmanager.<job_name>"
          taskManager: "<host>.taskmanager.<task_id>"
      prometheus:
        scrapeInterval: "30s"
        serviceMonitor: true
      restApi:
        enabled: true
        port: 8081
        ingress: { enabled: true, host: "flink-rest.<domain>" }

    # ---- 认证集成（P2-E4）----
    # Flink 引擎无原生 Web UI OIDC 集成，统一经 X4 APISIX 网关代理认证：
    #   用户 → APISIX（Keycloak OIDC）→ Flink REST/WebUI
    # Flink 作业提交通过 Security Context 携带 Kerberos 凭证，
    # SQL 作业通过 L3.7 策略下推做行/列级权限校验。
    auth:
      mode: "via-apisix-gateway"
      keycloakRealm: "sq"
      uiAuthVia: "apisix-keycloak-oidc"
      jobSubmission:
        authType: "kerberos-security-context"
        tokenExchange: true
        tenantContextProp: "flink.sql.tenant.id"

    # ---- 资源配额（Namespace 级单组件配额）----
    # P1-C12/P1-E5 说明：本 quota 是 Flink 在平台 Namespace 的总配额，
    #                    §11.5.2 是单租户配额，关系为：平台配额 ≥ Σ(租户配额)。
    quota:
      base:      { requests.cpu: "10", requests.memory: "20Gi",  limits.cpu: "20",  limits.memory: "30Gi" }
      standard:  { requests.cpu: "30", requests.memory: "60Gi",  limits.cpu: "60",  limits.memory: "90Gi" }
      flagship:  { requests.cpu: "80", requests.memory: "160Gi", limits.cpu: "160", limits.memory: "240Gi" }
