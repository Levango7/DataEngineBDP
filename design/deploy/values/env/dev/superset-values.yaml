# ============================================================================
# superset · dev 环境 values
# 策略：web=1,celery=1 · 资源最小 · SQLite · redis单节点 · 无PVC
# ============================================================================

image:
  repository: "apache/superset"
  tag: "4.1.0"
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests: { cpu: "250m", memory: "512Mi" }
  limits:   { cpu: "500m", memory: "1Gi" }

config:
  web:
    replicas: 1
    gunicornWorkers: 2
    gunicornTimeout: 120
  celery:
    worker:
      replicas: 1
      workerConcurrency: 2
    beat:
      enabled: true
      replicas: 1
  database:
    type: sqlite
    path: /var/lib/superset/superset.db
  cache:
    type: redis
    host: redis-superset-dev.svc
    port: 6379
  log:
    level: DEBUG

autoscaling:
  enabled: false
