# ============================================================================
# federated-query · prod 环境 values（台账 #90②）
# 覆盖：design/deploy/charts/federated-query/values.yaml
# 策略：多副本 · 开 HPA/PDB · 外部 Secret 存 JWT（不写明文）
# 命名空间取 prod-system：APISIX 的路由 upstream 用短名（federated-query:8094），
# 短名只能在同 namespace 解析，故与 encaps-layer / catalog 等既有服务同域。
# ============================================================================

image:
  repository: "ghcr.io/levango7/sq-federated-query"
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

hpa:
  enabled: true

pdb:
  enabled: true

auth:
  # prod 必须用外部 Secret，不要把真密钥写进 values。
  jwtSecretName: "federated-query-jwt-prod"

env:
  KARMADA_API: "http://karmada-api:8090"
