# ============================================================================
# cost-model · prod 环境 values（umbrella 依赖条目：cost-model.enabled）
# 覆盖：design/deploy/charts/cost-model/values.yaml
# 策略：双副本 · 生产建议接 PostgreSQL（DB_URL/DB_USERNAME/DB_PASSWORD）+ 迁移
# 资源与安全按生产档；JWT_SECRET/DB_PASSWORD 留空，由 prod 部署时注入
# ============================================================================

cost-model:
  enabled: true

  # prod 钉版本（台账 #111，2026-11-05 主理人裁「那就用版本号吧」）：tag 用 main 构建推给 GHCR 的
  # 40 位 commit sha（.github/workflows/build.yml:281 同时推 :latest 与 :<sha>），与同目录
  # catalog-values.yaml:9 的 prod 口径一致。升级 = 把 sha 换成新一次 main 构建的 commit。
  image:
    repository: "ghcr.io/levango7/sq-cost-model"
    tag: "5ea7e17753d9714df0122de1cf37cdc3874a9b34"
    pullPolicy: IfNotPresent

  replicaCount: 2

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  hpa:
    enabled: false

  podDisruptionBudget:
    enabled: false

  networkPolicy:
    enabled: false

  serviceMonitor:
    enabled: false

  env:
    SERVER_PORT: "8084"
    LOG_LEVEL: info
    JAVA_OPTS: "-Xms512m -Xmx1g"
    DB_URL: ""
    DB_USERNAME: ""
    CORS_ORIGINS: ""
    DDL_AUTO: "validate"
    COLLECTOR_INTERVAL: "60"
    COLLECT_CPU: "true"
    COLLECT_GPU: "true"
    COLLECT_MEMORY: "true"
    COLLECT_NETWORK: "true"
    COLLECT_STORAGE: "true"

  config: {}

  # prod 生效需按需填充：
  # auth.jwtSecretName / db.existingSecret（由运维按环境注入 Secret）
