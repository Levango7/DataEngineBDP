# ============================================================================
# sql-gateway · prod 环境 values
# 覆盖：design/deploy/charts/sql-gateway/values.yaml
# 策略：资源充足 · 日志WARN · 3副本 · PostgreSQL+PVC+HPA+PDB+TLS
# ============================================================================

image:
  repository: "docker.m.daocloud.io/sq-sql-gateway"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: apisix
  hosts:
    - host: sql-gateway.prod.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sql-gateway-tls
      hosts:
        - sql-gateway.prod.shuqing.local

env:
  LOG_LEVEL: warn
  JAVA_OPTS: "-Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

config:
  application.conf: |
    # sql-gateway prod 配置 - PostgreSQL + 连接池调优
    db.driver = postgresql
    db.url = "jdbc:postgresql://pg-sql-gateway.prod.svc:5432/sql-gateway"
    db.pool.hikari.maximumPoolSize = 20
    db.pool.hikari.connectionTimeout = 30000
    log.level = warn
    feature.persistentVolume = true

persistence:
  enabled: true
  storageClass: "sq-fast-ssd"
  accessModes:
    - ReadWriteOnce
  size: 50Gi
