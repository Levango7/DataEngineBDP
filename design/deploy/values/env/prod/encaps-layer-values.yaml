# ============================================================================
# encaps-layer · prod 环境 values
# 覆盖：design/deploy/charts/encaps-layer/values.yaml
# 策略：资源充足 · 日志WARN · 3副本 · PostgreSQL+PVC+HPA+PDB+TLS
# ============================================================================

image:
  repository: "docker.m.daocloud.io/sq-encapsulation"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: apisix
  hosts:
    - host: encaps-layer.prod.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: encaps-layer-tls
      hosts:
        - encaps-layer.prod.shuqing.local
  # ----------------------------------------------------------------------------
  # Ingress TLCP 配置（信创环境专用，R-021）
  # ----------------------------------------------------------------------------
  # 启用方式：在 xinchuang profile 下设置 ingress.tls.protocol=TLCP
  # 国密双证书由 K8s Secret 提供（cert-manager 国密 issuer 签发）：
  #   - sm2-sign-cert：SM2 签名证书（ssl_sign_certificate）
  #   - sm2-enc-cert：SM2 加密证书（ssl_enc_certificate）
  # 非信创环境保持 TLS1.3（默认），无需以下配置
  # xinchangTlcp:
  #   enabled: true
  #   signSecretName: platform-sm2-sign-cert
  #   encSecretName: platform-sm2-enc-cert
  #   cipher: "ECDHE-SM2-SM4-SM3"

env:
  LOG_LEVEL: warn
  JAVA_OPTS: "-Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

config:
  application.conf: |
    # encaps-layer prod 配置 - PostgreSQL + 连接池调优
    db.driver = postgresql
    db.url = "jdbc:postgresql://pg-encaps-layer.prod.svc:5432/encaps-layer"
    db.pool.hikari.maximumPoolSize = 20
    db.pool.hikari.connectionTimeout = 30000
    log.level = warn
    feature.persistentVolume = true

persistence:
  enabled: true
  storageClass: "sq-fast-ssd"
  accessModes:
    - ReadWriteOnce
  size: 50Gi
