# ============================================================================
# kafka · staging 环境 values
# 策略：broker=3,controller=3 · 资源中等 · kraft · retention 72h · 无PVC
# ============================================================================

image:
  repository: "apache/kafka"
  tag: "3.8.1"
  pullPolicy: IfNotPresent

replicas: 3

resources:
  requests: { cpu: "1", memory: "2Gi" }
  limits:   { cpu: "2", memory: "4Gi" }

config:
  broker:
    replicas: 3
    minInSyncReplicas: 2
    defaultReplicationFactor: 3
    compressionType: lz4
    logRetentionHours: 72
  metadata:
    mode: kraft
    kraft:
      controllers: 3
  log:
    level: INFO

autoscaling:
  enabled: false
