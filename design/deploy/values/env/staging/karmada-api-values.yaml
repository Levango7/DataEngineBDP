# ============================================================================
# karmada-api · staging 环境 values（台账 #90②）
# 覆盖：design/deploy/charts/karmada-api/values.yaml
# 策略：单副本 · 无 HPA/PDB · 内嵌 SQLite（emptyDir）· staging 弱密钥
# 命名空间取 staging-system：APISIX 的路由 upstream 用短名（karmada-api:8090），
# 短名只能在同 namespace 解析，故与 encaps-layer / catalog 等既有服务同域。
# ============================================================================

image:
  repository: "ghcr.io/levango7/sq-karmada-api"
  tag: "latest"
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

hpa:
  enabled: false

pdb:
  enabled: false

auth:
  # 仅 staging 使用；chart 会据此生成 <release>-jwt Secret。
  # 生产请用 auth.jwtSecretName 指向外部 Secret，不要把真密钥写进 values。
  # 与签发端（encaps-layer / Keycloak）保持一致才能通过鉴权。
  jwtSecretValue: "staging-env-karmada-jwt-0123456789abcdef-not-for-prod"

env:
  KARMADA_API_PORT: "8090"
  KARMADA_API_DB: "/app/data/karmada-api.db"
  JWT_ISSUER: "shuqing-bigdata"
  # staging 未部署上游 Karmada 控制面：留空 ⇒ 集群 API 按 main.go 既有行为降级为 stub 响应
  KARMADA_API_SERVER: ""
