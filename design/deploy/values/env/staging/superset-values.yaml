# ============================================================================
# superset · staging 环境 values
# 策略：web=2,celery=2 · 资源中等 · PostgreSQL · redis · 无PVC
# ============================================================================

image:
  repository: "apache/superset"
  tag: "4.1.0"
  pullPolicy: IfNotPresent

replicas: 2

resources:
  requests: { cpu: "500m", memory: "1Gi" }
  limits:   { cpu: "1",    memory: "2Gi" }

config:
  web:
    replicas: 2
    gunicornWorkers: 4
    gunicornTimeout: 120
  celery:
    worker:
      replicas: 2
      workerConcurrency: 4
    beat:
      enabled: true
      replicas: 1
  database:
    type: postgresql
    host: pg-superset.staging.svc
    port: 5432
    name: superset
  cache:
    type: redis
    host: redis-superset.staging.svc
    port: 6379
  log:
    level: INFO

autoscaling:
  enabled: false
