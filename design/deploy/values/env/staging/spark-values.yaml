# ============================================================================
# spark · staging 环境 values
# 策略：2副本 · 资源中等 · AQE开启 · offHeap 2g · 无PVC
# ============================================================================

image:
  repository: "spark-operator"
  tag: "1.4.0"
  pullPolicy: IfNotPresent

replicas: 2

resources:
  requests: { cpu: "1", memory: "2Gi" }
  limits:   { cpu: "2", memory: "4Gi" }

config:
  serializer: org.apache.spark.serializer.KryoSerializer
  memory:
    fraction: 0.7
    storageFraction: 0.4
    offHeapEnabled: true
    offHeapSize: 2g
  aqe:
    enabled: true
    coalescePartitions: true
    skewJoin: false
  log:
    level: INFO

autoscaling:
  enabled: false
