# ============================================================================
# catalog · staging 环境 values
# 覆盖：design/deploy/charts/catalog/values.yaml
# 策略：资源中等 · 日志INFO · 双副本 · PostgreSQL · PDB · 无PVC/HPA
# ============================================================================

image:
  repository: "docker.m.daocloud.io/sq-catalog"
  tag: "0.1.0-staging"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

hpa:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: apisix
  hosts:
    - host: catalog.staging.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  LOG_LEVEL: info
  JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseG1GC"

config:
  application.conf: |
    # catalog staging 配置 - PostgreSQL
    db.driver = postgresql
    db.url = "jdbc:postgresql://pg-catalog.staging.svc:5432/catalog"
    db.pool.hikari.maximumPoolSize = 10
    log.level = info
    feature.persistentVolume = false
