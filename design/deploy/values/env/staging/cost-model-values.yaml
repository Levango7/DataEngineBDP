# ============================================================================
# cost-model · staging 环境 values（umbrella 依赖条目：cost-model.enabled）
# 覆盖：design/deploy/charts/cost-model/values.yaml
# 策略：双副本 · H2 文件库 · 无HPA/PDB/NetworkPolicy · 默认启用
# ============================================================================

cost-model:
  enabled: true

  image:
    repository: "ghcr.io/levango7/sq-cost-model"
    tag: "latest"
    pullPolicy: Always

  replicaCount: 2

  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  hpa:
    enabled: false

  podDisruptionBudget:
    enabled: false

  networkPolicy:
    enabled: false

  serviceMonitor:
    enabled: false

  env:
    SERVER_PORT: "8084"
    LOG_LEVEL: info
    JAVA_OPTS: "-Xms256m -Xmx512m"
    DB_URL: ""
    DB_USERNAME: ""
    CORS_ORIGINS: ""
    DDL_AUTO: "update"
    COLLECTOR_INTERVAL: "60"
    COLLECT_CPU: "true"
    COLLECT_GPU: "true"
    COLLECT_MEMORY: "true"
    COLLECT_NETWORK: "true"
    COLLECT_STORAGE: "true"

  config: {}
