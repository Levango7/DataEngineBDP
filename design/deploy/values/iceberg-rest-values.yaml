# ============================================================================
# Iceberg REST Catalog 定制 Helm values
# 关联：design/deploy/charts/iceberg-rest（Chart 2.0.0 / App 2.0.0）
# 渲染： helm template iceberg-rest design/deploy/charts/iceberg-rest \
#          -f design/deploy/values/iceberg-rest-values.yaml -n sq-engine
# 说明：本文件顶层结构对齐 charts/iceberg-rest 的 values，可被 `helm install -f` 正确覆盖。
#       2026-11-22 新建——此前 chart 的 values.yaml / README.md / NOTES.txt 都引用本文件，
#       但文件**不存在** ⇒ 按 README 安装的部署实际吃的是 chart 骨架默认值
#       （台账 #126 配套登记项）。
# ============================================================================

# ---- 镜像 ----
# 2026-11-22 坐标订正（台账 #126）：原值
# `docker.m.daocloud.io/tabulario/iceberg-rest-catalog:0.7.0` 是**双重错坐标**
# ——仓名 `iceberg-rest-catalog` 在 Docker Hub 不存在，runner 上
# `docker manifest inspect` 返回 rc=1（denied）。真实坐标 `tabulario/iceberg-rest`。
# 1.6.0 与 0.7.0 均为 amd64+arm64 双架构（runner manifest 实测），取 1.6.0。
# 直连 Docker Hub：仓内加速器不代理该仓，且同批正对照 postgres:16 同样失败
# ⇒ 加速器侧不可判，不取加速器坐标。
image:
  repository: "tabulario/iceberg-rest"
  tag: "1.6.0"
  pullPolicy: IfNotPresent

# ---- 副本数 ----
# 必须为 1：默认 catalog 后端是镜像内置 JdbcCatalog + **容器内 sqlite 文件**
# （默认 CATALOG_URI=jdbc:sqlite:file:/tmp/iceberg_rest_mode=memory；runner 实测
#  该路径是 20480 字节真实 sqlite 文件，非内存库 ⇒ 容器重启即丢表清单）。
# sqlite 单文件库多副本各自持有本地文件 ⇒ 表清单分叉 ⇒ REST 请求落到不同副本
# 会看到不同 catalog ⇒ 语义错误。
# 要多副本，必须把下面 catalog.uri 指向外部共享 JDBC 库（PostgreSQL/MySQL）。
replicaCount: 1

# ---- 访问凭据（走 Secret，不进 ConfigMap：台账 #12）----
# 与对象存储 chart 共用同一套 AK/SK（键名一致）：
#   kubectl -n sq-engine create secret generic rustfs-creds \
#     --from-literal=access-key=<AK> --from-literal=secret-key=<SK>
credentials:
  existingSecret: "rustfs-creds"
  accessKeyKey: "access-key"
  secretKeyKey: "secret-key"

# ---- catalog 元数据后端 ----
# 留空 = 用镜像内置默认（容器内 sqlite，容器重启即丢表清单）。
# 指向外部共享 JDBC 库时填完整 JDBC URL，例如：
#   jdbc:postgresql://sq-postgres.sq-engine.svc.cluster.local:5432/iceberg_catalog
# 指向挂载卷时填 jdbc:sqlite:file:/data/catalog.db（配合 catalogPersistence.enabled）。
catalog:
  uri: ""

# ---- catalog 元数据持久化 ----
# 开启后挂 PVC 到 mountPath，并把 CATALOG_URI 指向该卷内的 sqlite 文件。
# 写权限靠 Pod 级 securityContext.fsGroup（镜像默认用户 uid/gid=1000）让卷可写。
# 约束：必须保持 replicaCount=1（sqlite 单文件不支持多副本并发写）。
catalogPersistence:
  enabled: true
  mountPath: /data
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  existingClaim: ""

# ---- 环境变量（仅非敏感项，进 ConfigMap；凭据见上方 credentials）----
# 契约按 runner 实测对齐（台账 #126）：
#   - CATALOG_IO__IMPL 用**双**下划线：Iceberg REST 的 Env 映射把属性名里的 '-'
#     记作 '__'，'io-impl' ⇒ 'IO__IMPL'（runner 实跑 properties:
#     io-impl=org.apache.iceberg.aws.s3.S3FileIO）。单下划线映射不到。
#   - S3 凭证用 AWS SDK 标准名 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
#     AWS_REGION（旧值 CATALOG_S3_ACCESS_KEY / CATALOG_S3_SECRET_KEY /
#     CATALOG_S3_REGION 不是该镜像认的键）。
#   - CATALOG_S3_PATH__STYLE__ACCESS=true 必须开：虚拟主机式寻址会把 bucket 拼到
#     endpoint 主机名前面，解析到 <bucket>.<endpoint> 而失败（runner 实测：未开时
#     建表 500 UnknownHostException: probe-bucket.rustfs；开启后建表 200）。
env:
  CATALOG_IO__IMPL: "org.apache.iceberg.aws.s3.S3FileIO"
  CATALOG_WAREHOUSE: "s3://lakehouse/warehouse"
  # 对象存储 Service 名（chart 名保留 minio，见台账 #17 的命名处置说明）
  CATALOG_S3_ENDPOINT: "http://minio:9000"
  CATALOG_S3_PATH__STYLE__ACCESS: "true"
  AWS_REGION: "us-east-1"
  LOG_LEVEL: "info"
  JAVA_OPTS: ""

# ---- Service ----
service:
  type: ClusterIP
  port: 8181
  containerPort: 8181

# ---- 资源配额（standard 档）----
resources:
  requests:
    cpu: "0.5"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

# ---- 安全上下文 ----
securityContext:
  enabled: true
  runAsNonRoot: true
  # 镜像默认用户 iceberg，uid/gid=1000（runner 实测 `id` 输出）
  runAsUser: 1000
  runAsGroup: 1000
  # fsGroup 让 catalog 挂载卷可写（sqlite 目录权限问题，runner 实测）
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- 健康检查 ----
# 路径必须是 /v1/config：该镜像**不实现** /health、/healthz、/readyz，
# 三个路径 runner 实测全部返回 400（旧值必然导致 Pod 永远 NotReady）。
probes:
  liveness:
    enabled: true
    httpGet:
      path: /v1/config
      port: 8181
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /v1/config
      port: 8181
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

# ---- 扩缩容 /  disruptions / Ingress：默认关闭 ----
# HPA 与 PDB 都依赖多副本，而 sqlite 单文件后端下多副本会表清单分叉
# ⇒ 开启 HPA 前必须先把 catalog.uri 指向外部共享 JDBC 库。
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

ingress:
  enabled: false
  className: apisix
  annotations: {}
  hosts:
    - host: iceberg-rest.shuqing.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}

# ---- NetworkPolicy / ServiceMonitor ----
networkPolicy:
  enabled: false

# ServiceMonitor 默认关闭：该镜像未暴露 /metrics（服务端 21 个源文件扫描 0 命中），
# 指标是**推送模式**（上游观测栈抓 otel-collector:8889）⇒ 抓取式采集器无对象可抓。
# 与台账 #130（OTel collector chart 缺失）同源。
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

# ============================================================================
# 版本三轴（不可混引，台账 #126）
#   ① Java 侧 Iceberg 库版本   = 1.12.0
#      （platform/flink-cdc/pom.xml:41、platform/governance/real-time-pipeline/pom.xml:25、
#        platform/stream-batch-scheduler/pom.xml:26 的 <iceberg.version>）
#   ② Spark 运行时 Iceberg JAR = iceberg-spark-runtime-4.1_2.13-1.11.0.jar
#      （platform/batch-pipeline/config/pipeline.json:174）⇒ 1.11.0
#   ③ REST catalog 服务端镜像   = tabulario/iceberg-rest:1.6.0 ⇒ 1.6.0
# 三者是**不同的轴**（库 / 客户端运行时 / 服务端实现），任何一处引用都不得
# 拿另一个轴的数字来对齐或类比。
# ============================================================================
