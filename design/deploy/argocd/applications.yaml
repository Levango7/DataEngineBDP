# ============================================================================
# ArgoCD Applications · 10 个关键组件 × 3 环境 = 30 个 Application
# ============================================================================
# 仓库：https://github.com/Levango7/DataEngineBDP
# 分支：main
# 同步策略：automated(prune + selfHeal) + retry(5, exponential backoff)
# 同步波次：确保依赖顺序（数据存储 → 计算引擎 → 业务服务 → 应用层）
#
# 同步波次说明：
#   wave -3：数据存储层（kafka, doris）
#   wave -2：计算引擎层（spark, flink, trino）
#   wave  0：业务服务层（encaps-layer, sql-gateway, catalog, rule-engine）
#   wave  1：应用层（superset）
# 注：ArgoCD 中 wave 值小的先同步，负数先于正数
# ============================================================================

# ============================================================================
# dev 环境 Applications
# ============================================================================

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-kafka
  namespace: argocd
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: gitops
    environment: dev
    component: kafka
    sync-wave: "-3"
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-dev
  source:
    repoURL: https://github.com/Levango7/DataEngineBDP
    targetRevision: main
    path: design/deploy/charts/kafka
    helm:
      releaseName: kafka
      valueFiles:
        - values.yaml
        - ../../values/env/dev/kafka-values.yaml
      version: v2
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-engine
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10

