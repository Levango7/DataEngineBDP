# staging 环境 patch
# ============================================================================
# staging：2 副本 + 中资源 + INFO 日志
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encaps-layer
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: encaps-layer
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: staging
            - name: LOG_LEVEL
              value: INFO
            - name: K8S_MOCK_ENABLED
              value: "false"