# 同步策略模板二：手动同步（prod 推荐用于关键变更）
# ============================================================================
# 适用于：prod 关键变更，需人工确认后再 sync
# 操作：Git push 后，ArgoCD UI 点 Sync 或 argocd app sync <app>
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sync-policy-template-manual
  namespace: argocd
  annotations:
    description: "模板：手动同步（prod 关键变更）"
    note: "此为模板，不实际部署，复制 spec.syncPolicy 到真实 Application"
spec:
  project: default
  source:
    repoURL: https://github.com/Levango7/DataEngineBDP
    targetRevision: main
    path: design/deploy/argocd/kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod-platform
  syncPolicy:
    # 不配置 automated → 默认手动同步
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 2
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m