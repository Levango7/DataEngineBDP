# Webhook 凭证 Secret · 漂移告警渠道密钥
# ============================================================================
# 作用：存储 Slack / 邮件 / 钉钉 / PagerDuty 的凭证
# 安全：生产环境应通过 SealedSecrets / External Secrets Operator 注入
#       此处为占位符，部署时替换
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications
    app.kubernetes.io/part-of: gitops
    app.kubernetes.io/component: drift-alerting
  annotations:
    description: "ArgoCD Notifications 凭证（占位符，部署时替换）"
    note: "生产环境通过 SealedSecrets / External Secrets Operator 注入"
type: Opaque
stringData:
  # Slack Bot Token（xoxb-开头）
  # 生成方式：Slack → Apps → Your Apps → OAuth & Permissions → Bot User OAuth Token
  slack-token: "REPLACE_WITH_SLACK_BOT_TOKEN"

  # 邮件 SMTP 凭证
  email-username: "argocd-drift@company.com"
  email-password: "REPLACE_WITH_EMAIL_PASSWORD"

  # 钉钉机器人 access_token
  # 生成方式：钉钉群 → 群设置 → 智能群助手 → 自定义机器人 → 安全设置加签
  dingtalk-token: "REPLACE_WITH_DINGTALK_TOKEN"

  # PagerDuty Integration Key
  # 生成方式：PagerDuty → Services → New Service → Integration → Events API v2
  pagerduty-key: "REPLACE_WITH_PAGERDUTY_KEY"