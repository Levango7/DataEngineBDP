# 漂移修复 RoleBinding · 绑定 ServiceAccount 与 Role
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-remediation-binding
  namespace: argocd
  labels:
    app.kubernetes.io/name: drift-remediation
    app.kubernetes.io/part-of: gitops
subjects:
  - kind: ServiceAccount
    name: argocd-remediation-sa
    namespace: argocd
roleRef:
  kind: Role
  name: drift-remediation-role
  apiGroup: rbac.authorization.k8s.io