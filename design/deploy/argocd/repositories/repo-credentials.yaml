# ArgoCD 仓库凭证 Secret · GitHub Levango7/DataEngineBDP
# ============================================================================
# 用法：
#   1. 创建 GitHub Personal Access Token（PAT），scope: repo + read:org
#   2. 部署时替换 password 占位符为真实 PAT：
#      sed -i 's/REPLACE_WITH_GITHUB_PAT/<your-pat>/' repositories/repo-credentials.yaml
#   3. kubectl apply -f design/deploy/argocd/repositories/repo-credentials.yaml
#
# 安全提示：
#   - PAT 仅用于 dev/staging 联调，生产环境改用 SSH deploy key 或 GitHub App
#   - 此 Secret 应通过 SealedSecrets / External Secrets Operator 注入，不入 Git 明文
#   - 提交前确认 password 字段是占位符而非真实 token
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: repo-levango7-dataenginebdp
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: gitops
type: Opaque
stringData:
  # GitHub 仓库 URL（HTTPS）
  url: https://github.com/Levango7/DataEngineBDP
  # 认证方式：https（用户名 + PAT）
  username: Levango7
  # PAT 占位符 —— 部署时替换为真实 token
  # 生成方式：GitHub → Settings → Developer settings → Personal access tokens → Fine-grained
  #   scope: Contents (read) + Metadata (read)
  password: REPLACE_WITH_GITHUB_PAT
  # 默认分支
  defaultBranch: main