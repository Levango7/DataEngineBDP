# =============================================================================
# 数据引擎大数据平台 - Phase 1a 开发依赖中间件 docker-compose
# -----------------------------------------------------------------------------
# 文件路径: design/deploy/dev/docker-compose-middleware.yml
# 用途: 为 Phase 1a 不依赖 K8s 的本地开发任务提供中间件支撑
#
# 覆盖任务:
#   - T008 多模态切片器        → Milvus + MinIO
#   - T009 混合检索与重排序    → Milvus + NebulaGraph + Elasticsearch
#   - T012 Calcite 联邦优化器  → PostgreSQL + Trino(可选，本文件用 PostgreSQL 模拟测试数据源)
#   - T014 Flink CDC 管道      → Flink + Kafka + MySQL + PostgreSQL
#   - T018 金融模板            → 无外部依赖（仅占位）
#   - T022 CryptoSpiFactory    → 无外部依赖（仅占位）
#
# 启动说明:
#   # 启动全部中间件
#   docker compose -f design/deploy/dev/docker-compose-middleware.yml up -d
#
#   # 查看运行状态
#   docker compose -f design/deploy/dev/docker-compose-middleware.yml ps
#
#   # 查看某服务日志（例如 kafka）
#   docker compose -f design/deploy/dev/docker-compose-middleware.yml logs -f kafka
#
#   # 健康检查总览
#   docker compose -f design/deploy/dev/docker-compose-middleware.yml ps --format json
#
#   # 停止全部中间件（保留数据卷）
#   docker compose -f design/deploy/dev/docker-compose-middleware.yml down
#
#   # 停止并清除数据卷（⚠️ 会丢失所有数据，开发重置时使用）
#   docker compose -f design/deploy/dev/docker-compose-middleware.yml down -v
#
# 端口约定:
#   所有对外端口使用 1xxxx 段，避免与本机原生服务（3306/5432/9092/9200 等）冲突。
#   - 19092 Kafka
#   - 19530 / 9091  Milvus
#   - 9669  NebulaGraph
#   - 13306 MySQL
#   - 15432 PostgreSQL
#   - 19000 / 19001 MinIO API / Console
#   - 19200 / 19300 Elasticsearch / Transport
#   - 18089 Flink JobManager Web
#   - 16379 Redis
# =============================================================================


networks:
  # 开发环境隔离网络，所有中间件在此网络内通过服务名互通
  dev:
    name: sq-dev-net
    driver: bridge

volumes:
  # ---------- Kafka ----------
  kafka-data:
  # ---------- Milvus ----------
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  # ---------- NebulaGraph ----------
  nebula-graphd-data:
  nebula-metad-data:
  nebula-storaged-data:
  # ---------- 关系数据库 ----------
  mysql-source-data:
  postgresql-source-data:
  # ---------- 对象存储 ----------
  minio-data:
  # ---------- 搜索引擎 ----------
  elasticsearch-data:
  # ---------- Redis ----------
  redis-data:
  # ---------- Flink ----------
  flink-jm-data:
  flink-tm-data:

services:
  # ===========================================================================
  # 1. 消息队列 - Kafka
  #    用途: T005 MAOP 编排 Agent 间异步通信；T014 Flink CDC 中转 Topic
  #    版本: confluentinc/cp-kafka:7.6.0 (对应 Kafka 3.6.x 内核)
  #    依赖: KRaft 模式（无需 ZooKeeper，简化本地开发）
  # ===========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sq-dev-kafka
    hostname: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "sq-dev-kafka-cluster"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ===========================================================================
  # 2. 向量数据库 - Milvus Standalone
  #    用途: T008 多模态切片器 Embedding 向量入库；T009 混合检索向量路
  #    版本: milvusdb/milvus:v2.4.0
  #    依赖: 内嵌 etcd + minio（与外部 minio 服务分离，避免开发环境耦合）
  # ===========================================================================
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: sq-dev-milvus-etcd
    hostname: milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: "revision"
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    networks:
      - dev
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: sq-dev-milvus-minio
    hostname: milvus-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus-minio-data:/minio_data
    networks:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    container_name: sq-dev-milvus
    hostname: milvus-standalone
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    networks:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ===========================================================================
  # 3. 图数据库 - NebulaGraph 3.6.0
  #    用途: T009 混合检索图谱路；T008 知识图谱切片关联
  #    架构: graphd（查询）+ metad（元数据）+ storaged（存储）三服务
  # ===========================================================================
  nebula-metad:
    image: vesoft/nebula-metad:v3.6.0
    container_name: sq-dev-nebula-metad
    hostname: nebula-metad
    command:
      - "--meta_server_addrs=nebula-metad:9559"
      - "--local_ip=nebula-metad"
      - "--ws_http_port=9558"
    ports:
      - "9559:9559"
      - "9558:9558"
    volumes:
      - nebula-metad-data:/data/meta
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9558/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.6.0
    container_name: sq-dev-nebula-storaged
    hostname: nebula-storaged
    command:
      - "--meta_server_addrs=nebula-metad:9559"
      - "--local_ip=nebula-storaged"
      - "--ws_http_port=9778"
    ports:
      - "9779:9779"
      - "9778:9778"
    volumes:
      - nebula-storaged-data:/data/storage
    depends_on:
      nebula-metad:
        condition: service_healthy
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9778/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nebula-graph:
    image: vesoft/nebula-graphd:v3.6.0
    container_name: sq-dev-nebula-graph
    hostname: nebula-graph
    command:
      - "--meta_server_addrs=nebula-metad:9559"
      - "--local_ip=nebula-graph"
      - "--ws_http_port=9668"
    ports:
      - "9669:9669"
      - "9668:9668"
    volumes:
      - nebula-graphd-data:/data/graph
    depends_on:
      nebula-metad:
        condition: service_healthy
      nebula-storaged:
        condition: service_healthy
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9668/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # 4. 关系数据库 - MySQL 8.0 (CDC 源)
  #    用途: T014 Flink CDC 源（MySQL → Kafka → Iceberg）
  #    配置: 开启 binlog（ROW 模式）以支持 Debezium/Flink CDC
  # ===========================================================================
  mysql-source:
    image: mysql:8.0
    container_name: sq-dev-mysql-source
    hostname: mysql-source
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test123}
      MYSQL_DATABASE: "sq_cdc_source"
      MYSQL_USER: "sq_cdc"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sq_cdc_pwd}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-source-data:/var/lib/mysql
    networks:
      - dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptest123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # 5. 关系数据库 - PostgreSQL 15 (CDC 源 + 联邦测试数据源)
  #    用途: T014 Flink CDC 源；T012 Calcite 联邦优化器测试数据源
  #    配置: 开启 logical replication + wal2json 解码插件（pgoutput 内置）
  # ===========================================================================
  postgresql-source:
    image: postgres:15
    container_name: sq-dev-postgresql-source
    hostname: postgresql-source
    ports:
      - "15432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test123}
      POSTGRES_DB: "sq_federal_test"
      POSTGRES_USER: "sq_federal"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "shared_preload_libraries=pglogical"
    volumes:
      - postgresql-source-data:/var/lib/postgresql/data
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U sq_federal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ===========================================================================
  # 6. 对象存储 - MinIO
  #    用途: T008 多模态切片原始文件存储；Milvus 备份；Iceberg 表存储（开发）
  #    凭据: minioadmin / minioadmin（仅开发环境，生产禁用）
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: sq-dev-minio
    hostname: minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ===========================================================================
  # 7. 搜索引擎 - Elasticsearch 8.14.1 (BM25)
  #    用途: T009 混合检索 BM25 路；T012 Calcite 联邦 ES 数据源
  #    配置: single-node + 关闭 xpack 安全（仅开发环境）
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    container_name: sq-dev-elasticsearch
    hostname: elasticsearch
    ports:
      - "19200:9200"
      - "19300:9300"
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: "sq-dev-es"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  # ===========================================================================
  # 8. 缓存 - Redis 7
  #    用途: 开发态通用缓存（会话/限流/向量检索结果缓存）
  #    版本: redis:7-alpine（轻量）
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sq-dev-redis
    hostname: redis
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "test123"]
    volumes:
      - redis-data:/data
    networks:
      - dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ===========================================================================
  # 9. Flink 1.18.1 集群（CDC 处理）
  #    用途: T014 Flink CDC 管道运行时（JobManager + TaskManager）
  #    配置: 1 JM + 1 TM（开发最小拓扑，生产应≥2 TM）
  # ===========================================================================
  flink-jobmanager:
    image: flink:1.18.1
    container_name: sq-dev-flink-jm
    hostname: flink-jobmanager
    ports:
      - "18089:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.port: 8081
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 60s
    volumes:
      - flink-jm-data:/opt/flink/checkpoints
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  flink-taskmanager:
    image: flink:1.18.1
    container_name: sq-dev-flink-tm
    hostname: flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2048m
    volumes:
      - flink-tm-data:/opt/flink/data
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://flink-jobmanager:8081/taskmanagers | grep -q taskmanagers || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s