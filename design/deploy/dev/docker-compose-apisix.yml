name: bdp-apisix

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: sq-etcd
    restart: unless-stopped
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      etcd --listen-client-urls=http://0.0.0.0:2379
      --advertise-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd-data
    networks:
      bdp-apisix-net:
        ipv4_address: 172.31.90.2

  apisix:
    image: apisix:3.9.1-fixed
    container_name: sq-apisix
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      ETCD_HOST: sq-etcd
      ETCD_PORT: "2379"
    ports:
      - "9080:9080"    # APISIX data plane
      - "9180:9180"    # Admin API
    networks:
      bdp-apisix-net:
        ipv4_address: 172.31.90.3

networks:
  bdp-apisix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.90.0/24
