apisix:
  node_listen: 9080
  enable_admin: true
  enable_heartbeat: true
  enable_reuse_port: true

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "http://sq-etcd:2379"
    prefix: "/apisix"
    timeout: 30
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
    admin_listen:
      ip: 0.0.0.0
      port: 9180

plugins:
  - limit-req
  - limit-count
  - limit-conn
  - proxy-rewrite
  - uri-blocker
  - ip-restriction
  - cors
  - prometheus
  - zipkin
  - request-id
  - jwt-auth
  - authz-keycloak

stream_proxy:
  tcp: {}
  udp: {}
