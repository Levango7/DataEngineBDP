# ============================================================================
# 第6章 封装层 API 契约（参考，非 K8s 资源）
# ============================================================================
# 上述 CRD 经封装层（encaps-layer）翻译为客户可操作 API，租户无需直接编辑 CRD。
# 封装层 API 契约（前缀 /api/mesh/v1/）：
#
#   | 能力       | 端点                          | 请求                                          | 响应                                  |
#   | ---------- | ----------------------------- | --------------------------------------------- | ------------------------------------- |
#   | 灰度发布   | POST /canary                  | { service, stable, canary, weight }           | { canaryId, status }                  |
#   | 灰度查询   | GET /canary/{id}              | -                                             | { stableWeight, canaryWeight, errorRate, latencyP99 } |
#   | 灰度全量   | POST /canary/{id}/promote     | -                                             | { status }                            |
#   | 灰度回滚   | POST /canary/{id}/rollback    | -                                             | { status }                            |
#   | 熔断配置   | PUT /circuit/{service}        | { consecutive5xx, interval, ejectTime }       | { status }                            |
#   | 重试配置   | PUT /retry/{service}          | { attempts, perTryTimeout, retryOn }          | { status }                            |
#   | 限流配置   | PUT /ratelimit/{service}      | { maxConnections, maxPendingRequests }        | { status }                            |
#   | mTLS 策略  | PUT /mtls/{namespace}         | { mode: strict|permissive }                   | { status }                            |
#   | 拓扑查询   | GET /topology/{namespace}     | -                                             | { nodes, edges, health }              |
#
# 封装层通过 K8s RBAC 限制租户仅能操作本 Namespace 的 CRD：
#   - Role: 仅允许 verbs=[get,list,watch,create,update,patch,delete] on
#           resources=[virtualservices,destinationrules,peerauthentications,authorizationpolicies]
#   - RoleBinding: 绑定租户 ServiceAccount 到上述 Role
#   详见：design/deploy/charts/encaps-layer/（封装层 Helm Chart 管理 RBAC）
# ============================================================================
# 验收对照表
# ============================================================================
# | 验收项（PRD/Phase1 计划）                                  | 本文件落地位置                  | 状态 |
# | ---------------------------------------------------------- | ------------------------------- | ---- |
# | sql-gateway->引擎链路 5%/20%/100% 灰度                     | 1.1-1.8 VirtualService weight  | OK   |
# | 连续 5xx >= 5 触发熔断 30s                                  | 2.1-2.5 outlierDetection       | OK   |
# | 重试默认 3 次                                              | 3.1-3.2 retries.attempts=3     | OK   |
# | 超时配置                                                   | 3.1-3.2 timeout=30s            | OK   |
# | 限流（连接池）                                             | 2.1-2.5 connectionPool         | OK   |
# | CRD 经封装层暴露给租户，租户仅操作本 Namespace             | 4.1-4.6 Sidecar/AuthZ/LimitRange | OK |
# | mTLS STRICT（引擎命名空间）                                | 0 PeerAuthentication           | OK   |
# | 国密 SM4 WASM（信创环境）                                  | 5 EnvoyFilter（注释，按需启用）| PAUSE |
# ============================================================================