# ============================================================================
# 数据引擎大数据平台 V2.0 · Istio 流量治理策略总配置
# ============================================================================
# 所属任务：T002 流量灰度 / 熔断 / 限流 / 重试规则配置
# 依赖任务：T001 Service Mesh 控制面部署与 Sidecar 注入
# 输出路径：design/deploy/istio/traffic-policies.yaml
# 适用 Istio：>= 1.20（API 版本 networking.istio.io/v1beta1 / security.istio.io/v1beta1）
#
# 对应需求：
#   - REQ-CN-001 Service Mesh（Istio）流量治理（V2.0 PRD 3.1）
#   - 验收标准：sql-gateway -> 引擎（Trino/Doris/Spark/Flink）链路支持 5%/20%/100% 灰度；
#              连续 5xx >= 5 触发熔断 30s；CRD 经封装层暴露给租户，租户仅能操作本 Namespace 资源
#   - 详见：design/v2.0/详细设计/V2.0_云原生增强详细设计.md 2.5 流量治理
#
# 部署方式：
#   kubectl apply -f design/deploy/istio/traffic-policies.yaml
#
# 灰度比例切换（经封装层 API POST /api/mesh/v1/canary）：
#   封装层翻译为对下方 VirtualService 的 weight 字段 patch，租户无需直接编辑 CRD。
#   - 5%  灰度：canary.weight=5,  stable.weight=95   （初始验证）
#   - 20% 灰度：canary.weight=20, stable.weight=80   （扩大验证）
#   - 100% 全量：canary.weight=100, stable.weight=0  （promote）
#   - 回滚：    canary.weight=0,   stable.weight=100 （rollback）
# ============================================================================

# ----------------------------------------------------------------------------
# 0. 命名空间：平台引擎命名空间 shuqing-system
# ----------------------------------------------------------------------------
# sql-gateway 与 Trino/Doris/Spark/Flink 引擎均部署于 shuqing-system，
# 该 Namespace 由 T001 sidecar 注入策略打标 istio-injection=enabled。
# 此处仅声明式呈现，实际由封装层创建；若已存在可重复 apply（幂等）。
apiVersion: v1
kind: Namespace
metadata:
  name: shuqing-system
  labels:
    istio-injection: enabled                # T001 sidecar 自动注入
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: platform-engines
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ----------------------------------------------------------------------------
# 1. PeerAuthentication · 引擎命名空间强制 mTLS STRICT
# ----------------------------------------------------------------------------
# 全局默认 PERMISSIVE（T001 已部署于 istio-system），此处 per-Namespace 覆盖为 STRICT，
# 强制 sql-gateway <-> 引擎间通信全走 mTLS，满足等保三级传输加密要求。
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-mtls
spec:
  mtls:
    mode: STRICT
---
# ============================================================================
# 第1章 流量灰度（金丝雀发布）
# ============================================================================
# 通过 VirtualService + DestinationRule 组合实现 sql-gateway -> 引擎链路按流量比例灰度。
# 每个引擎定义 stable / canary 两个 subset（按 Pod label version 区分），
# VirtualService 按 weight 分流，并支持 x-canary Header 强制灰度（内部测试用）。
#
# 灰度比例矩阵（对应验收标准 5%/20%/100%）：
#   | 引擎    | stable 版本 | canary 版本 | 初始灰度比例 | 说明                     |
#   | ------- | ----------- | ----------- | ------------ | ------------------------ |
#   | trino   | v428        | v430        | 5%           | 引擎升级初始验证         |
#   | doris-fe| v2.1        | v2.1.x      | 20%          | 扩大灰度验证             |
#   | spark   | v3.5        | v3.5.x      | 100% stable  | 全量稳定，注释演示切换   |
#   | flink   | v1.18       | v1.18.x     | 100% stable  | 全量稳定                 |
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# 1.1 DestinationRule · Trino 灰度 subset 定义
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: trino-canary
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-canary
    shuqing.io/service: trino
spec:
  host: trino
  subsets:
    - name: stable
      labels:
        version: v428                       # 稳定版 Trino 428
    - name: canary
      labels:
        version: v430                       # 金丝雀版 Trino 430
---
# ----------------------------------------------------------------------------
# 1.2 VirtualService · sql-gateway -> Trino 灰度路由（5% canary）
# ----------------------------------------------------------------------------
# 路由规则：
#   1) Header x-canary=true 强制走 canary（内部测试用，bypass weight）
#   2) 其余流量按 weight 分流：stable 95% / canary 5%（初始灰度）
# 重试与超时见 3.1（统一在 engine-retry-timeout VirtualService 配置）。
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: trino-canary
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-canary
    shuqing.io/service: trino
spec:
  hosts:
    - trino
  http:
    - name: canary-force                    # Header 强制灰度（内部测试）
      match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: trino
            subset: canary
    - name: weighted-canary                 # 按比例灰度
      route:
        - destination:
            host: trino
            subset: stable
          weight: 95                        # 稳定版 95%
        - destination:
            host: trino
            subset: canary
          weight: 5                         # 金丝雀版 5%（初始灰度）
---
# ----------------------------------------------------------------------------
# 1.3 DestinationRule · Doris-FE 灰度 subset 定义
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: doris-fe-canary
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-canary
    shuqing.io/service: doris-fe
spec:
  host: doris-fe
  subsets:
    - name: stable
      labels:
        version: v2.1                       # 稳定版 Doris 2.1
    - name: canary
      labels:
        version: v2.1.x                     # 金丝雀版 Doris 2.1.x
---
# ----------------------------------------------------------------------------
# 1.4 VirtualService · sql-gateway -> Doris-FE 灰度路由（20% canary）
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: doris-fe-canary
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-canary
    shuqing.io/service: doris-fe
spec:
  hosts:
    - doris-fe
  http:
    - name: canary-force
      match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: doris-fe
            subset: canary
    - name: weighted-canary
      route:
        - destination:
            host: doris-fe
            subset: stable
          weight: 80                        # 稳定版 80%
        - destination:
            host: doris-fe
            subset: canary
          weight: 20                        # 金丝雀版 20%（扩大灰度）
---
# ----------------------------------------------------------------------------
# 1.5 DestinationRule · Spark 灰度 subset 定义
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: spark-canary
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-canary
    shuqing.io/service: spark
spec:
  host: spark
  subsets:
    - name: stable
      labels:
        version: v3.5                       # 稳定版 Spark 3.5
    - name: canary
      labels:
        version: v3.5.x                     # 金丝雀版 Spark 3.5.x
---
# ----------------------------------------------------------------------------
# 1.6 VirtualService · sql-gateway -> Spark 灰度路由（100% stable，演示全量切换）
# ----------------------------------------------------------------------------
# 当前 100% stable（未启动灰度）。启动灰度时将 weight 调整为 95/5、80/20、0/100。
# 全量切换（promote）：stable.weight=0, canary.weight=100，再将 canary label 改为 stable。
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: spark-canary
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-canary
    shuqing.io/service: spark
spec:
  hosts:
    - spark
  http:
    - name: canary-force
      match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: spark
            subset: canary
    - name: weighted-canary
      route:
        - destination:
            host: spark
            subset: stable
          weight: 100                       # 稳定版 100%（未启动灰度）
        - destination:
            host: spark
            subset: canary
          weight: 0                         # 金丝雀版 0%
---
# ----------------------------------------------------------------------------
# 1.7 DestinationRule · Flink 灰度 subset 定义
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: flink-canary
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-canary
    shuqing.io/service: flink
spec:
  host: flink
  subsets:
    - name: stable
      labels:
        version: v1.18                      # 稳定版 Flink 1.18
    - name: canary
      labels:
        version: v1.18.x                    # 金丝雀版 Flink 1.18.x
---
# ----------------------------------------------------------------------------
# 1.8 VirtualService · sql-gateway -> Flink 灰度路由（100% stable）
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: flink-canary
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-canary
    shuqing.io/service: flink
spec:
  hosts:
    - flink
  http:
    - name: canary-force
      match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: flink
            subset: canary
    - name: weighted-canary
      route:
        - destination:
            host: flink
            subset: stable
          weight: 100                       # 稳定版 100%
        - destination:
            host: flink
            subset: canary
          weight: 0                         # 金丝雀版 0%
---
# ============================================================================
# 第2章 熔断（断路器）+ 限流（连接池）
# ============================================================================
# DestinationRule.trafficPolicy.outlierDetection 实现熔断，防级联故障。
# DestinationRule.trafficPolicy.connectionPool 实现限流，保护下游引擎。
#
# 熔断规则（对应验收标准）：连续 5xx >= 5 触发熔断 30s
#   - consecutive5xxErrors: 5
#   - interval: 30s          （检测间隔）
#   - baseEjectionTime: 30s  （熔断时长，对应验收标准 "触发熔断 30s"）
#   - maxEjectionPercent: 50 （最大熔断实例比例，避免全实例熔断）
#
# 限流规则（连接池）：
#   - tcp.maxConnections: 100         （最大 TCP 连接数）
#   - http.http1MaxPendingRequests: 50（HTTP/1.1 最大挂起请求）
#   - http.maxRequestsPerConnection: 10（单连接最大请求数，复用连接）
#   - http.h2MaxRequests: 1000        （HTTP/2 最大并发请求）
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# 2.1 DestinationRule · Trino 熔断 + 限流
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: trino-circuit-breaker
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-circuit-breaker
    shuqing.io/service: trino
spec:
  host: trino
  trafficPolicy:
    # ---- 熔断（断路器）----
    outlierDetection:
      consecutive5xxErrors: 5              # 连续 5 次 5xx 触发熔断
      interval: 30s                        # 检测间隔 30s
      baseEjectionTime: 30s                # 熔断时长 30s（验收标准）
      maxEjectionPercent: 50               # 最大熔断实例比例 50%
      consecutiveLocalOriginFailures: 5    # 本地 origin 失败也计入（同节点）
      splitExternalLocalOriginErrors: true # 区分外部/本地错误
    # ---- 限流（连接池）----
    connectionPool:
      tcp:
        maxConnections: 100                # 最大 TCP 连接数
        connectTimeout: 5s                 # 连接建立超时
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 50        # HTTP/1.1 最大挂起请求
        http2MaxRequests: 1000             # HTTP/2 最大并发请求
        maxRequestsPerConnection: 10       # 单连接最大请求数
        maxRetries: 3                       # 连接级最大重试数
        idleTimeout: 10m                   # 空闲连接超时
        h2UpgradePolicy: UPGRADE            # HTTP/1.1 升级 HTTP/2
    # ---- 负载均衡 ----
    loadBalancer:
      simple: LEAST_REQUEST                # 最少请求数，适合长查询引擎
---
# ----------------------------------------------------------------------------
# 2.2 DestinationRule · Doris-FE 熔断 + 限流
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: doris-fe-circuit-breaker
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-circuit-breaker
    shuqing.io/service: doris-fe
spec:
  host: doris-fe
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      consecutiveLocalOriginFailures: 5
      splitExternalLocalOriginErrors: true
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 5s
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
        idleTimeout: 10m
        h2UpgradePolicy: UPGRADE
    loadBalancer:
      simple: LEAST_REQUEST
---
# ----------------------------------------------------------------------------
# 2.3 DestinationRule · Spark 熔断 + 限流
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: spark-circuit-breaker
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-circuit-breaker
    shuqing.io/service: spark
spec:
  host: spark
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      consecutiveLocalOriginFailures: 5
      splitExternalLocalOriginErrors: true
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 5s
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
        idleTimeout: 10m
        h2UpgradePolicy: UPGRADE
    loadBalancer:
      simple: LEAST_REQUEST
---
# ----------------------------------------------------------------------------
# 2.4 DestinationRule · Flink 熔断 + 限流
# ----------------------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: flink-circuit-breaker
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-circuit-breaker
    shuqing.io/service: flink
spec:
  host: flink
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      consecutiveLocalOriginFailures: 5
      splitExternalLocalOriginErrors: true
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 5s
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
        idleTimeout: 10m
        h2UpgradePolicy: UPGRADE
    loadBalancer:
      simple: LEAST_REQUEST
---
# ----------------------------------------------------------------------------
# 2.5 DestinationRule · sql-gateway 熔断 + 限流（被 APISIX/前端调用侧）
# ----------------------------------------------------------------------------
# sql-gateway 作为被调用方（APISIX -> sql-gateway），同样配置熔断保护。
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: sql-gateway-circuit-breaker
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-circuit-breaker
    shuqing.io/service: sql-gateway
spec:
  host: sql-gateway
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      consecutiveLocalOriginFailures: 5
      splitExternalLocalOriginErrors: true
    connectionPool:
      tcp:
        maxConnections: 200                # sql-gateway 并发更高
        connectTimeout: 5s
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 2000
        maxRequestsPerConnection: 20
        maxRetries: 3
        idleTimeout: 10m
        h2UpgradePolicy: UPGRADE
    loadBalancer:
      simple: LEAST_REQUEST
---
# ============================================================================
# 第3章 重试 + 超时
# ============================================================================
# VirtualService.http.retries + timeout 实现重试与超时，提升临时故障容错。
#
# 重试策略（对应验收标准 "默认 3 次"）：
#   - attempts: 3                           # 最多重试 3 次
#   - perTryTimeout: 10s                    # 单次尝试超时 10s
#   - retryOn: 5xx,reset,connect-failure,refused-stream
#   - retryRemoteLocalities: true           # 跨 locality 重试
#
# 超时策略：
#   - sql-gateway -> 引擎：30s（SQL 查询链路，容忍较长执行）
#   - APISIX -> sql-gateway：30s
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# 3.1 VirtualService · sql-gateway -> 引擎重试 + 超时
# ----------------------------------------------------------------------------
# 此 VirtualService 作用于 sql-gateway 发出的出站流量（hosts: trino/doris-fe/spark/flink），
# 统一配置重试与超时。与 1 灰度 VirtualService 合并时，重试/超时字段会叠加生效。
# 为避免与灰度 VirtualService 冲突，此处采用独立 VirtualService 覆盖全局默认重试策略。
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: engine-retry-timeout
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-retry-timeout
spec:
  hosts:
    - trino
    - doris-fe
    - spark
    - flink
  http:
    - name: engine-default
      timeout: 30s                          # 单请求总超时 30s
      retries:
        attempts: 3                         # 最多重试 3 次（验收标准）
        perTryTimeout: 10s                 # 单次尝试超时 10s
        retryOn: 5xx,reset,connect-failure,refused-stream,gateway-error,cancelled,retriable-status-codes
        retryRemoteLocalities: true        # 跨 locality 重试
      route:
        - destination:
            host: trino                     # 默认 host，被 hosts 列表各自覆盖
---
# ----------------------------------------------------------------------------
# 3.2 VirtualService · APISIX -> sql-gateway 重试 + 超时
# ----------------------------------------------------------------------------
# APISIX 网关转发到 sql-gateway 的入站流量，配置重试与超时。
# 注意：APISIX 自身也有重试，此处 Istio 重试作为第二道防线。
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: sql-gateway-retry-timeout
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-retry-timeout
spec:
  hosts:
    - sql-gateway
  http:
    - name: sql-gateway-default
      timeout: 30s                          # 单请求总超时 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: 5xx,reset,connect-failure,refused-stream,gateway-error
        retryRemoteLocalities: true
      route:
        - destination:
            host: sql-gateway
---
# ============================================================================
# 第4章 多租户隔离
# ============================================================================
# 通过 Sidecar CR + AuthorizationPolicy + LimitRange 三层实现多租户隔离：
#   1. Sidecar CR：限制 egress 仅本 Namespace + 白名单服务，跨租户流量默认拒绝
#   2. AuthorizationPolicy：仅允许 sql-gateway 调用引擎，引擎间按需互信
#   3. LimitRange：约束 Sidecar 资源上限，防 Sidecar 吃光租户配额
#
# 对应验收标准：CRD 经封装层暴露给租户，租户仅能操作本 Namespace 资源。
# 封装层通过 K8s RBAC（Role/RoleBinding per-Namespace）限制租户仅能操作本 Namespace 的
# VirtualService/DestinationRule，此处不展开 RBAC（由封装层 Helm Chart 管理）。
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# 4.1 Sidecar CR · 限制 shuqing-system egress 范围
# ----------------------------------------------------------------------------
# 仅发现本 Namespace 服务 + istio-system（istiod），减少 sidecar 内存占用并实现流量隔离。
# 跨租户流量默认拒绝（未在 egress 列出的 Namespace 不可达）。
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: shuqing-system-sidecar
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-tenant-isolation
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/part-of: shuqing-bigdata
  egress:
    - hosts:
        - "./*"                             # 本 Namespace 所有服务
        - "istio-system/*"                  # istiod（控制面通信）
    # 跨 Namespace 调用需在此显式声明，默认拒绝
---
# ----------------------------------------------------------------------------
# 4.2 AuthorizationPolicy · deny-all 默认拒绝
# ----------------------------------------------------------------------------
# 空 spec = deny-all，再由下方 ALLOW policy 显式放行。
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all-by-default
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-tenant-isolation
spec: {}
---
# ----------------------------------------------------------------------------
# 4.3 AuthorizationPolicy · 仅允许 sql-gateway 调用引擎
# ----------------------------------------------------------------------------
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-sql-gateway-to-engines
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-tenant-isolation
spec:
  selector:
    matchLabels:
      shuqing.io/role: engine               # 引擎 Pod 需打此 label
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/shuqing-system/sa/sql-gateway"
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
---
# ----------------------------------------------------------------------------
# 4.4 AuthorizationPolicy · 引擎间互信（Trino -> Doris via connector）
# ----------------------------------------------------------------------------
# Trino 跨源 connector 调用 Doris-FE（thrift/mysql 协议），需允许引擎间互信。
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-engine-to-engine
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-tenant-isolation
spec:
  selector:
    matchLabels:
      shuqing.io/role: engine
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/shuqing-system/sa/trino"
              - "cluster.local/ns/shuqing-system/sa/spark"
              - "cluster.local/ns/shuqing-system/sa/flink"
      to:
        - operation:
            ports: ["8080", "9030", "8030", "4040", "8081"]
---
# ----------------------------------------------------------------------------
# 4.5 AuthorizationPolicy · 允许 APISIX 入口调用 sql-gateway
# ----------------------------------------------------------------------------
# APISIX 网关（部署于 apisix Namespace）调用 sql-gateway，需显式允许。
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-apisix-to-sql-gateway
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-tenant-isolation
spec:
  selector:
    matchLabels:
      shuqing.io/role: gateway
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["apisix"]          # APISIX 所在 Namespace
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
---
# ----------------------------------------------------------------------------
# 4.6 LimitRange · Sidecar 资源约束（防 Sidecar 吃光配额）
# ----------------------------------------------------------------------------
apiVersion: v1
kind: LimitRange
metadata:
  name: sidecar-resource-limits
  namespace: shuqing-system
  labels:
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: traffic-tenant-isolation
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi                      # Sidecar 默认 request
      default:
        cpu: 500m
        memory: 512Mi                      # Sidecar 默认 limit
      max:
        cpu: 1
        memory: 1Gi                         # Sidecar 最大 limit
---
