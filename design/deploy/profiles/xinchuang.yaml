# ============================================================================
# Profile: 信创环境（xinchuang）
# 机器：客户自有信创服务器（鲲鹏/海光/飞腾）+ 国产 OS
# 铁律：K8s 一律自建，不启用任何云托管 K8s；国密按本 Profile 启用
# 关联：部署清单 v0.1 §5 抽象维度表 / publiccloud 注"云只作裸 VM"
# ============================================================================
meta:
  name: xinchuang
  k8s: self-built
  note: "鲲鹏920(arm64)/海光(x86)/飞腾 纳管；openEuler/麒麟/统信"

compute:
  arch: ["arm64", "x86"]
  os: ["openEuler", "kylin", "uos"]

images:
  baseImage: "base:openeuler-24.03"
  extraVariant: "openeuler"          # buildx 额外产出 openEuler 基础镜像变体

global:
  guomiEnabled: true
  guomiAlgos: ["SM2", "SM3", "SM4"]

storage:
  # 统一对象存储抽象（storage-io 0.1.0）: driver 与 values-base.yaml 注入约定对齐
  objectStore:
    driver: xcobject                 # 国产对象存储（S3 兼容 CSI）
    endpoint: "https://xc-obj.internal"
    csi: "csi-xc"
    # ---- storage-io 对接字段（S3 兼容）----
    pathStyle: true                 # 国产对象存储多需 path-style
    region: "us-east-1"
    accessKeySource: secret         # env | secret | customer-provided; 信创走昆仑/内部 secret
    encryption: sm4                 # 国密 SM4 加密
  # Iceberg Catalog 策略: hive 保留（兼容存量）; 信创/多租户建议 rest
  catalog:
    mode: hive                      # hive | rest
    restUri: ""                     # mode=rest 时必填, 如 http://iceberg-rest:8181

network:
  cni: "cilium"
  lb: "metallb"
  # ----------------------------------------------------------------------------
  # Ingress TLCP 配置（信创环境专用，R-021）
  # ----------------------------------------------------------------------------
  # 国密传输安全协议 TLCP（GB/T 38636）双证书配置：
  #   - 签名证书（sm2_sign）：SM2 签名证书，用于握手签名
  #   - 加密证书（sm2_enc）：SM2 加密证书，用于密钥交换与数据加密
  # 启用后 Ingress 强制 TLCP 协议，禁用 RSA/AES/SHA-1 等国际算法；
  # 非信创环境降级为 TLS1.3（见 publiccloud/onprem profile）。
  # 证书由商密 CA 签发，托管于 KMS（见 kms.driver=GuomiKMS）。
  # 关联：design/安全/国密认证材料/SM2SM3SM4技术实现说明.md §5
  ingress:
    tls:
      enabled: true
      protocol: TLCP                  # 国密 TLS（GB/T 38636）；非信创环境使用 TLS1.3
      cipher: "ECDHE-SM2-SM4-SM3"     # 国密套件：SM2 密钥交换 + SM4 加密 + SM3 摘要
      # 国密双证书（K8s Secret 引用，由 cert-manager 国密 issuer 签发）
      signSecretName: "platform-sm2-sign-cert"   # SM2 签名证书 Secret
      encSecretName: "platform-sm2-enc-cert"     # SM2 加密证书 Secret
      # 降级配置：非信创客户端兼容（可选）
      fallbackTls: false              # 信创环境建议 false（强制 TLCP）；混合环境可设 true

kms:
  driver: "GuomiKMS"                 # CryptoDriver 国密实现
  algo: ["SM2", "SM3", "SM4"]

identity:
  driver: "KeycloakLDAP"

elastic:
  driver: "FixedNodePool"            # 信创固定节点池，不依赖云弹性
