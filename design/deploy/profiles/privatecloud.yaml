# ============================================================================
# Profile: 私有云 VM（privatecloud）
# 机器：客户私有云环境内的 VM + 厂商对象存储 / 块存储
# 关联：部署清单 v0.1 §5 抽象维度表
# ============================================================================
meta:
  name: privatecloud
  k8s: self-built
  note: "私有云 VM + 厂商对象存储/MinIO"

compute:
  arch: ["x86"]
  os: ["CentOS", "vendorOS"]

images:
  baseImage: "base:rockylinux-9"
  extraVariant: ""

global:
  guomiEnabled: false
  guomiAlgos: ["AES", "SM4"]          # 部分私有云支持 SM4

storage:
  # 统一对象存储抽象（storage-io 0.1.0）: driver 与 values-base.yaml 注入约定对齐
  objectStore:
    driver: s3                       # 厂商对象存储/MinIO（S3 兼容）
    endpoint: "http://private-obj.internal"
    csi: "ceph-csi"
    # ---- storage-io 对接字段（S3 兼容）----
    pathStyle: true                 # 私有对象存储多数需 path-style
    region: "us-east-1"
    accessKeySource: secret         # env | secret | customer-provided
    encryption: sm4                 # aes | sm4（部分私有云支持 SM4）
  # Iceberg Catalog 策略: hive 保留（兼容存量）; 生产/多租户可切 rest
  catalog:
    mode: hive                      # hive | rest
    restUri: ""                     # mode=rest 时必填, 如 http://iceberg-rest:8181

network:
  cni: "cilium"
  lb: "metallb"

kms:
  driver: "VendorKMS"                # 厂商 KMS
  algo: ["AES", "SM4"]

identity:
  driver: "KeycloakLDAP"

elastic:
  driver: "FixedNodePool"
