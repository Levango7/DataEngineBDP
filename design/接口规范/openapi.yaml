            data:
              $ref: '#/components/schemas/SqlValidateResponse'

    ApiResponse_SqlOptimizeResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SqlOptimizeResponse'

    ApiResponse_CrossSourceResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CrossSourceResponse'

    ApiResponse_ClusterInfo:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ClusterInfo'

    ApiResponse_MlModel:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MlModel'

    ApiResponse_FinetuneTask:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FinetuneTask'

    ApiResponse_PagedResult_Tenant:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PagedResult_Tenant'

    ApiResponse_PagedResult_DataSource:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PagedResult_DataSource'

    ApiResponse_PagedResult_Job:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PagedResult_Job'

    ApiResponse_PagedResult_ClusterInfo:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PagedResult_ClusterInfo'

    ApiResponse_PagedResult_MlModel:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PagedResult_MlModel'

    ApiResponse_PagedResult_InferenceService:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PagedResult_InferenceService'

    ApiResponse_List_Tenant:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Tenant'

    ApiResponse_List_String:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                type: string

    ApiResponse_List_ProviderDescriptor:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProviderDescriptor'

    ApiResponseBase:
      type: object
      required: [code, message, data, traceId, timestamp]
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功
          example: 0
        message:
          type: string
          example: OK
        data:
          description: 业务数据，失败时为 null
        traceId:
          type: string
          format: uuid
          description: 链路追踪 ID
        timestamp:
          type: integer
          format: int64
          description: 服务器时间戳（毫秒）

    # ---------- 业务模型 ----------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        captcha:
          type: string
          description: 验证码（可选）

    LoginResult:
      type: object
      required: [token, expiresIn, user]
      properties:
        token:
          type: string
          description: JWT access token
        expiresIn:
          type: integer
          description: token 过期时间（秒）
        refreshToken:
          type: string
          description: refresh token
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, username, nickname, email, tenantId, roles, status]
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        avatar:
          type: string
          format: uri
        tenantId:
          type: string
        roles:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        lastLoginAt:
          type: string
          format: date-time

    Tenant:
      type: object
      required: [id, name, planTier, status]
      properties:
        id:
          type: string
        name:
          type: string
        planTier:
          type: string
          enum: [standard, enterprise, flagship, internal]
          description: 套餐版本
        status:
          type: string
          enum: [active, disabled]
        quota:
          type: integer
          description: 用户数上限
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TenantCreateRequest:
      type: object
      required: [name, planTier]
      properties:
        name:
          type: string
        planTier:
          type: string
          enum: [standard, enterprise, flagship, internal]
        quota:
          type: integer

    DataSource:
      type: object
      required: [id, name, type, host, port, status]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          description: mysql/postgres/oracle/doris/kafka...
        host:
          type: string
        port:
          type: integer
        database:
          type: string
        username:
          type: string
        status:
          type: string
          enum: [connected, disconnected]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DataSourceRequest:
      type: object
      required: [name, type, host, port]
      properties:
        name:
          type: string
        type:
          type: string
        host:
          type: string
        port:
          type: integer
        database:
          type: string
        username:
          type: string
        password:
          type: string
          format: password

    ConnectionTestResult:
      type: object
      required: [success, latency, message]
      properties:
        success:
          type: boolean
        latency:
          type: integer
          description: 延迟（毫秒）
        message:
          type: string

    JobStatus:
      type: string
      enum: [pending, running, succeeded, failed, stopped]

    Job:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        cron:
          type: string
        lastRunAt:
          type: string
          format: date-time
        nextRunAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    JobCreateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        cron:
          type: string
        config:
          type: object
          additionalProperties: true

    SqlExecuteRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
        dialect:
          type: string
          enum: [trino, doris, hive, spark, mysql, postgres]
          default: trino
        dataSourceId:
          type: string
        timeout:
          type: integer
          default: 30

    SqlExecuteResponse:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: object
              nullable: true
        rowCount:
          type: integer
        durationMs:
          type: integer

    SqlParseRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
        dialect:
          type: string

    SqlParseResponse:
      type: object
      properties:
        dialect:
          type: string
        statementType:
          type: string
        tables:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            type: string

    SqlValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        dialect:
          type: string
        error:
          type: string

    SqlOptimizeRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
        dialect:
          type: string
        enableAllRules:
          type: boolean

    SqlOptimizeResponse:
      type: object
      properties:
        originalSql:
          type: string
        optimizedSql:
          type: string
        executionPlan:
          type: string
        rulesApplied:
          type: array
          items:
            type: string
        estimatedCost:
          type: number
        estimatedRows:
          type: number
        success:
          type: boolean
        error:
          type: string
        dialect:
          type: string

    CrossSourceRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
        dialect:
          type: string
        tenantId:
          type: string

    CrossSourceResponse:
      type: object
      properties:
        queryId:
          type: string
        status:
          type: string
          enum: [SUCCESS, FAILED]
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
        rowCount:
          type: integer
        crossSource:
          type: boolean
        sources:
          type: array
          items:
            type: string
        durationMs:
          type: integer
        error:
          type: string

    ClusterInfo:
      type: object
      required: [id, name, environment, status]
      properties:
        id:
          type: string
        name:
          type: string
        environment:
          type: string
          enum: [private, cloud, xinchang]
        status:
          type: string
          enum: [pending, running, stopped, failed]
        version:
          type: string
        nodeCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ClusterCreateRequest:
      type: object
      required: [name, environment]
      properties:
        name:
          type: string
        environment:
          type: string
          enum: [private, cloud, xinchang]
        version:
          type: string
        nodeCount:
          type: integer
        config:
          type: object
          additionalProperties: true

    ClusterScaleRequest:
      type: object
      required: [targetNodeCount]
      properties:
        targetNodeCount:
          type: integer

    ProviderDescriptor:
      type: object
      properties:
        name:
          type: string
        environments:
          type: array
          items:
            type: string
        version:
          type: string

    MlModel:
      type: object
      required: [id, name, algorithm]
      properties:
        id:
          type: string
        name:
          type: string
        algorithm:
          type: string
        version:
          type: string
        modelPath:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    ModelRegisterRequest:
      type: object
      required: [name, algorithm]
      properties:
        name:
          type: string
        algorithm:
          type: string
        version:
          type: string
        trainJobId:
          type: string
        modelPath:
          type: string
        description:
          type: string

    FinetuneRequest:
      type: object
      properties:
        modelName:
          type: string
        baseModel:
          type: string
        trainingData:
          type: string
        gpuConfig:
          type: string
        epochs:
          type: integer

    FinetuneTask:
      type: object
      properties:
        taskId:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        progress:
          type: number
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    InferenceService:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        modelId:
          type: string
        status:
          type: string
          enum: [deploying, running, stopped, failed]
        endpoint:
          type: string