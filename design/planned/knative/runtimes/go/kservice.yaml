# ============================================================================
# Go 函数运行时 Knative Service · 数据引擎大数据平台 T025
# ----------------------------------------------------------------------------
# 作用：将 Go Gin 函数运行时封装为 Knative Service
# 特性：
#   1. KPA 自动伸缩：target=10 RPS，min-scale=0（允许 scale-to-zero）
#   2. 无流量 60s 缩容到 0
#   3. 静态二进制：冷启动 < 0.5s
#   4. invocation 计量：/metrics 供 Prometheus 采集
#   5. tenant 隔离：通过 X-Tenant-Id 请求头传入
# ============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: go-function-runtime
  namespace: serverless-functions
  labels:
    app.kubernetes.io/name: go-function-runtime
    app.kubernetes.io/part-of: serverless-runtime
    platform.shuqing.io/component: serverless
    platform.shuqing.io/runtime: go
    platform.shuqing.io/task: "T025"
  annotations:
    serving.knative.dev/autoscaler-class: "kpa.autoscaling.knative.dev"
    autoscaling.knative.dev/target: "10"
    autoscaling.knative.dev/target-burst-capacity: "11"
    autoscaling.knative.dev/min-scale: "0"
    autoscaling.knative.dev/max-scale: "20"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "60s"
    autoscaling.knative.dev/metric: "rps"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/autoscale: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      timeoutSeconds: 30
      containerConcurrency: 10
      containers:
        - name: app
          image: shuqing/go-function-runtime:0.1.0
          ports:
            - containerPort: 8080
              name: http1
          env:
            - name: FUNCTION_NAME
              value: "default"
            - name: TENANT_ID
              value: "default-tenant"
            - name: LOG_LEVEL
              value: "release"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3