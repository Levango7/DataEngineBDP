# sidecar 注入验证示例 · Deployment
# 数擎云核 SKE · Service Mesh sidecar 注入测试
# 用法: kubectl apply -f ske/k3s/sample-mesh-test-deploy.yaml
# 验证: kubectl get pods -l app=mesh-test -o wide  应见 2/2 容器（业务+istio-proxy）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-test
  labels:
    app: mesh-test
    app.kubernetes.io/part-of: shuqing-bigdata
    app.kubernetes.io/component: mesh-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-test
  template:
    metadata:
      labels:
        app: mesh-test
        app.kubernetes.io/part-of: shuqing-bigdata
      annotations:
        # sidecar 注入后，prometheus scrape 由 istio-proxy 代理
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
    spec:
      serviceAccountName: mesh-test
      containers:
        - name: app
          image: hashicorp/http-echo:0.2.3
          args:
            - "-text=shuqing-mesh-test"
            - "-listen=:8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10