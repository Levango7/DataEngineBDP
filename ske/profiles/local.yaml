# 笔记本单机验证 Profile (非信创, x86_64 / amd64)
# 适用: 开发者笔记本 (无信创机器), 单机 K3s / kind, 最小资源, 本地 MinIO 存储
# 与 xinchuang 差异: arch=amd64, 无 openeuler 变体, 标准加密(非国密), 存储走 MinIO
# 注意: 仅用于本地验证 PoC; 客户交付仍用 xinchuang/onprem/publiccloud/privatecloud

profile: local
k8s:
  self-built: true
  distro: k3s          # 或 kind; 单机轻量
  singleNode: true
  namespacePrefix: ws

compute:
  arch: amd64
  os: ubuntu           # 笔记本宿主 Linux / WSL2

images:
  baseImage: "docker.io/library"
  extraVariant: ""     # 非信创, 不产 openeuler 变体
  platforms: ["amd64"]

global:
  guomiEnabled: false  # 笔记本无国密卡, 走标准算法

storage:
  # 统一对象存储抽象（storage-io 0.1.0）: driver 与 values-base.yaml 注入约定对齐
  objectStore:
    driver: minio               # 枚举: minio | ceph | s3 | xcobject; 本地单机用 MinIO
    endpoint: "http://minio.local:9000"
    bucket: "lakehouse"
    accessKey: "minio"
    secretKey: "minio123"
    # ---- storage-io 对接字段（S3 兼容）----
    pathStyle: true              # MinIO/Ceph 需 path-style 访问
    region: "us-east-1"
    accessKeySource: env         # env | secret | customer-provided
    encryption: aes              # aes | sm4（xinchuang 用 sm4）
  # Iceberg Catalog 策略: hive 保留（兼容存量）; 生产/多租户可切 rest
  catalog:
    mode: hive                   # hive | rest
    restUri: ""                  # mode=rest 时必填, 如 http://iceberg-rest:8181

network:
  lb: nodeport        # 单机用 NodePort / Port-Forward, 不用云 LB

kms:
  driver: Vault
  algo: aes

identity:
  provider: keycloak-local

elastic:
  mode: static        # 单机固定节点池, 不启用云节点伸缩
