# ============================================================================
# Profile: 本地数据中心（onprem）
# 机器：客户自有 x86 物理机 / 虚机 + 标准 OS
# 关联：部署清单 v0.1 §5 抽象维度表
# ============================================================================
meta:
  name: onprem
  k8s: self-built
  note: "x86 裸金属/虚机；CentOS/RHEL/Ubuntu"

compute:
  arch: ["x86"]
  os: ["CentOS", "RHEL", "Ubuntu"]

images:
  baseImage: "base:rockylinux-9"
  extraVariant: ""

global:
  guomiEnabled: false
  guomiAlgos: ["AES", "SHA256"]

storage:
  # 统一对象存储抽象（storage-io 0.1.0）: driver 与 values-base.yaml 注入约定对齐
  objectStore:
    driver: ceph                    # 枚举: minio | ceph | s3 | xcobject; Ceph RGW/MinIO 兼容 S3
    endpoint: "http://ceph-rgw.internal"
    csi: "ceph-csi"
    # ---- storage-io 对接字段（S3 兼容）----
    pathStyle: true                 # Ceph RGW 需 path-style 访问
    region: "us-east-1"
    accessKeySource: secret         # env | secret | customer-provided; 内部 Ceph 用 secret 注入
    encryption: aes                 # aes | sm4
  # Iceberg Catalog 策略: hive 保留（兼容存量）; 生产/多租户可切 rest
  catalog:
    mode: hive                      # hive | rest
    restUri: ""                     # mode=rest 时必填, 如 http://iceberg-rest:8181

network:
  cni: "cilium"
  lb: "metallb"

kms:
  driver: "Vault"                    # 自研/HashiCorp Vault
  algo: ["AES", "SHA256"]

identity:
  driver: "KeycloakLDAP"

elastic:
  driver: "FixedNodePool"
