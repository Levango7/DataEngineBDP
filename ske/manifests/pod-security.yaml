# 数擎云核 SKE · Pod 安全策略 (大数据平台多租户隔离)
# 关联: apiserver-hardening.yaml (admission PodSecurityPolicy) / tuning/security.sh (自检)
# 设计要点:
#   - 禁止 privileged: true (防容器逃逸)
#   - 禁止 hostNetwork/hostPID/hostIPC (防跨容器窥探)
#   - 强制 readOnlyRootFilesystem: true (除白名单组件)
#   - 强制 runAsNonRoot: true (禁止 root 运行)
#   - capabilities 白名单: 仅 NET_BIND_SERVICE (绑定低端口)
#   - seccompProfile: RuntimeDefault (系统调用过滤)
#   - 白名单: Cilium/CSI driver/kube-proxy 等系统组件需特权
#   - K8s >= 1.25 用 Pod Security Admission (PSA) restricted 级别替代 PSP

# ---- 1. Pod Security Admission: 基础命名空间强制 restricted 级别 ----
# 通过 Namespace label 启用 PSA, 适用于 K8s >= 1.25
apiVersion: v1
kind: Namespace
metadata:
  name: sq-tenant-example
  labels:
    # pod-security.kubernetes.io/enforce: restricted 强制 restricted 级别
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    # audit: restricted 违规记入审计日志 (不拒绝)
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    # warn: restricted 违规向 kubectl 输出警告
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    # 数擎租户标签
    sq.shuqing.io/tenant: "true"
    sq.shuqing.io/managed-by: ske

---
# ---- 2. 系统组件命名空间: privileged 级别 (白名单) ----
apiVersion: v1
kind: Namespace
metadata:
  name: ske-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    sq.shuqing.io/system-component: "true"

---
# ---- 3. (已移除) PodSecurityPolicy: K8s 1.25+ 由 Pod Security Admission 接管 ----
# 原配置使用 policy/v1beta1 PodSecurityPolicy, 该 API 在 K8s 1.25 已移除。
# 替代方案: Pod Security Admission (PSA), 通过 namespace 标签启用 (见上方 §1/§2)。
#   - restricted 级别 (租户): pod-security.kubernetes.io/enforce: restricted
#   - privileged 级别 (系统): pod-security.kubernetes.io/enforce: privileged
# PSA 是内置 admission controller, 无需创建 PodSecurityPolicy 资源,
# 也无需额外的 RBAC (PSP 需 ClusterRoleBinding 授权使用)。
# 如需更细粒度控制 (如自定义 volume 类型白名单), 可部署 OPA Gatekeeper (见下方 §5+)。

---
# ---- 4. (已移除) 系统组件白名单 PSP: 由 PSA privileged 级别替代 ----
# 原配置: policy/v1beta1 PodSecurityPolicy ske-system-privileged
# 替代: 上方 §2 ske-system namespace 标签 pod-security.kubernetes.io/enforce: privileged

---
# ---- 5. OPA Gatekeeper ConstraintTemplate: 禁止特权容器 ----
# 适用于安装了 Gatekeeper 的集群; 否则由 PSA/PSP 兜底
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: ske-disallow-privileged
spec:
  crd:
    spec:
      names:
        kind: SKEDisallowPrivileged
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptNamespaces:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package ske.disallow_privileged
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.privileged == true
          not is_exempt(input.review.object.metadata.namespace)
          msg := sprintf("容器 %v 禁止 privileged: true", [container.name])
        }
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.allowPrivilegeEscalation == true
          not is_exempt(input.review.object.metadata.namespace)
          msg := sprintf("容器 %v 禁止 allowPrivilegeEscalation: true", [container.name])
        }
        is_exempt(ns) {
          ns == input.parameters.exemptNamespaces[_]
        }

---
# ---- 6. OPA Gatekeeper Constraint: 应用禁止特权策略 ----
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: SKEDisallowPrivileged
metadata:
  name: no-privileged-containers
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - ske-system
      - cilium-system
  parameters:
    exemptNamespaces:
      - kube-system
      - ske-system
      - cilium-system

---
# ---- 7. OPA ConstraintTemplate: 强制 readOnlyRootFilesystem ----
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: ske-readonly-rootfs
spec:
  crd:
    spec:
      names:
        kind: SKEReadOnlyRootFS
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package ske.readonly_rootfs
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container.securityContext.readOnlyRootFilesystem
          not is_exempt(input.review.object.metadata.namespace)
          msg := sprintf("容器 %v 必须设置 readOnlyRootFilesystem: true", [container.name])
        }
        is_exempt(ns) {
          ns == input.parameters.exemptNamespaces[_]
        }

---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: SKEReadOnlyRootFS
metadata:
  name: enforce-readonly-rootfs
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - ske-system
      - cilium-system
  parameters:
    exemptNamespaces:
      - kube-system
      - ske-system
      - cilium-system
