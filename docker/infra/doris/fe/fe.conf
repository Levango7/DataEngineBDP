# Apache Doris FE 2.1.7 配置
# 用于OLAP分析测试，FE作为前端节点协调查询

# 网络配置
priority_networks = 172.20.0.0/16

# 元数据存储
meta_dir = /opt/apache-doris/fe/doris-meta

# 端口配置
edit_log_port = 9010
http_port = 8030
query_port = 9020
rpc_port = 9030
arrow_flight_sql_port = 9040

# 日志配置
log_dir = /opt/apache-doris/fe/log

# JVM配置
sys_log_level = INFO
sys_log_roll_num = 10
sys_log_roll_interval = DAY
sys_log_delete_age = 7d
audit_log_dir = /opt/apache-doris/fe/log
audit_log_roll_num = 10
audit_log_roll_interval = DAY

# 集群配置
heartbeat_failure_interval = 10
heartbeat_retry_times = 3
frontend_storage_type = BDBJE

# 负载均衡
enable_round_robin_auth = true

# 查询配置
qe_max_connection = 1024
max_connection_per_user = 100

# 自动表迁移
tablet_rebalancer_type = BeLoad

# 兼容性配置
enable_outfile_to_local = false