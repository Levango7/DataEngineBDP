# Apache Doris BE 2.1.7 配置
# 用于OLAP分析测试，BE作为后端节点存储和计算

# 网络配置
priority_networks = 172.20.0.0/16

# 存储配置
storage_root_path = /opt/apache-doris/be/storage
storage_page_cache_limit = 20%
disable_storage_page_cache = false
enable_storage_vectorization = true

# 端口配置
be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060
arrow_flight_port = 9070

# 日志配置
sys_log_dir = /opt/apache-doris/be/log
sys_log_level = INFO
sys_log_roll_num = 10
sys_log_roll_interval = DAY
sys_log_delete_age = 7d

# 内存配置
mem_limit = 80%
max_sys_mem_available_low_water_mark = 30%

# 计算配置
num_threads = 0
num_threads_per_storage_engine = 0
flush_thread_num_per_store = 2
compaction_thread_num_per_disk = 4
load_thread_num = 16

# Tablet配置
tablet_writer_open_rpc_timeout_sec = 60
tablet_meta_checkpoint_min_interval_secs = 600
max_tablet_num_per_shard = 1024

# 查询配置
max_load_job_size = 1024
streaming_load_max_batch_size = 10000
max_unpacked_row_block_size = 1048576

# 向量化配置
enable_vectorized_load = true
enable_vectorized_engine = true

# 兼容性配置
enable_outfile_to_local = false
disable_streaming_load_for_log_type = true