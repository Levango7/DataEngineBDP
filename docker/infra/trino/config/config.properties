# Trino 460 协调节点配置
# 用于交互式查询测试，启用memory和tpcds连接器
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# 查询执行配置
query.max-memory=1GB
query.max-memory-per-node=512MB
query.max-total-memory-per-node=1GB

# 内存连接器相关配置
memory.data-pages=100
memory.heap-headroom=256MB

# 日志配置
log.levels=INFO
log.min-level=INFO

# 交换配置
exchange.client-threads=4
exchange.concurrent-request-multiplier=3

# 任务配置
task.max-index-memory=256MB
task.writer-count=4