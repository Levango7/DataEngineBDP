########## nebula-metad v3.6.0 配置 ##########
# Meta服务配置，用于集群元数据管理

--meta_server_addrs=de-nebula-metad:9559
--local_ip=de-nebula-metad
--port=9559
--ws_ip=de-nebula-metad
--ws_http_port=19559
--data_path=/data/meta
--log_path=/logs/meta
--daemonize=false
--pid_file=/var/run/nebula-metad.pid
--timezone_name=UTC+08:00

# 系统配置
--num_workers=4
--num_io_threads=4
--meta_in_memory_threshold=2000000000
--heartbeat_interval_secs=10
--raft_heartbeat_interval_secs=1
--raft_election_timeout=5
--raft_log_path=/logs/meta/raft