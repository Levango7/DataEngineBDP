################################################################################
# Spark 3.5.3 (Bitnami) 配置
# 用于批计算测试，Master + 2 Worker
################################################################################

# Master 配置
spark.master                     spark://de-spark-master:7077
spark.driver.host                de-spark-master
spark.driver.bindAddress         0.0.0.0
spark.driver.port                4040
spark.blockManager.port          4041

# Worker 配置
spark.worker.memory              1g
spark.worker.cores               2
spark.executor.memory            1g
spark.executor.cores             2
spark.executor.instances         2

# 应用配置
spark.app.name                   dataengine-infra
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max  64m
spark.default.parallelism        4
spark.sql.shuffle.partitions     4

# 内存配置
spark.memory.fraction            0.6
spark.memory.storageFraction     0.5
spark.driver.memory              1g
spark.driver.maxResultSize       512m

# 网络配置
spark.network.timeout            120s
spark.rpc.message.maxSize        128
spark.scheduler.maxRegisteredResourcesWaitingTime  60s

# UI 配置
spark.ui.enabled                 true
spark.ui.port                    4040
spark.ui.retainedJobs            50
spark.ui.retainedStages          50

# 日志配置
spark.eventLog.enabled           true
spark.eventLog.dir               file:///opt/spark/shared/events
spark.logConf                    true

# Shuffle 配置
spark.shuffle.service.enabled    false
spark.shuffle.compress           true
spark.shuffle.spill.compress     true