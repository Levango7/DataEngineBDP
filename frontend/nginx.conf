server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # FinOps 看板
    location /finops/ {
        root /usr/share/nginx/html/finops-dashboard;
        try_files $uri $uri/ /finops-dashboard/index.html;
    }

    # 资产交换看板
    location /asset-exchange/ {
        root /usr/share/nginx/html/asset-exchange-dashboard;
        try_files $uri $uri/ /asset-exchange-dashboard/index.html;
    }

    # 微调监控看板
    location /finetuning/ {
        root /usr/share/nginx/html/finetuning-monitor;
        try_files $uri $uri/ /finetuning-monitor/index.html;
    }

    # 多集群看板
    location /multicluster/ {
        root /usr/share/nginx/html/multi-cluster-dashboard;
        try_files $uri $uri/ /multi-cluster-dashboard/index.html;
    }

    # 开放API看板
    location /openapi/ {
        root /usr/share/nginx/html/open-api-dashboard;
        try_files $uri $uri/ /open-api-dashboard/index.html;
    }

    # 支持 React Router SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 流量代理至后端网关（APISIX 或封装层）
    location /api {
        proxy_pass http://apisix-gateway:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 安全头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    error_page 404 /index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss application/atom+xml image/svg+xml;
}
