server {
    listen 8080;

    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;


    # 多集群 5 页已收编为主应用的 /multicluster/* 路由（C2 批次），
    # 由下方 SPA 兜底处理；原多集群子看板目录与 location 已摘除。

    # 开放API看板已收编为主应用的 /ops-api、/api-generate、/api-subscriptions 路由（C3 批次），
    # 由下方 SPA 兜底处理；原 open-api-dashboard 目录与 location 已摘除。

    # 支持 React Router SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 流量代理至后端网关（APISIX 或封装层）
    location /api {
        proxy_pass http://apisix-gateway:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 安全头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    error_page 404 /index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss application/atom+xml image/svg+xml;
}
