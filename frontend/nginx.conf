server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 支持 React Router SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 流量代理至后端网关。生产环境请通过反向代理或额外 location
    # 将 /api 转发到 APISIX 或封装层。开发环境使用 Vite proxy 即可。
    # location /api {
    #     proxy_pass http://apisix-gateway:9080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 安全头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    error_page 404 /index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss application/atom+xml image/svg+xml;
}
