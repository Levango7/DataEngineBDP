apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shuqing
  labels:
    app: catalog
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      # k8s 会为同命名空间的 Service 向 Pod 注入 CATALOG_PORT=tcp://IP:PORT 形式的
      # 链接变量；main.go 的 os.Getenv("CATALOG_PORT") 会取到该值并经
      # ":"+port 传给 ListenAndServe，地址非法导致 log.Fatalf 启动即退出
      # （同型根因已在 burn-in 集群 nl2sql 上实测 ValidationError）。
      # 关闭服务链接注入（组件间寻址走 Service DNS / 显式 URL，不依赖这些变量）。
      enableServiceLinks: false
      containers:
      - name: catalog
        image: sq/catalog:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: SERVER_PORT
          value: "8082"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shuqing
  labels:
    app: catalog
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  type: ClusterIP
  selector:
    app: catalog
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP