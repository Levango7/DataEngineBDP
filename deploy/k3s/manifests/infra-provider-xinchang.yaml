apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-provider-xinchang
  namespace: shuqing
  labels:
    app: infra-provider-xinchang
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-provider-xinchang
  template:
    metadata:
      labels:
        app: infra-provider-xinchang
    spec:
      containers:
      - name: infra-provider-xinchang
        image: sq/infra-provider-xinchang:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SERVER_PORT
          value: "8081"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: infra-provider-xinchang
  namespace: shuqing
  labels:
    app: infra-provider-xinchang
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  type: ClusterIP
  selector:
    app: infra-provider-xinchang
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP