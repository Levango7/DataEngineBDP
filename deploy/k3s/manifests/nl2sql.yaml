apiVersion: apps/v1
kind: Deployment
metadata:
  name: nl2sql
  namespace: shuqing
  labels:
    app: nl2sql
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nl2sql
  template:
    metadata:
      labels:
        app: nl2sql
    spec:
      containers:
      - name: nl2sql
        image: sq/nl2sql:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8093
          name: http
        env:
        - name: SERVER_PORT
          value: "8093"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8093
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8093
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nl2sql
  namespace: shuqing
  labels:
    app: nl2sql
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  type: ClusterIP
  selector:
    app: nl2sql
  ports:
  - name: http
    port: 8093
    targetPort: 8093
    protocol: TCP