apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-exchange
  namespace: shuqing
  labels:
    app: asset-exchange
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-exchange
  template:
    metadata:
      labels:
        app: asset-exchange
    spec:
      containers:
      - name: asset-exchange
        image: sq/asset-exchange:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8087
          name: http
        env:
        - name: SERVER_PORT
          value: "8087"
        readinessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: asset-exchange
  namespace: shuqing
  labels:
    app: asset-exchange
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  type: ClusterIP
  selector:
    app: asset-exchange
  ports:
  - name: http
    port: 8087
    targetPort: 8087
    protocol: TCP