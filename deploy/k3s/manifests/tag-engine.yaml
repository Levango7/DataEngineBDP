apiVersion: apps/v1
kind: Deployment
metadata:
  name: tag-engine
  namespace: shuqing
  labels:
    app: tag-engine
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tag-engine
  template:
    metadata:
      labels:
        app: tag-engine
    spec:
      containers:
      - name: tag-engine
        image: sq/tag-engine:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVER_PORT
          value: "8080"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tag-engine
  namespace: shuqing
  labels:
    app: tag-engine
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  type: ClusterIP
  selector:
    app: tag-engine
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP