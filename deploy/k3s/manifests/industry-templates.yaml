apiVersion: apps/v1
kind: Deployment
metadata:
  name: industry-templates
  namespace: shuqing
  labels:
    app: industry-templates
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: industry-templates
  template:
    metadata:
      labels:
        app: industry-templates
    spec:
      containers:
      - name: industry-templates
        image: sq/industry-templates:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8091
          name: http
        env:
        - name: SERVER_PORT
          value: "8091"
        # jwt_auth.py 在 K8s 内未显式 AUTH_MODE 时会 fail-fast 抛 RuntimeError。
        # k3s 冒烟路径与集成测试一致走匿名放行（tests/integration/conftest.py
        # 强制 AUTH_MODE=none），故此处显式设为 none，避免业务端点 500。
        # 注：k3s manifests 内其余服务同样未设置 AUTH_MODE，属既有横向缺口，
        # 本处仅补齐因本服务接入鉴权依赖而新增的风险。
        - name: AUTH_MODE
          value: "none"
        readinessProbe:
          httpGet:
            path: /health
            port: 8091
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8091
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: industry-templates
  namespace: shuqing
  labels:
    app: industry-templates
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  type: ClusterIP
  selector:
    app: industry-templates
  ports:
  - name: http
    port: 8091
    targetPort: 8091
    protocol: TCP