apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-gateway
  namespace: shuqing
  labels:
    app: sql-gateway
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-gateway
  template:
    metadata:
      labels:
        app: sql-gateway
    spec:
      containers:
      - name: sql-gateway
        image: sq/sql-gateway:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SERVER_PORT
          value: "8081"
        # application.yml 中 app.security.jwt.secret 为无默认值的占位符：
        # 缺失时 JwtAuthFilterAutoConfiguration 的守卫条件不成立 → 无 JwtAuthFilter
        # Bean → 启动失败（k3s burn-in 实测报 No qualifying bean of type
        # common.security.JwtAuthFilter）。此处仅供 burn-in 使用，
        # 取值与 tests/integration/k3s/conftest.py、docker-compose 的测试密钥一致；
        # 生产请走 helm charts（Secret 注入）。
        - name: JWT_SECRET
          value: "it-test-jwt-secret-at-least-32-bytes-long"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sql-gateway
  namespace: shuqing
  labels:
    app: sql-gateway
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  type: ClusterIP
  selector:
    app: sql-gateway
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP