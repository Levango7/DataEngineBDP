apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops
  namespace: shuqing
  labels:
    app: llmops
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmops
  template:
    metadata:
      labels:
        app: llmops
    spec:
      # k8s 会为同命名空间的 Service 向 Pod 注入 <SVC>_PORT=tcp://IP:PORT 形式的链接变量；
      # 本组件配置前缀恰为 LLMOPS_（config/settings.py 的 env_prefix），于是
      # LLMOPS_PORT 被当成端口解析而启动崩溃（本地复现 ValidationError:
      # port Input should be a valid integer, input_value='tcp://10.43.161.101:8093'，
      # 同型根因已在 burn-in 集群 nl2sql 上实测）。关闭服务链接注入
      # （组件间寻址走 Service DNS / 显式 URL，不依赖这些变量）。
      enableServiceLinks: false
      containers:
      - name: llmops
        image: sq/llmops:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVER_PORT
          value: "8080"
        # jwt_auth.py 在 K8s 内未显式 AUTH_MODE 时会 fail-fast 抛 RuntimeError。
        # k3s 冒烟路径与集成测试一致走匿名放行，故显式设为 none；
        # 生产请使用 helm charts（AUTH_MODE=jwt + Secret 注入）。
        - name: AUTH_MODE
          value: "none"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llmops
  namespace: shuqing
  labels:
    app: llmops
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  type: ClusterIP
  selector:
    app: llmops
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP