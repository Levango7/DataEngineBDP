apiVersion: apps/v1
kind: Deployment
metadata:
  name: encaps-layer
  namespace: shuqing
  labels:
    app: encaps-layer
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: encaps-layer
  template:
    metadata:
      labels:
        app: encaps-layer
    spec:
      containers:
      - name: encaps-layer
        image: sq/encaps-layer:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVER_PORT
          value: "8080"
        # application.yml 中 app.security.jwt.secret / app.encrypt.encrypt-key
        # 均为无默认值的占位符：缺失时 JwtAuthFilterAutoConfiguration 的守卫条件
        # 不成立 → 无 JwtAuthFilter Bean → 启动失败（k3s burn-in 实测报
        # PlaceholderResolutionException）。此处仅供 burn-in 使用，
        # 取值与 tests/integration/k3s/conftest.py、docker-compose 的测试密钥一致；
        # 生产请走 helm charts（Secret 注入）。
        - name: JWT_SECRET
          value: "it-test-jwt-secret-at-least-32-bytes-long"
        - name: ENCRYPT_KEY
          value: "0123456789abcdef0123456789abcdef"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: encaps-layer
  namespace: shuqing
  labels:
    app: encaps-layer
    app.kubernetes.io/part-of: shuqing-bigdata-platform
spec:
  type: ClusterIP
  selector:
    app: encaps-layer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP