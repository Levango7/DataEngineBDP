# 本地核心子集 values：仅启用可独立运行的自研服务，重型基础设施全关
# 配合 deploy/local-up.sh 使用；完整环境请用 design/deploy/values/env
# v2.1.0-RC 增补：Service 端口 + 资源限制 + 非 root 安全上下文

global:
  env: onprem
  imageRegistry: harbor.local/shuqing
  imageTag: v2.1.0-RC
  security:
    runAsUser: 65532
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

