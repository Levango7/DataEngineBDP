    repository: ghcr.io/levango7/sq-catalog
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    limits: { cpu: "500m", memory: 512Mi }
    requests: { cpu: "250m", memory: 256Mi }
  service:
    type: ClusterIP
    port: 8080
  env:
    CATALOG_DB_TYPE: "sqlite"
    CATALOG_DB: "/data/catalog.db"
