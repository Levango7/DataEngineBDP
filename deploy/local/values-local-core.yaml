# ---- 核心链路开启（封装层→SQL网关→目录/规则/NL2SQL/开放API）----
encaps-layer:
  enabled: true
  replicaCount: 1
  resources:
    limits: { cpu: "500m", memory: 512Mi }
    requests: { cpu: "250m", memory: 256Mi }
  service:
    type: ClusterIP
    port: 8080
  env:
    K8S_CLIENT_TIMEOUT: "30s"
    INFORMER_WATCH_CACHE: "true"

sql-gateway:
  enabled: true
  replicaCount: 1
  resources:
    limits: { cpu: "1", memory: 1Gi }
    requests: { cpu: "500m", memory: 512Mi }
  service:
    type: ClusterIP
    port: 8080
  env:
    QUERY_CACHE_ENABLED: "true"
    QUERY_CACHE_TTL: "60s"
    QUERY_CACHE_MAX_SIZE: "1000"

catalog:
  enabled: true
  replicaCount: 1
  resources:
    limits: { cpu: "500m", memory: 512Mi }
    requests: { cpu: "250m", memory: 256Mi }
  service:
    type: ClusterIP
    port: 8080
  env:
    CATALOG_DB_TYPE: "sqlite"
    CATALOG_DB: "/data/catalog.db"
    CATALOG_ES_ENABLED: "false"
  auth:
    jwtSigningKey: "local-dev-signing-key-change-me-0123456789abcdef"

rule-engine:
  enabled: true
  replicaCount: 1
  resources:
    limits: { cpu: "1", memory: 1Gi }
    requests: { cpu: "500m", memory: 512Mi }
  service:
    type: ClusterIP
    port: 8080
  env:
    ASYNC_BATCH_ENABLED: "true"
    BATCH_SIZE: "100"
    RULE_DATASOURCE_TYPE: "h2"

nl2sql:
  enabled: true
  replicaCount: 1
  resources:
    limits: { cpu: "500m", memory: 512Mi }
    requests: { cpu: "250m", memory: 256Mi }
  service:
    type: ClusterIP
    port: 8080

open-api-catalog:
  enabled: true
  replicaCount: 1
  resources:
    limits: { cpu: "500m", memory: 512Mi }
    requests: { cpu: "250m", memory: 256Mi }
  service:
    type: ClusterIP
    port: 8080
  env:
    APISIX_ADMIN_KEY: ""
    APISIX_URL: "http://apisix-admin:9180"