# ---- 核心链路开启（封装层→SQL网关→目录/规则/NL2SQL/开放API）----
encaps-layer:
  # 镜像内 appuser 已固化为 uid/gid=1001（见 platform/*/Dockerfile），此处与之对齐。
  # /app/data 是镜像内目录（非卷），K8s 的 fsGroup 对它不生效，只能靠 uid/gid 对齐；
  # 若 runAsGroup 与镜像 gid 不一致，H2 建库会抛
  # java.nio.file.AccessDeniedException: /app/data/<svc>-db.mv.db。
  # 注：更早版本此处曾为绕开 Logback 写盘问题设runAsUser: 0，那是错的方向——
  # Logback 根因是/app/logs 目录不存在（已由 Dockerfile mkdir + chart logs 挂载修复），
  # 以 root + runAsGroup:1000 运行反而对 /app/data 无写权。
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
  enabled: true
  # 镜像来源：GHCR（build.yml 主分支构建产物）。仓库为 public，包可匿名拉取（已实测 manifest OK）。
  # 注意：各 Chart 的 values.yaml 默认硬编码国内镜像源（docker.m.daocloud.io/sq-*、
  #       harbor.shuqing.io/...），指向并不存在或不可达的自研镜像，且会覆盖 global.imageRegistry，
  #       故此处必须逐服务显式覆盖 image.repository（详见 docs/KNOWN-FAILURES.md #30）。
  image:
    repository: ghcr.io/levango7/sq-encaps-layer
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    limits: { cpu: "500m", memory: 512Mi }
    requests: { cpu: "250m", memory: 256Mi }
  service:
    type: ClusterIP
    port: 8080
  env:
    K8S_CLIENT_TIMEOUT: "30s"
    INFORMER_WATCH_CACHE: "true"
  logs:
    # 与 Dockerfile 里mkdir -p /app/logs 双保险：即使镜像未预建目录也能写。
    # 仅本地/CI 打开；生产走日志采集或挂 PVC（chart 默认 enabled: false）。
    enabled: true
    mountPath: /app/logs
  tmp:
    # 保持 readOnlyRootFilesystem: true（不放弃安全加固），只把 /tmp 挂成 emptyDir。
    # 嵌入式 Tomcat 启动时要在 /tmp 建部署临时目录，只读根会直接导致启动失败：
    #   FileSystemException: /tmp/tomcat.<port>.<random>: Read-only file system
    #   -> ApplicationContextException: Unable to start web server
    enabled: true
  auth:
    # 本地/CI 无 shuqing-jwt-secret（见 design/deploy/JWT鉴权配置指南.md 第4节），
    # 复用 catalog chart 生成的 dataengine-catalog-auth（键 jwt-signing-key），
    # 与 nl2sql / open-api-catalog 的 existingSecretName 同一模式。
    # 不注入则 JwtAuthFilter Bean 缺失，容器启动即失败（详见 docs/KNOWN-FAILURES.md #30）。
    jwtSecretName: dataengine-catalog-auth
    jwtSecretKey: jwt-signing-key

