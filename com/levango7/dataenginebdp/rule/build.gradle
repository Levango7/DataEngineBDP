/*
 * rule 模块 — 规则库
 *
 * 库模块（无 @SpringBootApplication 主类，不打包 bootJar）
 *   嵌套子模块：rule/engine（规则引擎编排）
 * 功能：规则引擎编排、DAG、调度、重试、告警、可视化
 *
 * 依赖：
 *   - Lombok（根项目已统一引入）
 *   - Spring Boot starter-web（提供 @RestController/@Component/@Service/@Configuration 等）
 *   - Jackson（序列化，由 starter-web 传递引入，此处显式声明确保可用）
 *
 * 注意：bootJar 已在根 build.gradle 默认禁用，本模块仅产出普通 jar。
 *       虽然无主类，但代码使用了 Spring 注解，需 starter-web 编译。
 */
dependencies {
    // Spring Boot starter-web — 提供 Spring 注解 + Jackson + SLF4J
    implementation libs.springBootStarterWeb
    // Jackson — 序列化（由 starter-web 传递引入，显式声明确保可用）
    implementation libs.jacksonDatabind
}