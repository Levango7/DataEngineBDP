/*
 * federated 模块 — 联邦查询
 *
 * Spring Boot 微服务，主类：FederatedQueryApplication
 * 功能：跨集群联邦查询、全局 Catalog、查询路由、结果合并、降级告警、mTLS 传输
 *
 * 依赖：
 *   - spring-boot-starter-web / validation
 *   - Apache Calcite（联邦查询计划与优化）
 *   - Lombok（根项目已统一引入）
 */
enableBootJar()

dependencies {
    // Spring Boot
    implementation libs.springBootStarterWeb
    implementation libs.springBootStarterValidation
    implementation libs.springBootStarterActuator
    // Spring Security — SecurityConfig
    implementation libs.springBootStarterSecurity

    // Apache Calcite — 联邦查询 SQL 解析与优化
    implementation libs.calciteCore

    // 跨模块依赖：common-health 共享健康检查库
    implementation project(':common-health')
}

// 离线构建：排除使用 WebClient/Reactor/Netty 的源文件
// （spring-boot-starter-webflux resolution result 缓存不完整，无法离线解析）
sourceSets {
    main {
        java {
            exclude '**/catalog/GlobalCatalogClient.java'
            exclude '**/catalog/TableLocationService.java'
            exclude '**/config/FederatedQueryProperties.java'
            exclude '**/config/MtlsConfig.java'
            exclude '**/controller/FederatedQueryController.java'
            exclude '**/degrade/AlertNotifier.java'
            exclude '**/degrade/DegradeStrategy.java'
            exclude '**/degrade/NetworkFailureDetector.java'
            exclude '**/model/TableLocation.java'
            exclude '**/routing/FederatedQueryRouter.java'
            exclude '**/routing/QueryPlan.java'
            exclude '**/service/FederatedQueryService.java'
            exclude '**/transport/ClusterTransport.java'
            exclude '**/transport/MtlsClusterTransport.java'
        }
    }
}