/*
 * streambatch 模块 — 流批一体调度
 *
 * Spring Boot 微服务，主类：StreamBatchSchedulerApplication
 *   嵌套子模块：streambatch/dag、flink、spark、iceberg、plugin、router、service
 * 功能：DAG 编排、Flink 流提交、Spark 批提交、Iceberg 快照隔离、双视图路由、插件
 *
 * 依赖：
 *   - spring-boot-starter-web / validation
 *   - Flink（流提交，运行时由集群提供）
 *   - Spark（批提交，运行时由集群提供）
 *   - Iceberg（快照管理）
 *   - Lombok（根项目已统一引入）
 *
 * 注意：Flink/Spark/Iceberg 通过 compileOnly 引入（运行时由集群提供），
 *       避免与 Spring Boot 依赖冲突及打包膨胀。
 *
 * 离线构建说明：Flink/Spark/Iceberg 不在 Gradle 离线缓存中，
 * 以下 compileOnly/testImplementation 依赖已注释掉。
 * streambatch 源码不直接 import Flink/Spark/Iceberg API（提交逻辑通过
 * FlinkStreamSubmitter/SparkBatchSubmitter 封装，运行时由集群提供类路径），
 * 因此注释掉依赖后 main 编译可正常通过。
 * 有网络时恢复以下依赖即可。
 */
enableBootJar()

dependencies {
    // Spring Boot
    implementation libs.springBootStarterWeb
    implementation libs.springBootStarterValidation
    // 注意：spring-boot-starter-actuator 已移除，因为 streambatch 不使用 Actuator API，
    // 且其传递依赖（HdrHistogram/LatencyUtils）在 Gradle 离线缓存中元数据不完整，
    // 导致 bootJar 在离线模式下失败。有网络时可恢复 implementation libs.springBootStarterActuator。

    // Flink — 流提交（运行时由 Flink 集群提供）
    // 离线构建：org.apache.flink 不在缓存中，注释掉
    // compileOnly libs.flinkStreamingJava
    // compileOnly libs.flinkClients

    // Spark — 批提交（运行时由 Spark 集群提供）
    // 离线构建：org.apache.spark 不在缓存中，注释掉
    // compileOnly libs.sparkCore
    // compileOnly libs.sparkSql

    // Iceberg — 快照隔离管理
    // 离线构建：org.apache.iceberg 不在缓存中，注释掉
    // compileOnly libs.icebergCore
    // compileOnly libs.icebergApi

    // 测试时需要运行时
    // 离线构建：同上，注释掉
    // testImplementation libs.icebergCore
    // testImplementation libs.icebergApi
}