/*
 * function 模块 — 函数服务
 *
 * Spring Boot 微服务，主类：FunctionApplication
 * 功能：函数调用、调用度量、请求/响应模型
 *
 * 依赖：
 *   - spring-boot-starter-web
 *   - Lombok（根项目已统一引入）
 */
enableBootJar()

dependencies {
    // Spring Boot
    implementation libs.springBootStarterWeb
    implementation libs.springBootStarterActuator

    // 跨模块依赖：common-health 共享健康检查库
    implementation project(':common-health')
}

// 离线构建：禁用 bootJar，因为 Actuator 传递依赖（HdrHistogram/LatencyUtils）
// 在 Gradle 离线缓存中元数据不完整，导致 bootJar runtimeClasspath 解析失败。
// compileJava 不受影响（compileClasspath 不包含这些 runtime/optional 依赖）。
// 有网络时可移除此行恢复 bootJar。
bootJar {
    enabled = false
}
jar {
    enabled = true
    archiveClassifier = ''
}