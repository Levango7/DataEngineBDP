# CI 持续集成工作流
# 覆盖 YAML lint、Python 语法检查、Bash 语法检查、前端构建、Helm Chart lint、Markdown lint
# Phase1a 增强：新增多语言代码检查（golangci-lint/pylint/black/isort/Checkstyle/ESLint）+ 覆盖率收集（JaCoCo/go cover/pytest-cov）
# 覆盖率门禁增强（2026-08-13）：
#   - 全量模块门禁：Java 18个模块（行≥80%/分支≥70%）、Go 10个模块（≥70%）、Python 10个模块（≥75%）
#   - 趋势阻断：覆盖率相比基线下降 > 2% 阻断 CI（基线文件位于 docs/coverage-baseline/）
#   - 注：当前覆盖率远未达 85% GA 标准，保持现有阈值作为阻断门禁，逐步提升路线见 docs/coverage-roadmap.md
name: CI

on:
  # 推送到任意分支时触发
  push:
    branches:
      - '*'
  # 向 main 分支发起 PR 时触发
  pull_request:
    branches:
      - main
  # 每日凌晨2点定时触发（主要用于性能压测，非每次 PR 触发）
  schedule:
    - cron: '0 2 * * *'
  # 手动触发（支持按需运行性能压测）
  workflow_dispatch:

# 默认权限最小化，PR 评论和检查需要 pull-requests: write
permissions:
  contents: read
  pull-requests: write
  checks: write

# 同一分支的并发工作流只保留最新一次，避免重复执行浪费资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Gitleaks 密钥扫描：扫描代码中的硬编码密钥/凭证/Token
  # 阻断 CI：发现密钥泄露时 gitleaks-action 退出码非零，CI 整体失败
  # ============================================================
  gitleaks-scan:
    name: Gitleaks Scan (密钥扫描)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Go 代码检查：go vet + gofmt
  # 遍历 platform/ 下所有含 go.mod 的子目录，逐个执行 go vet + gofmt -l
  # go vet：编译器级静态检查（始终兼容当前 Go 版本）
  # gofmt -l：格式检查（列出格式不正确的文件）
  # ============================================================
  go-lint:
    name: Go Lint (gofmt)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            platform/ai-assistant/go.sum
            platform/catalog/go.sum
            platform/dqctl/go.sum
            platform/infra-provider-baremetal/go.sum
            platform/karmada/api/go.sum
            platform/karmada/failover/api/go.sum
            platform/llm-gateway/go.sum
            platform/observability/query-api/go.sum
            platform/vector-engine/go.sum

      - name: 对每个 Go 组件执行 gofmt -l
        run: |
          go_count=$(find platform -name go.mod -not -path "*/vendor/*" | wc -l)
          if [ "$go_count" -eq 0 ]; then
            echo "::warning::未发现任何 Go 组件，跳过 go-lint"
            exit 0
          fi
          fail_count=0
          while IFS= read -r gomod; do
            mod_dir=$(dirname "$gomod")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  gofmt: $mod_name ($mod_dir)"
            echo "============================================"
            # gofmt -l：格式检查（列出格式不正确的文件，不需要下载依赖）
            fmt_issues=$(cd "$mod_dir" && gofmt -l . 2>&1)
            if [ -z "$fmt_issues" ]; then
              echo "✓ $mod_name gofmt 格式正确"
            else
              echo "✗ $mod_name gofmt 格式问题:"
              echo "$fmt_issues"
              fail_count=$((fail_count + 1))
            fi
          done < <(find platform -name go.mod -not -path "*/vendor/*")
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Go 组件 lint 失败"
            exit 1
          fi

  # ============================================================
  # Python 代码检查：pylint + black + isort + flake8 + mypy
  # 遍历 platform/ 下所有含 pyproject.toml 的子目录
  # 配置文件：.pylintrc、pyproject.toml [tool.black] [tool.isort] [tool.mypy]
  # ============================================================
  python-lint:
    name: Python Lint (pylint/black/isort/flake8/mypy)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 lint 工具集
        run: pip install pylint black isort flake8 mypy -q

      - name: 对每个 Python 组件执行 lint
        run: |
          py_count=$(find platform -name pyproject.toml 2>/dev/null | wc -l)
          if [ "$py_count" -eq 0 ]; then
            echo "::warning::未发现任何 Python 组件，跳过 python-lint"
            exit 0
          fi
          fail_count=0
          while IFS= read -r f; do
            mod_dir=$(dirname "$f")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  Python Lint: $mod_name ($mod_dir)"
            echo "============================================"
            # black 格式检查（不修改文件）
            (cd "$mod_dir" && black --check --diff . 2>&1) || { echo "✗ $mod_name black 检查失败"; fail_count=$((fail_count + 1)); }
            # isort 导入顺序检查
            (cd "$mod_dir" && isort --check --diff . 2>&1) || { echo "✗ $mod_name isort 检查失败"; fail_count=$((fail_count + 1)); }
            # flake8 风格检查
            (cd "$mod_dir" && flake8 --max-line-length=120 --extend-ignore=E203,W503 . 2>&1) || { echo "✗ $mod_name flake8 检查失败"; fail_count=$((fail_count + 1)); }
            # pylint 静态分析（容忍度较高，不阻断 CI）
            (cd "$mod_dir" && pylint --rcfile=../../.pylintrc --fail-under=7.0 . 2>&1) || echo "::warning::$mod_name pylint 分数低于阈值，仅警告"
            # mypy 类型检查（可选，失败仅警告）
            (cd "$mod_dir" && mypy --ignore-missing-imports . 2>&1) || echo "::warning::$mod_name mypy 发现类型问题，仅警告"
          done < <(find platform -name pyproject.toml 2>/dev/null)
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Python 组件 lint 失败"
            exit 1
          fi

  # ============================================================
  # 前端代码检查：ESLint + Prettier + TypeScript 类型检查
  # 工作目录：frontend/
  # ============================================================
  frontend-lint:
    name: Frontend Lint (ESLint+Prettier+TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: ESLint 检查
        run: |
          if npm run lint --silent 2>/dev/null; then
            echo "✓ ESLint 检查通过"
          else
            echo "::warning::npm run lint 未配置或检查失败，跳过 ESLint"
          fi

      - name: Prettier 格式检查
        run: |
          if npx --no-install prettier --check "src/**/*.{ts,tsx,vue,js,jsx,css,scss,json,md}" 2>/dev/null; then
            echo "✓ Prettier 格式检查通过"
          else
            echo "::warning::Prettier 检查失败或未配置，仅警告"
          fi

      - name: TypeScript 类型检查
        run: |
          if npm run type-check --silent 2>/dev/null; then
            echo "✓ TypeScript 类型检查通过"
          else
            echo "::warning::npm run type-check 未配置，使用 vue-tsc 回退"
            npx --no-install vue-tsc --noEmit 2>/dev/null || echo "::warning::vue-tsc 检查跳过"
          fi

  # ============================================================
  # Java 代码检查：Checkstyle + SpotBugs + PMD
  # 通过 Maven 插件执行，遍历 platform/ 下所有含 pom.xml 的子目录
  # 配置文件：design/v2.0/Phase1/启动前准备/config/checkstyle.xml
  # ============================================================
  java-lint:
    name: Java Lint (Checkstyle+SpotBugs+PMD)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 安装 Maven 3.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: 对每个 Java 组件执行 checkstyle:check + pmd:check
        run: |
          java_count=$(find platform -name pom.xml -not -path "*/target/*" | wc -l)
          if [ "$java_count" -eq 0 ]; then
            echo "::warning::未发现任何 Java 组件，跳过 java-lint"
            exit 0
          fi
          fail_count=0
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  Java Lint: $mod_name ($mod_dir)"
            echo "============================================"
            # Checkstyle 检查（阻断：检查失败则 CI 失败）
            if mvn -f "$pom" checkstyle:check -B -q 2>&1; then
              echo "✓ $mod_name Checkstyle 通过"
            else
              echo "::error::$mod_name Checkstyle 检查失败（或插件未配置），已阻断 CI"
              fail_count=$((fail_count + 1))
            fi
            # PMD 检查（非阻断：环境差异可能导致 PMD 失败，仅警告不阻断 CI）
            if mvn -f "$pom" pmd:check -B -q 2>&1; then
              echo "✓ $mod_name PMD 通过"
            else
              echo "::warning::$mod_name PMD 检查失败（环境差异），仅警告"
            fi
          done < <(find platform -name pom.xml -not -path "*/target/*")
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Java 组件 lint 失败，java-lint 阻断"
            exit 1
          fi
          echo "Java lint 检查完成，全部通过"

  # ============================================================
  # YAML lint：校验所有 .yaml/.yml 文件语法与风格
  # 检查范围：design/deploy/values/、ske/manifests/、design/deploy/charts/
  # ============================================================
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: 校验 design/deploy/values/ 下的 YAML 文件
        run: |
          if compgen -G "design/deploy/values/*.yaml" > /dev/null; then
            yamllint -c .yamllint design/deploy/values/
          else
            echo "design/deploy/values/ 下无 YAML 文件，跳过"
          fi

      - name: 校验 ske/manifests/ 下的 YAML 文件
        run: |
          if compgen -G "ske/manifests/*.yaml" > /dev/null || compgen -G "ske/manifests/*.yml" > /dev/null; then
            yamllint -c .yamllint ske/manifests/
          else
            echo "ske/manifests/ 下无 YAML 文件，跳过"
          fi

      - name: 校验 design/deploy/charts/ 下的 YAML 文件
        run: |
          if [ -d "design/deploy/charts" ]; then
            yamllint -c .yamllint design/deploy/charts/
          else
            echo "design/deploy/charts/ 目录不存在，跳过"
          fi

  # ============================================================
  # Python 语法检查：编译 design/deploy/services/operations/main.py
  # ============================================================
  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 编译检查 main.py 语法
        run: |
          if [ -f "design/deploy/services/operations/main.py" ]; then
            python -m py_compile design/deploy/services/operations/main.py
            echo "main.py 语法检查通过"
          else
            echo "::error::design/deploy/services/operations/main.py 不存在"
            exit 1
          fi

  # ============================================================
  # Bash 语法检查：bash -n 检查所有关键 shell 脚本
  # 检查范围：ske/ske.sh、ske/tuning/*.sh、platform/bootstrap.sh
  # ============================================================
  bash-check:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 ske/ske.sh 语法
        run: |
          if [ -f "ske/ske.sh" ]; then
            bash -n ske/ske.sh
            echo "ske/ske.sh 语法检查通过"
          else
            echo "::error::ske/ske.sh 不存在"
            exit 1
          fi

      - name: 检查 ske/tuning/*.sh 语法
        run: |
          if compgen -G "ske/tuning/*.sh" > /dev/null; then
            for script in ske/tuning/*.sh; do
              echo "检查 $script ..."
              bash -n "$script"
            done
            echo "ske/tuning/ 下所有脚本语法检查通过"
          else
            echo "ske/tuning/ 下无 .sh 文件，跳过"
          fi

      - name: 检查 platform/bootstrap.sh 语法
        run: |
          if [ -f "platform/bootstrap.sh" ]; then
            bash -n platform/bootstrap.sh
            echo "platform/bootstrap.sh 语法检查通过"
          else
            echo "::error::platform/bootstrap.sh 不存在"
            exit 1
          fi

  # ============================================================
  # 前端构建：Node 22 + npm ci + npm run build
  # 工作目录：frontend/
  # ============================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            echo "package-lock.json 不存在，使用 npm install"
            npm install
          fi

      - name: 构建前端
        run: npm run build

      - name: 前端单元测试（vitest）
        # 130 个 API/视图测试；失败即阻断（防止前端回归被吞）
        run: npm run test -- --run

      - name: 检查 bundle 大小
        run: |
          # 检查 dist 目录下是否有超过 1MB 的 chunk
          oversized=$(find dist -name "*.js" -size +1M 2>/dev/null || true)
          if [ -n "$oversized" ]; then
            echo "WARNING: Oversized chunks detected:"
            echo "$oversized"
          else
            echo "All chunks are within size limit"
          fi
          # 输出 bundle 大小统计
          echo "Bundle size summary:"
          du -sh dist/assets/* 2>/dev/null || true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: warn

  # ============================================================
  # Helm lint：校验 design/deploy/charts/ 下每个 Helm Chart
  # 仅当 charts 目录存在时执行
  # ============================================================
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: 对每个 Chart 执行 helm lint（阻断：lint 失败则 CI 失败）
        run: |
          if [ ! -d "design/deploy/charts" ]; then
            echo "design/deploy/charts/ 目录不存在，跳过 helm lint"
            exit 0
          fi
          chart_found=0
          fail_count=0
          for chart_dir in design/deploy/charts/*/; do
            if [ -f "${chart_dir}Chart.yaml" ]; then
              chart_found=1
              echo "----------------------------------------"
              echo "校验 Chart: ${chart_dir}"
              echo "----------------------------------------"
              if helm lint "${chart_dir}"; then
                echo "✓ ${chart_dir} helm lint 通过"
              else
                echo "::error::${chart_dir} helm lint 失败"
                fail_count=$((fail_count + 1))
              fi
            fi
          done
          if [ "$chart_found" -eq 0 ]; then
            echo "design/deploy/charts/ 下未发现任何 Helm Chart，跳过"
          fi
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Helm Chart lint 失败，helm-lint 阻断 CI"
            exit 1
          fi

  # ============================================================
  # Java 构建与测试：JDK 17 + Maven 3.9
  # 遍历 platform/ 下所有含 pom.xml 的子目录，逐个执行 mvn test -B
  # 编译并运行单元测试（使用H2内存数据库+Mockito Mock，无需外部服务），上传构建产物清单
  # ============================================================
  java-build-test:
    name: Java Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 安装 Maven 3.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: 发现并遍历所有 Java 组件（含 pom.xml）
        run: |
          echo "============================================"
          echo "  扫描 platform/ 下所有含 pom.xml 的子目录"
          echo "============================================"
          java_modules=()
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            java_modules+=("$mod_dir")
            echo "发现 Java 组件: $mod_dir"
          done < <(find platform -name pom.xml -not -path "*/target/*")
          if [ ${#java_modules[@]} -eq 0 ]; then
            echo "::warning::未发现任何含 pom.xml 的 Java 组件，跳过 Java 构建"
            echo "java_skip=true" >> $GITHUB_ENV
          else
            echo "共发现 ${#java_modules[@]} 个 Java 组件"
            echo "java_skip=false" >> $GITHUB_ENV
          fi

      - name: 对每个 Java 组件执行 mvn test（运行单元测试）
        if: env.java_skip != 'true'
        run: |
          mvn -version
          echo "============================================"
          echo "  预构建：安装 sql-gateway 到本地仓库"
          echo "============================================"
          # lineage-analyzer 依赖 sql-gateway，需要先安装（预安装不运行测试）
          sql_gw_pom="platform/sql-gateway/pom.xml"
          if [ -f "$sql_gw_pom" ]; then
            mvn -f "$sql_gw_pom" install -B -DskipTests -q \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
            echo "✓ sql-gateway 已安装到本地仓库"
          fi
          echo "============================================"
          echo "  开始 Java 单元测试"
          echo "============================================"
          fail_count=0
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  测试: $mod_name ($mod_dir)"
            echo "============================================"
            if mvn -f "$pom" test -B -e \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn; then
              echo "✓ $mod_name 测试通过"
            else
              echo "::error::$mod_name 测试失败"

              fail_count=$((fail_count + 1))
            fi
          done < <(find platform -name pom.xml -not -path "*/target/*")
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Java 组件测试失败"
            exit 1
          fi

      - name: 收集 Java 构建产物
        if: env.java_skip != 'true' && always()
        run: |
          mkdir -p java-build-reports
          while IFS= read -r target_dir; do
            mod_dir=$(dirname "$target_dir")
            mod_name=$(basename "$mod_dir")
            mkdir -p "java-build-reports/$mod_name"
            # 复制编译的 class 文件清单（仅记录目录结构）
            if [ -d "$target_dir/classes" ]; then
              find "$target_dir/classes" -name "*.class" > "java-build-reports/$mod_name/classes-list.txt" 2>/dev/null || echo "无法列出 $mod_name class 文件" > "java-build-reports/$mod_name/classes-list.txt"
            fi
          done < <(find platform -path "*/target" -not -path "*/target/*" 2>/dev/null)
          echo "已收集构建产物清单到 java-build-reports/"

      - name: 上传 Java 构建报告
        if: env.java_skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: java-build-reports
          path: java-build-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: JaCoCo覆盖率门禁检查（全量模块）
        if: env.java_skip != 'true'
        run: |
          echo "============================================"
          echo "  JaCoCo 覆盖率门禁检查 (阈值: 行≥80% 分支≥70%)"
          echo "  覆盖范围：platform/ 下所有含 pom.xml 的 Java 模块"
          echo "============================================"
          # 阈值定义（保持当前值，不提升至 85%）
          LINE_THRESHOLD=80
          BRANCH_THRESHOLD=70
          # 遍历所有 Java 模块生成 JaCoCo 报告并执行门禁检查
          # 仅对存在 src/test 目录（有测试）的模块执行门禁；无测试的模块仅生成报告
          fail_count=0
          warn_count=0
          mod_count=0
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            mod_name=$(basename "$mod_dir")
            mod_count=$((mod_count + 1))
            echo "--------------------------------------------"
            echo "  JaCoCo: $mod_name ($mod_dir)"
            echo "--------------------------------------------"
            # 生成 JaCoCo 报告（如果插件未配置则跳过）
            if ! mvn -f "$pom" jacoco:report -B -q 2>/dev/null; then
              echo "::warning::$mod_name JaCoCo report 生成失败（插件可能未配置），跳过门禁"
              warn_count=$((warn_count + 1))
              continue
            fi
            # 检查是否存在 JaCoCo 报告（target/site/jacoco/jacoco.xml）
            jacoco_xml="$mod_dir/target/site/jacoco/jacoco.xml"
            if [ ! -f "$jacoco_xml" ]; then
              echo "::warning::$mod_name 未生成 jacoco.xml（可能无测试或无字节码），跳过门禁"
              warn_count=$((warn_count + 1))
              continue
            fi
            # 从 jacoco.xml 解析行覆盖率和分支覆盖率
            # JaCoCo XML 中 <counter type="LINE" missed="x" covered="y"/>，覆盖率 = covered/(missed+covered)*100
            line_missed=$(grep -oP '<counter type="LINE"[^>]*missed="\K[0-9]+' "$jacoco_xml" | tail -1)
            line_covered=$(grep -oP '<counter type="LINE"[^>]*covered="\K[0-9]+' "$jacoco_xml" | tail -1)
            branch_missed=$(grep -oP '<counter type="BRANCH"[^>]*missed="\K[0-9]+' "$jacoco_xml" | tail -1)
            branch_covered=$(grep -oP '<counter type="BRANCH"[^>]*covered="\K[0-9]+' "$jacoco_xml" | tail -1)
            # 计算覆盖率（避免除零）
            line_total=$((line_missed + line_covered))
            branch_total=$((branch_missed + branch_covered))
            if [ "$line_total" -gt 0 ]; then
              line_pct=$((line_covered * 100 / line_total))
            else
              line_pct=0
            fi
            if [ "$branch_total" -gt 0 ]; then
              branch_pct=$((branch_covered * 100 / branch_total))
            else
              branch_pct=0
            fi
            echo "$mod_name 行覆盖率: ${line_pct}% (阈值 ${LINE_THRESHOLD}%)，分支覆盖率: ${branch_pct}% (阈值 ${BRANCH_THRESHOLD}%)"
            # 门禁检查：行覆盖率和分支覆盖率均需达标
            # 注：当前覆盖率远未达 85% GA 标准，保持 80%/70% 作为阻断门禁
            # 仅对有测试的模块（line_total > 0）执行阻断
            if [ "$line_total" -gt 0 ]; then
              if [ "$line_pct" -lt "$LINE_THRESHOLD" ] || [ "$branch_pct" -lt "$BRANCH_THRESHOLD" ]; then
                echo "::error::$mod_name 覆盖率不达标：行 ${line_pct}%<${LINE_THRESHOLD}% 或 分支 ${branch_pct}%<${BRANCH_THRESHOLD}%，阻断 CI"
                fail_count=$((fail_count + 1))
              else
                echo "✓ $mod_name 覆盖率达标"
              fi
            else
              echo "::warning::$mod_name 无可统计的代码行（line_total=0），跳过门禁"
              warn_count=$((warn_count + 1))
            fi
          done < <(find platform -name pom.xml -not -path "*/target/*")
          echo "============================================"
          echo "  JaCoCo 门禁汇总：共 $mod_count 个模块，失败 $fail_count，警告 $warn_count"
          echo "============================================"
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Java 模块覆盖率低于阈值（行≥${LINE_THRESHOLD}% 分支≥${BRANCH_THRESHOLD}%），JaCoCo 门禁阻断 CI"
            exit 1
          fi

      - name: 覆盖率趋势阻断检查（Java）
        if: env.java_skip != 'true'
        run: |
          echo "============================================"
          echo "  Java 覆盖率趋势阻断（下降 > 2% 阻断 CI）"
          echo "============================================"
          # 从当前构建读取每个模块的行覆盖率，与基线文件对比
          # 基线文件：docs/coverage-baseline/java.json（首次运行时自动生成）
          # 如果基线不存在，跳过趋势检查（首次运行）
          BASELINE_FILE="docs/coverage-baseline/java.json"
          REGRESSION_THRESHOLD=2  # 下降超过 2% 阻断
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::warning::基线文件 $BASELINE_FILE 不存在，跳过趋势检查（首次运行）"
            echo "提示：执行 scripts/coverage/update-baseline.sh java 生成基线"
            exit 0
          fi
          echo "读取基线：$BASELINE_FILE"
          fail_count=0
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            mod_name=$(basename "$mod_dir")
            jacoco_xml="$mod_dir/target/site/jacoco/jacoco.xml"
            if [ ! -f "$jacoco_xml" ]; then
              continue
            fi
            # 当前覆盖率
            line_missed=$(grep -oP '<counter type="LINE"[^>]*missed="\K[0-9]+' "$jacoco_xml" | tail -1)
            line_covered=$(grep -oP '<counter type="LINE"[^>]*covered="\K[0-9]+' "$jacoco_xml" | tail -1)
            line_total=$((line_missed + line_covered))
            if [ "$line_total" -le 0 ]; then
              continue
            fi
            current_pct=$((line_covered * 100 / line_total))
            # 从基线读取（JSON 格式：{"module_name": line_pct}）
            baseline_pct=$(python3 -c "import json; d=json.load(open('$BASELINE_FILE')); print(d.get('$mod_name', 0))" 2>/dev/null || echo "0")
            # 计算下降幅度
            drop=$((baseline_pct - current_pct))
            if [ "$drop" -gt "$REGRESSION_THRESHOLD" ]; then
              echo "::error::$mod_name 覆盖率下降 $drop%（基线 ${baseline_pct}% → 当前 ${current_pct}%），超过 ${REGRESSION_THRESHOLD}% 阈值，阻断 CI"
              fail_count=$((fail_count + 1))
            else
              echo "✓ $mod_name 覆盖率趋势正常（基线 ${baseline_pct}% → 当前 ${current_pct}%，下降 $drop%）"
            fi
          done < <(find platform -name pom.xml -not -path "*/target/*")
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Java 模块覆盖率下降超过 ${REGRESSION_THRESHOLD}%，趋势阻断 CI"
            exit 1
          fi
          echo "✓ Java 覆盖率趋势检查通过"

  # ============================================================
  # Go 构建与测试：Go 1.26
  # 遍历 platform/ 下所有含 go.mod 的子目录，逐个执行 go test ./...
  # 编译并运行单元测试（纯单元测试，无需外部服务），上传构建报告
  # ============================================================
  go-build-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            platform/ai-assistant/go.sum
            platform/catalog/go.sum
            platform/dqctl/go.sum
            platform/infra-provider-baremetal/go.sum
            platform/karmada/api/go.sum
            platform/karmada/failover/api/go.sum
            platform/llm-gateway/go.sum
            platform/observability/query-api/go.sum
            platform/vector-engine/go.sum

      - name: 发现并遍历所有 Go 组件（含 go.mod）
        run: |
          echo "============================================"
          echo "  扫描 platform/ 下所有含 go.mod 的子目录"
          echo "============================================"
          go_modules=()
          while IFS= read -r gomod; do
            mod_dir=$(dirname "$gomod")
            go_modules+=("$mod_dir")
            echo "发现 Go 组件: $mod_dir"
          done < <(find platform -name go.mod -not -path "*/vendor/*")
          if [ ${#go_modules[@]} -eq 0 ]; then
            echo "::warning::未发现任何含 go.mod 的 Go 组件，跳过 Go 构建"
            echo "go_skip=true" >> $GITHUB_ENV
          else
            echo "共发现 ${#go_modules[@]} 个 Go 组件"
            echo "go_skip=false" >> $GITHUB_ENV
          fi

      - name: 对每个 Go 组件执行 go test（运行单元测试）
        if: env.go_skip != 'true'
        run: |
          set -o pipefail
          go version
          mkdir -p go-build-reports
          fail_count=0
          while IFS= read -r gomod; do
            mod_dir=$(dirname "$gomod")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  测试: $mod_name ($mod_dir)"
            echo "============================================"
            (cd "$mod_dir" && go test ./... 2>&1) | tee "go-build-reports/${mod_name}-test.log"
            if [ ${PIPESTATUS[0]} -eq 0 ]; then
              echo "✓ $mod_name go test 通过"
            else
              echo "✗ $mod_name go test 失败"
              fail_count=$((fail_count + 1))
            fi
          done < <(find platform -name go.mod -not -path "*/vendor/*")
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Go 组件测试失败"
            exit 1
          fi

      - name: 上传 Go 构建报告
        if: env.go_skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: go-build-reports
          path: go-build-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Go覆盖率门禁检查（全量模块）
        if: env.go_skip != 'true'
        run: |
          echo "============================================"
          echo "  Go 覆盖率门禁检查 (阈值: ≥70%)"
          echo "  覆盖范围：platform/ 下所有含 go.mod 的 Go 模块"
          echo "============================================"
          # 阈值定义（保持当前值，不提升至 85%）
          COVERAGE_THRESHOLD=70
          fail_count=0
          warn_count=0
          mod_count=0
          while IFS= read -r gomod; do
            mod_dir=$(dirname "$gomod")
            mod_name=$(basename "$mod_dir")
            mod_count=$((mod_count + 1))
            echo "--------------------------------------------"
            echo "  Go Coverage: $mod_name ($mod_dir)"
            echo "--------------------------------------------"
            # 运行测试并收集覆盖率，提取 total 行的覆盖率百分比
            cov_output=$(cd "$mod_dir" && go test -cover ./... 2>/dev/null || true)
            cov=$(echo "$cov_output" | grep "^total:" | awk '{print $NF}' | tr -d '%' || echo "")
            if [ -z "$cov" ]; then
              cov="0"
              echo "::warning::$mod_name 未生成覆盖率数据（可能无测试或测试失败），跳过门禁"
              warn_count=$((warn_count + 1))
              continue
            fi
            echo "$mod_name coverage: $cov%"
            # 门禁检查：覆盖率需 ≥ 70%
            # 使用 awk 进行浮点比较
            below=$(awk -v c="$cov" -v t="$COVERAGE_THRESHOLD" 'BEGIN { print (c < t) ? 1 : 0 }')
            if [ "$below" = "1" ]; then
              echo "::error::$mod_name 覆盖率 $cov% 低于阈值 ${COVERAGE_THRESHOLD}%，阻断 CI"
              fail_count=$((fail_count + 1))
            else
              echo "✓ $mod_name 覆盖率达标"
            fi
          done < <(find platform -name go.mod -not -path "*/vendor/*")
          echo "============================================"
          echo "  Go 门禁汇总：共 $mod_count 个模块，失败 $fail_count，警告 $warn_count"
          echo "============================================"
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Go 模块覆盖率低于 ${COVERAGE_THRESHOLD}%，Go 门禁阻断 CI"
            exit 1
          fi

      - name: 覆盖率趋势阻断检查（Go）
        if: env.go_skip != 'true'
        run: |
          echo "============================================"
          echo "  Go 覆盖率趋势阻断（下降 > 2% 阻断 CI）"
          echo "============================================"
          BASELINE_FILE="docs/coverage-baseline/go.json"
          REGRESSION_THRESHOLD=2  # 下降超过 2% 阻断
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::warning::基线文件 $BASELINE_FILE 不存在，跳过趋势检查（首次运行）"
            echo "提示：执行 scripts/coverage/update-baseline.sh go 生成基线"
            exit 0
          fi
          echo "读取基线：$BASELINE_FILE"
          fail_count=0
          while IFS= read -r gomod; do
            mod_dir=$(dirname "$gomod")
            mod_name=$(basename "$mod_dir")
            cov_output=$(cd "$mod_dir" && go test -cover ./... 2>/dev/null || true)
            cov=$(echo "$cov_output" | grep "^total:" | awk '{print $NF}' | tr -d '%' || echo "")
            if [ -z "$cov" ]; then
              continue
            fi
            baseline_pct=$(python3 -c "import json; d=json.load(open('$BASELINE_FILE')); print(d.get('$mod_name', 0))" 2>/dev/null || echo "0")
            # 浮点下降计算
            drop=$(python3 -c "print(round(float('$baseline_pct') - float('$cov'), 2))" 2>/dev/null || echo "0")
            below=$(python3 -c "print(1 if float('$drop') > $REGRESSION_THRESHOLD else 0)" 2>/dev/null || echo "0")
            if [ "$below" = "1" ]; then
              echo "::error::$mod_name 覆盖率下降 $drop%（基线 ${baseline_pct}% → 当前 ${cov}%），超过 ${REGRESSION_THRESHOLD}% 阈值，阻断 CI"
              fail_count=$((fail_count + 1))
            else
              echo "✓ $mod_name 覆盖率趋势正常（基线 ${baseline_pct}% → 当前 ${cov}%，下降 $drop%）"
            fi
          done < <(find platform -name go.mod -not -path "*/vendor/*")
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Go 模块覆盖率下降超过 ${REGRESSION_THRESHOLD}%，趋势阻断 CI"
            exit 1
          fi
          echo "✓ Go 覆盖率趋势检查通过"

  # ============================================================
  # Python 测试：Python 3.11
  # 遍历 platform/ 下所有含 pytest.ini 或 pyproject.toml(含 pytest 配置) 的子目录
  # 逐个执行 python -m pytest（运行单元测试，使用Mock模式，无需外部服务），上传测试报告
  # ============================================================
  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 发现并遍历所有 Python 组件（含 pytest 配置）
        run: |
          echo "============================================"
          echo "  扫描 platform/ 下所有含 pytest 配置的子目录"
          echo "============================================"
          py_modules=()
          # 收集含 pytest.ini 的目录
          while IFS= read -r f; do
            mod_dir=$(dirname "$f")
            py_modules+=("$mod_dir")
            echo "发现 Python 组件 (pytest.ini): $mod_dir"
          done < <(find platform -name pytest.ini 2>/dev/null)
          # 收集含 pyproject.toml 且配置了 pytest 的目录
          while IFS= read -r f; do
            mod_dir=$(dirname "$f")
            if grep -q "pytest" "$f" 2>/dev/null; then
              # 去重
              if [[ ! " ${py_modules[*]} " =~ " ${mod_dir} " ]]; then
                py_modules+=("$mod_dir")
                echo "发现 Python 组件 (pyproject.toml+pytest): $mod_dir"
              fi
            fi
          done < <(find platform -name pyproject.toml 2>/dev/null)
          if [ ${#py_modules[@]} -eq 0 ]; then
            echo "::warning::未发现任何含 pytest 配置的 Python 组件，跳过 Python 语法检查"
            echo "py_skip=true" >> $GITHUB_ENV
          else
            echo "共发现 ${#py_modules[@]} 个 Python 组件"
            echo "py_skip=false" >> $GITHUB_ENV
            printf '%s\n' "${py_modules[@]}" > .python-modules.txt
          fi

      - name: 对每个 Python 组件执行 pytest（运行单元测试）
        if: env.py_skip != 'true'
        run: |
          set -o pipefail  # 管道退出码取 pytest 而非 tee（修复 pytest 失败被吞）
          mkdir -p python-syntax-reports
          # 安装依赖并运行 pytest
          fail_count=0
          while IFS= read -r mod_dir; do
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  运行测试: $mod_name ($mod_dir)"
            echo "============================================"
            # 安装依赖
            if [ -f "$mod_dir/pyproject.toml" ]; then
              pip install -e "$mod_dir" -q 2>/dev/null || pip install -r "$mod_dir/requirements.txt" -q 2>/dev/null || true
            elif [ -f "$mod_dir/requirements.txt" ]; then
              pip install -r "$mod_dir/requirements.txt" -q 2>/dev/null || true
            fi
            # 运行 pytest
            if (cd "$mod_dir" && python -m pytest tests/ -v --tb=short 2>&1) | tee "python-syntax-reports/${mod_name}-test.log"; then
              echo "✓ $mod_name pytest 通过"
            else
              echo "✗ $mod_name pytest 失败"
              fail_count=$((fail_count + 1))
            fi
          done < .python-modules.txt
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Python 组件测试失败"
            exit 1
          fi

      - name: 上传 Python 语法检查报告
        if: env.py_skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: python-syntax-reports
          path: python-syntax-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Python覆盖率门禁检查（全量模块）
        if: env.py_skip != 'true'
        run: |
          echo "============================================"
          echo "  Python 覆盖率门禁检查 (阈值: ≥75%)"
          echo "  覆盖范围：platform/ 下所有含 pytest 配置的 Python 模块"
          echo "============================================"
          # 阈值定义（保持当前值，不提升至 85%）
          COVERAGE_THRESHOLD=75
          # 安装 pytest-cov
          pip install pytest-cov -q 2>/dev/null || true
          fail_count=0
          warn_count=0
          mod_count=0
          while IFS= read -r mod_dir; do
            mod_name=$(basename "$mod_dir")
            mod_count=$((mod_count + 1))
            echo "--------------------------------------------"
            echo "  Python Coverage: $mod_name ($mod_dir)"
            echo "--------------------------------------------"
            # 检查是否有 pytest 配置
            if [ ! -f "$mod_dir/pytest.ini" ] && [ ! -f "$mod_dir/pyproject.toml" ] && [ ! -f "$mod_dir/setup.cfg" ]; then
              echo "::warning::$mod_name 未配置 pytest，跳过覆盖率门禁"
              warn_count=$((warn_count + 1))
              continue
            fi
            # 安装依赖
            if [ -f "$mod_dir/pyproject.toml" ]; then
              pip install -e "$mod_dir" -q 2>/dev/null || pip install -r "$mod_dir/requirements.txt" -q 2>/dev/null || true
            elif [ -f "$mod_dir/requirements.txt" ]; then
              pip install -r "$mod_dir/requirements.txt" -q 2>/dev/null || true
            fi
            # 运行带覆盖率报告的 pytest，提取总覆盖率
            # 使用 --cov-report=term-missing 输出详细覆盖率
            cov_output=$(cd "$mod_dir" && python -m pytest tests/ --cov=. --cov-report=term-missing --no-header -q 2>&1 || true)
            # 从输出中提取 TOTAL 行的覆盖率百分比
            cov=$(echo "$cov_output" | grep -E "^TOTAL" | awk '{print $NF}' | tr -d '%' || echo "")
            if [ -z "$cov" ]; then
              # 兼容不同 pytest-cov 输出格式
              cov=$(echo "$cov_output" | grep -E "TOTAL" | grep -oE '[0-9]+%' | tr -d '%' | tail -1 || echo "")
            fi
            if [ -z "$cov" ]; then
              cov="0"
              echo "::warning::$mod_name 未生成覆盖率数据（可能无测试或测试失败），跳过门禁"
              warn_count=$((warn_count + 1))
              continue
            fi
            echo "$mod_name coverage: $cov%"
            # 门禁检查：覆盖率需 ≥ 75%
            below=$(python3 -c "print(1 if float('$cov') < $COVERAGE_THRESHOLD else 0)" 2>/dev/null || echo "0")
            if [ "$below" = "1" ]; then
              echo "::error::$mod_name 覆盖率 $cov% 低于阈值 ${COVERAGE_THRESHOLD}%，阻断 CI"
              fail_count=$((fail_count + 1))
            else
              echo "✓ $mod_name 覆盖率达标"
            fi
          done < .python-modules.txt
          echo "============================================"
          echo "  Python 门禁汇总：共 $mod_count 个模块，失败 $fail_count，警告 $warn_count"
          echo "============================================"
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Python 模块覆盖率低于 ${COVERAGE_THRESHOLD}%，Python 门禁阻断 CI"
            exit 1
          fi

      - name: 覆盖率趋势阻断检查（Python）
        if: env.py_skip != 'true'
        run: |
          echo "============================================"
          echo "  Python 覆盖率趋势阻断（下降 > 2% 阻断 CI）"
          echo "============================================"
          BASELINE_FILE="docs/coverage-baseline/python.json"
          REGRESSION_THRESHOLD=2  # 下降超过 2% 阻断
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::warning::基线文件 $BASELINE_FILE 不存在，跳过趋势检查（首次运行）"
            echo "提示：执行 scripts/coverage/update-baseline.sh python 生成基线"
            exit 0
          fi
          echo "读取基线：$BASELINE_FILE"
          fail_count=0
          while IFS= read -r mod_dir; do
            mod_name=$(basename "$mod_dir")
            if [ ! -f "$mod_dir/pytest.ini" ] && [ ! -f "$mod_dir/pyproject.toml" ] && [ ! -f "$mod_dir/setup.cfg" ]; then
              continue
            fi
            cov_output=$(cd "$mod_dir" && python -m pytest tests/ --cov=. --cov-report=term-missing --no-header -q 2>&1 || true)
            cov=$(echo "$cov_output" | grep -E "^TOTAL" | awk '{print $NF}' | tr -d '%' || echo "")
            if [ -z "$cov" ]; then
              cov=$(echo "$cov_output" | grep -E "TOTAL" | grep -oE '[0-9]+%' | tr -d '%' | tail -1 || echo "")
            fi
            if [ -z "$cov" ]; then
              continue
            fi
            baseline_pct=$(python3 -c "import json; d=json.load(open('$BASELINE_FILE')); print(d.get('$mod_name', 0))" 2>/dev/null || echo "0")
            drop=$(python3 -c "print(round(float('$baseline_pct') - float('$cov'), 2))" 2>/dev/null || echo "0")
            below=$(python3 -c "print(1 if float('$drop') > $REGRESSION_THRESHOLD else 0)" 2>/dev/null || echo "0")
            if [ "$below" = "1" ]; then
              echo "::error::$mod_name 覆盖率下降 $drop%（基线 ${baseline_pct}% → 当前 ${cov}%），超过 ${REGRESSION_THRESHOLD}% 阈值，阻断 CI"
              fail_count=$((fail_count + 1))
            else
              echo "✓ $mod_name 覆盖率趋势正常（基线 ${baseline_pct}% → 当前 ${cov}%，下降 $drop%）"
            fi
          done < .python-modules.txt
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Python 模块覆盖率下降超过 ${REGRESSION_THRESHOLD}%，趋势阻断 CI"
            exit 1
          fi
          echo "✓ Python 覆盖率趋势检查通过"

  # ============================================================
  # Docker 镜像构建验证：遍历 platform/ 下所有含 Dockerfile 的组件
  # 仅执行 docker build 验证（不 push），确保 Dockerfile 可正常构建
  # 仅在 PR 到 main 时执行
  # ============================================================
  docker-build:
    name: Docker Build Verify
    runs-on: ubuntu-latest
    # 仅在 PR 到 main 时执行，push 时不执行以节省资源
    if: github.event_name == 'pull_request'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 发现并遍历所有含 Dockerfile 的组件
        run: |
          echo "============================================"
          echo "  扫描 platform/ 下所有含 Dockerfile 的子目录"
          echo "============================================"
          docker_dirs=()
          while IFS= read -r df; do
            mod_dir=$(dirname "$df")
            docker_dirs+=("$mod_dir")
            echo "发现 Dockerfile: $mod_dir"
          done < <(find platform -name Dockerfile -not -path "*/target/*" -not -path "*/node_modules/*")
          if [ ${#docker_dirs[@]} -eq 0 ]; then
            echo "::warning::未发现任何含 Dockerfile 的组件，跳过 Docker 构建验证"
            echo "docker_skip=true" >> $GITHUB_ENV
          else
            echo "共发现 ${#docker_dirs[@]} 个 Dockerfile"
            echo "docker_skip=false" >> $GITHUB_ENV
          fi

      - name: 对每个 Dockerfile 执行 docker build（仅验证，不 push）
        if: env.docker_skip != 'true'
        run: |
          fail_count=0
          while IFS= read -r df; do
            mod_dir=$(dirname "$df")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  Docker build 验证: $mod_name ($mod_dir)"
            echo "============================================"
            # 使用本地镜像 tag，仅验证构建不 push
            if docker build -t "sq-${mod_name}:ci-verify" "$mod_dir"; then
              echo "✓ $mod_name Docker 构建成功"
            else
              echo "✗ $mod_name Docker 构建失败"
              fail_count=$((fail_count + 1))
            fi
          done < <(find platform -name Dockerfile -not -path "*/target/*" -not -path "*/node_modules/*")
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Docker 镜像构建失败"
            exit 1
          fi
          echo "所有 Docker 镜像构建验证通过"

  # ============================================================
  # 版本对账：检查各组件版本一致性
  # 检查 Go/Java/Node 版本是否统一，不一致则阻断 CI
  # ============================================================
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行版本对账
        run: bash scripts/check-versions.sh

  # ============================================================
  # 集成测试：依赖 java-build-test 和 go-build-test 通过
  # 实际启动 docker-compose 并运行 pytest 集成测试
  # 通过步骤级别的 continue-on-error 处理 docker-compose 启动失败
  # ============================================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs:
      - java-build-test
      - go-build-test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查集成测试环境
        run: |
          if [ ! -f "tests/integration/docker-compose.yml" ]; then
            echo "::warning::tests/integration/docker-compose.yml 不存在，跳过"
            echo "it_skip=true" >> $GITHUB_ENV
          else
            echo "发现集成测试环境: tests/integration/"
            echo "it_skip=false" >> $GITHUB_ENV
          fi

      - name: 安装 Python 3.11 和 pytest
        if: env.it_skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装集成测试依赖
        if: env.it_skip != 'true'
        working-directory: tests/integration
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt -q
          fi
          pip install pytest pytest-html -q

      - name: 启动 docker-compose 服务
        if: env.it_skip != 'true'
        working-directory: tests/integration
        continue-on-error: true
        run: |
          echo "启动 docker-compose 服务..."
          if docker compose up -d --wait; then
            echo "✓ 所有服务已启动"
            echo "it_services_ready=true" >> $GITHUB_ENV
          else
            echo "::warning::docker-compose 启动失败，跳过集成测试（CI 环境资源限制）"
            echo "it_services_ready=false" >> $GITHUB_ENV
          fi

      - name: 运行 pytest 集成测试
        if: env.it_skip != 'true' && env.it_services_ready == 'true'
        working-directory: tests/integration
        run: |
          echo "运行集成测试..."
          python -m pytest -v --tb=short --html=test-report.html --self-contained-html
          echo "集成测试执行完成"

      - name: 上传集成测试报告
        if: env.it_skip != 'true' && env.it_services_ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: tests/integration/test-report.html
          retention-days: 7
          if-no-files-found: warn

      - name: 清理 docker-compose 服务
        if: env.it_skip != 'true' && always()
        working-directory: tests/integration
        run: |
          echo "清理 docker-compose 服务..."
          docker compose down -v --remove-orphans || true
          echo "✓ 清理完成"

  # ============================================================
  # Markdown lint：校验 README.md、CONVENTIONS.md
  # 依赖前述所有检查全部通过，作为最后的文档门禁
  # ============================================================
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    # 依赖前 15 个 job 全部通过后才执行，确保并行最大化同时保留汇总门禁
    needs:
      - gitleaks-scan
      - go-lint
      - python-lint
      - frontend-lint
      - java-lint
      - yaml-lint
      - python-check
      - bash-check
      - frontend-build
      - helm-lint
      - java-build-test
      - go-build-test
      - python-test
      - docker-build
      - integration-test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: 校验 README.md
        run: |
          if [ -f "README.md" ]; then
            markdownlint README.md
            echo "README.md 校验通过"
          else
            echo "::error::README.md 不存在"
            exit 1
          fi

      - name: 校验 CONVENTIONS.md
        run: |
          if [ -f "CONVENTIONS.md" ]; then
            markdownlint CONVENTIONS.md
            echo "CONVENTIONS.md 校验通过"
          else
            echo "::error::CONVENTIONS.md 不存在"
            exit 1
          fi

  # ============================================================
  # Trivy 容器镜像漏洞扫描：扫描文件系统中的 CRITICAL/HIGH 漏洞
  # 输出 SARIF 格式报告并上传到 GitHub Security 代码扫描
  # 阻断 CI：发现 CRITICAL/HIGH 漏洞时 exit-code=1，CI 失败
  # ============================================================
  trivy-scan:
    name: Trivy Scan (容器镜像漏洞扫描)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Maven 并预热本地缓存（避免 Trivy 请求 Maven Central 被 429 限流）
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 预解析所有 Maven 依赖
        run: |
          # 先安装 sql-gateway 到本地 ~/.m2，避免 Trivy 解析 lineage-analyzer 时去公网/被 429
          if [ -f platform/sql-gateway/pom.xml ]; then
            mvn -f platform/sql-gateway/pom.xml install -B -q -DskipTests \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          fi
          while IFS= read -r pom; do
            mvn -f "$pom" dependency:resolve -B -q -DskipTests || true
          done < <(find platform -name pom.xml -not -path "*/target/*")

      - name: 安装Trivy (与 security.yml 保持一致，直装+重试3次)
        run: |
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.71.1/trivy_0.71.1_Linux-64bit.tar.gz
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy version

      - name: Trivy扫描 - 文件系统模式
        run: trivy fs --severity CRITICAL,HIGH --ignore-unfixed --format sarif --output trivy-results.sarif .

      - name: 上传Trivy扫描结果
        uses: github/codeql-action/upload-sarif@v3
        # 该上传已由 security.yml 的 trivy-scan 负责；CI 侧重门禁。非阻断。
        continue-on-error: true
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      # 移除之前添加的表报告（它已造成 Security 失败且 YAML 以避免添加工件为主）

  # ============================================================
  # CycloneDX SBOM 生成：为 Java (Maven) 和前端 (npm) 组件生成软件物料清单
  # 上传 bom.json/bom.xml 作为 CI 产物，供安全合规审计使用
  # ============================================================
  sbom-generation:
    name: SBOM生成 (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装CycloneDX
        run: |
          curl -sL https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-amd64 -o /usr/local/bin/cyclonedx
          chmod +x /usr/local/bin/cyclonedx

      - name: 生成Java SBOM
        run: |
          # 对 encaps-layer 模块生成 SBOM
          cd platform/encaps-layer
          if [ -f pom.xml ]; then
            mvn org.cyclonedx:cyclonedx-maven-plugin:makeBom -q || true
          fi

      - name: 生成前端SBOM
        run: |
          cd frontend
          if [ -f package.json ]; then
            npm install -g @cyclonedx/cyclonedx-npm
            cyclonedx-npm --output-format json --output-file frontend-bom.json || true
          fi

      - name: 上传SBOM产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: |
            **/bom.json
            **/bom.xml
            frontend-bom.json

  # ============================================================
  # Kubeconform K8s 清单验证：校验 ske/manifests/ 下的 K8s YAML 清单
  # 使用 kubeconform 对每个 YAML 文件执行 schema 校验（K8s 1.29.0）
  # ============================================================
  kubeconform-check:
    name: Kubeconform (K8s清单验证)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: 验证K8s清单
        run: |
          # 验证 ske manifests
          find ske/manifests -name "*.yaml" -exec kubeconform -strict -kubernetes-version 1.29.0 {} \;

  # ============================================================
  # 性能压测：运行 tests/performance/ 下的 locust 压测脚本与 benchmark
  # 触发条件：schedule（每日凌晨2点）+ workflow_dispatch（手动触发）+ push 到 main
  # 依赖 java-build-test 和 go-build-test 通过后运行（复用构建产物，避免重复编译）
  # 使用 continue-on-error: true 确保性能测试失败不阻断 CI（允许失败）
  # 注：非每次 PR 触发，避免压测拖慢 PR 反馈；仅定时/手动/main push 时运行
  # ============================================================
  performance-test:
    name: Performance Test (性能压测)
    runs-on: ubuntu-latest
    needs:
      - java-build-test
      - go-build-test
    # 仅在定时触发、手动触发或 push 到 main 时运行（PR 不触发，避免每次 PR 都跑压测）
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # 性能测试失败不阻断 CI（允许失败，仅作趋势观测）
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装性能测试依赖（locust + pytest）
        run: pip install locust pytest -q

      - name: 运行性能基准测试
        run: python tests/performance/run_benchmark.py

      - name: 上传性能报告 artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-benchmark-report
          path: tests/performance/benchmark_report.md
          retention-days: 30
          if-no-files-found: warn