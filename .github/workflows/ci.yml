# ============================================================================
# MAOP 数据引擎 BDP — GitHub Actions CI/CD 流水线
# ============================================================================
# 四阶段流水线：Build → Test → Image → Deploy
#
# 技术栈：Java 17 + Spring Boot 3.2.5 + Gradle 8.5（多项目）
# 镜像仓库：GitHub Container Registry (ghcr.io)
#
# 模块说明（14 个 include，11 个 Spring Boot 微服务 + 3 个库模块）：
#   Spring Boot 微服务（构建镜像）：
#     bigdata-encaps, encaps, federated, finops, function, governance,
#     infra, ruleengine, sqlgateway, streambatch, tagengine
#   库模块（不构建镜像）：
#     flinkcdc, rule, common-health
#
# 注意：本项目无 Gradle Wrapper（gradlew），CI 中通过 setup-gradle 安装 Gradle 8.5。
# ============================================================================

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 全局环境变量
env:
  GRADLE_VERSION: '8.5'
  JAVA_VERSION: '17'

# 默认权限：最小权限原则
permissions:
  contents: read

jobs:
  # ==========================================================================
  # 阶段 1：Build — 编译所有模块（跳过测试）
  # ==========================================================================
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: 编译所有模块（gradle build -x test）
        run: gradle build -x test --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            build/
            !build/**/tmp/
          retention-days: 7
          if-no-files-found: warn

  # ==========================================================================
  # 阶段 2：Test — 执行单元测试（依赖 Build）
  # ==========================================================================
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build
    # 提供 PostgreSQL 测试数据库服务
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: 执行单元测试（gradle test）
        run: gradle test --no-daemon --stacktrace
        env:
          # PostgreSQL 测试数据源配置
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/**/test-results/
            build/**/reports/tests/
            build/**/reports/jacoco/
          retention-days: 14
          if-no-files-found: warn

      - name: 发布测试摘要
        if: always()
        run: |
          echo "## 测试结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "测试已完成。详细报告见 test-results artifact。" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # 阶段 3：Image — 构建并推送 Docker 镜像（依赖 Test，仅 push 触发）
  # ==========================================================================
  image:
    name: 🐳 Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 11 个 Spring Boot 微服务模块及其源码目录
          - module: bigdata-encaps
            dir: com/levango7/dataenginebdp/bigdata/encaps
          - module: encaps
            dir: com/levango7/dataenginebdp/encaps
          - module: federated
            dir: com/levango7/dataenginebdp/federated
          - module: finops
            dir: com/levango7/dataenginebdp/finops
          - module: function
            dir: com/levango7/dataenginebdp/function
          - module: governance
            dir: com/levango7/dataenginebdp/governance
          - module: infra
            dir: com/levango7/dataenginebdp/infra
          - module: ruleengine
            dir: com/levango7/dataenginebdp/ruleengine
          - module: sqlgateway
            dir: com/levango7/dataenginebdp/sqlgateway
          - module: streambatch
            dir: com/levango7/dataenginebdp/streambatch
          - module: tagengine
            dir: com/levango7/dataenginebdp/tagengine
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: 构建 bootJar（${{ matrix.module }}）
        run: gradle :${{ matrix.module }}:bootJar --no-daemon --stacktrace

      - name: 检查 Dockerfile 是否存在
        id: dockerfile
        run: |
          # 依次在模块目录、项目根目录、build 目录查找 Dockerfile
          DOCKERFILE=""
          for candidate in \
            "${{ matrix.dir }}/Dockerfile" \
            "${{ matrix.dir }}/docker/Dockerfile" \
            "deploy/${{ matrix.module }}/Dockerfile" \
            "Dockerfile"; do
            if [ -f "$candidate" ]; then
              DOCKERFILE="$candidate"
              break
            fi
          done

          if [ -n "$DOCKERFILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "✅ 找到 Dockerfile: $DOCKERFILE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  模块 ${{ matrix.module }} 未找到 Dockerfile，跳过镜像构建"
          fi

      - name: 计算镜像仓库地址
        if: steps.dockerfile.outputs.exists == 'true'
        id: registry
        run: |
          # GitHub Container Registry 镜像名必须全小写
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          MODULE=$(echo "${{ matrix.module }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${REPO}/${MODULE}" >> $GITHUB_OUTPUT
          echo "镜像地址: ghcr.io/${OWNER}/${REPO}/${MODULE}"

      - name: 登录 GitHub Container Registry
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        if: steps.dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: 设置 Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像（${{ matrix.module }}）
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MODULE=${{ matrix.module }}
            JAR_PATH=build/${{ matrix.module }}/libs

      - name: 镜像构建摘要
        if: always()
        run: |
          echo "## 镜像构建：${{ matrix.module }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.dockerfile.outputs.exists }}" == "true" ]; then
            echo "✅ 镜像已构建并推送至 ${{ steps.registry.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  跳过：未找到 Dockerfile" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # 阶段 4：Deploy — 部署到 Kubernetes（依赖 Image，仅 push 到 main 触发）
  # ==========================================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: 设置 K8s context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: 创建命名空间（如不存在）
        run: |
          kubectl create namespace ${{ secrets.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: 创建/更新 Docker Registry Secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace ${{ secrets.K8S_NAMESPACE }} \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 生成部署清单
        run: |
          MODULES=("bigdata-encaps" "encaps" "federated" "finops" "function" "governance" "infra" "ruleengine" "sqlgateway" "streambatch" "tagengine")
          PORTS=(8081 8082 8083 8084 8086 8087 8088 8090 8091 8092 8093)
          
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          
          mkdir -p deploy/k8s/generated
          
          for i in "${!MODULES[@]}"; do
            MODULE="${MODULES[$i]}"
            PORT="${PORTS[$i]}"
            IMAGE="ghcr.io/${OWNER}/${REPO}/${MODULE}:latest"
            
            cat > "deploy/k8s/generated/${MODULE}.yaml" <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${MODULE}
            namespace: ${{ secrets.K8S_NAMESPACE }}
            labels:
              app: ${MODULE}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: ${MODULE}
            template:
              metadata:
                labels:
                  app: ${MODULE}
              spec:
                imagePullSecrets:
                  - name: ghcr-secret
                containers:
                  - name: ${MODULE}
                    image: ${IMAGE}
                    ports:
                      - containerPort: 8080
                    env:
                      - name: SPRING_DATASOURCE_URL
                        value: jdbc:postgresql://postgres-service:5432/dataenginebdp
                      - name: SPRING_DATASOURCE_USERNAME
                        valueFrom:
                          secretKeyRef:
                            name: db-credentials
                            key: username
                      - name: SPRING_DATASOURCE_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: db-credentials
                            key: password
                      - name: SPRING_REDIS_HOST
                        value: redis-service
                      - name: SPRING_REDIS_PORT
                        value: "6379"
                      - name: JAVA_OPTS
                        value: "-Xms256m -Xmx512m"
                    resources:
                      requests:
                        memory: "256Mi"
                        cpu: "250m"
                      limits:
                        memory: "512Mi"
                        cpu: "500m"
                    livenessProbe:
                      httpGet:
                        path: /actuator/health/liveness
                        port: 8080
                      initialDelaySeconds: 60
                      periodSeconds: 10
                      failureThreshold: 3
                    readinessProbe:
                      httpGet:
                        path: /actuator/health/readiness
                        port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      failureThreshold: 3
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${MODULE}-service
            namespace: ${{ secrets.K8S_NAMESPACE }}
          spec:
            type: ClusterIP
            selector:
              app: ${MODULE}
            ports:
              - port: ${PORT}
                targetPort: 8080
                protocol: TCP
          EOF
          done
          
          echo "Generated ${#MODULES[@]} deployment manifests"

      - name: 部署到 K8s
        run: |
          kubectl apply -f deploy/k8s/generated/ -n ${{ secrets.K8S_NAMESPACE }}
          
          MODULES=("bigdata-encaps" "encaps" "federated" "finops" "function" "governance" "infra" "ruleengine" "sqlgateway" "streambatch" "tagengine")
          for MODULE in "${MODULES[@]}"; do
            echo "Waiting for ${MODULE} rollout..."
            kubectl rollout status deployment/${MODULE} -n ${{ secrets.K8S_NAMESPACE }} --timeout=300s
          done

      - name: 部署摘要
        if: always()
        run: |
          echo "## 🚀 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**提交:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**分支:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**命名空间:** ${{ secrets.K8S_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -n ${{ secrets.K8S_NAMESPACE }} -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: 失败通知
        if: failure()
        run: |
          echo "## ❌ 部署失败" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请检查以下内容：" >> $GITHUB_STEP_SUMMARY
          echo "- KUBE_CONFIG secret 是否正确配置" >> $GITHUB_STEP_SUMMARY
          echo "- K8S_NAMESPACE secret 是否设置" >> $GITHUB_STEP_SUMMARY
          echo "- K8s 集群是否可访问" >> $GITHUB_STEP_SUMMARY
          echo "- 镜像是否已成功推送" >> $GITHUB_STEP_SUMMARY