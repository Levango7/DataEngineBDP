# ============================================================================
# MAOP 数据引擎 BDP — GitHub Actions CI/CD 流水线
# ============================================================================
# 四阶段流水线：Build → Test → Image → Deploy
#
# 技术栈：Java 17 + Spring Boot 3.2.5 + Gradle 8.5（多项目）
# 镜像仓库：GitHub Container Registry (ghcr.io)
#
# 模块说明（14 个 include，11 个 Spring Boot 微服务 + 3 个库模块）：
#   Spring Boot 微服务（构建镜像）：
#     bigdata-encaps, encaps, federated, finops, function, governance,
#     infra, ruleengine, sqlgateway, streambatch, tagengine
#   库模块（不构建镜像）：
#     flinkcdc, rule, common-health
#
# 注意：本项目无 Gradle Wrapper（gradlew），CI 中通过 setup-gradle 安装 Gradle 8.5。
# ============================================================================

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 全局环境变量
env:
  GRADLE_VERSION: '8.5'
  JAVA_VERSION: '17'

# 默认权限：最小权限原则
permissions:
  contents: read

jobs:
  # ==========================================================================
  # 阶段 1：Build — 编译所有模块（跳过测试）
  # ==========================================================================
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: 编译所有模块（gradle build -x test）
        run: gradle build -x test --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            build/
            !build/**/tmp/
          retention-days: 7
          if-no-files-found: warn

  # ==========================================================================
  # 阶段 2：Test — 执行单元测试（依赖 Build）
  # ==========================================================================
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build
    # 提供 PostgreSQL 测试数据库服务
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: 执行单元测试（gradle test）
        run: gradle test --no-daemon --stacktrace
        env:
          # PostgreSQL 测试数据源配置
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/**/test-results/
            build/**/reports/tests/
            build/**/reports/jacoco/
          retention-days: 14
          if-no-files-found: warn

      - name: 发布测试摘要
        if: always()
        run: |
          echo "## 测试结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "测试已完成。详细报告见 test-results artifact。" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # 阶段 3：Image — 构建并推送 Docker 镜像（依赖 Test，仅 push 触发）
  # ==========================================================================
  image:
    name: 🐳 Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 11 个 Spring Boot 微服务模块及其源码目录
          - module: bigdata-encaps
            dir: com/levango7/dataenginebdp/bigdata/encaps
          - module: encaps
            dir: com/levango7/dataenginebdp/encaps
          - module: federated
            dir: com/levango7/dataenginebdp/federated
          - module: finops
            dir: com/levango7/dataenginebdp/finops
          - module: function
            dir: com/levango7/dataenginebdp/function
          - module: governance
            dir: com/levango7/dataenginebdp/governance
          - module: infra
            dir: com/levango7/dataenginebdp/infra
          - module: ruleengine
            dir: com/levango7/dataenginebdp/ruleengine
          - module: sqlgateway
            dir: com/levango7/dataenginebdp/sqlgateway
          - module: streambatch
            dir: com/levango7/dataenginebdp/streambatch
          - module: tagengine
            dir: com/levango7/dataenginebdp/tagengine
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: 构建 bootJar（${{ matrix.module }}）
        run: gradle :${{ matrix.module }}:bootJar --no-daemon --stacktrace

      - name: 检查 Dockerfile 是否存在
        id: dockerfile
        run: |
          # 依次在模块目录、项目根目录、build 目录查找 Dockerfile
          DOCKERFILE=""
          for candidate in \
            "${{ matrix.dir }}/Dockerfile" \
            "${{ matrix.dir }}/docker/Dockerfile" \
            "deploy/${{ matrix.module }}/Dockerfile" \
            "Dockerfile"; do
            if [ -f "$candidate" ]; then
              DOCKERFILE="$candidate"
              break
            fi
          done

          if [ -n "$DOCKERFILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "✅ 找到 Dockerfile: $DOCKERFILE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  模块 ${{ matrix.module }} 未找到 Dockerfile，跳过镜像构建"
          fi

      - name: 计算镜像仓库地址
        if: steps.dockerfile.outputs.exists == 'true'
        id: registry
        run: |
          # GitHub Container Registry 镜像名必须全小写
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          MODULE=$(echo "${{ matrix.module }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${REPO}/${MODULE}" >> $GITHUB_OUTPUT
          echo "镜像地址: ghcr.io/${OWNER}/${REPO}/${MODULE}"

      - name: 登录 GitHub Container Registry
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        if: steps.dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: 设置 Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像（${{ matrix.module }}）
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MODULE=${{ matrix.module }}
            JAR_PATH=build/${{ matrix.module }}/libs

      - name: 镜像构建摘要
        if: always()
        run: |
          echo "## 镜像构建：${{ matrix.module }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.dockerfile.outputs.exists }}" == "true" ]; then
            echo "✅ 镜像已构建并推送至 ${{ steps.registry.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  跳过：未找到 Dockerfile" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # 阶段 4：Deploy — 部署占位（依赖 Image，仅 push 触发）
  # ==========================================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署摘要
        run: |
          echo "## 🚀 部署阶段" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**提交:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**分支:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "当前为占位步骤，后续完善以下部署目标：" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Kubernetes 集群部署（kubectl/kustomize/helm）" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] 滚动更新策略配置" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] 部署健康检查与回滚机制" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] 部署通知（Slack/钉钉/企业微信）" >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------------
      # 占位步骤：K8s 部署（后续完善）
      # ----------------------------------------------------------------------
      # 解除以下注释并配置 KUBE_CONFIG secret 后即可启用 K8s 部署
