      # - name: 配置 kubectl
      #   uses: azure/setup-kubectl@v4
      #   with:
      #     version: 'v1.29.0'
      #
      # - name: 设置 K8s context
      #   uses: azure/k8s-set-context@v4
      #   with:
      #     kubeconfig: ${{ secrets.KUBE_CONFIG }}
