      # - name: 部署到 K8s
      #   run: |
      #     kubectl apply -f deploy/k8s/ -n ${{ secrets.K8S_NAMESPACE }}
      #     kubectl rollout status deployment/${{ github.event.repository.name }} -n ${{ secrets.K8S_NAMESPACE }}

      - name: 部署占位（待实现）
        run: |
          echo "=============================================="
          echo "  部署阶段占位步骤"
          echo "  提交 SHA: ${{ github.sha }}"
          echo "  分支: ${{ github.ref_name }}"
          echo "  后续完善 K8s 部署逻辑"
          echo "=============================================="