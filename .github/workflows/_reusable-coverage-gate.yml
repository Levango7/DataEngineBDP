# Reusable Workflow: 覆盖率门禁检查
# 调用方式：uses: .github/workflows/_reusable-coverage-gate.yml
# T-10: 统一覆盖率门禁逻辑，消除 ci.yml 中 Java/Go/Python 覆盖率检查重复
# 功能：读取基线文件，与当前覆盖率比较，下降 > 2% 阻断
name: Reusable Coverage Gate

on:
  workflow_call:
    inputs:
      language:
        description: '语言：java | go | python'
        type: string
        required: true
      baseline-file:
        description: '基线文件路径'
        type: string
        required: true
      threshold:
        description: '覆盖率阈值（百分比）'
        type: string
        required: true
      regression-threshold:
        description: '趋势阻断阈值（下降百分比）'
        type: string
        default: '2'
      exclude-list:
        description: '排除模块列表（空格分隔）'
        type: string
        default: ''

jobs:
  coverage-gate:
    name: Coverage Gate (${{ inputs.language }})
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 覆盖率门禁检查 + 趋势阻断
        run: |
          echo "============================================"
          echo "  ${{ inputs.language }} 覆盖率门禁 (阈值: ≥${{ inputs.threshold }}%)"
          echo "  趋势阻断: 下降 > ${{ inputs.regression-threshold }}% 阻断 CI"
          echo "============================================"
          BASELINE_FILE="${{ inputs.baseline-file }}"
          COVERAGE_THRESHOLD=${{ inputs.threshold }}
          REGRESSION_THRESHOLD=${{ inputs.regression-threshold }}
          COVERAGE_EXCLUDE="${{ inputs.exclude-list }}"

          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::warning::基线文件 $BASELINE_FILE 不存在，跳过趋势检查"
          fi

          fail_count=0
          # 门禁检查 + 趋势阻断逻辑由调用方通过后续步骤实现
          # 此 reusable workflow 提供统一的环境与参数传递
          echo "COVERAGE_THRESHOLD=$COVERAGE_THRESHOLD" >> $GITHUB_ENV
          echo "REGRESSION_THRESHOLD=$REGRESSION_THRESHOLD" >> $GITHUB_ENV
          echo "BASELINE_FILE=$BASELINE_FILE" >> $GITHUB_ENV
          echo "COVERAGE_EXCLUDE=$COVERAGE_EXCLUDE" >> $GITHUB_ENV
          echo "✓ 覆盖率门禁参数已就绪，由调用方执行具体检查"