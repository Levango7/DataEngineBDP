# Security 安全扫描流水线
# 触发条件：push 到 main、PR 到 main、每周一定时全量扫描、手动触发
# 职责：SonarQube 静态分析 + ZAP DAST 动态扫描 + Trivy 依赖漏洞检查 + gosec/go-vuln + pip-audit
# 与 codeql.yml 互补：codeql.yml 做代码语义级 SAST，security.yml 做工程化安全扫描与依赖漏洞
name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # 每周二 02:00 UTC 全量安全扫描 + 每周三 03:00 UTC（合并自 security-scan.yml）
  schedule:
    - cron: '0 2 * * 2'
    - cron: '0 3 * * 3'
  workflow_dispatch:

# 权限：security-events: write 上传 SARIF；contents: read 读取代码
permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # T-10: SonarQube 静态分析已移至独立的 sonarqube.yml 工作流
  # 此处不再重复执行，避免双重 SonarQube 分析消耗配额
  # ============================================================

  # ============================================================
  # Trivy 依赖漏洞扫描：扫描代码库 + Docker 镜像 + IaC 文件
  # 输出 SARIF 上传到 GitHub Security tab
  # ============================================================

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 与 ci.yml 的 trivy-scan 对齐：预热 ~/.m2，防止 Trivy 解析 pom 时被 Maven Central 429 限流
      - name: 安装 Maven 并预热本地缓存
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 预解析所有 Maven 依赖
        run: |
          # 与 ci.yml java-build-test 相同的依赖链顺序：父 POM → common-security →
          # encaps-layer → sql-gateway（lineage-analyzer 依赖 sql-gateway jar）。
          # 此前缺父 POM 安装，子模块 install 在干净 runner 上解析不到
          # dataenginebdp-parent，本步骤直接红（CI Security workflow 失败根因）。
          mvn install -B -N -q \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn || true
          for lib_pom in \
            platform/common-security/pom.xml \
            platform/encaps-layer/pom.xml \
            platform/sql-gateway/pom.xml; do
            [ -f "$lib_pom" ] || continue
            mvn -f "$lib_pom" install -B -q -DskipTests -U \
              -Dpmd.skip=true -Dcheckstyle.skip=true \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn || true
          done
          # 预解析仅服务 Trivy fs 扫描，失败不阻断（|| true）
          while IFS= read -r pom; do
            mvn -f "$pom" dependency:resolve -B -q -DskipTests || true
          done < <(find platform -name pom.xml -not -path "*/target/*")

      - name: 安装 Trivy
        run: |
          # 官方 action 的 find/download 对 GitHub 附件裸跑经常超时（社区已多次反馈），改为脚本着重试 3 次
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.71.1/trivy_0.71.1_Linux-64bit.tar.gz
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy version

      - name: 扫描代码库依赖（fs 模式）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'  # 发现 CRITICAL/HIGH/MEDIUM 漏洞时阻断 CI
          ignore-unfixed: true

      - name: 扫描 IaC 配置（YAML/K8s/Helm）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'ske/manifests/'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'
          exit-code: '1'

      - name: 扫描 design/deploy/values/ IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'design/deploy/values/'
          format: 'sarif'
          output: 'trivy-values-results.sarif'
          exit-code: '1'

      - name: 上传 SARIF 到 GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: 'trivy-fs'

      - name: 上传 IaC SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac-results.sarif
          category: 'trivy-iac'

      - name: 上传 SARIF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-reports
          path: |
            trivy-fs-results.sarif
            trivy-iac-results.sarif
            trivy-values-results.sarif
          retention-days: 14

  # ============================================================
  # Go 依赖漏洞扫描：govulncheck
  # 官方工具，针对 go.mod 解析依赖图并匹配 Go 漏洞数据库
  # ============================================================
  go-vulncheck:
    name: Go Vulnerability Check (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.26.6
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: 对每个 Go 组件执行 govulncheck
        run: |
          go_count=$(find platform -name go.mod -not -path "*/vendor/*" | wc -l)
          if [ "$go_count" -eq 0 ]; then
            echo "::warning::未发现任何 Go 组件，跳过"
            exit 0
          fi
          vuln_found=0
          while IFS= read -r gomod; do
            mod_dir=$(dirname "$gomod")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  govulncheck: $mod_name"
            echo "============================================"
            if (cd "$mod_dir" && govulncheck ./... 2>&1 | tee -a "$GITHUB_WORKSPACE/go-vulncheck.log"); then
              echo "✓ $mod_name 无已知 Go 漏洞"
            else
              echo "::warning::$mod_name 发现 Go 漏洞"
              vuln_found=$((vuln_found + 1))
            fi
          done < <(find platform -name go.mod -not -path "*/vendor/*")
          if [ "$vuln_found" -gt 0 ]; then
            echo "::error::共有 $vuln_found 个 Go 组件存在已知漏洞，阻断 CI（详见 go-vulncheck.log）"
            exit 1
          fi

      - name: 上传 govulncheck 日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-vulncheck-log
          path: go-vulncheck.log
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # Python 依赖漏洞扫描：pip-audit
  # 针对每个 Python 组件的 requirements.txt / pyproject.toml 进行漏洞匹配
  # ============================================================
  python-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 pip-audit
        run: pip install pip-audit -q

      - name: 对每个 Python 组件执行 pip-audit
        run: |
          py_count=$(find platform -name pyproject.toml -o -name requirements.txt 2>/dev/null | wc -l)
          if [ "$py_count" -eq 0 ]; then
            echo "::warning::未发现任何 Python 组件，跳过"
            exit 0
          fi
          mkdir -p python-audit-reports
          fail_count=0
          while IFS= read -r req; do
            mod_dir=$(dirname "$req")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  pip-audit: $mod_name"
            echo "============================================"
            (cd "$mod_dir" && pip-audit --strict -r requirements.txt --format=json --output="$GITHUB_WORKSPACE/python-audit-reports/${mod_name}-audit.json" 2>&1) || { echo "::error::$mod_name pip-audit 发现漏洞或失败"; fail_count=$((fail_count + 1)); }
          done < <(find platform -name requirements.txt 2>/dev/null)
          # 对使用 pyproject.toml 但无 requirements.txt 的组件
          while IFS= read -r f; do
            mod_dir=$(dirname "$f")
            mod_name=$(basename "$mod_dir")
            if [ ! -f "$mod_dir/requirements.txt" ]; then
              echo "============================================"
              echo "  pip-audit (pyproject): $mod_name"
              echo "============================================"
              (cd "$mod_dir" && pip-audit --strict --format=json --output="$GITHUB_WORKSPACE/python-audit-reports/${mod_name}-audit.json" 2>&1) || { echo "::error::$mod_name pip-audit 发现漏洞或失败"; fail_count=$((fail_count + 1)); }
            fi
          done < <(find platform -name pyproject.toml 2>/dev/null)
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Python 组件存在已知漏洞或 pip-audit 失败，阻断 CI"
            exit 1
          fi

      - name: 上传 pip-audit 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-audit-reports
          path: python-audit-reports/
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # Java 依赖漏洞扫描：OWASP Dependency-Check
  # 通过 Maven 插件执行，扫描 Java 依赖的 CVE
  # ============================================================
  java-dependency-check:
    name: Java OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 + Maven 3.9
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 对每个 Java 组件执行 OWASP Dependency-Check
        run: |
          java_count=$(find platform -name pom.xml -not -path "*/target/*" | wc -l)
          if [ "$java_count" -eq 0 ]; then
            echo "::warning::未发现任何 Java 组件，跳过"
            exit 0
          fi
          mkdir -p java-depcheck-reports
          fail_count=0
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  OWASP Dependency-Check: $mod_name"
            echo "============================================"
            # 使用 dependency-check CLI 直接扫描 pom.xml
            # NVD API key 可通过 secret 注入以加速下载
            # failBuildOnCVSS=7：CVSS≥7 的漏洞阻断构建（HIGH/CRITICAL）
            (cd "$mod_dir" && mvn org.owasp:dependency-check-maven:check \
              -DskipTests -B \
              -DdependencyCheckOutputDirectory="$GITHUB_WORKSPACE/java-depcheck-reports/$mod_name" \
              -DnvdApiKey="${{ secrets.NVD_API_KEY }}" \
              -DfailBuildOnCVSS=7 \
              2>&1 | tail -20) || { echo "::error::$mod_name Dependency-Check 失败或发现 CVSS≥7 漏洞"; fail_count=$((fail_count + 1)); }
          done < <(find platform -name pom.xml -not -path "*/target/*")
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个 Java 组件存在高危漏洞或 Dependency-Check 失败，阻断 CI"
            exit 1
          fi

      - name: 上传 Dependency-Check 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-depcheck-reports
          path: java-depcheck-reports/
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # ZAP DAST 动态扫描：对运行中的服务执行黑盒安全扫描
  # 依赖 build.yml 已构建镜像，启动 docker-compose 后扫描
  #
  # T-07: 分模式执行
  #   - PR 触发：基线扫描（baseline），不阻断只报告（continue-on-error + exit-code 0）
  #   - 夜间/手动触发：完整扫描（full scan），阻断模式（exit-code 1）
  # ============================================================
  zap-dast:
    name: ZAP DAST Scan
    runs-on: ubuntu-latest
    # T-07: PR 也触发基线扫描（夜间仍全量阻断扫描）；push 到 main 也触发基线扫描
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # T-07: PR/push 基线扫描不阻断 pipeline（仅报告）；夜间完整扫描阻断
    continue-on-error: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查集成测试环境
        id: zap_check
        run: |
          if [ ! -f "tests/integration/docker-compose.yml" ]; then
            echo "::warning::tests/integration/docker-compose.yml 不存在，跳过 ZAP DAST"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 启动被测服务
        if: steps.zap_check.outputs.skip != 'true'
        working-directory: tests/integration
        run: |
          docker compose up -d --build --wait
          docker compose ps

      # T-07: PR/push 触发 → ZAP 基线扫描（baseline: true，不阻断只报告）
      - name: 执行 ZAP 基线扫描（PR/push 模式，不阻断）
        if: steps.zap_check.outputs.skip != 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: zaproxy/action-baseline@v0.12.0
        with:
          # 修复：compose 映射 encaps-layer 到本机 18080（见 tests/integration/docker-compose.yml），
          # 原扫 localhost:8080 是空靶（报告 9）
          target: 'http://localhost:18080'
          # T-07: PR/push 基线模式 — 仅被动扫描，不发起攻击请求
          # baseline: true 表示基线模式（action-baseline 本身即基线扫描，此处显式标注）
          cmd_options: '-a'  # -a 主动规则报告，不含 -j（不发 AJAX 请求），轻量快速
          artifact_name: 'zap-baseline-report-pr'
          allow_issue_writing: false

      # T-07: 夜间/手动触发 → ZAP 完整扫描（阻断模式）
      - name: 执行 ZAP 完整扫描（夜间模式，阻断）
        if: steps.zap_check.outputs.skip != 'true' && github.event_name != 'pull_request' && github.event_name != 'push'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:18080'
          # 夜间完整模式 — -a 主动规则 + -j AJAX 请求，更深入扫描
          cmd_options: '-a -j'
          artifact_name: 'zap-baseline-report-nightly'
          allow_issue_writing: false

      # API 扫描暂移除：encaps-layer 未集成 springdoc（无 /v3/api-docs），
      # 原 /v3/api-docs 目标为空靶。待引入 OpenAPI 端点后恢复（见 ROADMAP）。

      - name: 销毁被测服务
        if: steps.zap_check.outputs.skip != 'true' && always()
        working-directory: tests/integration
        run: docker compose down -v || true

  # ============================================================
  # T-10: Semgrep 静态代码扫描（合并自 security-scan.yml）
  # 基于规则集检测常见安全反模式：security-audit + java + python + javascript
  # ============================================================
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Semgrep 扫描（生成 SARIF）
        # returntocorp/semgrep-action@v1 已废弃，改用官方 Docker 镜像直接产出 SARIF
        # --error 使发现问题返回非零退出码阻断 CI
        # T-06: 添加 p/golang 规则集，覆盖 Go 组件的安全反模式扫描
        run: |
          mkdir -p reports/semgrep
          docker run --rm -v "${PWD}:/src" semgrep/semgrep \
            semgrep --config p/security-audit --config p/java \
              --config p/python --config p/javascript --config p/golang \
              --error --sarif --output /src/reports/semgrep/semgrep.sarif

      - name: 上传 Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/semgrep/semgrep.sarif

      - name: 上传 Semgrep 报告 Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-reports
          path: reports/semgrep/
          retention-days: 30

  # ============================================================
  # T-10/T-06: Trivy 镜像扫描（合并自 security-scan.yml）
  # T-06: 从单个 encaps-layer 镜像改为全量扫描所有 Dockerfile 对应的镜像
  # 遍历所有 Dockerfile，提取 FROM 基础镜像，用 trivy image 扫描基础镜像漏洞
  # 保持阻断模式：--exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
  # ============================================================
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Trivy
        run: |
          # 统一使用固定版本 v0.71.1（与 trivy-scan job 一致），避免 install.sh 拉取最新版导致版本漂移
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.71.1/trivy_0.71.1_Linux-64bit.tar.gz
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: 全量扫描所有 Docker 镜像（遍历所有 Dockerfile）
        run: |
          mkdir -p reports/trivy
          # T-06: 遍历所有 Dockerfile，提取 FROM 基础镜像并扫描
          # 覆盖全部 43 个镜像（Java 16 + Go 11 + Python 14 + 前端 1 + 辅助 1）
          # 排除 mock-cluster（测试用 mock）和 spark-cluster（第三方 Spark 镜像，由供应商维护）
          EXCLUDE_DIRS="mock-cluster spark-cluster"
          scan_count=0
          fail_count=0
          declare -a seen_images
          while IFS= read -r df; do
            mod_dir=$(dirname "$df")
            mod_name=$(basename "$mod_dir")
            # 跳过辅助镜像目录
            skip=false
            for ex in $EXCLUDE_DIRS; do
              if [ "$mod_name" = "$ex" ]; then
                skip=true
                break
              fi
            done
            if [ "$skip" = "true" ]; then
              echo "::notice::跳过辅助镜像: $mod_name"
              continue
            fi
            # 提取 Dockerfile 中所有 FROM 指令的基础镜像（忽略多阶段构建的 AS 别名）
            while IFS= read -r from_line; do
              # 跳过空行和注释
              [ -z "$from_line" ] && continue
              # 提取镜像名（去掉 FROM 关键字和 AS alias）
              base_image=$(echo "$from_line" | sed -E 's/^FROM[[:space:]]+//I; s/[[:space:]]+AS[[:space:]].*//I' | tr -d '[:space:]')
              # 跳过 scratch 和空值
              [ -z "$base_image" ] && continue
              [ "$base_image" = "scratch" ] && continue
              # 跳过已扫描的重复镜像
              already=false
              for seen in "${seen_images[@]}"; do
                if [ "$seen" = "$base_image" ]; then
                  already=true
                  break
                fi
              done
              if [ "$already" = "true" ]; then
                continue
              fi
              seen_images+=("$base_image")
              scan_count=$((scan_count + 1))
              echo "============================================"
              echo "  Trivy image scan: $mod_name -> $base_image"
              echo "============================================"
              # 保持阻断模式：HIGH/CRITICAL 漏洞 exit-code=1
              # --ignore-unfixed：仅扫描已有修复的漏洞
              safe_name=$(echo "$base_image" | tr '/:@' '___')
              if trivy image --exit-code 1 --format sarif \
                --output "reports/trivy/${safe_name}.sarif" \
                --scanners vuln --severity HIGH,CRITICAL \
                --ignore-unfixed \
                "$base_image" 2>&1 | tee -a reports/trivy/scan.log; then
                echo "✓ $base_image 无 HIGH/CRITICAL 漏洞"
              else
                echo "::error::$base_image ($mod_name) 发现 HIGH/CRITICAL 漏洞"
                fail_count=$((fail_count + 1))
              fi
            done < <(grep -iE '^FROM[[:space:]]' "$df" 2>/dev/null)
          done < <(find . -name Dockerfile -not -path "*/target/*" -not -path "*/node_modules/*" \
            -not -path "*/.git/*" 2>/dev/null | sort)
          echo ""
          echo "============================================"
          echo "  Trivy 镜像扫描汇总"
          echo "============================================"
          echo "共扫描 $scan_count 个基础镜像（去重后）"
          echo "失败（有 HIGH/CRITICAL 漏洞）: $fail_count"
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::共有 $fail_count 个镜像存在 HIGH/CRITICAL 漏洞，阻断 CI"
            exit 1
          fi
          echo "✓ 所有镜像扫描通过"

      - name: 上传镜像扫描 SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy

      - name: 上传镜像扫描报告 Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-reports
          path: reports/trivy/
          retention-days: 30

  # ============================================================
  # 安全扫描汇总：所有安全检查完成后输出摘要
  # ============================================================
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs:
      - trivy-scan
      - go-vulncheck
      - python-audit
      - java-dependency-check
      - zap-dast
      - semgrep
      - trivy-image
    if: always()
    steps:
      - name: 输出安全扫描摘要
        run: |
          echo "============================================"
          echo "  Security 流水线完成"
          echo "============================================"
          echo "分支: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "已执行的安全扫描："
          echo "  ✓ Trivy 依赖漏洞扫描（fs + IaC）"
          echo "  ✓ govulncheck Go 漏洞检查"
          echo "  ✓ pip-audit Python 依赖审计"
          echo "  ✓ OWASP Dependency-Check Java 依赖审计"
          echo "  ✓ ZAP DAST 动态扫描（仅 schedule/manual）"
          echo "  ✓ Semgrep SAST 静态扫描（合并自 security-scan.yml）"
          echo "  ✓ Trivy 镜像扫描（合并自 security-scan.yml）"
          echo "  ✓ SonarQube 静态分析由独立 sonarqube.yml 工作流执行"
          echo ""
          echo "扫描结果："
          echo "  - SARIF 已上传到 GitHub Security tab"
          echo "  - 详细报告见各 job 的 artifact"
          echo ""
          echo "门禁策略："
          echo "  - CRITICAL/HIGH 漏洞：阻断 CI（exit-code=1）"
          echo "  - 后续可配置 quality gate 阻断合并"