# Security 安全扫描流水线
# 触发条件：push 到 main、PR 到 main、每周一定时全量扫描、手动触发
# 职责：SonarQube 静态分析 + ZAP DAST 动态扫描 + Trivy 依赖漏洞检查 + gosec/go-vuln + pip-audit
# 与 codeql.yml 互补：codeql.yml 做代码语义级 SAST，security.yml 做工程化安全扫描与依赖漏洞
name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # 每周二 02:00 UTC 全量安全扫描
  schedule:
    - cron: '0 2 * * 2'
  workflow_dispatch:

# 权限：security-events: write 上传 SARIF；contents: read 读取代码
permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # SonarQube 静态分析：聚合 Java/Go/Python/JS 多语言代码质量与安全
  # 依赖 ci.yml 的覆盖率报告（通过 artifact 下载或重新生成）
  # 需配置 Secret：SONAR_TOKEN、SONAR_HOST_URL
  # 若未配置 SonarQube，则该 job 会跳过
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 需要 blame 信息

      - name: 检查 SonarQube 配置
        id: sonar_check
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ] || [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "::warning::SONAR_TOKEN 或 SONAR_HOST_URL 未配置，跳过 SonarQube 分析"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "SonarQube 配置完整，开始分析"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 安装 JDK 17 + Maven 3.9
        if: steps.sonar_check.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 安装 SonarQube Scanner
        if: steps.sonar_check.outputs.skip != 'true'
        run: |
          # 安装 sonar-scanner CLI（用于非 Maven 项目扫描）
          SCANNER_VERSION=5.0.1.3006
          curl -sSL "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip" -o /tmp/sonar-scanner.zip
          unzip -q /tmp/sonar-scanner.zip -d /tmp/
          echo "/tmp/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin" >> $GITHUB_PATH

      - name: 执行 SonarQube 分析（Maven 项目）
        if: steps.sonar_check.outputs.skip != 'true'
        run: |
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  SonarQube Maven 分析: $mod_name"
            echo "============================================"
            mvn -f "$pom" verify sonar:sonar -B \
              -Dsonar.projectKey="${{ github.repository_owner }}_${mod_name}" \
              -Dsonar.projectName="$mod_name" \
              -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
              -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
              -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml" \
              -Dsonar.exclusions="**/target/**,**/generated/**" \
              || echo "::warning::$mod_name SonarQube 分析失败，继续下一个"
          done < <(find platform -name pom.xml -not -path "*/target/*" 2>/dev/null)

      - name: 执行 SonarQube 分析（Go/Python 项目）
        if: steps.sonar_check.outputs.skip != 'true'
        run: |
          # Go 项目
          while IFS= read -r gomod; do
            mod_dir=$(dirname "$gomod")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  SonarQube Scanner 分析 (Go): $mod_name"
            echo "============================================"
            (cd "$mod_dir" && sonar-scanner \
              -Dsonar.projectKey="${{ github.repository_owner }}_${mod_name}" \
              -Dsonar.projectName="$mod_name" \
              -Dsonar.sources=. \
              -Dsonar.language=go \
              -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
              -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
              -Dsonar.exclusions="**/vendor/**,**/*_test.go" \
              ) || echo "::warning::$mod_name SonarQube 分析失败"
          done < <(find platform -name go.mod -not -path "*/vendor/*" 2>/dev/null)
          # Python 项目
          while IFS= read -r f; do
            mod_dir=$(dirname "$f")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  SonarQube Scanner 分析 (Python): $mod_name"
            echo "============================================"
            (cd "$mod_dir" && sonar-scanner \
              -Dsonar.projectKey="${{ github.repository_owner }}_${mod_name}" \
              -Dsonar.projectName="$mod_name" \
              -Dsonar.sources=. \
              -Dsonar.language=python \
              -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
              -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
              -Dsonar.exclusions="**/tests/**,**/test_*,**/.venv/**" \
              ) || echo "::warning::$mod_name SonarQube 分析失败"
          done < <(find platform -name pyproject.toml 2>/dev/null)

  # ============================================================
  # Trivy 依赖漏洞扫描：扫描代码库 + Docker 镜像 + IaC 文件
  # 输出 SARIF 上传到 GitHub Security tab
  # ============================================================
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 与 ci.yml 的 trivy-scan 对齐：预热 ~/.m2，防止 Trivy 解析 pom 时被 Maven Central 429 限流
      - name: 安装 Maven 并预热本地缓存
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 预解析所有 Maven 依赖
        run: |
          # 与 ci.yml java-build-test 相同的依赖链顺序：父 POM → common-security →
          # encaps-layer → sql-gateway（lineage-analyzer 依赖 sql-gateway jar）。
          # 此前缺父 POM 安装，子模块 install 在干净 runner 上解析不到
          # dataenginebdp-parent，本步骤直接红（CI Security workflow 失败根因）。
          mvn install -B -N -q \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn || true
          for lib_pom in \
            platform/common-security/pom.xml \
            platform/encaps-layer/pom.xml \
            platform/sql-gateway/pom.xml; do
            [ -f "$lib_pom" ] || continue
            mvn -f "$lib_pom" install -B -q -DskipTests -U \
              -Dpmd.skip=true -Dcheckstyle.skip=true \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn || true
          done
          # 预解析仅服务 Trivy fs 扫描，失败不阻断（|| true）
          while IFS= read -r pom; do
            mvn -f "$pom" dependency:resolve -B -q -DskipTests || true
          done < <(find platform -name pom.xml -not -path "*/target/*")

      - name: 安装 Trivy
        run: |
          # 官方 action 的 find/download 对 GitHub 附件裸跑经常超时（社区已多次反馈），改为脚本着重试 3 次
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.71.1/trivy_0.71.1_Linux-64bit.tar.gz
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy version

      - name: 扫描代码库依赖（fs 模式）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'  # 阻断 CI（CRITICAL/HIGH/MEDIUM 漏洞）
          ignore-unfixed: true

      - name: 扫描 IaC 配置（YAML/K8s/Helm）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'ske/manifests/'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'
          exit-code: '1'

      - name: 扫描 design/deploy/values/ IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'design/deploy/values/'
          format: 'sarif'
          output: 'trivy-values-results.sarif'
          exit-code: '1'

      - name: 上传 SARIF 到 GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: 'trivy-fs'

      - name: 上传 IaC SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac-results.sarif
          category: 'trivy-iac'

      - name: 上传 SARIF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-reports
          path: |
            trivy-fs-results.sarif
            trivy-iac-results.sarif
            trivy-values-results.sarif
          retention-days: 14

  # ============================================================
  # Go 依赖漏洞扫描：govulncheck
  # 官方工具，针对 go.mod 解析依赖图并匹配 Go 漏洞数据库
  # ============================================================
  go-vulncheck:
    name: Go Vulnerability Check (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: 对每个 Go 组件执行 govulncheck
        run: |
          go_count=$(find platform -name go.mod -not -path "*/vendor/*" | wc -l)
          if [ "$go_count" -eq 0 ]; then
            echo "::warning::未发现任何 Go 组件，跳过"
            exit 0
          fi
          vuln_found=0
          while IFS= read -r gomod; do
            mod_dir=$(dirname "$gomod")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  govulncheck: $mod_name"
            echo "============================================"
            if (cd "$mod_dir" && govulncheck ./... 2>&1 | tee -a "$GITHUB_WORKSPACE/go-vulncheck.log"); then
              echo "✓ $mod_name 无已知 Go 漏洞"
            else
              echo "::warning::$mod_name 发现 Go 漏洞"
              vuln_found=$((vuln_found + 1))
            fi
          done < <(find platform -name go.mod -not -path "*/vendor/*")
          if [ "$vuln_found" -gt 0 ]; then
            echo "::warning::共有 $vuln_found 个 Go 组件存在已知漏洞，请检查 go-vulncheck.log"
          fi

      - name: 上传 govulncheck 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-vulncheck-log
          path: go-vulncheck.log
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # Python 依赖漏洞扫描：pip-audit
  # 针对每个 Python 组件的 requirements.txt / pyproject.toml 进行漏洞匹配
  # ============================================================
  python-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 pip-audit
        run: pip install pip-audit -q

      - name: 对每个 Python 组件执行 pip-audit
        run: |
          py_count=$(find platform -name pyproject.toml -o -name requirements.txt 2>/dev/null | wc -l)
          if [ "$py_count" -eq 0 ]; then
            echo "::warning::未发现任何 Python 组件，跳过"
            exit 0
          fi
          mkdir -p python-audit-reports
          while IFS= read -r req; do
            mod_dir=$(dirname "$req")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  pip-audit: $mod_name"
            echo "============================================"
            (cd "$mod_dir" && pip-audit -r requirements.txt --format=json --output="$GITHUB_WORKSPACE/python-audit-reports/${mod_name}-audit.json" 2>&1) || echo "::warning::$mod_name pip-audit 发现漏洞或失败"
          done < <(find platform -name requirements.txt 2>/dev/null)
          # 对使用 pyproject.toml 但无 requirements.txt 的组件
          while IFS= read -r f; do
            mod_dir=$(dirname "$f")
            mod_name=$(basename "$mod_dir")
            if [ ! -f "$mod_dir/requirements.txt" ]; then
              echo "============================================"
              echo "  pip-audit (pyproject): $mod_name"
              echo "============================================"
              (cd "$mod_dir" && pip-audit --format=json --output="$GITHUB_WORKSPACE/python-audit-reports/${mod_name}-audit.json" 2>&1) || echo "::warning::$mod_name pip-audit 发现漏洞或失败"
            fi
          done < <(find platform -name pyproject.toml 2>/dev/null)

      - name: 上传 pip-audit 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-reports
          path: python-audit-reports/
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # Java 依赖漏洞扫描：OWASP Dependency-Check
  # 通过 Maven 插件执行，扫描 Java 依赖的 CVE
  # ============================================================
  java-dependency-check:
    name: Java OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 + Maven 3.9
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 对每个 Java 组件执行 OWASP Dependency-Check
        run: |
          java_count=$(find platform -name pom.xml -not -path "*/target/*" | wc -l)
          if [ "$java_count" -eq 0 ]; then
            echo "::warning::未发现任何 Java 组件，跳过"
            exit 0
          fi
          mkdir -p java-depcheck-reports
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  OWASP Dependency-Check: $mod_name"
            echo "============================================"
            # 使用 dependency-check CLI 直接扫描 pom.xml
            # NVD API key 可通过 secret 注入以加速下载
            (cd "$mod_dir" && mvn org.owasp:dependency-check-maven:check \
              -DskipTests -B \
              -DdependencyCheckOutputDirectory="$GITHUB_WORKSPACE/java-depcheck-reports/$mod_name" \
              -DnvdApiKey="${{ secrets.NVD_API_KEY }}" \
              2>&1 | tail -20) || echo "::warning::$mod_name Dependency-Check 失败或发现漏洞"
          done < <(find platform -name pom.xml -not -path "*/target/*")

      - name: 上传 Dependency-Check 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-depcheck-reports
          path: java-depcheck-reports/
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # ZAP DAST 动态扫描：对运行中的服务执行黑盒安全扫描
  # 依赖 build.yml 已构建镜像，启动 docker-compose 后扫描
  # 仅在主分支定时扫描或手动触发时执行（PR 不执行以节省资源）
  # ============================================================
  zap-dast:
    name: ZAP DAST Scan
    runs-on: ubuntu-latest
    # 仅在定时扫描或手动触发时执行 DAST（耗时较长）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查集成测试环境
        id: zap_check
        run: |
          if [ ! -f "tests/integration/docker-compose.yml" ]; then
            echo "::warning::tests/integration/docker-compose.yml 不存在，跳过 ZAP DAST"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 启动被测服务
        if: steps.zap_check.outputs.skip != 'true'
        working-directory: tests/integration
        run: |
          docker compose up -d --build --wait
          docker compose ps

      - name: 执行 ZAP 基线扫描
        if: steps.zap_check.outputs.skip != 'true'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          # 修复：compose 映射 encaps-layer 到本机 18080（见 tests/integration/docker-compose.yml），
          # 原扫 localhost:8080 是空靶（报告 9）
          target: 'http://localhost:18080'
          cmd_options: '-a -j'
          artifact_name: 'zap-baseline-report'
          allow_issue_writing: false

      # API 扫描暂移除：encaps-layer 未集成 springdoc（无 /v3/api-docs），
      # 原 /v3/api-docs 目标为空靶。待引入 OpenAPI 端点后恢复（见 ROADMAP）。

      - name: 销毁被测服务
        if: steps.zap_check.outputs.skip != 'true' && always()
        working-directory: tests/integration
        run: docker compose down -v || true

  # ============================================================
  # 安全扫描汇总：所有安全检查完成后输出摘要
  # ============================================================
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs:
      - sonarqube
      - trivy-scan
      - go-vulncheck
      - python-audit
      - java-dependency-check
      - zap-dast
    if: always()
    steps:
      - name: 输出安全扫描摘要
        run: |
          echo "============================================"
          echo "  Security 流水线完成"
          echo "============================================"
          echo "分支: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "已执行的安全扫描："
          echo "  ✓ SonarQube 静态分析（代码质量+安全 hotspot）"
          echo "  ✓ Trivy 依赖漏洞扫描（fs + IaC）"
          echo "  ✓ govulncheck Go 漏洞检查"
          echo "  ✓ pip-audit Python 依赖审计"
          echo "  ✓ OWASP Dependency-Check Java 依赖审计"
          echo "  ✓ ZAP DAST 动态扫描（仅 schedule/manual）"
          echo ""
          echo "扫描结果："
          echo "  - SARIF 已上传到 GitHub Security tab"
          echo "  - 详细报告见各 job 的 artifact"
          echo ""
          echo "门禁策略："
          echo "  - CRITICAL/HIGH 漏洞：阻断 CI（exit-code=1）"
          echo "  - 后续可配置 quality gate 阻断合并"