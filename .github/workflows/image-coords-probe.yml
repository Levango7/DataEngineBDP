name: Image Coords Probe (128-132 one-shot)

# 一次性镜像坐标探针（台账 #128–#132）。
# 本机无法核实第三方镜像 tag（Docker Hub 与 docker.m.daocloud.io 的 registry API
# 在本机 401/超时），故借 GitHub Actions runner 实测坐标可达性。
# 判据：只有 rc=0 才算"坐标存在"；rc≠0 一律记 UNRESOLVED（不可判），
# 因为失败形态与负对照（不存在的仓名）无法区分时，不得断言"坐标不存在"。
on:
  push:
    branches: ["feat/128-132-deployment-surface"]

permissions:
  # 只读：探针不需要写仓库。此前用 contents: write 把结果推到独立结果分支，
  # 等于把仓库级写令牌发给了这个一次性 workflow（有该分支推送权者可在运行中取得
  # 写令牌并推其它分支 / 改 workflow）。结果改用 artifact 承载（actions/upload-artifact）。
  contents: read

concurrency:
  group: image-coords-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Probe third-party image coordinates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 探针：逐坐标 docker manifest inspect
        run: |
          set -u
          cat > /tmp/coords.txt <<'EOF'
          karmada|docker.m.daocloud.io/karmada/karmada-controller-manager:v1.12.0
          karmada|docker.m.daocloud.io/karmada/karmada-scheduler:v1.12.0
          karmada|docker.m.daocloud.io/karmada/karmada-webhook:v1.12.0
          karmada|docker.m.daocloud.io/karmada/karmada-aggregated-apiserver:v1.12.0
          karmada|docker.m.daocloud.io/karmada/karmada-agent:v1.12.0
          karmada|docker.m.daocloud.io/karmada/karmada-metrics-adapter:v1.12.0
          karmada|docker.m.daocloud.io/karmada/karmada-scheduler-estimator:v1.12.0
          karmada|docker.m.daocloud.io/karmada/karmada-descheduler:v1.12.0
          karmada|docker.m.daocloud.io/karmada/karmada-search:v1.12.0
          karmada|docker.m.daocloud.io/cfssl/cfssl:latest
          karmada|docker.m.daocloud.io/bitnami/kubectl:latest
          karmada|registry.k8s.io/etcd:3.5.16-0
          karmada|registry.k8s.io/kube-apiserver:v1.31.3
          karmada|registry.k8s.io/kube-controller-manager:v1.31.3
          istio|docker.m.daocloud.io/istio/pilot:1.22.3
          istio|docker.m.daocloud.io/istio/proxyv2:1.22.3
          istio|busybox:1.28
          otel|docker.m.daocloud.io/otel/opentelemetry-collector-contrib:0.130.0
          otel|docker.m.daocloud.io/grafana/tempo:2.6.0
          owasp|docker.m.daocloud.io/owasp/modsecurity-crs:4.8.0-nginx-202411071011
          owasp|docker.m.daocloud.io/owasp/modsecurity-crs:nginx
          owasp|apache/apisix:3.11.0
          keycloak|quay.io/keycloak/keycloak:25.0.0
          positive-control|postgres:16
          negative-control|docker.m.daocloud.io/this-repo-must-not-exist-128-probe/nope:0.0.0
          EOF

          probe() {
            kind="$1"; ref="$2"
            out="$(docker manifest inspect "$ref" 2>&1)"; rc=$?
            if [ "$rc" -eq 0 ]; then
              arch="$(printf '%s' "$out" \
                | grep -o '"architecture"[[:space:]]*:[[:space:]]*"[^"]*"' \
                | sed 's/.*: *"//; s/"$//' | sort -u | tr '\n' ',' | sed 's/,$//')"
              [ -z "$arch" ] && arch="unknown"
              printf 'PROBE\tOK\t%s\t%s\trc=0\tarch=%s\n' "$kind" "$ref" "$arch"
            else
              err="$(printf '%s' "$out" | tr '\n' ' ' | cut -c1-200)"
              printf 'PROBE\tFAIL\t%s\t%s\trc=%s\terr=%s\n' "$kind" "$ref" "$rc" "$err"
            fi
          }

          echo "=== 镜像坐标探针开始 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          : > /tmp/probe-results.tsv
          while IFS='|' read -r kind ref; do
            [ -z "$kind" ] && continue
            line="$(probe "$kind" "$ref")"
            printf '%s\n' "$line"
            printf '%s\n' "$line" >> /tmp/probe-results.tsv
          done < /tmp/coords.txt

          ok_count="$(grep -c $'^PROBE\tOK\t' /tmp/probe-results.tsv || true)"
          fail_count="$(grep -c $'^PROBE\tFAIL\t' /tmp/probe-results.tsv || true)"
          echo "=== 探针结果汇总 OK=$ok_count UNRESOLVED=$fail_count ==="

          {
            echo "## 镜像坐标探针结果（run ${GITHUB_RUN_ID}）"
            echo
            echo "| 类别 | 坐标 | 结论 | rc | 架构 / 错误摘要 |"
            echo "| --- | --- | --- | --- | --- |"
            while IFS=$'\t' read -r _ status kind ref rc detail; do
              if [ "$status" = "OK" ]; then
                echo "| $kind | \`$ref\` | 存在 | 0 | ${detail#arch=} |"
              else
                echo "| $kind | \`$ref\` | 不可判 | ${rc#rc=} | ${detail#err=} |"
              fi
            done < /tmp/probe-results.tsv
            echo
            echo "结论口径：只有 rc=0 记「存在」；rc≠0 一律记「不可判」（与负对照失败形态无法区分时不作存在性断言）。"
          } >> "$GITHUB_STEP_SUMMARY"

          # 探针本身不阻断：坐标缺失需人工改 chart 再提交，不应把 CI 变成红灯。
          exit 0

      - name: 探针结果落盘（待上传为 artifact）
        # 结果承载口径：GitHub 的 /actions/jobs/<id>/logs 对未认证请求返回 403
        # （本机实测），step summary 亦无免密 API 可读 ⇒ 逐坐标结果随本 workflow
        # 以 artifact 形式留存（取回口径：gh run download -n <artifact>）。
        # 2026-11-22 改口径：此前把结果推到独立结果分支，代价是给这个一次性 workflow
        # 发了仓库级 contents: write 写令牌（有该分支推送权者可在运行中取得写令牌并推
        # 其它分支 / 改 workflow）。permissions 已收敛为 contents: read，结果改用
        # artifact 承载；已跑过的 3 次探针结果仍留在结果分支
        # probe/128-132-image-coords 上（历史事实不变）。
        continue-on-error: true
        run: |
          set -u
          {
            echo "# run ${GITHUB_RUN_ID} / sha ${GITHUB_SHA} / $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# 判据：只有 rc=0 记「存在」；rc≠0 一律记「不可判」（与负对照失败形态无法区分时不作存在性断言）"
            echo "# 坐标清单："
            cat /tmp/coords.txt
            echo "# 探针结果（PROBE<TAB>状态<TAB>类别<TAB>坐标<TAB>rc<TAB>架构或错误摘要）："
            cat /tmp/probe-results.tsv
          } > "/tmp/image-coords-${GITHUB_RUN_ID}.tsv"
          cat "/tmp/image-coords-${GITHUB_RUN_ID}.tsv"

      - name: 上传探针结果 artifact
        # 探针本身不阻断 CI（坐标缺失需人工改 chart 再提交，不应把 CI 变成红灯），
        # 故上传失败同样软失败。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: image-coords-${{ github.run_id }}
          path: /tmp/image-coords-${{ github.run_id }}.tsv
          if-no-files-found: error
