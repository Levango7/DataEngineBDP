# Build 构建流水线
# 触发条件：push 到 main/release 分支、手动触发
# 职责：编译产物 + Docker 镜像构建 + 推送到 GHCR（ghcr.io）
# 与 ci.yml 区分：ci.yml 在 PR 上做检查不推送，build.yml 在主分支做构建并推送制品
# 与 release.yml 区分：release.yml 在打 tag 时发布 GitHub Release，build.yml 在每次主分支推送时构建可部署镜像
name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
  # 支持手动触发，便于按需重建镜像
  workflow_dispatch:
    inputs:
      push_image:
        description: '是否推送镜像到 GHCR（true/false）'
        required: false
        default: 'true'

# 权限：packages: write 推送 GHCR 镜像；contents: read 读取代码；id-token: write 用于 OIDC 镜像签名
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# 同一分支的并发构建只保留最新一次
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 门禁检查：等待 CI 工作流在对应 commit 上通过后才允许构建
  # 防止在 CI 失败的情况下推送镜像
  # ============================================================
  ci-gate:
    name: CI Gate (等待 CI 通过)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 等待 CI 工作流通过
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Frontend Build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          verbose: true

      - name: CI 门禁通过
        run: echo "CI 工作流已通过，开始执行构建流水线"

  # ============================================================
  # 构建前端并推送 Nginx 镜像
  # 1. npm ci && npm run build 生成 dist/
  # 2. 基于 frontend/Dockerfile 构建 nginx 静态站点镜像
  # 3. 推送到 ghcr.io/${{ org }}/sq-frontend:${{ sha }}
  # ============================================================
  build-frontend-image:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      # GHCR 仓库路径必须全小写；repository_owner 可能含大写（如 Levango7），统一小写化
      - name: 计算小写 GHCR 命名空间
        run: echo "REGISTRY_NS=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖并构建前端
        working-directory: frontend/
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          file: frontend/Dockerfile
          push: ${{ github.event.inputs.push_image != 'false' }}
          tags: |
            ghcr.io/${{ env.REGISTRY_NS }}/sq-frontend:latest
            ghcr.io/${{ env.REGISTRY_NS }}/sq-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 不在镜像构建期生成 provenance/sbom,避免拉取 buildkit-syft-scanner
          # 时受 Docker Hub 瞬时故障(502)影响;SBOM 由 ci.yml CycloneDX
          # 与 release.yml anchore/sbom-action 统一生成

  # ============================================================
  # 构建 Java 组件 Docker 镜像
  # 遍历 platform/ 下所有同时含 pom.xml 和 Dockerfile 的子目录
  # 镜像名：ghcr.io/${{ org }}/sq-${{ mod_name }}:${{ sha }}
  # ============================================================
  build-java-images:
    name: Build & Push Java Images
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - name: 计算小写 GHCR 命名空间
        run: echo "REGISTRY_NS=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 (Temurin) + Maven 3.9
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          maven-version: '3.9'
          cache: 'maven'

      - name: 编译所有 Java 组件（mvn package -DskipTests）
        run: |
          java_count=$(find platform -name pom.xml -not -path "*/target/*" | wc -l)
          if [ "$java_count" -eq 0 ]; then
            echo "::warning::未发现任何 Java 组件，跳过"
            exit 0
          fi
          # lineage-analyzer 依赖 sql-gateway，与 ci.yml 一致先装到本地仓库
          if [ -f "platform/sql-gateway/pom.xml" ]; then
            # PMD/Checkstyle 由 CI java-lint job 独立把关，打包/安装阶段跳过，避免 PMD 报错阻断镜像构建
            mvn -f platform/sql-gateway/pom.xml install -B -DskipTests -q \
              -Dpmd.skip=true -Dcheckstyle.skip=true \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          fi
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  编译 Java 组件: $mod_name"
            echo "============================================"
            mvn -f "$pom" clean package -DskipTests -B -V \
              -Dpmd.skip=true -Dcheckstyle.skip=true \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          done < <(find platform -name pom.xml -not -path "*/target/*")

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送所有 Java 镜像
        run: |
          push_flag="${{ github.event.inputs.push_image != 'false' }}"
          img_count=0
          while IFS= read -r df; do
            mod_dir=$(dirname "$df")
            mod_name=$(basename "$mod_dir")
            # 仅处理含 pom.xml 的目录（Java 组件）
            if [ ! -f "$mod_dir/pom.xml" ]; then
              continue
            fi
            img_count=$((img_count + 1))
            echo "============================================"
            echo "  Docker build & push: $mod_name"
            echo "============================================"
            # lineage-analyzer 的 Dockerfile 按 platform 根目录作为 context 书写
            # (COPY sql-gateway/… 与 governance/lineage-analyzer/…)，需特判
            build_ctx="$mod_dir"
            dockerfile_arg=""
            if [ "$mod_name" = "lineage-analyzer" ]; then
              build_ctx="platform"
              dockerfile_arg="-f platform/governance/lineage-analyzer/Dockerfile"
            fi
            docker buildx build \
              -t "ghcr.io/${{ env.REGISTRY_NS }}/sq-${mod_name}:latest" \
              -t "ghcr.io/${{ env.REGISTRY_NS }}/sq-${mod_name}:${{ github.sha }}" \
              --label "org.opencontainers.image.source=${{ github.repositoryUrl }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --cache-from "type=gha,scope=java-images" \
              --cache-to "type=gha,mode=max,scope=java-images" \
              --push="$push_flag" \
              $dockerfile_arg \
              "$build_ctx"
          done < <(find platform -name Dockerfile -not -path "*/target/*")
          echo "共构建 $img_count 个 Java 镜像"

  # ============================================================
  # 构建 Go 组件 Docker 镜像
  # 遍历 platform/ 下所有同时含 go.mod 和 Dockerfile 的子目录
  # 多架构构建：linux/amd64 + linux/arm64（信创 ARM 服务器支持）
  # ============================================================
  build-go-images:
    name: Build & Push Go Images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: ci-gate
    steps:
      - name: 计算小写 GHCR 命名空间
        run: echo "REGISTRY_NS=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: 设置 QEMU（多架构构建前置）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送所有 Go 镜像（多架构）
        run: |
          push_flag="${{ github.event.inputs.push_image != 'false' }}"
          img_count=0
          while IFS= read -r df; do
            mod_dir=$(dirname "$df")
            mod_name=$(basename "$mod_dir")
            # 仅处理含 go.mod 的目录（Go 组件）
            if [ ! -f "$mod_dir/go.mod" ]; then
              continue
            fi
            img_count=$((img_count + 1))
            echo "============================================"
            echo "  Docker buildx (linux/amd64+arm64): $mod_name"
            echo "============================================"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -t "ghcr.io/${{ env.REGISTRY_NS }}/sq-${mod_name}:latest" \
              -t "ghcr.io/${{ env.REGISTRY_NS }}/sq-${mod_name}:${{ github.sha }}" \
              --label "org.opencontainers.image.source=${{ github.repositoryUrl }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --cache-from "type=gha,scope=go-images" \
              --cache-to "type=gha,mode=max,scope=go-images" \
              --push="$push_flag" \
              "$mod_dir"
          done < <(find platform -name Dockerfile -not -path "*/target/*")
          echo "共构建 $img_count 个 Go 镜像（多架构）"

  # ============================================================
  # 构建 Python 组件 Docker 镜像
  # 遍历 platform/ 下所有同时含 pyproject.toml 和 Dockerfile 的子目录
  # ============================================================
  build-python-images:
    name: Build & Push Python Images
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - name: 计算小写 GHCR 命名空间
        run: echo "REGISTRY_NS=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送所有 Python 镜像
        run: |
          push_flag="${{ github.event.inputs.push_image != 'false' }}"
          img_count=0
          while IFS= read -r df; do
            mod_dir=$(dirname "$df")
            mod_name=$(basename "$mod_dir")
            # 仅处理含 pyproject.toml 的目录（Python 组件）
            if [ ! -f "$mod_dir/pyproject.toml" ]; then
              continue
            fi
            img_count=$((img_count + 1))
            echo "============================================"
            echo "  Docker build & push: $mod_name"
            echo "============================================"
            docker buildx build \
              -t "ghcr.io/${{ env.REGISTRY_NS }}/sq-${mod_name}:latest" \
              -t "ghcr.io/${{ env.REGISTRY_NS }}/sq-${mod_name}:${{ github.sha }}" \
              --label "org.opencontainers.image.source=${{ github.repositoryUrl }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --cache-from "type=gha,scope=python-images" \
              --cache-to "type=gha,mode=max,scope=python-images" \
              --push="$push_flag" \
              "$mod_dir"
          done < <(find platform -name Dockerfile -not -path "*/target/*")
          echo "共构建 $img_count 个 Python 镜像"

  # ============================================================
  # 构建 Helm Chart tgz 并推送到 GHCR OCI Registry
  # 遍历 design/deploy/charts/ 下所有 Chart
  # ============================================================
  build-charts:
    name: Build & Push Helm Charts (OCI)
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - name: 计算小写 GHCR 命名空间
        run: echo "REGISTRY_NS=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: 登录 GHCR OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 打包并推送所有 Helm Chart
        run: |
          if [ ! -d "design/deploy/charts" ]; then
            echo "::warning::design/deploy/charts/ 目录不存在，跳过"
            exit 0
          fi
          mkdir -p release-charts
          chart_count=0
          for chart_dir in design/deploy/charts/*/; do
            if [ -f "${chart_dir}Chart.yaml" ]; then
              chart_count=$((chart_count + 1))
              chart_name=$(basename "${chart_dir}")
              echo "============================================"
              echo "  打包 & 推送 Chart: ${chart_name}"
              echo "============================================"
              # 打包为 tgz
              helm package "${chart_dir}" -d release-charts/
              # 推送到 GHCR OCI Registry（带限流间隔与重试，避免 GitHub secondary rate limit 403）
              if [ "${{ github.event.inputs.push_image != 'false' }}" = "true" ]; then
                push_ok=0
                for attempt in 1 2 3; do
                  if helm push "release-charts/${chart_name}-"*.tgz "oci://ghcr.io/${{ env.REGISTRY_NS }}/charts"; then
                    push_ok=1
                    break
                  else
                    echo "::warning::chart ${chart_name} 推送失败(第 ${attempt} 次),60s 后重试(规避 GHCR 限流)"
                    sleep 60
                  fi
                done
                [ "$push_ok" -eq 1 ] || { echo "::error::chart ${chart_name} 重试 3 次仍失败"; exit 1; }
                sleep 2  # 相邻推送节流，降低触发 secondary rate limit 概率
              fi
            fi
          done
          echo "共处理 $chart_count 个 Helm Chart"

      - name: 上传 Chart tgz 产物
        uses: actions/upload-artifact@v4
        with:
          name: build-helm-charts
          path: release-charts/*.tgz
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # 构建汇总：所有镜像构建完成后输出摘要
  # ============================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - build-frontend-image
      - build-java-images
      - build-go-images
      - build-python-images
      - build-charts
    steps:
      - name: 计算小写 GHCR 命名空间
        run: echo "REGISTRY_NS=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: 输出构建摘要
        run: |
          echo "============================================"
          echo "  Build 流水线完成"
          echo "============================================"
          echo "分支: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "镜像仓库: ghcr.io/${{ env.REGISTRY_NS }}/"
          echo ""
          echo "已构建并推送的镜像："
          echo "  - sq-frontend (Nginx 静态站点)"
          echo "  - sq-* (Java/Go/Python 后端组件)"
          echo "  - charts/* (Helm Chart OCI)"
          echo ""
          echo "镜像标签："
          echo "  - latest（滚动更新）"
          echo "  - ${{ github.sha }}（精确版本回滚）"