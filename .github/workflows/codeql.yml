# CodeQL 安全分析工作流
# 对 Java、Go、Python、JavaScript 四种语言执行静态安全分析
# 触发条件：push 到 main、PR 到 main、每周定时（周一 02:00 UTC）
name: CodeQL Security Analysis

on:
  # 推送到 main 分支时触发
  push:
    branches:
      - main
  # 向 main 分支发起 PR 时触发
  pull_request:
    branches:
      - main
  # 每周一 02:00 UTC 定时执行全量扫描
  schedule:
    - cron: '0 2 * * 1'
  # 支持手动触发
  workflow_dispatch:

# 权限：需要 security-events: write 以上传 SARIF 结果到 GitHub Security
permissions:
  security-events: write
  actions: read
  contents: read

# 同一分支的并发分析只保留最新一次
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 分析任务：对 java、go、python、javascript 四种语言执行 CodeQL 分析
  # 每种语言一个 job，并行执行以加速分析
  # ============================================================
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # CodeQL 支持的语言：java、go、python、javascript
        # javascript 同时覆盖 TypeScript（frontend/ 下的 .ts/.tsx）
        language:
          - java
          - go
          - python
          - javascript

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ============================================================
      # 初始化 CodeQL：根据 matrix.language 自动配置分析环境
      # 使用 codeql-action/init@v4，queries 使用默认 + security-extended 套件
      # ============================================================
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 使用 security-extended 套件，覆盖更多安全规则
          queries: security-extended,security-and-quality
          # 启用 autobuild 的调试日志
          debug: false

      # ============================================================
      # Java 构建准备：安装 JDK 17 + Maven 3.9
      # 仅对 java 语言执行，为后续自定义构建步骤提供工具链
      # autobuild 无法可靠检测多模块 Maven 布局，故改用自定义构建
      # ============================================================
      - name: 安装 JDK 17 + Maven 3.9（Java 专用）
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # ============================================================
      # 自定义 Java 构建：遍历 platform/ 下所有 pom.xml 执行 mvn compile
      # 替代 autobuild，解决 "Could not detect build system" 问题
      # ============================================================
      - name: 自定义构建（Java Maven 多模块）
        if: matrix.language == 'java'
        run: |
          java_count=$(find platform -name pom.xml -not -path "*/target/*" 2>/dev/null | wc -l)
          if [ "$java_count" -eq 0 ]; then
            echo "::warning::未发现任何 Java 组件（pom.xml），跳过构建"
            exit 0
          fi
          while IFS= read -r pom; do
            mod_dir=$(dirname "$pom")
            mod_name=$(basename "$mod_dir")
            echo "============================================"
            echo "  CodeQL 构建准备: mvn compile $mod_name"
            echo "============================================"
            mvn -f "$pom" compile -B -q \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
              || echo "::warning::$mod_name 编译失败，继续下一个"
          done < <(find platform -name pom.xml -not -path "*/target/*")

      # ============================================================
      # 自动构建（非 Java 语言）：CodeQL 会根据语言自动执行构建
      # Go：自动检测 go.mod 并构建
      # Python：无需构建，直接分析源码
      # JavaScript：自动检测 npm/yarn 并构建
      # Java 已由上述自定义步骤处理，此处跳过
      # ============================================================
      - name: 自动构建（CodeQL autobuild，非 Java）
        if: matrix.language != 'java'
        uses: github/codeql-action/autobuild@v4
        # 对非关键语言构建失败时继续执行，避免单语言失败阻塞整体分析
        continue-on-error: ${{ matrix.language == 'javascript' || matrix.language == 'python' }}

      # ============================================================
      # 执行 CodeQL 分析：分析构建产物，生成 SARIF 结果
      # ============================================================
      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # 上传 SARIF 到 GitHub Security tab
          upload: true
          # 输出 SARIF 文件路径
          output: sarif-results/${{ matrix.language }}.sarif

      # ============================================================
      # 上传 SARIF 结果为 artifact（备份，便于离线分析）
      # ============================================================
      - name: 上传 SARIF 结果 artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/${{ matrix.language }}.sarif
          retention-days: 14
          if-no-files-found: warn