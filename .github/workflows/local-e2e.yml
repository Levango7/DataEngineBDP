name: Local E2E (kind + Karmada Multi-cluster)

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "frontend/**"
      - "design/deploy/charts/**"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/local-e2e.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_karmada:
        description: "Run Karmada multi-cluster test"
        type: boolean
        default: false
      run_infra:
        description: "Run Docker Compose infra (heavy)"
        type: boolean
        default: false

jobs:
  # ============================================================
  # 1. Profile 渲染 + Schema 校验（快速，无需集群）
  # ============================================================
  profile-render:
    name: Profile Render Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/
      - name: Run profile-render-check
        run: bash scripts/profile-render-check.sh

  # ============================================================
  # 2. 单组件测试（T-10: 已移除，与 ci.yml 的 java-build-test/go-build-test/python-test 重复）
  # 如需独立运行单组件测试，请触发 ci.yml 工作流
  # ============================================================

  # ============================================================
  # 3. 核心 5 服务 Kind 部署 + 冒烟测试
  # ============================================================
  kind-smoke:
    name: Kind Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [profile-render]
    # 台账 #30：原来此处是 continue-on-error: true（镜像不可达 → “假绿”）；
    # 现方案①在 CI 内 build + kind load 真实镜像，本 job 应真绿，故去掉 continue-on-error（不再假装成功）。
    steps:
      - uses: actions/checkout@v4
      - name: Write kind config
        run: |
          cat > /tmp/kind-config.yaml << 'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 30000
              hostPort: 30000
          EOF
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: dataengine-e2e
          node_image: kindest/node:v1.29.2
          config: /tmp/kind-config.yaml
      - name: Build & load core images into kind
        # 台账 #30 方案①：自研镜像在 CI 内构建并 kind load，避免依赖不可达的
        # harbor.shuqing.io / 不存在的 docker.m.daocloud.io/sq-* 标签（此前“假绿”的根因）。
        # image.tag=kind-local 与 deploy/local/values-local-images.yaml 对齐。
        run: |
          set -euo pipefail
          build_load() {  # <image> <dockerfile> <context>
            echo "== build $1 (ctx=$3) =="
            docker build -t "$1" -f "$2" "$3"
            kind load docker-image "$1" --name dataengine-e2e
          }
          build_load sq-encapsulation:kind-local     platform/encaps-layer/Dockerfile     .
          build_load sq-sql-gateway:kind-local       platform/sql-gateway/Dockerfile       .
          build_load sq-catalog:kind-local           platform/catalog/Dockerfile           platform/catalog
          build_load sq-rule-engine:kind-local       platform/rule-engine/Dockerfile       .
          build_load sq-nl2sql:kind-local            platform/nl2sql/Dockerfile            platform/nl2sql
          build_load sq-open-api-catalog:kind-local  platform/open-api-catalog/Dockerfile  platform/open-api-catalog
      - name: Deploy core subset
        # 复用 kind-action 建的 dataengine-e2e 集群；EXTRA_VALUES 把 6 个服务指到刚 load 的本地镜像。
        env:
          CLUSTER: dataengine-e2e
          EXTRA_VALUES: deploy/local/values-local-images.yaml
        run: |
          bash deploy/local-up.sh
      - name: Run smoke test
        run: bash scripts/smoke-test.sh
      - name: Upload logs on failure
        if: failure()
        run: |
          kubectl get pods -n dataengine -o wide
          kubectl describe pods -n dataengine
          #遍历全部核心服务采集日志。
          #此前只硬编码 encaps-layer / sql-gateway / catalog 三个，
          #导致 rule-engine / nl2sql / open-api-catalog 崩溃时日志完全缺失，
          #无法判定根因（见 docs/KNOWN-FAILURES.md #30）。改为按标签全量采集。
          for svc in encaps-layer sql-gateway rule-engine catalog nl2sql open-api-catalog; do
            echo "===== logs: ${svc} ====="
            kubectl logs -n dataengine -l "app.kubernetes.io/name=${svc}" --tail=200 \
              || echo "(no logs for ${svc})"
            # CrashLoop 的上一次崩溃日志在 --previous，不取会漏掉真正的异常栈
            kubectl logs -n dataengine -l "app.kubernetes.io/name=${svc}" --tail=200 --previous \
              || echo "(no previous logs for ${svc})"
          done

  # ============================================================
  # 4. Karmada 多集群联邦测试（可选，手动触发）
  # ============================================================
  karmada-multicluster:
    name: Karmada Multi-cluster
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_karmada == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install karmadactl
        run: |
          curl -sSL https://github.com/karmada-io/karmada/releases/download/v1.11.0/karmadactl-v1.11.0-linux-amd64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/karmadactl /usr/local/bin/
      - name: Run multi-cluster setup
        run: bash scripts/setup-karmada-multicluster.sh
      - name: Verify cross-cluster scheduling
        run: |
          kubectl config use-context kind-karmada-control
          kubectl get clusters -n karmada-system
          kubectl get resourcebindings -n default
          for ctx in kind-member1 kind-member2; do
            echo "=== $ctx ==="
            kubectl --context $ctx get pods -n default -l app=nginx-test
          done

  # ============================================================
  # 5. Docker Compose 基础设施集成测试（可选，手动触发）
  # ============================================================
  infra-integration:
    name: Infra Integration (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker Compose infra
        run: |

          docker compose -f docker-compose.infra.yml up -d
          sleep 90
      - name: Verify infra services
        run: |
          # Trino
          docker exec trino trino --execute "SHOW CATALOGS"
          # Doris FE
          curl -f http://localhost:8030/api/bootstrap
          # Kafka
          docker exec kafka kafka-topics --bootstrap-server localhost:9092 --list
          # Flink
          curl -f http://localhost:8081/overview
          # Spark
          curl -f http://localhost:4040
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v -x
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.infra.yml down -v