# Quality Gate 质量门禁聚合工作流（T-10）
# 通过 workflow_run 触发，在 ci.yml / security.yml / codeql.yml / sonarqube.yml 完成后
# 聚合所有工作流结果，生成 Quality Gate 报告并设置 GitHub Status Check
#
# 设计原则：
#   1. 不重复执行任何检查，仅聚合既有工作流结果
#   2. 只统计「触发本次聚合的那个 commit」上的运行（按 head_sha 取数），
#      该 commit 上仍有前置未完成时记 neutral——不允许在证据不全时自称 success
#   3. 判定逻辑收敛到 scripts/quality-gate-verdict.py（单一事实来源，可本地自测）：
#      失败/超时 → failure；取消（未出结论）→ 单列一档并仍阻断，处置是重跑而不是改代码；
#      取数异常/未知结论 → neutral（不冒充通过）；评估对象已被后续提交取代 → 结论作废
#   4. 本检查已在 main 的 required 名单内（9 项之一，2026-10-29 加入），
#      且是 Security / CodeQL / SonarQube 的唯一必需代理——它失败即阻断合并
#   5. 报告写入 Job Summary + 创建 Check Run
name: Quality Gate

on:
  # workflow_run 触发：在指定工作流完成后自动执行
  workflow_run:
    workflows:
      - "CI"           # ci.yml
      - "Security"     # security.yml
      - "CodeQL Security Analysis"  # codeql.yml（name 为 CodeQL Security Analysis）
      - "SonarQube Analysis"  # sonarqube.yml
    types:
      - completed
  # 支持手动触发（便于调试）
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: write

# 同一来源分支只保留最新一次聚合：本工作流由 workflow_run 下游触发（CI/Security/CodeQL/SonarQube
# 每完成一次就多排一条），实测队列抽样中 58/100 条是 Quality Gate、队头已排 3h+、
# 全仓吞吐仅 19-21 run/小时。聚合器语义是"最新状态覆盖"，故 cancel-in-progress 安全。
concurrency:
  group: quality-gate-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 聚合工作流结果：检查所有前置工作流的结论
  # ============================================================
  aggregate-quality-gate:
    name: Aggregate Quality Gate
    # dependabot 分支不聚合：实测 main 尖上曾堆积 220+ 条 Quality Gate run
    # （118 cancelled / 74 queued），主因是每个 dependabot 分支各占一个 concurrency
    # group、各自的 CI/Security/CodeQL/SonarQube 完成事件都要排一次聚合，
    # 把 runner 队列挤满、真正的 CI 反而拿不到 runner（台账 #75 的同源问题）。
    # 这些分支的结论由 PR 页自身的 check 展示，不需要聚合报告。
    if: ${{ !startsWith(github.event.workflow_run.head_branch || '', 'dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取前置工作流运行结果
        id: workflow_results
        uses: actions/github-script@v7
        with:
          script: |
            // 只认「触发本次聚合的那个 commit」上的运行。此前取的是每个 workflow 全局最新
            // 一条（per_page=10 + 按名字挑最新），会把别的分支/别的 commit 的结论盖到本次
            // Check Run 上——聚合器于是可以给一个从没跑过的 commit 盖绿章。
            const sha = (context.payload.workflow_run && context.payload.workflow_run.head_sha) || context.sha;
            core.info(`评估对象 head_sha=${sha}`);
            const workflows = ['CI', 'Security', 'CodeQL Security Analysis', 'SonarQube Analysis'];
            const results = {};
            let pendingCount = 0;

            for (const wfName of workflows) {
              try {
                // 按 head_sha 精确取该 commit 上的运行，再按名字筛
                const runs = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: sha,
                  per_page: 50
                });

                const wfRun = runs.data.workflow_runs
                  .filter(r => r.name === wfName && r.head_sha === sha)
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

                if (wfRun) {
                  const done = wfRun.status === 'completed';
                  if (!done) { pendingCount++; }
                  results[wfName] = {
                    conclusion: done ? wfRun.conclusion : wfRun.status,
                    status: wfRun.status,
                    html_url: wfRun.html_url,
                    created_at: wfRun.created_at
                  };
                  core.info(`${wfName}: ${done ? wfRun.conclusion : '尚未完成（' + wfRun.status + '）'} (${wfRun.html_url})`);
                } else {
                  results[wfName] = { conclusion: 'not_found', status: 'absent', html_url: null, created_at: null };
                  core.info(`${wfName}: 该 commit 上无运行记录（此事件不触发它，按不阻断处理）`);
                }
              } catch (err) {
                core.warning(`获取 ${wfName} 运行结果失败: ${err.message}`);
                results[wfName] = { conclusion: 'error', status: 'absent', html_url: null, created_at: null };
              }
            }
            core.info(`前置未完成 ${pendingCount} 个（最终判定以 scripts/quality-gate-verdict.py 为准）`);

            // 评估上下文：用于判「本次评估的 commit 是否已被后续提交取代」。
            // 取代关系来自源分支当前 head 与本次评估对应的源分支提交不一致；
            // 判不准（取不到当前 head / PR 事件缺 pull_requests）时一律不启用，按保守档处理。
            const wr = context.payload.workflow_run || {};
            const event = wr.event || 'unknown';
            const headBranch = wr.head_branch || null;
            let expectedHeadSha = sha;
            let stalenessKnown = false;
            if (event === 'pull_request') {
              const prHeadSha = (wr.pull_requests && wr.pull_requests[0] && wr.pull_requests[0].head && wr.pull_requests[0].head.sha) || null;
              if (prHeadSha) {
                expectedHeadSha = prHeadSha;
                stalenessKnown = true;
              }
            } else if (headBranch) {
              expectedHeadSha = sha;
              stalenessKnown = true;
            }
            let currentHeadSha = null;
            if (headBranch) {
              try {
                const branch = await github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: headBranch
                });
                currentHeadSha = branch.data.commit.sha;
              } catch (err) {
                core.info(`分支 ${headBranch} 当前 head 取不到（${err.message}）⇒ 不启用陈旧隔离，按保守档处理`);
              }
            }
            const evaluation = {
              head_sha: sha,
              event: event,
              head_branch: headBranch,
              expected_head_sha: expectedHeadSha,
              current_head_sha: currentHeadSha,
              staleness_known: stalenessKnown
            };
            core.setOutput('evaluation_json', JSON.stringify(evaluation));
            core.info(`评估上下文: ${JSON.stringify(evaluation)}`);

            core.setOutput('results_json', JSON.stringify(results));

      - name: 准备 Python（判据脚本运行环境）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 判定 Quality Gate 结论（判据单一事实来源）
        # 判据全部落在 scripts/quality-gate-verdict.py，本地可自测：
        #   python3 scripts/quality-gate-verdict.py --self-test
        # 台账 #99 选项③④（取消单列、判据口径入档）/ #103（取数异常不许盖绿章）。
        id: verdict
        env:
          QUALITY_GATE_RESULTS: ${{ steps.workflow_results.outputs.results_json }}
          QUALITY_GATE_EVALUATION: ${{ steps.workflow_results.outputs.evaluation_json }}
        run: |
          set -euo pipefail
          python3 scripts/quality-gate-verdict.py >> "$GITHUB_OUTPUT"
          grep -E '^(overall|fail_count|failed_count|cancelled_count|stale_count|pending_count|unknown_count|stale|reasons)=' "$GITHUB_OUTPUT" || true

      - name: 生成 Quality Gate 报告
        uses: actions/github-script@v7
        env:
          QUALITY_GATE_RESULTS: ${{ steps.workflow_results.outputs.results_json }}
          QUALITY_GATE_OVERALL: ${{ steps.verdict.outputs.overall }}
          QUALITY_GATE_FAIL_COUNT: ${{ steps.verdict.outputs.fail_count }}
          QUALITY_GATE_FAILED_COUNT: ${{ steps.verdict.outputs.failed_count }}
          QUALITY_GATE_CANCELLED_COUNT: ${{ steps.verdict.outputs.cancelled_count }}
          QUALITY_GATE_STALE_COUNT: ${{ steps.verdict.outputs.stale_count }}
          QUALITY_GATE_PENDING_COUNT: ${{ steps.verdict.outputs.pending_count }}
          QUALITY_GATE_UNKNOWN_COUNT: ${{ steps.verdict.outputs.unknown_count }}
          QUALITY_GATE_STALE: ${{ steps.verdict.outputs.stale }}
          QUALITY_GATE_REASONS: ${{ steps.verdict.outputs.reasons }}
          QUALITY_GATE_HEAD_SHA: ${{ steps.verdict.outputs.head_sha }}
          QUALITY_GATE_BUCKETS: ${{ steps.verdict.outputs.buckets_json }}
        with:
          script: |
            const results = JSON.parse(process.env.QUALITY_GATE_RESULTS);
            const overall = process.env.QUALITY_GATE_OVERALL;
            const failCount = Number(process.env.QUALITY_GATE_FAIL_COUNT || 0);
            const failedCount = Number(process.env.QUALITY_GATE_FAILED_COUNT || 0);
            const cancelledCount = Number(process.env.QUALITY_GATE_CANCELLED_COUNT || 0);
            const staleCount = Number(process.env.QUALITY_GATE_STALE_COUNT || 0);
            const pendingCount = Number(process.env.QUALITY_GATE_PENDING_COUNT || 0);
            const unknownCount = Number(process.env.QUALITY_GATE_UNKNOWN_COUNT || 0);
            const isStale = process.env.QUALITY_GATE_STALE === 'true';
            const reasons = process.env.QUALITY_GATE_REASONS || '';
            const headSha = process.env.QUALITY_GATE_HEAD_SHA || '';
            const buckets = JSON.parse(process.env.QUALITY_GATE_BUCKETS || '{}');

            const bucketOf = (name) => {
              for (const [bucket, names] of Object.entries(buckets)) {
                if (names.includes(name)) { return bucket; }
              }
              return 'ok';
            };

            // 写入 Job Summary
            const summary = core.summary;
            summary.addRaw('## Quality Gate 报告\n\n');
            const verdict = overall === 'success' ? '✅ 通过' : (overall === 'neutral' ? '⚠️ 未完成（不冒充通过）' : '❌ 失败');
            summary.addRaw(`**整体结论**: ${verdict}\n\n`);
            summary.addRaw(`**评估对象**: \`head_sha=${headSha}\`（只统计该 commit 上的运行）\n\n`);
            summary.addRaw(`**判定依据**: ${reasons}\n\n`);
            summary.addRaw(`**失败**: ${failedCount} 个（已出结论且失败）｜**取消**: ${cancelledCount} 个（未出结论，处置是重跑而不是改代码）｜**未完成**: ${pendingCount} 个｜**取数异常/未知结论**: ${unknownCount} 个｜**因提交被取代而作废**: ${staleCount} 个\n\n`);
            summary.addRaw('### 前置工作流结果\n\n');
            summary.addRaw('| 工作流 | 结论 | 分类 | 运行时间 | 链接 |\n');
            summary.addRaw('|--------|------|------|---------|------|\n');
            for (const [name, info] of Object.entries(results)) {
              const bucket = bucketOf(name);
              const emoji = info.conclusion === 'success' ? '✅' :
                            info.conclusion === 'failure' ? '❌' :
                            info.conclusion === 'cancelled' ? '⛔' :
                            info.conclusion === 'not_found' ? '⬜' :
                            info.conclusion === 'error' ? '❓' : '⚠️';
              const bucketLabel = {
                failed: '失败', cancelled: '取消（未出结论）', pending: '未完成',
                unknown: '取数异常/未知', ok: '通过'
              }[bucket] || bucket;
              const link = info.html_url ? `[查看](${info.html_url})` : 'N/A';
              summary.addRaw(`| ${name} | ${emoji} ${info.conclusion} | ${bucketLabel} | ${info.created_at || 'N/A'} | ${link} |\n`);
            }
            summary.addRaw('\n### 门禁策略\n\n');
            summary.addRaw('- CI（ci.yml）：代码检查 + 单元测试 + 覆盖率门禁 + 趋势阻断 + 基线一致性\n');
            summary.addRaw('- Security（security.yml）：Trivy + govulncheck + pip-audit + OWASP + ZAP + Semgrep\n');
            summary.addRaw('- CodeQL：代码语义级 SAST 静态分析\n');
            summary.addRaw('- SonarQube Analysis：代码质量 + 安全 hotspot\n');
            summary.addRaw('\n> 口径如实说明：本检查**在** main 分支保护的 required 名单内（9 项之一：Java / Frontend / Go / Python Test + Analyze×4 + 本检查），\n');
            summary.addRaw('> 且 Security / CodeQL / SonarQube 三者**不在** required 名单内——本检查是它们唯一的必需代理，因此它失败即阻断合并。\n');
            if (isStale) {
              summary.addRaw('> 本次评估的提交已被后续提交取代，结论作废（不冒充通过也不冒充失败）；请以最新提交上的结论为准。\n');
            }
            await summary.write();

      - name: 设置 GitHub Status Check
        uses: actions/github-script@v7
        env:
          QUALITY_GATE_OVERALL: ${{ steps.verdict.outputs.overall }}
          QUALITY_GATE_FAIL_COUNT: ${{ steps.verdict.outputs.fail_count }}
          QUALITY_GATE_FAILED_COUNT: ${{ steps.verdict.outputs.failed_count }}
          QUALITY_GATE_CANCELLED_COUNT: ${{ steps.verdict.outputs.cancelled_count }}
          QUALITY_GATE_REASONS: ${{ steps.verdict.outputs.reasons }}
        with:
          script: |
            const overall = process.env.QUALITY_GATE_OVERALL;
            const failCount = Number(process.env.QUALITY_GATE_FAIL_COUNT || 0);
            const failedCount = Number(process.env.QUALITY_GATE_FAILED_COUNT || 0);
            const cancelledCount = Number(process.env.QUALITY_GATE_CANCELLED_COUNT || 0);
            const reasons = process.env.QUALITY_GATE_REASONS || '';

            // 创建 Check Run（在对应 commit 上设置状态）
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Quality Gate',
              head_sha: context.payload.workflow_run?.head_sha || context.sha,
              status: 'completed',
              conclusion: overall,
              output: {
                title: overall === 'success' ? 'Quality Gate Passed'
                      : (overall === 'neutral' ? `Quality Gate Inconclusive (${reasons})`
                      : `Quality Gate Failed (${failedCount} failed / ${cancelledCount} cancelled)`),
                summary: overall === 'success'
                  ? '✅ 所有前置工作流通过'
                  : (overall === 'neutral'
                      ? `⚠️ 未完成，不冒充通过：${reasons}`
                      : `❌ ${failCount} 个前置工作流未通过（失败 ${failedCount}、取消 ${cancelledCount}），详见 Job Summary。取消＝未出结论，处置动作是重跑，不是改代码。`)
              }
            });

            core.info(`Check Run 创建成功: ${check.html_url}`);

      - name: 阻断 CI（如有工作流失败）
        if: steps.verdict.outputs.overall == 'failure'
        run: |
          echo "::error::Quality Gate 失败：${{ steps.verdict.outputs.fail_count }} 个前置工作流未通过"
          echo "请查看上方报告定位失败的工作流，修复后重新触发"
          echo "::notice::取消（cancelled）＝未出结论，不是代码失败：若失败项里有取消项，处置动作是重跑该次运行，而不是改代码"
          exit 1