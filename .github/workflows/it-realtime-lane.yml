name: IT Realtime Lane (CDC to Iceberg E2E)

# Phase D 端到端验收泳道（#141 范式：nightly + dispatch，不进 PR 必检）。
# 判据：CDC 灌一行 -> Iceberg 表可查，P95 <= 60s（首现口径，measure2.py 硬断言）。
# 配方与口径说明见 tests/integration/realtime-lane/README.md。

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  realtime-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        command: >-
          postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
        env:
          POSTGRES_USER: bdp_lane
          POSTGRES_PASSWORD: bdp_lane
          POSTGRES_DB: bdp_lane
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bdp_lane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Source table and publication
        run: |
          PGPASSWORD=bdp_lane psql -h 127.0.0.1 -p 5433 -U bdp_lane -d bdp_lane -c "CREATE TABLE IF NOT EXISTS public.mv_sales_lane(id bigint primary key, name text, amount double precision, src_ts timestamptz default clock_timestamp());"
          PGPASSWORD=bdp_lane psql -h 127.0.0.1 -p 5433 -U bdp_lane -d bdp_lane -tAc "SELECT 'CREATE PUBLICATION mv_lane_pub FOR TABLE public.mv_sales_lane' WHERE NOT EXISTS (SELECT FROM pg_publication WHERE pubname = 'mv_lane_pub')" | PGPASSWORD=bdp_lane psql -h 127.0.0.1 -p 5433 -U bdp_lane -d bdp_lane
          PGPASSWORD=bdp_lane psql -h 127.0.0.1 -p 5433 -U bdp_lane -d bdp_lane -tAc "SELECT pubname FROM pg_publication"

      - name: Build classpath
        run: |
          # flink-cdc 依赖仓内兄弟模块（common-security 等，私有 SNAPSHOT 不在 Central）：
          # 先聚合 reactor install 兄弟模块进 .m2，再单模块 build-classpath
          mvn -B -pl platform/flink-cdc -am -DskipTests install > /tmp/mvn-install.log 2>&1 \
            || { grep -E '^\[ERROR\]|BUILD FAILURE|Could not (resolve|transfer)' /tmp/mvn-install.log | tail -12 | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 2800 > /tmp/mvn-err.txt; echo "::error::install failed: $(cat /tmp/mvn-err.txt)"; exit 1; }
          mvn -B -f platform/flink-cdc/pom.xml dependency:build-classpath -Dmdep.outputFile=/tmp/lane-cp.txt > /tmp/mvn-cp.log 2>&1 \
            || { grep -E '^\[ERROR\]|BUILD FAILURE|Could not (resolve|transfer)' /tmp/mvn-cp.log | tail -12 | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 2800 > /tmp/mvn-err.txt; echo "::error::bc failed: $(cat /tmp/mvn-err.txt)"; exit 1; }
          mvn -B -q dependency:get -Dartifact=org.apache.kafka:kafka-clients:3.9.2
          mvn -B -q dependency:get -Dartifact=org.apache.iceberg:iceberg-api:1.12.0
          test -s /tmp/lane-cp.txt
          KC="$HOME/.m2/repository/org/apache/kafka/kafka-clients/3.9.2/kafka-clients-3.9.2.jar"
          API="$HOME/.m2/repository/org/apache/iceberg/iceberg-api/1.12.0/iceberg-api-1.12.0.jar"
          test -s "$KC" && test -s "$API"
          echo "LANE_CP=$KC:$(cat /tmp/lane-cp.txt):$API" >> "$GITHUB_ENV"

      - name: Compile lane tools
        run: |
          javac -d tests/integration/realtime-lane -cp "$LANE_CP" tests/integration/realtime-lane/LaneTools.java

      - name: Write job config
        run: |
          mkdir -p /tmp/lane /tmp/lane-warehouse
          sed -e 's|REPLACE_HOST|127.0.0.1|g' \
              -e 's|REPLACE_PORT|5433|g' \
              -e 's|REPLACE_USER|bdp_lane|g' \
              -e 's|REPLACE_PASSWORD|bdp_lane|g' \
              -e 's|REPLACE_DATABASE|bdp_lane|g' \
              -e 's|REPLACE_WAREHOUSE|file:///tmp/lane-warehouse|g' \
              tests/integration/realtime-lane/lane-postgres-iceberg-ci.yaml > /tmp/lane.yaml

      - name: Create iceberg target table
        run: |
          cd tests/integration/realtime-lane
          java -cp ".:$LANE_CP" LaneTools create file:///tmp/lane-warehouse dw mv_sales_lane | grep TABLE-READY

      - name: Start CDC job
        working-directory: platform/flink-cdc
        run: |
          OPENS="--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.nio.charset=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.zip=ALL-UNNAMED --add-opens=java.base/java.util.regex=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.math=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.security.provider=ALL-UNNAMED --add-opens=java.base/sun.security.util=ALL-UNNAMED"
          KC="$HOME/.m2/repository/org/apache/kafka/kafka-clients/3.9.2/kafka-clients-3.9.2.jar"
          nohup java $OPENS -Xmx1536m -cp "$KC:target/classes:$LANE_CP" \
            com.levango7.dataenginebdp.flinkcdc.CdcFrameworkMain \
            --config /tmp/lane.yaml > /tmp/lane/job.log 2>&1 &
          sleep 45
          grep -E "Iceberg 真实写入路径已附加" /tmp/lane/job.log
          pgrep -f CdcFrameworkMain > /dev/null

      - name: Inject and track first-seen latency
        env:
          LANE_LOG: /tmp/lane
        run: |
          bash tests/integration/realtime-lane/lane-burst.sh 25 1.0 1 \
            "postgresql://bdp_lane:bdp_lane@127.0.0.1:5433/bdp_lane" \
            file:///tmp/lane-warehouse dw mv_sales_lane || RC=$?
          DEB=$(wc -c < /tmp/lane/dump-err.log 2>/dev/null || echo -1)
          INJ=$(grep -c injected /tmp/lane/inject-log.txt 2>/dev/null || echo -1)
          echo "burst rc=${RC:-0} dumperr=$DEB inj=$INJ"
          echo "dump-err tail:"; tail -5 /tmp/lane/dump-err.log 2>/dev/null || echo none
          if ! test -s /tmp/lane/burst.csv; then
            echo "::error::no-burst-csv rc=${RC:-0} dumperr=$DEB inj=$INJ"
            if [ "$DEB" -gt 0 ]; then
              echo "::error::dumperr-first=$(head -1 /tmp/lane/dump-err.log | head -c 320)"
              exit 23
            fi
            JOBALIVE=$(pgrep -f CdcFrameworkMain >/dev/null && echo 1 || echo 0)
            JOBERR=$(grep -E 'Caused by' /tmp/lane/job.log 2>/dev/null | tail -1 | head -c 320)
            echo "::error::no-rows inj=$INJ jobalive=$JOBALIVE causedby=$JOBERR"
            exit 24
          fi
          NROWS=$(wc -l < /tmp/lane/burst.csv)
          test "$NROWS" -eq 25 || { echo "::error::burst-rows=$NROWS rc=${RC:-0} inj=$INJ"; exit 25; }

      - name: Assert P95
        run: |
          python3 tests/integration/realtime-lane/measure2.py /tmp/lane/burst.csv /tmp/lane/inject-log.txt 60

      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-lane-logs
          path: |
            /tmp/lane/
            /tmp/lane.yaml
          if-no-files-found: ignore

  doris-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        command: >-
          postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
        env:
          POSTGRES_USER: bdp_lane
          POSTGRES_PASSWORD: bdp_lane
          POSTGRES_DB: bdp_lane
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bdp_lane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mysql client
        run: |
          set -x
          if command -v mysql >/dev/null 2>&1; then
            echo "mysql client already present: $(mysql --version)"
          else
            sudo apt-get update
            sudo apt-get install -y mysql-client-8.0 || {
              echo "::warning::mysql-client-8.0 no candidate; enabling universe and retrying"
              sudo add-apt-repository -y universe
              sudo apt-get update
              sudo apt-get install -y mysql-client-8.0 mysql-client-core-8.0
            }
          fi
          mysql --version | head -1

      - name: Download Doris 4.1.5 binary
        run: |
          mkdir -p /tmp/doris-pkg /tmp/doris
          cd /tmp/doris-pkg
          curl -sL -C - --max-time 900 -o doris.tar.gz \
            "https://apache-doris-releases.oss-accelerate.aliyuncs.com/apache-doris-4.1.5-bin-x64.tar.gz"
          echo "size=$(wc -c < doris.tar.gz)"
          cd /tmp/doris
          tar -xzf /tmp/doris-pkg/doris.tar.gz
          ls apache-doris-4.1.5-bin-x64 | head -4

      - name: Tune Doris conf and kernel
        run: |
          D=/tmp/doris/apache-doris-4.1.5-bin-x64
          sed -i 's/^JAVA_OPTS_FOR_JDK_17=.*/JAVA_OPTS_FOR_JDK_17="-Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -XX:+UseG1GC -Xmx2048m -Xms1024m --add-opens=java.base\/java.util=ALL-UNNAMED --add-opens=java.base\/java.nio=ALL-UNNAMED --add-opens=java.base\/java.lang=ALL-UNNAMED"/' "$D/fe/conf/fe.conf"
          grep -q "^mem_limit=" "$D/be/conf/be.conf" && sed -i 's/^mem_limit=.*/mem_limit=3221225472/' "$D/be/conf/be.conf" || echo "mem_limit=3221225472" >> "$D/be/conf/be.conf"
          sudo sysctl -w vm.max_map_count=2000000
          sudo swapoff -a || true
          sudo apt-get install -y -qq mysql-client-core-8.0 >/dev/null 2>&1 || true

      - name: Start Doris FE and BE
        run: |
          D=/tmp/doris/apache-doris-4.1.5-bin-x64
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          ulimit -n 655350 || ulimit -n 10240 || true
          $D/fe/bin/start_fe.sh --daemon || true
          for i in $(seq 1 60); do
            curl -s --max-time 3 "http://127.0.0.1:8030/api/bootstrap" >/dev/null 2>&1 && break
            sleep 2
          done
          curl -s --max-time 5 "http://127.0.0.1:8030/api/bootstrap" && echo " FE-HTTP-UP"
          $D/be/bin/start_be.sh --daemon || true
          sleep 5
          M="mysql -h127.0.0.1 -P9030 -uroot --ssl-mode=DISABLED"
          $M -e "ALTER SYSTEM ADD BACKEND '127.0.0.1:9050';" || true
          for i in $(seq 1 25); do
            A=$($M -N -e "SHOW BACKENDS;" 2>/dev/null | awk -F'\t' '$10=="true"{c++} END{print c+0}')
            echo "backend-poll$i alive=$A"
            [ "$A" -ge 1 ] && break
            sleep 3
          done

      - name: Create Doris target table
        run: |
          M="mysql -h127.0.0.1 -P9030 -uroot --ssl-mode=DISABLED"
          $M -e "CREATE DATABASE IF NOT EXISTS dw;"
          $M -e "USE dw; CREATE TABLE IF NOT EXISTS mv_sales_lane (id BIGINT, name VARCHAR(64), amount DOUBLE, src_ts DATETIME) UNIQUE KEY(id) DISTRIBUTED BY HASH(id) BUCKETS 1 PROPERTIES (\"replication_num\" = \"1\");"
          $M -e "USE dw; SHOW TABLES;"

      - name: Source table and publication
        run: |
          PGPASSWORD=bdp_lane psql -h 127.0.0.1 -p 5433 -U bdp_lane -d bdp_lane -c "CREATE TABLE IF NOT EXISTS public.mv_sales_lane(id bigint primary key, name text, amount double precision, src_ts timestamptz default clock_timestamp());"
          PGPASSWORD=bdp_lane psql -h 127.0.0.1 -p 5433 -U bdp_lane -d bdp_lane -tAc "SELECT 'CREATE PUBLICATION mv_lane_pub FOR TABLE public.mv_sales_lane' WHERE NOT EXISTS (SELECT FROM pg_publication WHERE pubname = 'mv_lane_pub')" | PGPASSWORD=bdp_lane psql -h 127.0.0.1 -p 5433 -U bdp_lane -d bdp_lane

      - name: Build classpath
        run: |
          mvn -B -pl platform/flink-cdc -am -DskipTests install > /tmp/mvn-install.log 2>&1 \
            || { grep -E '^\[ERROR\]|BUILD FAILURE|Could not (resolve|transfer)' /tmp/mvn-install.log | tail -12 | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 2800 > /tmp/mvn-err.txt; echo "::error::install failed: $(cat /tmp/mvn-err.txt)"; exit 1; }
          mvn -B -f platform/flink-cdc/pom.xml dependency:build-classpath -Dmdep.outputFile=/tmp/lane-cp.txt > /tmp/mvn-cp.log 2>&1 \
            || { grep -E '^\[ERROR\]|BUILD FAILURE|Could not (resolve|transfer)' /tmp/mvn-cp.log | tail -12 | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 2800 > /tmp/mvn-err.txt; echo "::error::bc failed: $(cat /tmp/mvn-err.txt)"; exit 1; }
          mvn -B -q dependency:get -Dartifact=org.apache.kafka:kafka-clients:3.9.2
          test -s /tmp/lane-cp.txt
          KC="$HOME/.m2/repository/org/apache/kafka/kafka-clients/3.9.2/kafka-clients-3.9.2.jar"
          test -s "$KC"
          echo "LANE_CP=$KC:$(cat /tmp/lane-cp.txt)" >> "$GITHUB_ENV"

      - name: Write job config
        run: |
          mkdir -p /tmp/lane
          cat <<'YAML' | sed 's/^          //' > /tmp/lane-doris.yaml
          job:
            name: lane-pg-doris
            parallelism: 1
            checkpointIntervalMs: 5000
          sources:
            - name: lane-pg
              type: POSTGRESQL
              host: 127.0.0.1
              port: 5433
              username: bdp_lane
              password: bdp_lane
              database: bdp_lane
              table: public.mv_sales_lane
              startupMode: initial
          sinks:
            - name: lane-doris
              type: DORIS
              host: 127.0.0.1
              port: 8030
              username: root
              primaryKey: id
              properties:
                database: dw
                table: mv_sales_lane
                batch-size: "20"
          YAML
          cat /tmp/lane-doris.yaml

      - name: Start CDC job
        working-directory: platform/flink-cdc
        run: |
          OPENS="--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.nio.charset=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.zip=ALL-UNNAMED --add-opens=java.base/java.util.regex=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.math=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.security.provider=ALL-UNNAMED --add-opens=java.base/sun.security.util=ALL-UNNAMED"
          KC="$HOME/.m2/repository/org/apache/kafka/kafka-clients/3.9.2/kafka-clients-3.9.2.jar"
          nohup java $OPENS -Xmx1536m -cp "$KC:target/classes:$LANE_CP" \
            com.levango7.dataenginebdp.flinkcdc.CdcFrameworkMain \
            --config /tmp/lane-doris.yaml > /tmp/lane/job.log 2>&1 &
          sleep 45
          pgrep -f CdcFrameworkMain > /dev/null
          grep -E "Doris Stream Load Sink 初始化" /tmp/lane/job.log | tail -1

      - name: Inject and track first-seen latency
        env:
          LANE_LOG: /tmp/lane
        run: |
          bash tests/integration/realtime-lane/doris-burst.sh 25 1.0 601 || RC=$?
          DEB=$(wc -c < /tmp/lane/dump-err.log 2>/dev/null || echo -1)
          INJ=$(grep -c injected /tmp/lane/inject-log.txt 2>/dev/null || echo -1)
          echo "burst rc=${RC:-0} dumperr=$DEB inj=$INJ"
          if ! test -s /tmp/lane/burst.csv; then
            echo "::error::no-burst-csv rc=${RC:-0} dumperr=$DEB inj=$INJ"
            JOBERR=$(grep -E 'Caused by' /tmp/lane/job.log 2>/dev/null | tail -1 | head -c 320)
            echo "::error::no-rows inj=$INJ causedby=$JOBERR"
            exit 24
          fi
          NROWS=$(wc -l < /tmp/lane/burst.csv)
          test "$NROWS" -eq 25 || { echo "::error::burst-rows=$NROWS rc=${RC:-0}"; exit 25; }

      - name: Assert P95
        run: |
          python3 tests/integration/realtime-lane/measure2.py /tmp/lane/burst.csv /tmp/lane/inject-log.txt 60

      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doris-lane-logs
          path: |
            /tmp/lane/
            /tmp/lane-doris.yaml
          if-no-files-found: ignore
