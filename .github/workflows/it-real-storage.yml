# 独立工作流：P1-8 Phase 1 真实存储泳道（catalog×PostgreSQL + MinIO 写→读内容级断言）。
#
# 为什么独立成 nightly/dispatch 泳道（不塞进 ci.yml 的 PR 必检）：
#   1) deploy-completeness-plan §四 Phase 1 明文口径：CI 时长评估点 → 分 job 或
#      nightly 化，不塞 PR 必检（账号 ≈20 作业/小时，台账 #102）；
#   2) base compose（tests/integration/docker-compose.yml）零变化，PR 门禁的
#      Integration Test 行为与合并前完全一致；真实存储栈由 override 文件
#      （docker-compose.real-storage.yml）按需加载；
#   3) 独立信号便于观察真实存储面的历史趋势，与 K3s burn-in、nightly-e2e 同构。
#
# R9 棘轮（KNOWN-FAILURES / 台账 #93）：本泳道的 compose up 走 scripts/compose-retry.sh。
name: IT Real Storage

on:
  schedule:
    # 每日 22:00 UTC（北京 06:00），避开 nightly-e2e（18:00 UTC）与 it-k3s（周一 03:00 UTC）
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: it-real-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-storage:
    name: 真实存储写→读（catalog×PG + MinIO）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11 与集成测试依赖
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip -q
          pip install -r tests/integration/requirements.txt -q

      - name: 记录泳道起止（CI 时长评估点，见 deploy-completeness-plan §四 Phase 1）
        run: echo "REAL_STORAGE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: 启动真实存储最小栈（base + real-storage override）
        working-directory: tests/integration
        # 最小栈：只起 catalog + postgresql + minio（compose 自动带上依赖），
        # 不拉满 32 服务全栈——本泳道验证的是存储面真实贯通，省下的时长如实记入台账。
        # R9：compose up 必须走 compose-retry.sh（换源重试一次，真失败仍按原语义阻断）。
        run: |
          BASE_REGISTRY="$(bash "$GITHUB_WORKSPACE/scripts/pick-base-registry.sh" || true)"
          BASE_REGISTRY="${BASE_REGISTRY:-docker.io}"
          export BASE_REGISTRY
          if ! bash "$GITHUB_WORKSPACE/scripts/compose-retry.sh" \
              docker compose -f docker-compose.yml -f docker-compose.real-storage.yml \
              up -d --wait --wait-timeout 600 catalog postgresql minio; then
            echo "::error::真实存储栈启动失败或健康检查超时，阻断"
            docker compose -f docker-compose.yml -f docker-compose.real-storage.yml ps -a || true
            docker compose -f docker-compose.yml -f docker-compose.real-storage.yml logs --tail=100 || true
            exit 1
          fi
          echo "✓ catalog + postgresql + minio 已就绪"

      - name: 真实存储写→读内容级断言（含 restart 跨进程持久性实证）
        working-directory: tests/integration
        env:
          REAL_STORAGE: "1"
        run: |
          python -m pytest -v --tb=short e2e/test_e2e_real_storage.py \
            --html=real-storage-report.html --self-contained-html

      - name: PG 侧举证（行真实落库，非 API 回显）
        working-directory: tests/integration
        run: |
          count=$(docker compose -f docker-compose.yml -f docker-compose.real-storage.yml \
            exec -T postgresql psql -U it -d catalog -t -A -c \
            "select count(*) from databases where name like '%-probe-%';")
          echo "PG 中探针行数 = ${count}"
          test "${count:-0}" -ge 1

      - name: 泳道墙钟时长（如实记录，供 §四 Phase 1 CI 时长评估）
        if: always()
        run: |
          echo "真实存储泳道墙钟耗时：$(($(date +%s) - ${REAL_STORAGE_START:-0}))s（首跑实测值记入台账 DONE 行）"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-storage-report
          path: tests/integration/real-storage-report.html
          if-no-files-found: ignore
