# Reusable Workflow: Java + Maven 环境初始化
# 调用方式：uses: .github/workflows/_reusable-setup-java-maven.yml
# T-10: 统一 Java/Maven 环境配置，消除 ci.yml/build.yml/security.yml/sonarqube.yml 重复
name: Reusable Setup Java + Maven

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK 版本'
        type: string
        default: '17'
      maven-version:
        description: 'Maven 版本'
        type: string
        default: '3.9.9'
      distribution:
        description: 'JDK 发行版'
        type: string
        default: 'temurin'

jobs:
  setup-java-maven:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 JDK ${{ inputs.java-version }} (${{ inputs.distribution }})
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.distribution }}
          java-version: ${{ inputs.java-version }}
          cache: 'maven'

      - name: 安装 Maven ${{ inputs.maven-version }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ inputs.maven-version }}

      - name: 预热 Maven 本地缓存（安装 parent POM + 内部依赖链）
        run: |
          if [ -f "pom.xml" ]; then
            mvn install -B -N -q \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
              || echo "::warning::parent POM 安装失败"
          fi
          for lib_pom in \
            "platform/common-security/pom.xml" \
            "platform/encaps-layer/pom.xml" \
            "platform/sql-gateway/pom.xml"; do
            [ -f "$lib_pom" ] || continue
            mvn -f "$lib_pom" install -B -q -DskipTests -U \
              -Dpmd.skip=true -Dcheckstyle.skip=true \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
              || echo "::warning::$lib_pom 安装失败"
          done