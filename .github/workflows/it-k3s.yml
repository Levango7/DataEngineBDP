# 独立工作流：K3s 六链路集成测试（chain1–chain6）
#
# 为什么独立成 job（不塞进 ci.yml 的 Integration Test）：
#   1) 那条腿的 job 上限 30 分钟，pytest 单轮已占 13 分钟；这里要构建镜像 + 建集群 + 等 Pod 就绪，
#      放一起必然超时（台账 #20-A 实测）。
#   2) tests/integration/k3s/conftest.py:566,590 的 T-05 严格模式规定"部署失败不 skip、直接报红"，
#      所以它天生要真集群，不能和 compose 腿混跑。
#   3) 独立工作流便于单独重跑与看历史，也不影响主 CI 的绿灯口径。
#
# 关键前提（实测得出，不是猜）：
#   - deploy/k3s/manifests 的 22 个 Service 全是 ClusterIP；测试在宿主机上用
#     `kubectl get svc` 拿 ClusterIP 直连（conftest.py:4,40，命名空间默认 shuqing）。
#     k3d 的 ClusterIP 在宿主网络里默认不可路由 → 不加路由会全线连接失败，
#     且会被误读成"产品缺陷"。故本文件显式补 `ip route`。
#   - manifests 引用 sq/*:0.1.0，而 Helm charts（13 个 values.yaml）与 compose 全用 shuqing/*。
#     本 job 按 manifests 现状构建 sq/* 标签（不在此处改产品口径），命名统一另立事项。
#   - 未构建的组件其 Pod 会停在 ImagePullBackOff；ensure_k3s_services_deployed 的
#     `kubectl wait --all` 超时被其自身容忍（conftest 内 pass），故只构建各链路真正需要的组件。
name: IT K3s Chains

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 跑一次全量集群链路（不阻断主 CI，作为独立信号）
    - cron: "0 3 * * 1"

concurrency:
  group: it-k3s-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  K3D_CLUSTER: sq
  # k3s 默认 Service CIDR（用于宿主路由）
  SVC_CIDR: 10.43.0.0/16
  CHAIN_IMAGES: >-
    encaps-layer
    sql-gateway
    nl2sql
    infra-orchestrator
    knowledge-engine
    industry-templates
    lineage-analyzer

jobs:
  k3s-chains:
    name: K3s 六链路（chain1-6）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        id: checkout
        uses: actions/checkout@v4

      - name: 安装 k3d 与 helm
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.1 bash
          curl -fsSL https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          k3d version
          helm version --short

      - name: 建 k3d 集群
        run: |
          set -euo pipefail
          k3d cluster create "$K3D_CLUSTER" \
            --k3s-arg "--disable=traefik@server:0" \
            --k3s-arg "--disable=servicelb@server:0" \
            --wait
          kubectl config current-context
          kubectl get nodes

      - name: 补宿主机到 ClusterIP 的路由
        # 没有这一步，测试对 ClusterIP 的直连会全部超时，并把基础设施问题误报成产品缺陷。
        run: |
          set -euo pipefail
          node_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' k3d-${K3D_CLUSTER}-server-0)
          echo "k3d 节点 IP: ${node_ip}"
          sudo ip route replace "$SVC_CIDR" via "$node_ip"
          ip route | grep -E "$SVC_CIDR|${node_ip}" || true

      - name: 构建并导入链路所需镜像
        # 逐个构建（组件互为独立 Dockerfile）；构建失败只跳过该组件，不让整轮无意义红
        run: |
          set -uo pipefail
          built=()
          for comp in $CHAIN_IMAGES; do
            dir="platform/$comp"
            [ -d "$dir" ] || dir=$(find platform -maxdepth 2 -type d -name "$comp" | head -1)
            if [ -z "$dir" ] || [ ! -f "$dir/Dockerfile" ]; then
              echo "::warning::$comp 未找到 Dockerfile，跳过"
              continue
            fi
            # 构建上下文自适应：Java 组件 Dockerfile 内 `COPY platform/<模块>/...`
            # 需仓库根上下文；Python/Go 组件用组件目录为上下文。硬编码组件目录
            # 会使 Java 组件报 "/platform/<组件>/src: not found"（实测）。
            if grep -q "COPY platform/" "$dir/Dockerfile"; then
              echo "构建 sq/$comp:0.1.0（Java 组件，上下文=仓库根）"
              build_args=(-f "$dir/Dockerfile" .)
            else
              echo "构建 sq/$comp:0.1.0（Python 组件，上下文=$dir）"
              build_args=("$dir")
            fi
            if docker build -t "sq/$comp:0.1.0" "${build_args[@]}"; then
              built+=("sq/$comp:0.1.0")
            else
              echo "::warning::$comp 构建失败，跳过"
            fi
          done
          echo "共 ${#built[@]} 个镜像待导入"
          k3d image import "${built[@]}" -c "$K3D_CLUSTER"

      - name: 部署 manifests
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k3s/manifests/namespace.yaml
          kubectl apply -f deploy/k3s/manifests/ || true
          echo "等待链路相关 Pod 就绪（最多 300s）"
          for comp in $CHAIN_IMAGES; do
            kubectl -n shuqing wait --for=condition=Ready pod \
              -l "app=${comp}" --timeout=300s || echo "::warning::${comp} 未在期限内 Ready"
          done
          kubectl -n shuqing get pods -o wide | head -40

      - name: 安装 pytest 与集成测试依赖
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r tests/integration/requirements.txt 2>/dev/null || pip install -q pytest requests pyjwt
          pip install -q pytest-html

      - name: 运行 K3s 六链路
        env:
          K3S_NAMESPACE: shuqing
        # 与 ci.yml 的集成腿保持同一工作目录约定：conftest 里的组件根路径按
        # tests/integration 相对位置推导（本项目已因写死相对路径踩过 66 个 error）
        working-directory: tests/integration
        run: |
          python -m pytest k3s -v --tb=short --html=k3s-report.html --self-contained-html

      - name: 失败时抓集群与容器日志
        if: failure() && steps.checkout.outcome == 'success'
        run: |
          echo "=== Pod 状态 ==="
          kubectl -n shuqing get pods -o wide || true
          echo "=== 未就绪 Pod 的事件与日志 ==="
          for p in $(kubectl -n shuqing get pods -o jsonpath='{range .items[?(@.status.phase!="Running")]}{.metadata.name}{end}' 2>/dev/null | head -6); do
            echo "--- $p ---"
            kubectl -n shuqing describe pod "$p" | tail -25 || true
            kubectl -n shuqing logs "$p" --tail=80 || true
          done

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k3s-chains-report
          path: tests/integration/k3s-report.html
          retention-days: 7
          if-no-files-found: warn
