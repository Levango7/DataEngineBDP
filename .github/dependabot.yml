# Dependabot 依赖更新配置
# 自动检测并创建 PR 更新过期的依赖，降低安全风险
# 覆盖 5 种生态系统：github-actions、maven、gomod、npm、pip
# 每周检查一次，避免 PR 过于频繁干扰开发
version: 2

updates:
  # ============================================================
  # GitHub Actions 依赖更新：检查 .github/workflows/ 下的 action 版本
  # ============================================================
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: '[deps-actions]'
      include: scope

  # ============================================================
  # npm 依赖更新：检查 frontend/ 下的 package.json
  # ============================================================
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
      - frontend
    commit-message:
      prefix: '[deps-npm]'
      include: scope
    groups:
      # 将开发依赖合并为一个 PR
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # 生产依赖合并为一个 PR
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

