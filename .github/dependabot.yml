# Dependabot 配置（2026-10-10 起：维护模式——只留安全更新通道）
#
# 背景
# ----
# 本仓自 2026-10-03 转入维护模式：**仅修 P0 缺陷与安全补丁**，不做常规依赖升级。
# 但本文件原有 30 个 updates 条目（maven×17 / gomod×10 / pip×9 / npm / actions，weekly）
# 持续开出版本升级 PR，积压到 **150+ 条开放 PR**（2026-10-10 实测 156 条，其中 155 条为依赖
# 版本升级）——占用 CI 与评审带宽，且与维护模式口径不符。
#
# 处置（2026-10-10，台账变更日志同批记录）
# --------------------------------------
# 1) 存量 155 条版本升级 PR 已全部销账关闭（每条附理由评论：Trivy HIGH/CRITICAL 门禁全绿、
#    无一引用"修复用"CVE——唯一带 CVE 字样的 #330 其 changelog 明写 not affected；
#    大版本升级留待大版本规划窗口）；
# 2) **Dependabot 安全更新已开启**（仓库 Settings 的 `automated-security-fixes`，
#    同日由 API 打开，复核由 false 变 true；开启后 `dependabot/alerts?state=open` = 0 条，
#    与 Trivy 门禁一致）——安全更新**不受本文件影响**：它由仓库设置驱动，
#    出现真实漏洞会自动开安全 PR；
# 3) 本文件移除全部 version-updates 条目，使依赖面**只保留安全更新一个入口**。
#
# 恢复方式
# --------
# 退出维护模式（大版本规划窗口）时：从 git 历史取回本文件（2026-10-10 之前的版本含
# 全部 30 个生态条目），或按当时的产品/依赖策略重新登记 ecosystem。
version: 2

# 维护模式：不配置 version updates。安全更新独立于本文件（见上方"处置 2)"）。
updates: []
