# Dependabot 依赖更新配置（维护模式：只留安全更新通道，版本更新按生态显式关掉）
#
# 背景
# ----
# 本仓自 2026-10-03 转入维护模式：**仅修 P0 缺陷与安全补丁**，不做常规依赖升级。
# 存量 155 条版本升级 PR 已于 2026-10-10 全部销账关闭（每条附理由评论）。
#
# 2026-10-23 的实测订正（重要，别再退回 `updates: []`）
# --------------------------------------------------------
# 2026-10-10 这一版把本文件写成 `updates: []`，并在注释里断言"依赖面只剩安全更新一个入口"。
# **断言不成立**：2026-10-23 Dependabot 仍开出两张版本升级 PR——#718（production-dependencies
# 分组，element-plus 2.14.4→2.14.7 + vue）与 #719（development-dependencies 分组，8 个 dev 依赖）。
# 这两个分组名只存在于 2026-10-10 之前的旧配置里 ⇒ Dependabot 开这两张 PR 时用的**不是**
# 本文件那份 `updates: []`，而是含旧分组规则的那份配置。
# 可确定的是"用哪份配置"，不可确定的是"为什么这次触发"：GitHub 未公开配置错误查询接口
#（GET /repos/{owner}/{repo}/dependabot/configuration_errors 在本仓返回 404），
# 且 2026-10-13 / 10-20 两个周一都没出 PR ⇒ 触发时刻与仓库级 "Dependabot version updates"
# 开关、Dependabot 内部调度都有关，API 侧读不到。故下面改用官方文档给的确定性手段，
# 不再依赖"清空 updates 数组"这种没被证实的隐式关闭。
#
# GitHub 官方文档给的关闭手段是**按生态把 open-pull-requests-limit 置 0**
# （"如果只需要安全更新并且想要排除版本更新，可以将 open-pull-requests-limit 设置为 0"），
# 而不是清空 updates 数组。所以本文件恢复各生态条目，但把 limit 一律置 0：
#   - 版本更新：照旧按周检查依赖，但**不再开 PR**（limit=0）；
#   - 安全更新：由仓库 Settings 的 automated-security-fixes 驱动，**不受本文件影响**，
#     出现真实漏洞时照常开 PR（依赖告警的打开数与 Trivy 门禁互为对照）。
#
# 维护模式期间新增依赖时：只要目录在下面列表里，它就自动继承 limit=0，无需额外动作；
# 新增目录记得在列表里补一条（limit=0），否则该目录不在监控面内。
#
# 退出维护模式（大版本规划窗口）时：把需要的生态条目的 limit 从 0 调回正数即可。
version: 2

updates:
  # ============================================================
  # GitHub Actions 依赖更新：检查 .github/workflows/ 下的 action 版本
  # ============================================================
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: '[deps-actions]'
      include: scope

  # ============================================================
  # npm 依赖更新：检查 frontend/ 下的 package.json
  # ============================================================
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - npm
      - frontend
    commit-message:
      prefix: '[deps-npm]'
      include: scope
    groups:
      # 将开发依赖合并为一个 PR
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # 生产依赖合并为一个 PR
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

