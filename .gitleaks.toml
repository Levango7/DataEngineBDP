title = "DataEngineBDP gitleaks config"

[allowlist]
description = "允许的测试/示例/模板模式"
paths = [
    "(.*_test\\.go)$",
    "(.*Test\\.java)$",
    "(.*_test\\.py)$",
    "(.*\\.test\\.js)$",
    "(.*\\.spec\\.ts)$",
    "(.*\\.md)$",
    "(docs/.*)$",
    "(doc_optimization/.*)$",
    "(.*config-local\\.yaml)$",
    "(.*config\\.yaml\\.example)$",
    "(.*\\.example\\.ya?ml)$",
    "(.*application-it\\.yml)$",
    "(.*application-dev\\.yml)$",
    "(.*\\.local\\.ya?ml)$",
]
regexes = [
    "JWT_SIGNING_KEY\\s*[=:]*[\"']*[A-Za-z0-9+/=]{32,}[\"']*",
    "JWT_SECRET\\s*[=:]*[\"']*[A-Za-z0-9+/=]{32,}[\"']*",
    "STD_KEY_HEX\\s*=[\"']*[A-Fa-f0-9]{32,}[\"']*",
    "testSecret\\s*[=:]*[\"']*REDACTED[\"']*",
    "curl\\s+.*-u\\s+REDACTED",
    "curl\\s+.*-u\\s+[\"']*[^\"']+[\"']*",
    "token:\\s*REDACTED",
    "refreshToken:\\s*REDACTED",
    "key:\\s*REDACTED",
]