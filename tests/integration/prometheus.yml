# Prometheus 集成测试采集配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'encaps-layer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['encaps-layer:8080']

  - job_name: 'sql-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['sql-gateway:8081']

  - job_name: 'catalog'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['catalog:8082']

  - job_name: 'rule-engine'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['rule-engine:8083']