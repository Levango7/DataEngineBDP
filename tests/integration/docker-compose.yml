# 数据引擎大数据平台集成测试环境编排
#
# 用途：在 CI 或本地一键拉起 4 个自研组件，供 pytest 集成测试调用。
# 所有服务均配置 healthcheck，确保服务就绪后再执行测试。
#
# 启动：docker-compose up -d --build
# 等待就绪：docker-compose up -d --wait   （Compose v2 支持 --wait）
# 销毁：docker-compose down -v
#
# 端口映射（使用 18080-18083 避开本机 8080 端口占用）：
#   encaps-layer  -> 18080 -> 容器内 8080
#   sql-gateway   -> 18081 -> 容器内 8081
#   catalog       -> 18082 -> 容器内 8082
#   rule-engine   -> 18083 -> 容器内 8083

# 台账 #72：base 镜像源可由 CI 的选源脚本（scripts/pick-base-registry.sh）注入；
# 宿主没给 BASE_REGISTRY 时用今天的默认宿主，行为与改动前一致。
x-base-args: &base-args
  - BASE_REGISTRY=${BASE_REGISTRY:-docker.m.daocloud.io}

services:
  # ---------------------------------------------------------------------------
  # 封装层（Java/Spring Boot, port 8080）
  # ---------------------------------------------------------------------------
  encaps-layer:
    build:
      context: ../..
      dockerfile: platform/encaps-layer/Dockerfile
      args: *base-args
    image: shuqing/encaps-layer:0.1.0
    container_name: it-encaps-layer
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    ports:
      - "18080:8080"
    environment:
      - SERVER_PORT=8080
      # 集成测试环境必需的安全配置（生产通过 KMS/环境变量注入）
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - ENCRYPT_KEY=0123456789abcdef0123456789abcdef
      - K8S_MOCK_ENABLED=true
      # 本地降级登录（无 Keycloak 的集成/E2E 栈：admin/admin 签发平台 JWT）；
      # 生产部署严禁开启——Keycloak 不可达时应返回 503 而非降级
      - APP_SECURITY_LOCAL_AUTH_ENABLED=true
      # 显式注入降级账号密码：AuthController 的 local-auth.password 默认值为空，
      # 且 @PostConstruct 会随机生成 16 位强密码（bae9a404 安全加固），
      # 不注入则 admin/admin 恒返 401，导致 E2E 登录门禁全线失败。
      # 注意：必须用全路径 env 名 APP_SECURITY_LOCAL_AUTH_PASSWORD 才能绑定到
      # app.security.local-auth.password；短名 LOCAL_AUTH_PASSWORD 不参与绑定。
      - APP_SECURITY_LOCAL_AUTH_PASSWORD=admin
      # E2E 每用例独立登录、workers=1 串行猛打，默认登录限流 5 rpm/IP 会误伤；
      # 测试栈放宽至 600（application.yml: login-rpm=${RATE_LIMIT_LOGIN_RPM:5}）
      - RATE_LIMIT_LOGIN_RPM=600
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      # encaps-layer 无 /api/v1/health 控制器，使用 Spring Boot Actuator 端点
      # （application.yml 已暴露 health，SecurityConfig 已放行 /actuator/health）
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 封装层租户域服务（Java/Spring Boot, port 8081 → 主机 18090）
  # ---------------------------------------------------------------------------
  # Sprint 2.2 L4：租户域独立微服务（Tenant/Project/Account/Workspace/Quota）。
  # 镜像 classpath 含 encaps-layer jar（组件扫描会带入其 TenantController），
  # 故必须 ENCAPS_LAYER_TENANT_CONTROLLER_ENABLED=false 防 /api/v1/tenants 双注册
  # （生产跨进程部署时 encaps-layer 容器不受此影响，其自身默认启用）。
  encaps-tenant:
    build:
      context: ../..
      dockerfile: platform/encaps-tenant/Dockerfile
      args: *base-args
    image: shuqing/encaps-tenant:0.1.0
    container_name: it-encaps-tenant
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    ports:
      - "18090:8081"
    environment:
      - SERVER_PORT=8081
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - ENCRYPT_KEY=0123456789abcdef0123456789abcdef
      - K8S_MOCK_ENABLED=true
      # 关闭 encaps-layer 侧 TenantController（防同前缀双注册，见 EncapsTenantApplicationIT）
      - ENCAPS_LAYER_TENANT_CONTROLLER_ENABLED=false
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 统一 SQL 网关（Java/Spring Boot, port 8081）
  # ---------------------------------------------------------------------------
  sql-gateway:
    build:
      context: ../..
      dockerfile: platform/sql-gateway/Dockerfile
      args: *base-args
    image: shuqing/sql-gateway:0.1.0
    container_name: it-sql-gateway
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    ports:
      - "18081:8081"
    environment:
      - SERVER_PORT=8081
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - ENCRYPT_KEY=0123456789abcdef0123456789abcdef
      - K8S_MOCK_ENABLED=true
    depends_on:
      encaps-layer:
        condition: service_healthy
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # Catalog 元数据目录（Go/Gin, port 8082）
  # ---------------------------------------------------------------------------
  catalog:
    build:
      context: ../../platform/catalog
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/catalog:0.1.0
    container_name: it-catalog
    ports:
      - "18082:8082"
    environment:
      - CATALOG_PORT=8082
      - CATALOG_VERSION=0.1.0
      - JWT_SIGNING_KEY=it-test-jwt-secret-at-least-32-bytes-long
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 规则引擎（Java/Spring Boot, port 8083）
  # ---------------------------------------------------------------------------
  rule-engine:
    build:
      context: ../..
      dockerfile: platform/rule-engine/Dockerfile
      args: *base-args
    image: shuqing/rule-engine:0.1.0
    container_name: it-rule-engine
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    ports:
      - "18083:8083"
    environment:
      - SERVER_PORT=8083
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - ENCRYPT_KEY=0123456789abcdef0123456789abcdef
      - K8S_MOCK_ENABLED=true
    depends_on:
      encaps-layer:
        condition: service_healthy
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # FinOps 成本模型服务（Java/Spring Boot, port 8084）
  # ---------------------------------------------------------------------------
  cost-model:
    build:
      context: ../..
      dockerfile: platform/finops/cost-model/Dockerfile
      args: *base-args
    image: shuqing/cost-model:0.1.0
    container_name: it-cost-model
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    ports:
      - "18084:8084"
    environment:
      - SERVER_PORT=8084
      - PROMETHEUS_URL=http://prometheus:9090
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - ENCRYPT_KEY=0123456789abcdef0123456789abcdef
      - K8S_MOCK_ENABLED=true
    depends_on:
      encaps-layer:
        condition: service_healthy
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # FinOps 看板与优化建议服务（Java/Spring Boot, port 8085 → 主机 18087）
  # ---------------------------------------------------------------------------
  # T029 FinOps 看板与优化建议
  # - Top10/趋势/明细/闲置清单看板
  # - 5 类闲置模式识别（低 CPU/低内存/未挂载存储/空闲 GPU/低流量）
  # - 账单导出 CSV/Excel（明细+汇总）
  # - 分账到子工作空间（比例可配置）
  finops-dashboard:
    build:
      context: ../..
      dockerfile: platform/finops/dashboard/Dockerfile
      args: *base-args
    image: shuqing/finops-dashboard:0.1.0
    container_name: it-finops-dashboard
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    ports:
      - "18087:8085"
    environment:
      - SERVER_PORT=8085
      - PROMETHEUS_URL=http://prometheus:9090
      - COST_MODEL_URL=http://cost-model:8084
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - ENCRYPT_KEY=0123456789abcdef0123456789abcdef
      - K8S_MOCK_ENABLED=true
    depends_on:
      cost-model:
        condition: service_healthy
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # LLM 多模态网关（Go/Gin, port 8084 → 主机 18085）
  # ---------------------------------------------------------------------------
  # T030 大模型多模态网关统一 API 与路由
  # - OpenAI 兼容 API（/v1/chat/completions）
  # - 四维度路由（模型/租户/场景/成本）
  # - 多模态 Token 计量（文本/图像/语音/视频）
  # - SSE 流式响应 + 异步批处理
  llm-gateway:
    build:
      context: ../../platform/llm-gateway
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/llm-gateway:0.2.0
    container_name: it-llm-gateway
    ports:
      - "18085:8084"
    environment:
      - LLM_GATEWAY_PORT=8084
      - LLM_GATEWAY_VERSION=0.2.0
      - LLM_GATEWAY_MOCK_MODE=true
      - JWT_DEV_MODE=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 模型评测平台（Python/FastAPI, port 8086 → 主机 18086）
  # ---------------------------------------------------------------------------
  # T031 模型评测平台与 A/B 对比
  # - 评测任务引擎（提交/查询/日志/终止）
  # - MMLU/CMMLU/CEval 标准集
  # - 六指标（准确率/召回率/F1/延迟/成本/幻觉率）
  # - 三模式（规则/模型/人工）+ A/B 对比报告
  evaluation:
    build:
      context: ../../platform/llm-gateway/evaluation
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/evaluation:0.1.0
    container_name: it-evaluation
    ports:
      - "18086:8086"
    environment:
      - EVAL_PORT=8086
      - LLM_GATEWAY_URL=http://it-llm-gateway:8084
      - LLM_GATEWAY_API_KEY=dummy
      - EVAL_DEV_MODE=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      llm-gateway:
        condition: service_healthy
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 微调→评测→部署闭环编排服务（Python/FastAPI, port 18088）
  # ---------------------------------------------------------------------------
  # T033 一键闭环编排：微调→评测→部署
  # - 集成 T032 微调引擎 + T031 评测平台 + 模型仓库
  # - 版本化管理（Adapter/评测报告）
  # - WebSocket 实时进度推送
  finetuning-loop:
    build:
      context: ../../design/planned/model-finetuning/loop
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/finetuning-loop:0.1.0
    container_name: it-finetuning-loop
    ports:
      - "18088:18088"
    environment:
      - LOOP_PORT=18088
      - LOOP_MOCK_MODE=true
      # 2026-10-14 台账 #68①第 2 步：翻 AUTH_MODE=jwt 并补齐此前缺失的 JWT_SECRET。
      # 原形态 AUTH_MODE=none ⇒ app/jwt_auth.py:75 缺省即匿名 admin 放行，任何未带 token 的
      # 请求都能进 /api/v1/loop/*（loop_routes.py:49-52 的唯一守卫被短路）——夜间若有未认证 401
      # 断言，打到本服务会恒真失明。与本栈其余 python 域用同一 41 字节密钥（HS256）。
      # LOOP_DEV_MODE 同步置 false：config.py:96-103 的安全校验只在非 dev_mode 下要求
      # jwt_secret 存在且 ≥32 字节；若留着 true，服务侧自检关闭而 jwt_auth 侧强制，口径不一致。
      # /health 不受影响：它注册在 app 上（main.py:156），不在带鉴权依赖的 router 内 ⇒ 健康检查仍通过。
      - LOOP_DEV_MODE=false
      - AUTH_MODE=jwt
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - FINETUNE_URL=http://it-finetuning:8095
      - EVALUATION_URL=http://it-evaluation:8086
      - REGISTRY_URL=http://it-model-registry:18089
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18088/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      evaluation:
        condition: service_healthy
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 模型仓库注册部署服务（Python/FastAPI, port 18089）
  # ---------------------------------------------------------------------------
  # T033 模型仓库：微调后模型注册 + 一键部署 + 部署管理 + 健康检查
  model-registry:
    build:
      context: ../../design/planned/registry
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/model-registry:0.1.0
    container_name: it-model-registry
    ports:
      - "18089:18089"
    environment:
      - REGISTRY_PORT=18089
      - REGISTRY_MOCK_MODE=true
      # 台账 #68 选项① 第 1 步：本栈改为强制 JWT。两行必须同批——`jwt_auth.py:75` 缺省 none，
      # 而 `AUTH_MODE=jwt` 缺 JWT_SECRET 会在首次请求抛裸 RuntimeError 让业务端点变 500。
      # healthcheck 走 /health（main.py:105，不在 registry_routes.py:132 的 authDeps 内），故不受影响。
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - AUTH_MODE=jwt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18089/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 资产流通市场（Python/FastAPI, port 8087 → 主机 18094）
  # ---------------------------------------------------------------------------
  # Sprint 3.1：Phase 3 栈真实化——asset-exchange 提供前端 /api/v1/assets 与
  # /api/v1/subscriptions（资产市场/订阅页面）。
  # 宿主机端口 18094 对齐 tests/integration/e2e/conftest.py 的 asset_exchange 规划。
  asset-exchange:
    build:
      context: ../../platform/asset-exchange
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/asset-exchange:0.1.0
    container_name: it-asset-exchange
    ports:
      - "18094:8087"
    environment:
      - ASSET_EXCHANGE_HOST=0.0.0.0
      - ASSET_EXCHANGE_PORT=8087
      - ASSET_EXCHANGE_STORE_TYPE=sqlite
      # 集成测试环境显式匿名放行（生产默认强制 JWT）
      - AUTH_MODE=none
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 业务线门户（Python/FastAPI, port 8088 → 主机 18093）
  # ---------------------------------------------------------------------------
  # Sprint 3.1：business-portal 提供前端 /api/v1/business-lines（业务线门户页面）。
  # 宿主机端口 18093 新分配（e2e/conftest 原预留 observability:18093，query-api
  # 暂不入栈，端口让渡 business-portal 并同步更新 e2e/conftest 规划）。
  business-portal:
    build:
      context: ../../platform/business-portal
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/business-portal:0.1.0
    container_name: it-business-portal
    ports:
      - "18093:8088"
    environment:
      - BP_HOST=0.0.0.0
      - BP_PORT=8088
      - BP_STORE_TYPE=sqlite
      - AUTH_MODE=none
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 开放 API 目录（Python/FastAPI, port 8090 → 主机 18095）
  # ---------------------------------------------------------------------------
  # Sprint 3.1：open-api-catalog 提供前端 /api/v1/apis 与 /api/v1/subscriptions
  # 的 API 目录部分（开放 API 市场/订阅审批页面）。
  # 宿主机端口 18095 对齐 e2e/conftest 的 open_api_catalog 规划。
  open-api-catalog:
    build:
      context: ../../platform/open-api-catalog
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/open-api-catalog:0.1.0
    container_name: it-open-api-catalog
    ports:
      - "18095:8090"
    environment:
      - OPENAPI_CATALOG_HOST=0.0.0.0
      - OPENAPI_CATALOG_PORT=8090
      - OPENAPI_CATALOG_STORE_TYPE=sqlite
      - AUTH_MODE=none
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 行业模板（Python/FastAPI, port 8091 → 主机 18096）
  # ---------------------------------------------------------------------------
  # Sprint 3.1：industry-templates 提供前端 /api/v1/templates（行业模板页面）。
  # 宿主机端口 18096 对齐 e2e/conftest 的 industry_templates 规划。
  industry-templates:
    build:
      context: ../../platform/industry-templates
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/industry-templates:0.1.0
    container_name: it-industry-templates
    ports:
      - "18096:8091"
    environment:
      - INDUSTRY_TEMPLATES_HOST=0.0.0.0
      - INDUSTRY_TEMPLATES_PORT=8091
      - INDUSTRY_TEMPLATES_DEPLOY_MODE=mock
      - AUTH_MODE=none
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - it-net

  # ===========================================================================
  # karmada 域四服务（profile: karmada-extra，台账 #90）
  #
  # 这四张 chart 此前 0/4 进入任何装载体，实现侧缺陷（karmada-api 的 /api/v1/clusters
  # 被写成 /api/v1/clusters/clusters）也从未被任何自动化打到过——单测把 handler 挂在
  # 与 main.go 不同的前缀上，所以测试绿而生产 404。
  #
  # 用 compose profile 隔离：默认不启动，ZAP/Playwright/nightly 的 `docker compose up`
  # 行为不变；仅 ci.yml 的 Integration Test 以 `--profile karmada-extra` 追加拉起，
  # 由 tests/integration/test_karmada_services.py 断言端点形状与鉴权。
  # 宿主机端口 18101 沿用 e2e/conftest.py 的 KARMADA_URL 约定；18107-18109 为旧表
  # 未占用的号段（18103-18106 已被 infra-orchestrator 等占用）。
  #
  # 上游 Karmada 控制面不在本栈内：karmada-api 未配 KARMADA_API_SERVER 时按
  # main.go 的既定行为降级为 stub 响应。因此这里验的是"服务能起、路由形状对、
  # 鉴权生效"，不是真实控制面联调；控制面接入见台账 #90 的待裁项。
  # ===========================================================================

  # karmada 控制台 API（Go/Gin, 容器 8090 → 主机 18101）
  karmada-api:
    profiles: ["karmada-extra"]
    build:
      context: ../../platform/karmada/karmada-api
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/karmada-api:0.1.0
    container_name: it-karmada-api
    ports:
      - "18101:8090"
    environment:
      - KARMADA_API_PORT=8090
      - "KARMADA_API_DB=:memory:"
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - JWT_ISSUER=shuqing-bigdata
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - it-net

  # 故障迁移 API（Go/Gin, 容器 8094 → 主机 18107）
  failover-api:
    profiles: ["karmada-extra"]
    build:
      context: ../../platform/karmada/failover/failover-api
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/failover-api:0.1.0
    container_name: it-failover-api
    ports:
      - "18107:8094"
    environment:
      - FAILOVER_API_PORT=8094
      - "FAILOVER_API_DB=:memory:"
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - JWT_ISSUER=shuqing-bigdata
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8094/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - it-net

  # 故障迁移引擎（Go, 容器 8095 → 主机 18108）；控制面指向栈内 karmada-api
  failover-engine:
    profiles: ["karmada-extra"]
    build:
      context: ../../platform/karmada/failover/failover-engine
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/failover-engine:0.1.0
    container_name: it-failover-engine
    ports:
      - "18108:8095"
    environment:
      - FAILOVER_ENGINE_PORT=8095
      - KARMADA_API_URL=http://karmada-api:8090
      - FAILOVER_PRIMARY_CLUSTER=primary
      - FAILOVER_BACKUP_CLUSTERS=backup-a,backup-b
    depends_on:
      karmada-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8095/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - it-net

  # 跨集群查询路由与归并（Java/Spring Boot, 容器 8094 → 主机 18109）
  federated-query:
    profiles: ["karmada-extra"]
    build:
      # Dockerfile 同批拷贝 platform/common-security 与 platform/karmada/federated-query，
      # 故 context 必须是仓根（与 encaps-layer 同形）。
      context: ../..
      dockerfile: platform/karmada/federated-query/Dockerfile
      args: *base-args
    image: shuqing/federated-query:0.1.0
    container_name: it-federated-query
    ports:
      - "18109:8094"
    environment:
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - JWT_ISSUER=shuqing-bigdata
      - KARMADA_API=http://karmada-api:8090
    depends_on:
      karmada-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8094/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - it-net

  # ===========================================================================
  # 台账 #57① 栈外服务扩栈（profile: nightly-extra）
  #
  # 这 5 个服务此前不在栈内，导致 nightly 里 /vector、/ai-assistant、
  # /cluster/overview、/clusters、/lineage 等前缀按 playwright.config.ts 的既定策略
  # 回落到 encaps-layer:18080 ⇒ 404。扩栈后由 playwright 显式指向本组宿主机端口。
  #
  # 用 compose profile 隔离：默认不启动，故 ci.yml 的 Integration Test、security.yml
  # 的 ZAP DAST、it-k3s 等 `docker compose up` 行为**完全不变**（零波及）；
  # 仅 nightly-e2e.yml 以 `--profile nightly-extra` 显式拉起。
  # 宿主机端口 18091/18092/18097/18098/18099 取自 #57① 决策文档 §4（空闲段）。
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 向量检索引擎（Go/Gin, 容器 8086 → 主机 18091）
  # ---------------------------------------------------------------------------
  vector-engine:
    profiles: ["nightly-extra"]
    build:
      context: ../../platform/vector-engine
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/vector-engine:0.1.0
    container_name: it-vector-engine
    ports:
      - "18091:8086"
    environment:
      - VECTOR_ENGINE_PORT=8086
      # 栈内没有 Milvus：显式选内存 mock 存储（非静默回退）。
      - STORE_TYPE=mock
      - MOCK_FALLBACK=true
      - VECTOR_ENGINE_VERSION=0.1.0
      # 与 encaps-layer 同密钥/issuer：login 签发的 token 可直接通过本服务校验。
      # 注意：**不得**设 VECTOR_AUTH_REQUIRED=false——spec 含“未认证返回 401”断言。
      - JWT_SIGNING_KEY=it-test-jwt-secret-at-least-32-bytes-long
      - JWT_ISSUER=shuqing-bigdata
      - CORS_ORIGINS=http://localhost:5173
    healthcheck:
      # 健康端点在 /api/v1/health（镜像内置 HEALTHCHECK 写的 /health 是 404，此处覆盖为正确路径）
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # AI 助手（Go/Gin, 容器 18110 → 主机 18092）
  # ---------------------------------------------------------------------------
  ai-assistant:
    profiles: ["nightly-extra"]
    build:
      context: ../../platform/ai-assistant
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/ai-assistant:0.1.0
    container_name: it-ai-assistant
    ports:
      - "18092:18110"
    environment:
      - AI_ASSISTANT_PORT=18110
      - AI_ASSISTANT_DB=/app/data/ai-assistant.db
      - JWT_SIGNING_KEY=it-test-jwt-secret-at-least-32-bytes-long
      - JWT_ISSUER=shuqing-bigdata
      # 容器内 localhost 不是栈内服务，必须改写成服务名。
      - LLM_GATEWAY_URL=http://llm-gateway:8084
      - SQL_GATEWAY_URL=http://sql-gateway:8081
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18110/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 可观测性查询 API（Go/Gin, 容器 8090 → 主机 18097）
  # ---------------------------------------------------------------------------
  query-api:
    profiles: ["nightly-extra"]
    build:
      context: ../../platform/observability/query-api
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/query-api:0.1.0
    container_name: it-query-api
    ports:
      - "18097:8090"
    environment:
      - QUERY_API_PORT=8090
      - QUERY_API_VERSION=0.1.0
      - JWT_SIGNING_KEY=it-test-jwt-secret-at-least-32-bytes-long
      - JWT_ISSUER=shuqing-bigdata
      # compose 栈内无 k8s：显式启用空数据 mock，使 /api/v1/cluster/* 路由注册并返回 200
      # （否则 NewClusterHandler 因无 kubeconfig 失败 → 路由不注册 → 404）。
      - QUERY_API_K8S_MOCK=true
      # 栈内已有 prometheus 服务（同一 it-net）；/cluster/overview 的数据源。
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 基础设施编排（Java/Spring Boot, 容器 8085 → 主机 18098）
  # ---------------------------------------------------------------------------
  infra-orchestrator:
    profiles: ["nightly-extra"]
    build:
      context: ../..
      dockerfile: platform/infra-orchestrator/Dockerfile
      args: *base-args
    image: shuqing/infra-orchestrator:0.1.0
    container_name: it-infra-orchestrator
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    ports:
      - "18098:8085"
    environment:
      # Dockerfile EXPOSE/HEALTHCHECK 与 k3s manifest 均按 8085；application.yml 默认 8086 需覆盖。
      - INFRA_ORCHESTRATOR_PORT=8085
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - JWT_ISSUER=shuqing-bigdata
      - CORS_ORIGINS=http://localhost:5173
      - APP_K8S_MOCK_ENABLED=true
      # 4 个 infra-provider-* 不在栈内：显式关闭，避免 /clusters 聚合时逐个连接超时。
      - XINCHANG_PROVIDER_ENABLED=false
      - BAREMETAL_PROVIDER_ENABLED=false
      - CLOUD_PROVIDER_ENABLED=false
      - PRIVATE_PROVIDER_ENABLED=false
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 数据血缘分析（Java/Spring Boot, 容器 8086 → 主机 18099）
  # ---------------------------------------------------------------------------
  lineage-analyzer:
    profiles: ["nightly-extra"]
    build:
      context: ../..
      dockerfile: platform/governance/lineage-analyzer/Dockerfile
      args: *base-args
    image: shuqing/lineage-analyzer:0.1.0
    container_name: it-lineage-analyzer
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    ports:
      - "18099:8086"
    environment:
      - SERVER_PORT=8086
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - JWT_ISSUER=shuqing-bigdata
      - CORS_ORIGINS=http://localhost:5173
      # H2 内存库 + Flyway 关闭：零外部依赖即可启动。
      - FLYWAY_ENABLED=false
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8086/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # 栈外扩栈·第二期（台账 #57①）：补齐 Dockerfile 后进栈的三服务
  # ---------------------------------------------------------------------------
  # 前置条件由本批补齐：这三个模块此前**仓内无 Dockerfile**（第一期五项基建见 #395）。
  stream-batch-scheduler:
    profiles: ["nightly-extra"]
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    build:
      context: ../..
      dockerfile: platform/stream-batch-scheduler/Dockerfile
      args: *base-args
    image: shuqing/stream-batch-scheduler:0.1.0
    container_name: it-stream-batch-scheduler
    ports:
      - "18103:18086"
    environment:
      - STREAM_BATCH_SCHEDULER_PORT=18086
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - CORS_ORIGINS=http://localhost:5173
      # 默认 H2 库落在 ${user.home}/.shuqing，显式改到镜像内已赋权的 /app/data
      - SCHEDULER_DB_URL=jdbc:h2:file:/app/data/scheduler-data;AUTO_SERVER=TRUE
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18086/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  encaps-data:
    profiles: ["nightly-extra"]
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    build:
      context: ../..
      dockerfile: platform/encaps-data/Dockerfile
      args: *base-args
    image: shuqing/encaps-data:0.1.0
    container_name: it-encaps-data
    ports:
      - "18104:8083"
    environment:
      - ENCAPS_DATA_PORT=8083
      - DB_URL=jdbc:h2:file:/app/data/encaps-data-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      # 凭据加密密钥（CredentialEncryptorConfig 条件装配前置；缺省则 DataSourceController 起不来）
      - CREDENTIAL_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - ENCRYPT_KEY=0123456789abcdef0123456789abcdef
      - CORS_ORIGINS=http://localhost:5173
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  encaps-gateway:
    profiles: ["nightly-extra"]
    mem_limit: 640m  # 台账 #57① 方案B：给 JVM 一个 cgroup 边界，避免 MaxRAMPercentage 按宿主机(≈7GB)算堆
    build:
      context: ../..
      dockerfile: platform/encaps-gateway/Dockerfile
      args: *base-args
    image: shuqing/encaps-gateway:0.1.0
    container_name: it-encaps-gateway
    ports:
      - "18105:8082"
    environment:
      - ENCAPS_GATEWAY_PORT=8082
      - DB_URL=jdbc:h2:file:/app/data/encaps-gateway-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      - CREDENTIAL_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - ENCRYPT_KEY=0123456789abcdef0123456789abcdef
      - CORS_ORIGINS=http://localhost:5173
    healthcheck:
      # 启动容差（2026-10-10 实测）：`docker compose up --wait` 对**瞬时 unhealthy** 立即失败，
      # 而 JVM 冷启动在 CI 2 核 runner 上可远超原窗口（start_period 15s + retries10×5s ≈ 65s）
      # ⇒ 应用其实正常却让整栈启动失败（run 38015350893 / 38021431664 均此因）。
      # 放宽到 90s + 30×5s ≈ 240s；本地实测该容差下 encaps-layer 稳定 healthy（RSS ~378MiB/640m）。
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # LLMOps（Python/FastAPI, 容器 8080 → 主机 18106）
  # ---------------------------------------------------------------------------
  # 台账 #1b Q1：llmops 为模型/评估/微调/推理域的**单一权威**（encaps-layer 门面退场后，
  # 前端 llmops.ts 的 /api/v1/llmops/** 由 Vite 代理与 APISIX 直接指向本服务）。
  # 进基础栈（基础 nightly 会跑 llmops.spec.ts）；mock 存储，无外部依赖。
  llmops:
    build:
      context: ../../platform/llmops
      dockerfile: Dockerfile
      args: *base-args
    image: shuqing/llmops:0.1.0
    container_name: it-llmops
    ports:
      - "18106:8080"
    environment:
      - LLMOPS_HOST=0.0.0.0
      - LLMOPS_PORT=8080
      # mock 存储：测试栈不接 MLflow（其余 Python 服务同理）
      - LLMOPS_STORE_TYPE=mock
      - JWT_SECRET=it-test-jwt-secret-at-least-32-bytes-long
      # 不显式声明时 jwt_auth.py 回落 AUTH_MODE=none（匿名 admin 放行），夜间 E2E 的未认证 401 断言因此失明。
      # 本栈 JWT_SECRET 41 字节 ⇒ jjwt 按密钥长度签出 HS256，与 llmops 的 _decodeHS256 同源。
      - AUTH_MODE=jwt
    healthcheck:
      # 路径为 /health：llmops 健康路由未挂 API 前缀（llmops/api/app.py: include_router(health.router)），
      # 探 /api/v1/health 实测 404；镜像已补装 curl（见 platform/llmops/Dockerfile）。
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - it-net

  # ---------------------------------------------------------------------------
  # Prometheus（采集 4 个自研组件的 metrics）
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: it-prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - it-net
    depends_on:
      encaps-layer:
        condition: service_healthy
      sql-gateway:
        condition: service_healthy
      catalog:
        condition: service_healthy
      rule-engine:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Grafana（可视化面板）
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: it-grafana
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    networks:
      - it-net
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # Jaeger（分布式追踪，All-in-One 模式）
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: it-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      # OTLP HTTP：宿主 4318 常被本机开发工具（如 IDE 的 otel collector）占用，
      # 宿主侧映射改走 14318；容器内仍是 4318（服务间通信走容器网络不受影响）
      - "14318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - it-net

networks:
  it-net:
    driver: bridge