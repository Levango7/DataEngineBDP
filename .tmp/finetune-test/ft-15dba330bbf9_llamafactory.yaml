model_name_or_path: meta-llama/Llama-2-7b-hf
dataset_name: alpaca-zh
dataset_dir: /data/datasets/alpaca-zh.json
template: default
output_dir: /tmp/finetune-test/output
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 0.0002
weight_decay: 0.01
warmup_steps: 100
max_seq_length: 1024
logging_steps: 5
save_steps: 500
seed: 42
fp16: true
bf16: false
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj
