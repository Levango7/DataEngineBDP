model_name_or_path: meta-llama/Llama-2-13b-hf
dataset_name: alpaca-zh
dataset_dir: /data/datasets/alpaca-zh.json
template: default
output_dir: /tmp/finetune-test/output
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 100
max_seq_length: 2048
logging_steps: 5
save_steps: 500
seed: 42
fp16: true
bf16: false
finetuning_type: lora
quantization_bit: 4
quantization_method: bitsandbytes
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
