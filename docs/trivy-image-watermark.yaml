  # ── 2026-11-25 台账 #137：python:3.12-slim 基座漂至 trixie，CI 报 54 条（去重 14 id）HIGH ──
  # 实测（WSL trivy 0.76.2 同口径）：仅 CVE-2026-124851（libzstd1）有修复版，其余 13 条上游无修复版。
  # 出货侧 asset-exchange 运行时层已加 --only-upgrade 涉及包（台账 #137 ④ 段），
  # libzstd1 补至 1.5.7+dfsg-1+deb13u1；其余 13 条上游无修复版 ⇒ 按风险接受限期豁免，
  # 理由=应用层（Python/FastAPI Web 服务）不直接调用相关二进制/库，实际利用面窄；
  # 非「出货侧已修」的掩盖（这 13 条补包无门）。到期未清按判据复核（基座自重建带上修复版，
  # 或主理人裁跨线跃迁 Alpine），不续期。
  - package: 'libzstd1'
