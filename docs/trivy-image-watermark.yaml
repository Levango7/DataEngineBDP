    expired_at: '2026-12-15'
    statement: 'libzstd1 1.5.7+dfsg-1 → 1.5.7+dfsg-1+deb13u1（HIGH），python:3.12-slim 基座引用（trixie，门禁去重后单扫 asset-exchange）；出货侧 --only-upgrade libzstd1 已补至修复版，出货镜像不在受影响区间'
