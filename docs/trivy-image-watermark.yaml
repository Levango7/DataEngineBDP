# Trivy 镜像豁免的「包 + 版本水位」账（台账 #113）
#
# 唯一事实源。docs/trivy-image-ignore.yaml 由 scripts/gen-trivy-ignore.py 从本文件生成，
# **不要手改生成物**；改水位改这里，然后跑生成器 + scripts/check-trivy-ignore-drift.py。
#
# 为什么豁免的单位从「CVE 号」上移到「包 + 版本水位」（台账 #113）：
#   4 周内同一个包、同一个修复版，CVE 逐个新增（libexpat→libx11→brotli→curl），
#   按 CVE 号逐条豁免等于打地鼠；按「包 + 版本水位」记一条，CVE 列表成为派生结果。
#
# 字段口径：
#   package             包名（Trivy 侧的包/库名）
#   ecosystem           生态（npm / alpine / debian / maven）
#   vulnerable_version  该水位对应的脆弱版本（多个命中用 ", " 分隔；推不出时写 "unknown"）
#   fixed_versions      修复版本水位；**不得为空**。上游只给「内容更新」没有版本级修复线时，
#                       写保留字 "unversioned"（此时 statement 里不允许出现版本级修复线）
#   expired_at          到期日（到期未清 ⇒ trivy 自动重新判红，不许靠挪日期过关）
#   statement           该水位的主 statement（取本记录第一条 CVE 的原文，逐字保留）
#   notes               生成物里该水位条目上方的注释（原文逐行保留）
#   cves                该水位覆盖的 CVE 列表（id + 各自的 statement 原文，逐字保留）
#
# 校验口径（scripts/check-trivy-ignore-drift.py）：字段缺失 / cves 重复 / cve id 形态不对 /
# fixed_versions 与 statement 里写的修复线矛盾 ⇒ rc=2；生成物与水位账不一致 ⇒ rc=1。
schema_version: 1

# ── 生成物的机制说明段（原样写进 docs/trivy-image-ignore.yaml 的头部）──────────────
preamble: |
  # Trivy 镜像扫描的**限期**豁免账（台账 #74）
  #
  # 来由：#604 把 security.yml 的镜像扫描修好（扫描前展开 ${BASE_REGISTRY} + 不再用
  # `if trivy … | tee` 吞退码）之后，main 第一次真扫出 HIGH/CRITICAL。
  # 实测口径（run 39033912823 / job 117399792492）：共扫描 13 个基座、**执行失败 0**、7 个有命中，
  # 其中 alpine 3.19 的 2 条本 PR 直接清了（抬到 3.20——同一次扫描里 3.20 是 0 命中，这是实证不是猜）；
  # 剩下 15 个 CVE 就是这张表。
  #
  # 为什么这 15 条不能在本 PR 里"抬个 tag"顺手清掉——先把话说实：
  #   2026-10-17 从 daocloud 的 manifest config 里读出**实际版本与构建时间**（不是猜的）：
  #     node   22-alpine     = NODE_VERSION 22.23.3,  created 2026-09-23
  #            22.22.0-alpine 22.22.0 / 2026-01-28；22.21.1-alpine 22.21.1 / 2025-12-18  ⇒ 都更旧
  #     python 3.11-slim     = PYTHON_VERSION 3.11.17, created 2026-10-06
  #            3.11.14-slim   3.11.14 / 2026-02-24                                      ⇒ 更旧
  #     maven  3.9-eclipse-temurin-17 = jdk-17.0.20.1+1, created 2026-09-25
  #            3.9.12 / 2026-02-17，3.9.11 / 2025-11-14                                 ⇒ 都更旧
  #     temurin 17-jre       = jdk-17.0.20.1+1, created 2026-10-17
  #            17.0.13_11-jre 17.0.13+11 / 2025-01-22                                   ⇒ 更旧
  #   ⇒ **我们用的浮动 tag 就是这条版本线的最新构建**，同线换 tag 换不出修复；
  #     （提醒：digest 不同只说明"是两份不同构建"，不说明谁新——上面这张表读的是版本与日期，
  #      不是 digest 大小。）
  #   能清这些的只有**跨线跃迁**，而跨线＝改运行时，必须单独一轮构建+测试验证：
  #     - python 3.11 → 3.12：本次扫描里 `python:3.12-slim` 是 **0 命中**（实测，有现成证据）
  #     - temurin 17-jre → 17-jre-alpine：本次扫描里 `17-jre-alpine` 是 **0 命中**（实测）
  #     - node 22-alpine 的 10 条：本次没有扫过任何"干净的 node"，**没有实测依据**，
  #       所以不能拿"升到 24"当结论，只能等上游 npm 内容更新或先补一次候选 tag 扫描
  #   这些跃迁不在"改选源"的 PR 里做，清单与解锁条件写在台账 #74。
  #
  # 本机答不了、也不假装答的：`registry-1.docker.io` 从本机连不通（curl 28 号错，实测），
  #   所以"Hub 上的同名浮动 tag 是否比镜像站这份更新"没法本机判定；要在 runner 上取 Hub digest 对，
  #   已记进 #74。这不改变上面的结论——因为**同线换 tag 无用**这一条是拿版本/日期证的，不依赖 Hub。
  #
  # 机制：trivy 原生 `.trivyignore.yaml` 语义（id + statement + expired_at）。
  # **到期未清 ⇒ 自动重新判红**，这笔债不会静默烂掉。到期日统一 2026-12-01。
  # 到那天若还在，该做的是"扫候选 tag → 跨线跃迁 → 跑验证"，不是把 expired_at 往后挪——
  # 挪日期等于把这条刚修好的门禁重新关掉。
  #
  # 每条 statement 里的"现版本 → 上游修复版本"取自这次扫描的 SARIF 的 Fixed Version 字段。
  #
  # ── 2026-11-22 口径订正（台账 #113）────────────────────────────────────────
  # **本门禁扫的是 Dockerfile 的 FROM 基座引用，不是出货镜像；基座层命中 ≠ 我们的交付物有该漏洞。**
  # 台账 #113 的现场：4 周内同一个包、同一个修复版，CVE 逐个新增（libexpat→libx11→brotli→curl），
  # 按 CVE 号逐条豁免等于打地鼠 ⇒ 豁免的单位上移到「包 + 版本水位」。
  # 本文件由 scripts/gen-trivy-ignore.py 从 docs/trivy-image-watermark.yaml 生成，**不要手改**；
  # 改水位改水位账，然后跑 scripts/check-trivy-ignore-drift.py（漂移即判红）。
  # 上面几段是 2026-10-17/10-28 的历史快照（当时的 15 条、到期日统一 2026-12-01）；
  # 现在的条数与到期日以水位账与本文件的实际条目为准。

# ── 原文件里已无在册条目的历史注记（原文保留，供追溯）───────────────────────────
history_notes: |
  # ---- eclipse-temurin:17-jre（CI 实际构建的 10 个运行层；另有 platform/encaps-layer/Dockerfile.multiarch
  #      用同一基座，但 CI 不构建它，故不在 #684 的删除清单里）----
  # 这四条的成因是同一个：基镜自带的 Bitnami 服务管理器 /usr/bin/pebble 用 Go stdlib v1.27.1 编，
  # 修复线 1.26.10 / 1.27.3 尚未随基镜发布（`--ignore-unfixed` 不吞它们，因为上游**有**修复版本）。
  # PR #684 已在 10 个运行层加 `RUN rm -f /usr/bin/pebble`：本机 trivy 0.71.1 实扫同一基座
  # 由 4 条变 0 条，`java -version` 仍是 openjdk 17.0.20.1。写在本表的原因是这条门禁扫的是
  # **基座引用本身**，看不见我们自己构建层里的删除（与下面 libexpat 那组同理）。
  # 如实记下局限：删除只作用于镜像装配后的根文件系统；基座那一层的 layer blob 在 registry 里仍含该二进制，
  # 逐层解包的人还是拿得到它。真要连这个都消掉只有跨线换基座（#74 已列 `17-jre-alpine` 实测 0 命中）。
  # ==== 2026-11-06 复核注记（不改动上面任何条目，只更正「谁还在承重」的读法）====
  # 事实源：main `75a9010c`（PR #768 已合入，frontend 运行层基座由 nginx:alpine 换成 nginx:alpine-slim，
  #   见台账 #114；本仓另两处在 #115 里由 zcode 线走定向补包）。现查 git grep 计数：
  #   `FROM ... nginx:alpine` = 0 处；`FROM ... eclipse-temurin:17-jre-alpine` = 19 处（运行阶段），
  #   本机真容器实测该基座 libexpat 仍是 2.9.0-r0。
  # 逐条读法：
  #   CVE-2026-77214（libexpat 2.8.5-r0→2.9.0-r0）：原文写「两基座」，现只剩 **temurin 半边**可能还匹配
  #     （Alpine 仓已给到 2.10.0-r0，这条是否还被命中取决于 trivy 的区间口径，未现测 ⇒ 保留）。
  #   CVE-2026-88806（libx11，仅 nginx:alpine）与 CVE-2026-92392（curl，仅 nginx:alpine）：
  #     **nginx 半边随 #768 失去引用** ⇒ 变成「无引用条目」，到期未清按判据复核、不续期。
  #   CVE-2026-111497（brotli-libs，两基座）：同 77214，只剩 temurin 半边。
  #   CVE-2026-117610 / CVE-2026-118370（libexpat 2.9.0-r0→2.10.0-r0，两基座）：**temurin 半边继续承重**，
  #     删了会当场变红；nginx 半边失去引用。
  #   CVE-2026-113351（libexpat，登记时实测仅 nginx:alpine 命中）：**登记面已整体消失**，
  #     但本批仍不删——同一 Alpine 3.24.3、同一包版本 2.9.0-r0，trivy 为何只匹配 nginx 那格至今未查清（台账 #113），
  #     删除安全性要一次「去掉该条目的扫描」才能证；而未命中的豁免项不造成假绿，留着零风险、删错当场红。
  # 结论：本文件条目数不变（19 条），只更正读法；到期（12-01 / 12-15）逐条按 `docker run <base> apk info -v`
  #   这类可复核判据清，不靠挪日期。
  # ==== 2026-11-28 复核：按判据清出 6 水位 / 9 CVE（删除审计可重建：每条到期日如下）----
  # 证据（本机真容器直读；temurin/alpine/maven 的 trivy raw scan 因 java-db 下载挂起未跑完，
  # 判据走本文件自带的 apk/dpkg 直读口径，gate 形态旁证由删除 PR 自身的 CI Trivy Image Scan 提供）：
  #   · eclipse-temurin:17-jre-alpine apk list -I：libexpat-2.10.0-r0、brotli-libs-1.2.1-r0
  #     ⇒ libexpat 2.8.5-r0 与 2.9.0-r0 两条水位、brotli-libs 条全部解锁（基座已带上修复版）
  #   · python:3.12-slim dpkg 直读 zlib1g=1:1.3.dfsg+really1.3.1-1+deb13u1，且本机 trivy 0.76.2
  #     raw scan（--ignore-unfixed 同口径、未带 ignorefile）该基座 Total=1 仅 libzstd1 ⇒ zlib1g 两条解锁
  #   · nginx:alpine 已无 FROM 引用（frontend 运行层 #768 起为 nginx:alpine-slim）⇒ curl/libx11
  #     与 libexpat@2.9.0 的 nginx 半边死引用；temurin 半边由上条 apk 证据解锁 ⇒ 整水位删除
  #   · node:22-alpine 仍有 1 处 frontend build 引用（活引用，同 maven builder 口径登记）⇒
  #     npm 9 条承重保留；12-01 批余量 7 水位 / 11 CVE（npm 9 + maven guava/openssl 2）到期压力未解
  #     （候选 tag 扫描/跨线跃迁待立项），不许挪日期过关
  # 删除 6 水位 / 9 CVE 与各自到期日：brotli-libs@1.2.0-r1（111497，12-01）/ curl@8.22.0-r0
  #   （92392，12-01）/ libexpat@2.8.5-r0（77214，12-01）/ libexpat@2.9.0-r0（117610/118370/
  #   113351，12-15）/ libx11@1.8.13-r0（88806，12-01）/ zlib1g@1:1.3.dfsg+really1.3.1-1+b1
  #   （76844/85091，12-15）；余 17 水位（27 CVE）承重或上游无修复版，保留。

# ── 水位记录 ──────────────────────────────────────────────────────────────────
watermarks:
  - package: 'apt'
    ecosystem: 'debian'
    vulnerable_version: '2.8.3'
    fixed_versions:
      - '2.8.4ubuntu0.1'
    expired_at: '2026-12-15'
    statement: 'apt / libapt-pkg6.0t64 2.8.3 → 2.8.4ubuntu0.1，仅 maven:3.9-eclipse-temurin-17 的 AS builder 阶段（19 个 Dockerfile）；运行阶段是 temurin-alpine/distroless，apt 不随产物出货。同一 CVE 在 python:3.12-slim 那半已由基座自重建消解（现镜像 3.0.4，PR #769 复跑 0 命中实证），本条只覆盖 Ubuntu 线'
    notes:
      - '# ---- 2026-11-06：CVE-2026-109518（apt / libapt-pkg）跨两条基座线命中，本条只覆盖仍未消解的那半 ----'
      - '# 同一条 CVE 先在 python:3.12-slim 报 Installed 3.0.3（Fixed 3.0.4，Debian 线）：main `302de56a`'
      - '#   的扫描（2026-11-05T04:44:25Z，job `127050736879`）就是这么红的；基座在 08:00:30Z 自重建'
      - '#   （现 digest `e695ab189fa2…`，容器内 `dpkg -l apt` 已是 3.0.4）⇒ 那一半**本仓零改动**，'
      - '#   并且 PR #769 的复跑（Security run `42063726469`）里 python 那格已 0 命中，实证闭环。'
      - '# 随后它改在 maven:3.9-eclipse-temurin-17 报 Installed 2.8.3（Fixed `2.8.4ubuntu0.1`，Ubuntu noble 线）。'
      - '#   命中面实测＝19 个 Dockerfile 的 `FROM ... AS builder` 构建阶段（grep 计数），运行阶段是'
      - '#   eclipse-temurin:17-jre-alpine / distroless ⇒ apt 不随产物出货。'
      - '# 本机实测（2026-11-06，真容器，同一基座现 digest `1a352420f7ab…`）：apt 与 libapt-pkg6.0t64 都还是'
      - '#   2.8.3，而 `apt-cache policy` 的 Candidate 已是 **2.8.4ubuntu0.1** ⇒ 修复版 Ubuntu 仓里已发布，'
      - '#   只差基座重建。两条可选解法：① 等基座自重建（与 python 那半同一条路，已验证会自己消）；'
      - '#   ② 在 19 个构建阶段各加一条 `apt-get upgrade -y apt libapt-pkg6.0t64`——代价是每次 Java 镜像构建'
      - '#   多一层 apt update/upgrade，而 `Java Build & Test` / `Docker Build Verify` 已是全仓最长的两条腿，不划算。'
      - '# 记法与本表既有的 maven openssl 条目同口径（构建阶段基座、不随产物出货）；到期未解自动重新判红。'
      - '# 解锁：`docker run <base> dpkg -l apt | awk ''/^ii/{print $3}''` 显示 ≥2.8.4ubuntu0.1 后删掉本条。'
    cves:
      - id: CVE-2026-109518
        statement: 'apt / libapt-pkg6.0t64 2.8.3 → 2.8.4ubuntu0.1，仅 maven:3.9-eclipse-temurin-17 的 AS builder 阶段（19 个 Dockerfile）；运行阶段是 temurin-alpine/distroless，apt 不随产物出货。同一 CVE 在 python:3.12-slim 那半已由基座自重建消解（现镜像 3.0.4，PR #769 复跑 0 命中实证），本条只覆盖 Ubuntu 线'
