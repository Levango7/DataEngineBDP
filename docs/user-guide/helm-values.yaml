    limits:   { cpu: "1000m", memory: "1Gi" }
  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
  ingress:
