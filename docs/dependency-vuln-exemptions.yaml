  - id: GHSA-hvw5-3mgw-7rcf
    package: io.debezium:debezium-core
    installed: "1.9.7.Final"
    fixed: "2.3.0.Alpha1"
    severity: MEDIUM
    reason: >-
      修复版是 2.3.0.Alpha1，即从 1.9.7 跨过 2.0/2.1/2.2 三个**大版本**。本模块
      platform/flink-cdc 直依赖 com.ververica:flink-connector-mysql-cdc:3.0.1，该连接器是
      按 Debezium 1.9.x 的 API 编译的；本仓 Java 源码里 `import io.debezium` 现查 **0 处**
      （debezium 只作为连接器的运行时依赖存在）。单方面把 debezium 抬到 2.3 会打穿连接器的二进制兼容，
      而这不是一个依赖批次能验证的事。
    followup: "解锁条件：先升 flink-cdc 到按 Debezium 2.x 编译的版本（或改用 Flink CDC 的对应发行线），再随之抬 debezium"
    expired_at: 2027-01-31
    source: "platform/flink-cdc/pom.xml；GitHub Security tab / Dependabot alerts"

