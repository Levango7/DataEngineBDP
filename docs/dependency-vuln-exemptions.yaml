  # ==========================================================================
  # 二、受影响代码路径在本仓不可达（§2.2 间接依赖，不影响本仓）
  # ==========================================================================

  - id: GHSA-cg8m-r9f2-5wm2
    package: black
    installed: "26.5.1"
    fixed: "26.10.1"
    severity: HIGH
    reason: >-
      告警标题是「Black: GitHub Action installs unvalidated required-version from pyproject.toml」
      ——受影响面是 **black 的 GitHub Action** 在安装时读 pyproject.toml 里的 required-version。
      本仓：① 全仓 .github/workflows/*.yml 里没有任何 `psf/black` 或 `uses: ...black`（现查 0 命中）；
      ② 根 pyproject.toml 的 [tool.black] 只有 line-length / target-version / include / extend-exclude，
      **没有 required-version**；③ black 是以 CLI 形态经 `pip install -r requirements-lint.txt` 装的。
      ⇒ 受影响的执行路径不存在。硬升到 26.10.1 会按 requirements-lint.txt 自己写的升级流程
      强制全仓 Python 重排一遍，属零安全收益的大 diff，不做。
    followup: "若将来改用 black 的 GitHub Action 或加 required-version，本条立即失效、必须升级"
    expired_at: 2027-01-31
    source: "GitHub Security tab / Dependabot alerts；requirements-lint.txt；根 pyproject.toml"

