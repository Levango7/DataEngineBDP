# 依赖漏洞豁免账（Dependabot / Trivy 口径）
#
# 与 docs/trivy-image-ignore.yaml 是两张表，不混用：
# ・这张表记**依赖包**（pip / npm / maven / go）的告警；
# ・trivy-image-ignore.yaml 记**镜像基座**的 CVE。
#
# 规则（见 docs/security-vuln-triage.md §二 / §四）：
# ・每条必须写清「为什么这条修不了 / 不该在本仓修」，并且**能复核**（给出可复现的判据）。
# ・到期日一律设短（1–3 个月）。到期还在，要么修、要么续期并附新理由；
#   **挪日期等于把门禁重新关掉**，所以续期必须同时说明上游此前的进展。
# ・有修复版且修得动的一律不进本表——进本表的都是「修不动」或「修它会把别的东西打穿」。
