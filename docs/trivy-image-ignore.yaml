# Trivy 镜像扫描的**限期**豁免账（台账 #74）
#
# 来由：#604 把 security.yml 的镜像扫描修好（扫描前展开 ${BASE_REGISTRY} + 不再用
# `if trivy … | tee` 吞退码）之后，main 第一次真扫出 HIGH/CRITICAL。
# 实测口径（run 39033912823 / job 117399792492）：共扫描 13 个基座、**执行失败 0**、7 个有命中，
# 其中 alpine 3.19 的 2 条本 PR 直接清了（抬到 3.20——同一次扫描里 3.20 是 0 命中，这是实证不是猜）；
# 剩下 15 个 CVE 就是这张表。
#
# 为什么这 15 条不能在本 PR 里"抬个 tag"顺手清掉——先把话说实：
#   2026-10-17 从 daocloud 的 manifest config 里读出**实际版本与构建时间**（不是猜的）：
#     node   22-alpine     = NODE_VERSION 22.23.3,  created 2026-09-23
#            22.22.0-alpine 22.22.0 / 2026-01-28；22.21.1-alpine 22.21.1 / 2025-12-18  ⇒ 都更旧
#     python 3.11-slim     = PYTHON_VERSION 3.11.17, created 2026-10-06
#            3.11.14-slim   3.11.14 / 2026-02-24                                      ⇒ 更旧
#     maven  3.9-eclipse-temurin-17 = jdk-17.0.20.1+1, created 2026-09-25
#            3.9.12 / 2026-02-17，3.9.11 / 2025-11-14                                 ⇒ 都更旧
#     temurin 17-jre       = jdk-17.0.20.1+1, created 2026-10-17
#            17.0.13_11-jre 17.0.13+11 / 2025-01-22                                   ⇒ 更旧
#   ⇒ **我们用的浮动 tag 就是这条版本线的最新构建**，同线换 tag 换不出修复；
#     （提醒：digest 不同只说明"是两份不同构建"，不说明谁新——上面这张表读的是版本与日期，
#      不是 digest 大小。）
#   能清这些的只有**跨线跃迁**，而跨线＝改运行时，必须单独一轮构建+测试验证：
#     - python 3.11 → 3.12：本次扫描里 `python:3.12-slim` 是 **0 命中**（实测，有现成证据）
#     - temurin 17-jre → 17-jre-alpine：本次扫描里 `17-jre-alpine` 是 **0 命中**（实测）
#     - node 22-alpine 的 10 条：本次没有扫过任何"干净的 node"，**没有实测依据**，
#       所以不能拿"升到 24"当结论，只能等上游 npm 内容更新或先补一次候选 tag 扫描
#   这些跃迁不在"改选源"的 PR 里做，清单与解锁条件写在台账 #74。
#
# 本机答不了、也不假装答的：`registry-1.docker.io` 从本机连不通（curl 28 号错，实测），
#   所以"Hub 上的同名浮动 tag 是否比镜像站这份更新"没法本机判定；要在 runner 上取 Hub digest 对，
#   已记进 #74。这不改变上面的结论——因为**同线换 tag 无用**这一条是拿版本/日期证的，不依赖 Hub。
#
# 机制：trivy 原生 `.trivyignore.yaml` 语义（id + statement + expired_at）。
# **到期未清 ⇒ 自动重新判红**，这笔债不会静默烂掉。到期日统一 2026-12-01。
# 到那天若还在，该做的是"扫候选 tag → 跨线跃迁 → 跑验证"，不是把 expired_at 往后挪——
# 挪日期等于把这条刚修好的门禁重新关掉。
#
# 每条 statement 里的"现版本 → 上游修复版本"取自这次扫描的 SARIF 的 Fixed Version 字段。
vulnerabilities:
  # ---- node:22-alpine（frontend 构建阶段）：命中都在镜像自带的 npm 依赖里，同线无更新构建 ----
  - id: CVE-2026-102276
    statement: "node 22-alpine(22.23.3) 自带 npm 的 brace-expansion 2.0.2；SARIF 修复线 2.1.5/3.0.7/5.0.10；同线无更新构建 ⇒ 需 npm 内容更新或跨大版本跃迁（本仓暂无实测干净的 node tag）"
    expired_at: 2026-12-01
  - id: CVE-2026-102278
    statement: "同上，brace-expansion 2.0.2 → 2.1.6/3.0.8/5.0.11"
    expired_at: 2026-12-01
  - id: CVE-2026-13149
    statement: "同上，brace-expansion 2.0.2 → 2.1.2/1.1.16/5.0.7"
    expired_at: 2026-12-01
  - id: CVE-2026-14257
    statement: "同上，brace-expansion 2.0.2 → 2.1.3/3.0.3/5.0.8"
    expired_at: 2026-12-01
  - id: CVE-2026-69152
    statement: "同上，brace-expansion 2.0.2 → 2.1.4/3.0.6/5.0.9"
    expired_at: 2026-12-01
  - id: CVE-2026-69192
    statement: "node 22-alpine 自带 npm 的 ip-address 10.1.0 → 10.3.1"
    expired_at: 2026-12-01
  - id: CVE-2026-9496
    statement: "node 22-alpine 自带 npm 的 pacote（19.0.2 与 20.0.1 两处命中）；随 npm 内容更新清"
    expired_at: 2026-12-01
  - id: CVE-2026-33671
    statement: "node 22-alpine 自带 npm 的 picomatch 4.0.3；随 npm 内容更新清"
    expired_at: 2026-12-01
  - id: CVE-2026-48815
    statement: "node 22-alpine 自带 npm 的 sigstore 3.1.0；随 npm 内容更新清"
    expired_at: 2026-12-01

  # ---- eclipse-temurin:17-jre（CI 实际构建的 10 个运行层；另有 platform/encaps-layer/Dockerfile.multiarch
  #      用同一基座，但 CI 不构建它，故不在 #684 的删除清单里）----
  # 这四条的成因是同一个：基镜自带的 Bitnami 服务管理器 /usr/bin/pebble 用 Go stdlib v1.27.1 编，
  # 修复线 1.26.10 / 1.27.3 尚未随基镜发布（`--ignore-unfixed` 不吞它们，因为上游**有**修复版本）。
  # PR #684 已在 10 个运行层加 `RUN rm -f /usr/bin/pebble`：本机 trivy 0.71.1 实扫同一基座
  # 由 4 条变 0 条，`java -version` 仍是 openjdk 17.0.20.1。写在本表的原因是这条门禁扫的是
  # **基座引用本身**，看不见我们自己构建层里的删除（与下面 libexpat 那组同理）。
  # 如实记下局限：删除只作用于镜像装配后的根文件系统；基座那一层的 layer blob 在 registry 里仍含该二进制，
  # 逐层解包的人还是拿得到它。真要连这个都消掉只有跨线换基座（#74 已列 `17-jre-alpine` 实测 0 命中）。
  # 解锁：Bitnami 用 Go ≥1.27.3 重出 pebble 并随基镜发布后，整块删掉这 4 条与那 10 行 RUN。
  - id: CVE-2026-78667
    statement: "temurin 17-jre(jdk-17.0.20.1+1, 2026-10-17 构建) 内 /usr/bin/pebble 的 Go stdlib v1.27.1 → 修复线 1.26.9/1.27.2；本次扫描里 17-jre-alpine 是 0 命中 ⇒ 清法是变体跃迁，需单独验证"
    expired_at: 2026-12-01
  - id: CVE-2026-78669
    statement: "同上（pebble / Go stdlib v1.27.1）"
    expired_at: 2026-12-01
  - id: CVE-2026-97031
    statement: "同上（pebble / Go stdlib v1.27.1）"
    expired_at: 2026-12-01
  - id: CVE-2026-111943
    statement: "同上（pebble / Go stdlib v1.27.1 → 1.26.10、1.27.3）。这条 2026-10-21 才显形：CI 工件 trivy-image-reports 里 eclipse-temurin_17-jre.sarif 在同批**只剩这 1 条 results**（另三条早已在本表），job `119158037486` 因此对每条 PR 判红——是漏登一条 id，不是基镜新出的洞"
    expired_at: 2026-12-01

  # ---- maven:3.9-eclipse-temurin-17（18 个 Dockerfile 的构建阶段）----
  - id: CVE-2026-84782
    statement: "maven 3.9-eclipse-temurin-17（jdk-17.0.20.1+1, 2026-09-25）里 Ubuntu jammy 的 openssl / libssl3t64 3.0.13-0ubuntu3.15 → 3.0.13-0ubuntu3.16；同线无更新构建 ⇒ 等镜像重建（构建阶段基座，不随产物出货）"
    expired_at: 2026-12-01

  # ---- python:3.11-slim（9 个 Dockerfile 的运行阶段）----
